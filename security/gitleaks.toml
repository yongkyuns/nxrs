title = "nxrs secret scanning"
[extend]
useDefault = true

# Narrow false positives: source file hashes, not blanket fixture/path exclusions.
[[allowlists]]
description = "Detector provenance maps a source path to its SHA-256"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['^tests/detection/results/[^/]+/provenance\.json$']
regexTarget = "line"
regexes = ['^\s*"hal/detector/src/api\.rs":\s*"[0-9a-f]{64}",?\s*$']

[[allowlists]]
description = "RTOS benchmark records the upstream tm_api.h git object hash"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['^tests/rtos-bench/upstream\.json$']
regexTarget = "line"
regexes = ['^\s*"tm_api\.h":\s*"[0-9a-f]{40}",?\s*$']

[[allowlists]]
description = "Detector firmware provenance records three public HAL API source hashes"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['^tests/detection/results/[^/]+/firmware\.json$']
regexTarget = "line"
regexes = ['^\s*"hal/(camera|detector|wifi)/src/api\.rs":\s*"[0-9a-f]{64}",?\s*$']

[[allowlists]]
description = "Detector validation records the public API schema source hash"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['^tests/detection/results/[^/]+/validation\.json$']
regexTarget = "line"
regexes = ['^\s*"docs/monitoring-api\.json":\s*"[0-9a-f]{64}",?\s*$']

[[allowlists]]
description = "Radio provenance records the public credential-fixture C source hash"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['^tests/csi-radio/results/[^/]+\.json$']
regexTarget = "line"
regexes = ['^\s*"tests/nuttx-std/wifi/ffi/credentials\.c":\s*"[0-9a-f]{64}",?\s*$']

[[allowlists]]
description = "Channel benchmark records the public pthread-key patch source hash"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['^tests/std-channel-perf/results/[^\r\n]+/(build|analysis)\.json$']
regexTarget = "line"
regexes = ['^\s*"upstream/nuttx/patches/0006-flat-build-global-pthread-keys\.patch":\s*"[0-9a-f]{64}",?\s*$']

# Reviewed provenance in 55c6b2b and 8efbd59, not credentials. Match exact
# public source hashes, exact fields, complete lines and bounded result paths.
# tools/scan-secrets.py self-test verifies the source blobs and negative controls.
# Gitleaks 8.30.1 may include the preceding newline in regexTarget="line".
# Accommodate only leading EOL/indentation and trailing CR; never extra fields.
[[allowlists]]
description = "Reviewed event-path measurement source hashes from 2026-11-04"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['^tests/event-path-perf/results/2026-11-04-esp32s3/board/(build|runs/pass-[1-3]-(blocked|ready)-(std|crossbeam|messaging)-try)/build\.json$']
regexTarget = "line"
regexes = [
  '^[\r\n \t]*"hal/imu/src/api\.rs":[ \t]*"051b8789dfd02ecf97bf0b22538fca53c7fc4cf10791a2f7fa7461cd28a0a528",?[ \t\r]*$',
  '^[\r\n \t]*"upstream/nuttx/patches/0006-flat-build-global-pthread-keys\.patch":[ \t]*"776a412266a0ec3d30b2aef62f11ad05119b53dcc71bc836b33dfd0e93f84101",?[ \t\r]*$',
]

[[allowlists]]
description = "Reviewed channel-progress pthread patch hash from 2026-11-04"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['^tests/channel-progress/results/2026-11-04-esp32s3/(runs/(std|crossbeam|fifo)/[^/]+/run/(build|analysis|acceptance)|(std|fifo)-(no-repair|physical))\.json$']
regexTarget = "line"
regexes = ['^[\r\n \t]*"upstream/nuttx/patches/0006-flat-build-global-pthread-keys\.patch":[ \t]*"776a412266a0ec3d30b2aef62f11ad05119b53dcc71bc836b33dfd0e93f84101",?[ \t\r]*$']

# Reviewed Dropbear history contains two public preimage hashes and a prose
# table row that the generic key heuristic matches. The self-test reconstructs
# the source bytes from the immutable complete patch and verifies the prose.
[[allowlists]]
description = "Reviewed Dropbear authentication source preimage hashes"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['^tests/host/fixtures/dropbear-native/upstream\.json$']
regexTarget = "line"
regexes = [
  '^[\r\n \t]*"netutils/dropbear/port/nuttx_auth\.c":[ \t]*"bf80ad81244d769c98a3888742d4c8d829fc475593573f262e505db1477a3936",?[ \t\r]*$',
  '^[\r\n \t]*"netutils/dropbear/patch/0002-use-nuttx-passwd-auth\.patch":[ \t]*"47f56660a9a2ef7fe1c1d218079e952c73d0ddd520ad6fc8eb1d49238bb93c47",?[ \t\r]*$',
]

[[allowlists]]
description = "Reviewed Dropbear resource measurement table prose"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['^docs/dropbear-ssh\.md$']
regexTarget = "line"
regexes = ['^[\r\n \t]*\| Resource cost \| Matched baseline, dependencies selected but not running, listening, authenticated shell, handshake/rekey/failure peaks, post-disconnect and post-stop \|[ \t\r]*$']
