title = "nxrs secret scanning"
[extend]
useDefault = true

# Narrow false positives: source file hashes, not blanket fixture/path exclusions.
[[allowlists]]
description = "Detector provenance maps a source path to its SHA-256"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['^tests/detection/results/[^/]+/provenance\.json$']
regexTarget = "line"
regexes = ['^\s*"hal/detector/src/api\.rs":\s*"[0-9a-f]{64}",?\s*$']

[[allowlists]]
description = "RTOS benchmark records the upstream tm_api.h git object hash"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['^tests/rtos-bench/upstream\.json$']
regexTarget = "line"
regexes = ['^\s*"tm_api\.h":\s*"[0-9a-f]{40}",?\s*$']

[[allowlists]]
description = "Detector firmware provenance records three public HAL API source hashes"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['^tests/detection/results/[^/]+/firmware\.json$']
regexTarget = "line"
regexes = ['^\s*"hal/(camera|detector|wifi)/src/api\.rs":\s*"[0-9a-f]{64}",?\s*$']

[[allowlists]]
description = "Detector validation records the public API schema source hash"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['^tests/detection/results/[^/]+/validation\.json$']
regexTarget = "line"
regexes = ['^\s*"docs/monitoring-api\.json":\s*"[0-9a-f]{64}",?\s*$']

[[allowlists]]
description = "Radio provenance records the public credential-fixture C source hash"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['^tests/csi-radio/results/[^/]+\.json$']
regexTarget = "line"
regexes = ['^\s*"tests/nuttx-std/wifi/ffi/credentials\.c":\s*"[0-9a-f]{64}",?\s*$']

[[allowlists]]
description = "Archived std-channel build provenance records the public pthread-key patch SHA-256"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['^tests/std-channel-perf/results/2026-11-02-(qemu|esp32s3)/([^/]+/)+(build|analysis)\.json$']
regexTarget = "line"
regexes = ['^\s*"upstream/nuttx/patches/0006-flat-build-global-pthread-keys\.patch":\s*"[0-9a-f]{64}",?\s*$']

[[allowlists]]
description = "Twelve reviewed P0 SIMPLE_BOOT receipts repeat one exact public patch hash"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['^tests/std-channel-perf/results/2026-11-03-esp32s3-simpleboot/(firmware-receipts/(latency|latency-rom-digest)/build\.json|runs/(latency-tight-1|latency-rom-digest-tight-[123]|latency-rom-digest-seed-1-1)/(build|analysis)\.json)$']
regexTarget = "line"
regexes = ['^\s*"upstream/nuttx/patches/0006-flat-build-global-pthread-keys\.patch":\s*"776a412266a0ec3d30b2aef62f11ad05119b53dcc71bc836b33dfd0e93f84101",?\s*$']

[[allowlists]]
description = "Twenty-seven reviewed P0 latency-control receipts repeat one exact public patch hash"
targetRules = ["generic-api-key"]
condition = "AND"
paths = [
  '^tests/std-channel-perf/results/2026-11-03-esp32s3-latency-controls/firmware-receipts/build\.json$',
  '^tests/std-channel-perf/results/2026-11-03-esp32s3-latency-controls/runs/(01-tight|02-seed-1-a|03-seed-17|04-fixed-100-w100-a|05-fixed-100-w101-a|06-fixed-1000-w100-a|07-fixed-1000-w101-a|08-seed-113|09-seed-1-b|10-fixed-1000-w101-b|11-fixed-1000-w100-b|12-fixed-100-w101-b|13-fixed-100-w100-b)/(build|analysis)\.json$',
]
regexTarget = "line"
regexes = ['^\s*"upstream/nuttx/patches/0006-flat-build-global-pthread-keys\.patch":\s*"776a412266a0ec3d30b2aef62f11ad05119b53dcc71bc836b33dfd0e93f84101",?\s*$']

[[allowlists]]
description = "Forty-nine reviewed P1 physical evidence files repeat one exact public patch hash"
targetRules = ["generic-api-key"]
condition = "AND"
paths = [
  '^tests/channel-progress/results/2026-11-04-esp32s3/runs/(crossbeam/select-(reserved|published)|std/(mutex-(admit|take)-(held|released)|condvar-(close-wait|publish-before-wait|wait-publish))|fifo/(fifo-(select|try-recv)-(reserved|published)|fifo-try-send-(reserved|reclaimed)))/run/(build|analysis|acceptance)\.json$',
  '^tests/channel-progress/results/2026-11-04-esp32s3/(std|fifo)-(no-repair|physical)\.json$',
]
regexTarget = "line"
regexes = ['^\s*"upstream/nuttx/patches/0006-flat-build-global-pthread-keys\.patch":\s*"776a412266a0ec3d30b2aef62f11ad05119b53dcc71bc836b33dfd0e93f84101",?\s*$']
