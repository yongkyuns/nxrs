[package]
name = "nxrs-navigation-services"
version.workspace = true
edition.workspace = true

[lib]
name = "navigation"

[features]
probe = ["dep:log"]

[dependencies]
log = { version = "0.4", optional = true }
nxrs-messaging = { path = "../../shared/messaging" }
nxrs-imu = { path = "../../hal/imu" }
nxrs-gnss = { path = "../../hal/gnss" }
triple_buffer = "=9.0.0"

[dev-dependencies]
nxrs-composition = { path = "../../platform", features = ["imu", "gnss"] }
nxrs-simulation = { path = "../../shared/simulation" }
