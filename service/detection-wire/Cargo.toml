[package]
name = "nxrs-detection-wire"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "detection_wire"

[features]
default = ["json"]
json = ["dep:serde", "dep:serde_json"]

[dependencies]
serde = { version = "=1.0.228", features = ["derive"], optional = true }
serde_json = { version = "=1.0.145", optional = true }

[[example]]
name = "video_fixture"
required-features = ["json"]

[[test]]
name = "contract"
required-features = ["json"]
