[package]
name = "nxrs-telemetry-service"
version.workspace = true
edition.workspace = true

[lib]
name = "telemetry_service"

[features]
default = ["summary"]
summary = ["dep:nxrs-camera", "dep:nxrs-transport"]
stream = [
    "dep:nxrs-ble", "dep:nxrs-cellular", "dep:nxrs-gnss", "dep:nxrs-imu",
    "dep:nxrs-log-router", "dep:nxrs-navigation-services", "dep:nxrs-tls",
]

[dependencies]
nxrs-camera = { path = "../../hal/camera", optional = true }
nxrs-transport = { path = "../../hal/transport", optional = true }
nxrs-ble = { path = "../../hal/ble", features = ["peripheral"], optional = true }
nxrs-cellular = { path = "../../hal/cellular", optional = true }
nxrs-gnss = { path = "../../hal/gnss", optional = true }
nxrs-imu = { path = "../../hal/imu", optional = true }
nxrs-log-router = { path = "../logging", optional = true }
nxrs-navigation-services = { path = "../navigation", optional = true }
nxrs-tls = { path = "../../hal/tls", features = ["pairing"], optional = true }

[[test]]
name = "packet_sink"
required-features = ["summary"]
