[package]
name = "nxrs-identity-sdk-target"
version.workspace = true
edition.workspace = true

[dependencies]
nxrs-device-identity = { path = "../../../driver/device-identity" }
nxrs-camera = { path = "../../../hal/camera" }
nxrs-camera-stream = { path = "../../../app/camera-stream" }
nxrs-stream-service = { path = "../../../service/stream" }

[features]
probe = []

[[bin]]
name = "identity-sdk-target"
path = "src/main.rs"
required-features = ["probe"]

[[bin]]
name = "identity-tls-target"
path = "src/tls.rs"
required-features = ["probe"]
