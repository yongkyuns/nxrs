[package]
name = "nxrs-std-resources"
version.workspace = true
edition.workspace = true
publish = false

# Explicit workspace member, excluded from default-members. Built as its own
# destructive qualification image, never as a production app dependency.

[dependencies]
nxrs-service-event = { path = "../../../service/event" }

# Borrowed portable app sources mention their own optional probe; this fixture does not enable it.
[lints.rust]
unexpected_cfgs = { level = "deny", check-cfg = ['cfg(feature, values("probe"))'] }

[[bin]]
name = "ao-stack-stress"
path = "src/bin/ao-stack-stress.rs"
test = false
bench = false
