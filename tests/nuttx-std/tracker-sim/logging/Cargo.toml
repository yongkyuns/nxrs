[package]
name = "nxrs-tracker-log-qualification"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
log = "0.4"
nxrs-navigation-services = { path = "../../../../service/navigation", features = ["probe"] }
nxrs-composition = { path = "../../../../platform", features = ["imu"] }
nxrs-messaging = { path = "../../../../shared/messaging" }
nxrs-log-router = { path = "../../../../service/logging" }

[package.metadata.nxrs]
qualification-only = true
required-capabilities = ["imu"]

[package.metadata.nxrs.firmware]
command = "motion_tracker"
stack-size = 32768
