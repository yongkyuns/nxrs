# Compile/link fixture, not stock board wiring. BSP must register /dev/spi2
# and route SPIDEV_USER(0) to the sensor CS. NuttX owns pinmux and controller setup.
remove-devices = ["motion"]

[resources.sensor_spi]
kind = "spi"
device = "/dev/spi2"
frequency = 4_000_000

[devices.motion_spi]
compatible = "st,lsm6dso"
bus = "sensor_spi"
chip-select = 0
spi-mode = 3

[devices.motion_spi.wake]
kind = "periodic"

[roles]
imu = "motion_spi"
