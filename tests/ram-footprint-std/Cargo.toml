[workspace]
resolver = "2"

[package]
name = "nxrs-ram-footprint-std"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
messaging = { package = "nxrs-messaging", path = "../../shared/messaging" }
nxrs-allocation-probe = { path = "../allocation-probe" }
crossbeam-channel = { version = "=0.5.17", default-features = false, features = ["std"] }

[profile.release]
opt-level = 2
lto = "fat"
codegen-units = 1
panic = "abort"
debug = 0
