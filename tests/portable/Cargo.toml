[package]
name = "nxrs-simulator"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
nxrs-camera = { path = "../../hal/camera" }
nxrs-storage = { path = "../../hal/storage" }
nxrs-transport = { path = "../../hal/transport" }
nxrs-camera-service = { path = "../../service/camera" }
nxrs-recording-service = { path = "../../service/recording" }
nxrs-telemetry-service = { path = "../../service/telemetry" }
nxrs-applications = { path = "../../app/nxrs" }
