[workspace]
[package]
name = "nxrs-mpsc-comparison"
version = "0.1.0"
edition = "2024"
publish = false
build = "build.rs"
[lib]
name = "mpsc_comparison"
crate-type = ["rlib", "staticlib"]
[[bin]]
name = "mpsc-comparison"
path = "src/main.rs"

[[test]]
name = "capture"
path = "tests/capture.rs"
harness = false

[target.'cfg(not(any(target_os = "nuttx", target_os = "none")))'.dev-dependencies]
allocation_probe = { package = "nxrs-allocation-probe", path = "../../allocation-probe" }
navigation = { package = "nxrs-navigation-services", path = "../../../service/navigation" }
imu = { package = "nxrs-imu", path = "../../../hal/imu" }
gnss = { package = "nxrs-gnss", path = "../../../hal/gnss" }
heapless = { version = "=0.9.4", default-features = false }

[package.metadata.nxrs]
qualification-only = true

[package.metadata.nxrs.firmware]
bin = "mpsc-comparison"
command = "mpsc_perf"
priority = 100
stack-size = 8192

[profile.release]
panic = "abort"
lto = "fat"
codegen-units = 1
opt-level = "z"
debug = false
strip = "none"
