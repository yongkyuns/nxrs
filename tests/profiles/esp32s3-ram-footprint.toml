# Same-substrate ordinary Rust RAM controls; NSH is a shared measured baseline.
# This is a new cohort, not the October shell-free POSIX comparison profile.
board = "esp32s3-devkit:nsh"
target = "xtensa-esp32s3-nuttx"
crossdev = "xtensa-esp32s3-elf-"
machine = "Tensilica Xtensa Processor"
image = "nuttx.merged.bin"
requires-qemu = false
hal = {}

[kconfig]
enable = [
  "ESP32S3_QEMU_IMAGE", "ESP32S3_USBSERIAL", "ESP32S3_DEFAULT_CPU_FREQ_240",
  "OTHER_SERIAL_CONSOLE", "ARCH_CHIP_ESP32S3WROOM2N16R8V",
  "DEBUG_FEATURES", "DEBUG_ASSERTIONS", "DEBUG_SYMBOLS", "DEBUG_LINK_MAP",
  "STACK_COLORATION",
]
disable = [
  "NET", "SMP", "DISABLE_PTHREAD", "NSH_NETINIT", "NETUTILS_NETINIT",
  "NET_USRSOCK", "NET_ETHERNET", "ESP32S3_WIFI", "ESP32S3_BLE",
  "ESP32S3_SPIRAM", "UART0_SERIAL_CONSOLE", "ARCH_LEDS",
]
set = ["PTHREAD_STACK_DEFAULT=4096", "ARCH_INTERRUPTSTACK=4096"]
require = [
  "CONFIG_BUILD_FLAT=y", "CONFIG_ARCH_XTENSA=y", "CONFIG_ARCH_CHIP_ESP32S3=y",
  "CONFIG_ESP32S3_QEMU_IMAGE=y", "CONFIG_ESPRESSIF_SIMPLE_BOOT=y",
  "CONFIG_ESP32S3_USBSERIAL=y", "CONFIG_OTHER_SERIAL_CONSOLE=y",
  "CONFIG_ESP32S3_DEFAULT_CPU_FREQ_MHZ=240", "CONFIG_PTHREAD_STACK_DEFAULT=4096",
  "CONFIG_ARCH_INTERRUPTSTACK=4096", "CONFIG_STACK_COLORATION=y",
]
forbid-regex = "^CONFIG_(NET|SMP|DISABLE_PTHREAD|ESP32S3_WIFI|ESP32S3_BLE|ESP32S3_SPIRAM|UART0_SERIAL_CONSOLE)=y$"
