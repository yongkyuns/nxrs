# Receive-only Philips I²S on Freenove FNK0085. Preserve inherited camera settings.
CONFIG_AUDIO=y
CONFIG_DRIVERS_AUDIO=y
CONFIG_AUDIO_I2S=y
CONFIG_ESPRESSIF_I2S0=y
CONFIG_ESPRESSIF_I2S0_RX=y
CONFIG_ESPRESSIF_I2S0_ROLE_MASTER=y
CONFIG_ESPRESSIF_I2S0_DATA_BIT_WIDTH_32BIT=y
# CONFIG_ESPRESSIF_I2S0_TX is not set
# CONFIG_ESPRESSIF_I2S0_MCLK is not set
# CONFIG_AUDIO_I2SCHAR is not set
# CONFIG_AUDIO_MULTI_SESSION is not set
# CONFIG_AUDIO_EXCLUDE_STOP is not set
CONFIG_ESPRESSIF_I2S0_SAMPLE_RATE=16000
CONFIG_ESPRESSIF_I2S0_BCLKPIN=14
CONFIG_ESPRESSIF_I2S0_WSPIN=21
CONFIG_ESPRESSIF_I2S0_DINPIN=1
CONFIG_PIPES=y
