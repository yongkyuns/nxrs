# Cortex-M33/MPS2 AN521 hardware-free qualification platform.
# This is an ARMv8-M runtime proxy, not RP2350 hardware emulation.
board = "mps2-an521:nsh"
target = "thumbv8m.main-nuttx-eabi"
crossdev = "arm-none-eabi-"
machine = "ARM"
image = "nuttx"
hal = { imu = "mock", gnss = "mock" }

[kconfig]
enable = [
  "DEBUG_FEATURES",
  "DEBUG_ASSERTIONS",
  "DEBUG_SYMBOLS",
  "DEBUG_LINK_MAP",
  "SCHED_BACKTRACE",
  "UNWINDER_ARM",
  "STACK_COLORATION",
  "FS_PROCFS",
]
# MPS2 nsh defaults DEBUG_SCHED on. With the 64-bit clock that deliberately
# seeds the scheduler clock immediately before a 32-bit wrap; disable that
# debug stress fixture for the ordinary ARMv8-M runtime proxy.
disable = [
  "ARCH_FPU",
  "SMP",
  "NET",
  "DISABLE_PTHREAD",
  "DEBUG_SCHED",
  "DEBUG_SCHED_ERROR",
  "FS_PROCFS_EXCLUDE_PROCESS",
  "FS_PROCFS_EXCLUDE_MEMINFO",
]
set = ["PTHREAD_STACK_DEFAULT=65536", "MM_BACKTRACE=8", "MM_BACKTRACE_DEFAULT=y"]
require = [
  "CONFIG_ARCH_ARM=y",
  "CONFIG_ARCH_BOARD_MPS2_AN521=y",
  "CONFIG_ARCH_CHIP_MPS2_AN521=y",
  "CONFIG_RAM_SIZE=2097152",
  "CONFIG_PTHREAD_STACK_DEFAULT=65536",
  "CONFIG_MM_BACKTRACE=8",
  "CONFIG_MM_BACKTRACE_DEFAULT=y",
  "CONFIG_SCHED_BACKTRACE=y",
  "CONFIG_UNWINDER_ARM=y",
  "# CONFIG_UNWINDER_FRAME_POINTER is not set",
  "CONFIG_FS_PROCFS=y",
  "CONFIG_STACK_COLORATION=y",
  "# CONFIG_FS_PROCFS_EXCLUDE_PROCESS is not set",
  "# CONFIG_FS_PROCFS_EXCLUDE_MEMINFO is not set",
]
forbid-regex = "^CONFIG_(ARCH_FPU|SMP|NET|DISABLE_PTHREAD|DEBUG_SCHED|DEBUG_SCHED_ERROR)=y$"
