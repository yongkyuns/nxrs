# The full app uses NuttX GATT over an H4 controller attached to UART2.
extends = "esp32s3-qemu-tracker-devices"
hal = { ble = "nuttx", tls = "nuttx" }

[resources.controller_uart]
binding = "uart2"
kconfig = { ESP32S3_UART2_TXPIN = 13, ESP32S3_UART2_RXPIN = 7 }
baud = 115200

[kconfig]
enable = [
  "ESP32S3_QEMU_IMAGE", "DEBUG_FEATURES", "DEBUG_ASSERTIONS", "DEBUG_ERROR", "DEBUG_WIRELESS",
  "ALLOW_BSD_COMPONENTS", "PIPES", "NET", "NET_BLUETOOTH", "NETDEV_LATEINIT",
  "NETDEV_IOCTL", "DRIVERS_WIRELESS", "DRIVERS_BLUETOOTH", "WIRELESS",
  "WIRELESS_BLUETOOTH", "WIRELESS_BLUETOOTH_HOST", "BLUETOOTH_UART",
  "BLUETOOTH_UART_SHIM", "BLUETOOTH_UART_OTHER", "SCHED_LPWORK",
  "ESP32S3_RNG", "DEV_RANDOM",
  "SPI", "SPI_DRIVER", "SPI_EXCHANGE", "SPI_CMDDATA", "INPUT", "INPUT_FT5X06",
  "FT5X06_POLLMODE", "FT5X06_SINGLEPOINT", "MTD", "RAMMTD", "RAMMTD_FLASHSIM",
  "MTD_CONFIG_NVS", "MTD_CONFIG_NAMED",
]
disable = [
  "SMP", "ESP32S3_SPIRAM", "ESPRESSIF_WIFI", "ESPRESSIF_BLE", "SPI_HWFEATURES",
  "MTD_CONFIG_NONE", "NSH_NETINIT", "NSH_PIPELINE", "NETUTILS_NETINIT",
]
set = [
  "INIT_ENTRYPOINT=\"tracker_sim_init\"", "INIT_ENTRYNAME=\"tracker_sim_init\"",
  "USEC_PER_TICK=1000", "PTHREAD_STACK_DEFAULT=16384", "UART2_RXBUFSIZE=2048",
  "ESP32S3_RX_FIFO_THRD=1",
  "UART2_TXBUFSIZE=512", "FT5X06_POLL_IDLE_MS=40",
  "BLUETOOTH_TXCMD_STACKSIZE=8192", "BLUETOOTH_TXCONN_STACKSIZE=8192",
  "SCHED_LPWORKSTACKSIZE=4096", "IOB_NBUFFERS=32", "IOB_BUFSIZE=256",
  "MTD_CONFIG_NAME_LEN=32", "RAMMTD_ERASESIZE=4096", "RAMMTD_BLOCKSIZE=256",
]
require = [
  "CONFIG_INIT_ENTRYPOINT=\"tracker_sim_init\"", "CONFIG_NET_BLUETOOTH=y",
  "CONFIG_WIRELESS_BLUETOOTH_HOST=y", "CONFIG_BLUETOOTH_UART_SHIM=y",
  "CONFIG_BLUETOOTH_UART_OTHER=y", "CONFIG_ESP32S3_RNG=y", "CONFIG_DEV_RANDOM=y",
  "CONFIG_FT5X06_POLL_IDLE_MS=40", "CONFIG_PIPES=y",
]
forbid-regex = "^CONFIG_(SMP|ESP32S3_SPIRAM|ESPRESSIF_WIFI|ESPRESSIF_BLE|SCHED_TICKLESS)=y$"
