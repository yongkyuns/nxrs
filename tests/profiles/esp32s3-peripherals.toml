# Dedicated test image. The test writes to the first two sectors of the scratch MTD partition.
board = "esp32s3-devkit:nsh"
target = "xtensa-esp32s3-nuttx"
crossdev = "xtensa-esp32s3-elf-"
machine = "Tensilica Xtensa Processor"
image = "nuttx.bin"
requires-qemu = false
hal = { boot = "nuttx", rtc = "nuttx", watchdog = "nuttx", flash = "nuttx" }

[kconfig]
enable = [
  "RAW_BINARY", "ARCH_CHIP_ESP32S3WROOM2N16R8V", "RTC", "RTC_DRIVER", "WATCHDOG", "ESP32S3_MWDT0",
  "ESP32S3_SPIFLASH", "ESP32S3_MTD", "BCH", "ESP32S3_USBSERIAL", "OTHER_SERIAL_CONSOLE",
  "BOARDCTL", "BOARDCTL_RESET_CAUSE", "DEV_GPIO", "ESPRESSIF_GPIO_IRQ",
  "ESP32S3_DEVKIT_GPIO_IRQ_RISING", "PIPES",
  "ESPRESSIF_LEDC", "ESPRESSIF_LEDC_TIMER0", "ESPRESSIF_LEDC_GPIO_READBACK",
  "ESPRESSIF_ADC", "ESPRESSIF_ADC_1",
  "ESPRESSIF_ADC_1_MODE_ONE_SHOT", "ESPRESSIF_ADC_1_CH0", "ESPRESSIF_ADC_1_CH1",
]
disable = [
  "NET", "SMP", "DISABLE_PTHREAD", "ESP32S3_QEMU_IMAGE", "UART0_SERIAL_CONSOLE",
  "ESP32S3_SPIFLASH_AUTO_BRINGUP", "LIBC_LOCALTIME",
  "WATCHDOG_AUTOMONITOR", "WATCHDOG_PANIC_NOTIFIER", "GPIO_LOWER_HALF", "NSH_PIPELINE",
  "ESPRESSIF_ADC_1_CH2", "ESPRESSIF_ADC_1_CH3",
]
set = [
  "PTHREAD_STACK_DEFAULT=16384", "ARCH_INTERRUPTSTACK=4096",
  "ESP32S3_STORAGE_MTD_OFFSET=0xf00000", "ESP32S3_STORAGE_MTD_SIZE=0x10000",
  # GPIO14 senses the LEDC waveform on the same pad.
  "ESP32S3_DEVKIT_GPIO_IRQ_PIN=14", "DEV_GPIO_NPOLLWAITERS=1", "DEV_GPIO_NSIGNALS=0",
  "ESPRESSIF_LEDC_CHANNEL0_PIN=14", "PWM_NCHANNELS=1", "USEC_PER_TICK=1000",
]
require = [
  "CONFIG_ESPRESSIF_SIMPLE_BOOT=y", "CONFIG_ESP32S3_FLASH_16M=y", "CONFIG_RTC=y", "CONFIG_RTC_DRIVER=y",
  "CONFIG_WATCHDOG=y", "CONFIG_ESP32S3_MWDT0=y", "CONFIG_ESP32S3_MTD=y",
  "CONFIG_MTD_PARTITION=y", "CONFIG_BCH=y", "CONFIG_ESP32S3_USBSERIAL=y",
  "CONFIG_BOARDCTL_RESET_CAUSE=y",
  "CONFIG_PIPES=y", "CONFIG_DEV_GPIO=y", "CONFIG_ESP32S3_DEVKIT_GPIO_IRQ_PIN=14",
  "CONFIG_ESP32S3_DEVKIT_GPIO_IRQ_RISING=y", "CONFIG_DEV_GPIO_NPOLLWAITERS=1",
  "CONFIG_PWM_NCHANNELS=1", "CONFIG_ESPRESSIF_LEDC_CHANNEL0_PIN=14",
  "CONFIG_ESPRESSIF_LEDC_GPIO_READBACK=y",
  "CONFIG_ESPRESSIF_ADC_1_CH0=y", "CONFIG_ESPRESSIF_ADC_1_CH1=y", "CONFIG_ESPRESSIF_ADC_1_MODE_ONE_SHOT=y",
  "CONFIG_ESP32S3_STORAGE_MTD_OFFSET=0xf00000", "CONFIG_ESP32S3_STORAGE_MTD_SIZE=0x10000",
]
forbid-regex = "^CONFIG_(SMP|ESP32S3_SPIFLASH_AUTO_BRINGUP|ESPRESSIF_SECURE_FLASH_ENC_ENABLED|LIBC_LOCALTIME|WATCHDOG_AUTOMONITOR|WATCHDOG_PANIC_NOTIFIER)=y$"

[rtc]
device = "/dev/rtc0"

[watchdog]
device = "/dev/watchdog0"
mode = "runtime"

[flash]
device = "/dev/mtdblock0"

[composition]
version = 1
mode = "qualification"

[resources]
[devices]
