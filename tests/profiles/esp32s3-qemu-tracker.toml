# Real ESP32-S3 serial and NuttX IP drivers. UART2 terminates at a host modem model.
extends = "esp32s3-qemu-tracker-devices"
hal = { cellular = "nuttx" }

[resources.modem_uart]
binding = "uart2"
kconfig = { ESP32S3_UART2_TXPIN = 13, ESP32S3_UART2_RXPIN = 7 }
baud = 115200

[cellular]
uart = "modem_uart"

[kconfig]
enable = [
  "ESP32S3_QEMU_IMAGE", "DEBUG_FEATURES", "DEBUG_ASSERTIONS",
  "ALLOW_BSD_COMPONENTS", "PIPES", "NET", "NET_IPv4", "NET_UDP", "NET_TCP",
  "NET_TUN", "NETUTILS_NETLIB", "SCHED_LPWORK", "NETDEV_LATEINIT", "NET_SOCKOPTS", "LIBC_NETDB",
  "SPI", "SPI_DRIVER", "SPI_EXCHANGE", "SPI_CMDDATA", "INPUT", "INPUT_FT5X06", "FT5X06_POLLMODE",
  "FT5X06_SINGLEPOINT", "MTD", "RAMMTD", "RAMMTD_FLASHSIM", "MTD_CONFIG_NVS", "MTD_CONFIG_NAMED",
]
disable = ["SMP", "ESP32S3_SPIRAM", "ESPRESSIF_WIFI", "SPI_HWFEATURES", "MTD_CONFIG_NONE", "ESPRESSIF_BLE", "NSH_NETINIT", "NSH_PIPELINE", "NETUTILS_NETINIT"]
set = ["USEC_PER_TICK=1000", "UART2_RXBUFSIZE=4096", "UART2_TXBUFSIZE=1024", "NET_TUN_PKTSIZE=1500", "PTHREAD_STACK_DEFAULT=16384", "MTD_CONFIG_NAME_LEN=32", "RAMMTD_ERASESIZE=4096", "RAMMTD_BLOCKSIZE=256"]
require = ["CONFIG_NET_TUN=y", "CONFIG_NET_TUN_PKTSIZE=1500", "CONFIG_NET_IPv4=y", "CONFIG_NET_UDP=y", "CONFIG_PIPES=y"]
forbid-regex = "^CONFIG_(SMP|ESP32S3_SPIRAM|ESPRESSIF_WIFI|ESPRESSIF_BLE|SCHED_TICKLESS)=y$"
