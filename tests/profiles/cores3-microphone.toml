# Native microphone qualification, not a portable Rust audio HAL binding.
board = "esp32s3-m5-cores3:nsh"
target = "xtensa-esp32s3-nuttx"
crossdev = "xtensa-esp32s3-elf-"
machine = "Tensilica Xtensa Processor"
image = "nuttx.bin"
requires-qemu = false
hal = {}

[build]
size-optimized = true

[kconfig]
enable = [
  "RAW_BINARY", "ARCH_CHIP_ESP32S3CUSTOM", "ESP32S3CUSTOM_FLASH_16M",
  "ESP32S3_I2C0", "ESP32S3_I2C0_MASTER_MODE", "BOARD_LATE_INITIALIZE",
  "DRIVERS_AUDIO", "AUDIO", "AUDIO_I2S", "AUDIO_ES7210",
  "ESPRESSIF_I2S0", "ESPRESSIF_I2S0_RX", "ESPRESSIF_I2S0_MCLK",
  "ESPRESSIF_I2S0_ROLE_MASTER", "ESP32S3_M5_CORES3_MIC",
  "SCHED_LPWORK", "SYSTEM_NXRECORDER", "FS_TMPFS",
  "ESP32S3_USBSERIAL", "OTHER_SERIAL_CONSOLE", "SYSLOG_CONSOLE",
  "DEBUG_FEATURES", "DEBUG_SYMBOLS", "DEBUG_LINK_MAP",
]
disable = [
  "NET", "SMP", "ESPRESSIF_WIFI", "ESPRESSIF_BLE", "ESP32S3_QEMU_IMAGE",
  "ESPRESSIF_I2S0_TX", "ESPRESSIF_I2S1", "ESP32S3_M5_CORES3_LCD",
  "I2C_POLLED", "UART0_SERIAL_CONSOLE", "DISABLE_PTHREAD", "NSH_PIPELINE",
  "AUDIO_EXCLUDE_STOP", "AUDIO_MULTI_SESSION", "ESP32S3_SPIRAM",
]
set = [
  "ESP32S3_I2C0_SDAPIN=12", "ESP32S3_I2C0_SCLPIN=11",
  "ESP32S3_I2CTIMEOSEC=0", "ESP32S3_I2CTIMEOMS=50",
  "ESPRESSIF_I2S0_MCLKPIN=0", "ESPRESSIF_I2S0_BCLKPIN=34",
  "ESPRESSIF_I2S0_WSPIN=33", "ESPRESSIF_I2S0_DINPIN=14",
  "ESPRESSIF_I2S0_SAMPLE_RATE=16000", "I2S_DMADESC_NUM=16",
  "ES7210_BUFFER_SIZE=1024", "ES7210_NUM_BUFFERS=4",
  "NXRECORDER_RECORDTHREAD_STACKSIZE=16384", "SCHED_LPWORKSTACKSIZE=8192",
]
require = [
  "CONFIG_ARCH_BOARD_ESP32S3_M5_CORES3=y", "CONFIG_ESPRESSIF_SIMPLE_BOOT=y",
  "CONFIG_ESP32S3_FLASH_16M=y", "CONFIG_BOARD_LATE_INITIALIZE=y",
  "CONFIG_ESP32S3_M5_CORES3_MIC=y", "CONFIG_AUDIO_ES7210=y",
  "CONFIG_SYSTEM_NXRECORDER=y", "CONFIG_FS_TMPFS=y", "CONFIG_SCHED_LPWORK=y",
  "CONFIG_ESP32S3_I2C0_SDAPIN=12", "CONFIG_ESP32S3_I2C0_SCLPIN=11",
  "CONFIG_ESP32S3_I2CTIMEOSEC=0", "CONFIG_ESP32S3_I2CTIMEOMS=50",
  "CONFIG_ESPRESSIF_I2S0_MCLKPIN=0", "CONFIG_ESPRESSIF_I2S0_BCLKPIN=34",
  "CONFIG_ESPRESSIF_I2S0_WSPIN=33", "CONFIG_ESPRESSIF_I2S0_DINPIN=14",
  "CONFIG_ESPRESSIF_I2S0_RX=y", "CONFIG_ESPRESSIF_I2S0_MCLK=y",
  "CONFIG_ESPRESSIF_I2S0_ROLE_MASTER=y", "CONFIG_ESPRESSIF_I2S0_SAMPLE_RATE=16000",
  "CONFIG_ES7210_BUFFER_SIZE=1024", "CONFIG_ES7210_NUM_BUFFERS=4",
  "CONFIG_ESP32S3_USBSERIAL=y", "CONFIG_OTHER_SERIAL_CONSOLE=y",
  "CONFIG_DEBUG_SYMBOLS=y", "CONFIG_DEBUG_LINK_MAP=y",
  "# CONFIG_ESPRESSIF_I2S0_TX is not set", "# CONFIG_AUDIO_EXCLUDE_STOP is not set",
]
forbid-regex = "^CONFIG_(SMP|ESPRESSIF_WIFI|ESPRESSIF_BLE|ESPRESSIF_I2S0_TX|ESPRESSIF_I2S1|ESP32S3_M5_CORES3_LCD|ESP32S3_SPIRAM)=y$"
