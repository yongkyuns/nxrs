# Build-only qualification. The guarded loader refuses unprovisioned hardware.
extends = "esp32s3-camera-stream-mcuboot"
# Factory-image builds only: the pinned encrypted update path is unqualified.
hal = { boot = "none" }
hardware-protection = true
cpus = 1

# Stable product/flash-format class, independent of release version.
image-class = "b8c23dde-977a-454f-88ea-7cafafe51a90"

[detector]
model = "pico"
stack-bytes = 131072
sample-ms = 500

[mcuboot]
flash-size = 0x1000000
primary-offset = 0x20000
secondary-offset = 0x220000
slot-size = 0x200000
scratch-offset = 0x420000
scratch-size = 0x40000
header-size = 32
write-align = 32
erase-size = 4096
