# Single-core Cortex-M33 channel qualification; radios remain inactive.
board = "raspberrypi-pico-2:usbnsh"
target = "thumbv8m.main-nuttx-eabi"
crossdev = "arm-none-eabi-"
machine = "ARM"
image = "nuttx.bin"
requires-qemu = false
hal = {}

[build]
trace-only-backtrace = true
size-optimized = true

[init]
args = []

[kconfig]
enable = [
  "BOARDCTL_USBDEVCTRL", "RAW_BINARY", "BOOT_RUNFROMFLASH", "PTHREAD_MUTEX_TYPES", "DEBUG_FEATURES",
  "DEBUG_ASSERTIONS", "STACK_COLORATION", "CDCACM_1200BPS_BOOTLOADER",
  "RP23XX_USB_BOOTSEL_DISABLE_MSD", "RAMLOG", "RAMLOG_SYSLOG", "RAMLOG_NONBLOCKING",
]
disable = [
  "SYSTEM_NSH", "NSH_LIBRARY", "SYSTEM_DD", "FS_PROCFS", "FS_PROCFS_REGISTER", "LIBC_FLOATINGPOINT", "ARCH_LEDS", "USERLED", "BOOT_COPYTORAM", "RP23XX_UF2_BINARY", "ARCH_FPU", "SMP", "NET",
  "DISABLE_PTHREAD", "DISABLE_MQUEUE", "PRIORITY_INHERITANCE", "SCHED_CRITMONITOR",
  "SCHED_INSTRUMENTATION", "SYSLOG_CONSOLE", "SYSLOG_DEFAULT", "SYSLOG_CDCACM",
  "EXAMPLES_HELLO", "TESTING_GETPRIME", "TESTING_OSTEST",
]
set = [
  "USEC_PER_TICK=10000", "PTHREAD_STACK_DEFAULT=4096", "INIT_STACKSIZE=8192",
  "DEFAULT_TASK_STACKSIZE=8192", "RAMLOG_BUFSIZE=4096", "MQ_MAXMSGSIZE=64",
]
require = [
  "CONFIG_BOOT_RUNFROMFLASH=y", "CONFIG_ARCH_CHIP_RP23XX=y", "CONFIG_RAM_SIZE=532480",
  "CONFIG_USEC_PER_TICK=10000", "CONFIG_CDCACM_1200BPS_BOOTLOADER=y",
  "CONFIG_BOARD_USBDEV_BOOTLOADER=y",
  "CONFIG_MQ_MAXMSGSIZE=64",
]
forbid-regex = "^CONFIG_(SMP|ARCH_FPU|NET|DISABLE_MQUEUE|PRIORITY_INHERITANCE|BOOT_COPYTORAM)=y$"
