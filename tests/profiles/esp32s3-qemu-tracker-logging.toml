# The headless one-IMU image with an OS log ring and a volatile archive volume.
extends = "esp32s3-qemu-tracker-headless"

[kconfig]
enable = ["PIPES", "FS_TMPFS", "SYSLOG", "RAMLOG", "RAMLOG_SYSLOG", "SYSLOG_CHARDEV"]
disable = ["SMP", "ESP32S3_SPIRAM", "ESPRESSIF_WIFI", "ESPRESSIF_BLE",
  "ESP32S3_UART2", "SPI", "INPUT", "MTD", "NSH_PIPELINE",
  "RAMLOG_NONBLOCKING", "SYSLOG_DEFAULT", "SYSLOG_CONSOLE"]
set = ['INIT_ENTRYPOINT="tracker_sim_init"', 'INIT_ENTRYNAME="tracker_sim_init"',
  "USEC_PER_TICK=1000", "PTHREAD_STACK_DEFAULT=16384", "RAMLOG_BUFSIZE=8192",
  'SYSLOG_DEVPATH="/dev/kmsg"']
require = ["CONFIG_ESP32S3_QEMU_IMAGE=y", "CONFIG_I2C_DRIVER=y", "CONFIG_ESP32S3_UART1=y", "CONFIG_PIPES=y",
  'CONFIG_INIT_ENTRYPOINT="tracker_sim_init"', "CONFIG_FS_TMPFS=y",
  "CONFIG_RAMLOG_SYSLOG=y", "# CONFIG_RAMLOG_NONBLOCKING is not set",
  "CONFIG_SYSLOG_CHARDEV=y", 'CONFIG_SYSLOG_DEVPATH="/dev/kmsg"']
forbid-regex = "^CONFIG_(SMP|ESP32S3_UART2|SPI|INPUT|MTD|NET_BLUETOOTH|SCHED_TICKLESS|SYSLOG_(DEFAULT|CONSOLE|FILE))=y$"
