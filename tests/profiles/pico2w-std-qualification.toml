# Ordinary Rust qualification through USB NSH; no radio or sensor simulation.
board = "raspberrypi-pico-2:usbnsh"
target = "thumbv8m.main-nuttx-eabi"
crossdev = "arm-none-eabi-"
machine = "ARM"
image = "nuttx.bin"
requires-qemu = false
hal = {}

[build]
trace-only-backtrace = true
panic-immediate-abort = false
size-optimized = true

[kconfig]
enable = [
  "BOARDCTL_USBDEVCTRL", "RAW_BINARY", "BOOT_RUNFROMFLASH", "PTHREAD_MUTEX_TYPES",
  "DEBUG_FEATURES", "DEBUG_ASSERTIONS", "STACK_COLORATION", "SYSTEM_NSH",
  "NSH_LIBRARY", "CDCACM_1200BPS_BOOTLOADER", "RP23XX_USB_BOOTSEL_DISABLE_MSD",
]
disable = [
  "ARCH_FPU", "SMP", "NET", "DISABLE_PTHREAD", "PRIORITY_INHERITANCE",
  "BOOT_COPYTORAM", "RP23XX_UF2_BINARY", "ARCH_LEDS", "USERLED",
  "SCHED_CRITMONITOR", "SCHED_INSTRUMENTATION", "EXAMPLES_HELLO",
  "TESTING_GETPRIME", "TESTING_OSTEST",
]
set = ["USEC_PER_TICK=10000", "PTHREAD_STACK_DEFAULT=4096", "INIT_STACKSIZE=8192"]
require = [
  "CONFIG_ARCH_ARM=y", "CONFIG_ARCH_CHIP_RP23XX=y", "CONFIG_RAM_SIZE=532480",
  "CONFIG_BOOT_RUNFROMFLASH=y", "CONFIG_SYSTEM_NSH=y", "CONFIG_NSH_LIBRARY=y",
  "CONFIG_USEC_PER_TICK=10000", "CONFIG_PTHREAD_STACK_DEFAULT=4096",
  "CONFIG_STACK_COLORATION=y", "CONFIG_CDCACM_1200BPS_BOOTLOADER=y",
  "CONFIG_BOARD_USBDEV_BOOTLOADER=y",
]
forbid-regex = "^CONFIG_(SMP|ARCH_FPU|NET|DISABLE_PTHREAD|PRIORITY_INHERITANCE|BOOT_COPYTORAM)=y$"
