# Same CPU, preemption policy and workload resource reservations as NuttX.
CONFIG_SMP=n
CONFIG_SYS_CLOCK_TICKS_PER_SEC=100
CONFIG_TIMESLICING=y
CONFIG_TIMESLICE_SIZE=10
CONFIG_TIMESLICE_PRIORITY=0
CONFIG_MAIN_THREAD_PRIORITY=5
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_ISR_STACK_SIZE=4096
CONFIG_POLL=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_INIT_STACKS=y
CONFIG_THREAD_MONITOR=y
CONFIG_ASSERT=y
CONFIG_STACK_SENTINEL=y

# Native kernel APIs only. No networking, radio, POSIX emulation or shell.
CONFIG_NETWORKING=n
CONFIG_WIFI=n
CONFIG_BT=n
CONFIG_SHELL=n
CONFIG_LOG=n
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_MINIMAL_LIBC=y
CONFIG_HEAP_MEM_POOL_SIZE=0
CONFIG_SYS_HEAP_RUNTIME_STATS=y
CONFIG_SIZE_OPTIMIZATIONS=y
CONFIG_BUILD_OUTPUT_BIN=y
CONFIG_ESP_SIMPLE_BOOT=y
CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y
CONFIG_ESPTOOLPY_FLASHMODE_DIO=y
CONFIG_ESPTOOLPY_FLASHFREQ_40M=y

# Do not place application resources in external RAM or depend on PSRAM.
# NuttX's historical profile initialized PSRAM, but its app allocations were
# in internal SRAM. This lean native comparison does not require PSRAM.
CONFIG_ESP_SPIRAM=n
