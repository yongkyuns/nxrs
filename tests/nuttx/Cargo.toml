[package]
name = "nxrs-nuttx-app"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["staticlib"]
test = false
doctest = false

[[bin]]
name = "nxrs-nuttx-std-app"
path = "src/main.rs"
required-features = ["std-integration"]

[features]
std-integration = []

[dependencies]
nxrs-camera = { path = "../../hal/camera" }
nxrs-storage = { path = "../../hal/storage" }
nxrs-transport = { path = "../../hal/transport" }
nxrs-camera-service = { path = "../../service/camera" }
nxrs-recording-service = { path = "../../service/recording" }
nxrs-applications = { path = "../../app/nxrs" }
nxrs-nuttx-support = { path = "../../hal/support/nuttx" }
