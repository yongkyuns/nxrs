[package]
name = "nxrs-nuttx-app"
version.workspace = true
edition.workspace = true

[features]
# Only the ordinary-std executable selects sockets; ARCH_SIM keeps its local
# core-only compatibility output and compiles the HAL contracts alone.
udp = ["nxrs-transport/udp"]

[lib]
crate-type = ["staticlib"]
test = false
doctest = false

[[bin]]
name = "nxrs-nuttx-std-app"
path = "src/main.rs"
required-features = ["udp"]

[dependencies]
nxrs-camera = { path = "../../hal/camera" }
nxrs-storage = { path = "../../hal/storage" }
nxrs-transport = { path = "../../hal/transport" }
nxrs-camera-service = { path = "../../service/camera" }
nxrs-recording-service = { path = "../../service/recording" }
nxrs-camera-test-support = { path = "../camera-support" }
nxrs-nuttx-support = { path = "support" }
