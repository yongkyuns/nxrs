[package]
name = "nxrs-event-services-comparison"
version = "0.1.0"
edition = "2024"
publish = false
[workspace]
[features]
default = []
lean = []
mailbox = []
timer-1ms = []
scheduling-natural = []
scheduling-budget = []
work-chunked = ["scheduling-budget"]
[[bin]]
name = "embassy-services"
path = "embassy.rs"
test = false
bench = false
[target.'cfg(target_os = "none")'.dependencies]
embassy-sync = "=0.7.2"
embassy-executor = { version = "=0.10.0", features = ["executor-thread"] }
critical-section = "=1.2.0"
esp-hal = { version = "=1.0.0", features = ["esp32s3", "unstable"] }
esp-bootloader-esp-idf = { version = "=0.2.0", features = ["esp32s3"] }
static_cell = "=2.1.1"
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
debug = 1
overflow-checks = false
debug-assertions = false
[profile.release.package.nxrs-event-services-comparison]
opt-level = 2
