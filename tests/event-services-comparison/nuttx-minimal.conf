# Benchmark-only: native POSIX APIs, LED and serial command transport remain.
# Kernel/libc are size-built like Zephyr; application handlers remain -O2.
CONFIG_DEBUG_FULLOPT=n
CONFIG_DEBUG_CUSTOMOPT=y
CONFIG_DEBUG_OPTLEVEL="-Os"
CONFIG_DEBUG_INFO=n
CONFIG_DEBUG_WARN=n
CONFIG_LIBC_FLOATINGPOINT=n
CONFIG_NSH_LIBRARY=n
CONFIG_SYSTEM_NSH=n
CONFIG_SYSTEM_DD=n
CONFIG_SYSTEM_READLINE=n
CONFIG_BUILTIN=n
CONFIG_BINFMT_DISABLE=y
CONFIG_FS_PROCFS=n
CONFIG_FS_ANONMAP=n
CONFIG_DISABLE_MOUNTPOINT=y
CONFIG_DRVR_MKRD=n
CONFIG_BOARDCTL_MKRD=n
CONFIG_BOARDCTL=n
CONFIG_BOARD_LATE_INITIALIZE=y
CONFIG_DEV_ZERO=n
CONFIG_DEV_URANDOM=n
CONFIG_HAVE_CXX=n
CONFIG_ESP32S3_SPIRAM=n
CONFIG_ESP32S3_UART0=n
# The bounded console does not spawn/reap child tasks or use environment APIs.
# POSIX worker creation and pthread_join remain enabled.
CONFIG_DISABLE_ENVIRON=y
CONFIG_SCHED_HAVE_PARENT=n
CONFIG_SCHED_CHILD_STATUS=n
CONFIG_SCHED_WAITPID=n
CONFIG_INIT_ENTRYPOINT="es_console_main"
CONFIG_INIT_ENTRYNAME="es_console_main"
CONFIG_INIT_STACKSIZE=8192
