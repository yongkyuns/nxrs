[package]
name = "nxrs-camera-ingest"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
probe = []

[dependencies]
nxrs-enrollment = { path = "../../service/enrollment" }
rcgen = { version = "=0.14.10", default-features = false, features = ["ring", "pem", "x509-parser"] }
time = "=0.3.55"
subtle = "=2.6.1"
# Reuse the gateway's exact versions; no camera HAL or MCU dependency.
tokio = { version = "=1.51.6", features = ["macros", "rt", "net", "io-util", "process", "signal", "sync", "time"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
libc = "=0.2.191"
nxrs-detection-wire = { path = "../../service/detection-wire" }
nxrs-firmware-update = { path = "../../service/firmware-update" }
getrandom = "=0.3.4"

sha2 = "=0.10.9"
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
x509-parser = { version = "=0.18.1", default-features = false }
zeroize = "=1.9.1"
