[package]
name = "nxrs-camera-ingest"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
nxrs-gateway-private-file = { path = "../private-file" }
# Reuse the gateway's exact versions; no camera HAL or MCU dependency.
tokio = { version = "=1.51.6", features = ["macros", "rt", "net", "io-util", "process", "signal", "sync", "time"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
x509-parser = { version = "=0.18.1", default-features = false }
zeroize = "=1.9.1"

# Only the separate publisher executable links the installed host FFmpeg SDK.
# Ordinary ingest/controller builds retain no native multimedia dependency.
[features]
publisher-sdk = ["dep:ffmpeg-sys-next"]

[dependencies.ffmpeg-sys-next]
version = "=9.0.1"
default-features = false
features = ["avformat", "avcodec"]
optional = true

[[bin]]
name = "nxrs-rtsp-publisher"
path = "src/bin/publisher/main.rs"
required-features = ["publisher-sdk"]
