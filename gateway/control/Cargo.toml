[package]
name = "nxrs-gateway-control"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
nxrs-camera-activity = { path = "../activity" }
axum = { version = "=0.8.6", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "=1.48.0", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
getrandom = "=0.3.4"
sha2 = "=0.10.9"
subtle = "=2.6.1"
# These already-pinned transport crates are reused; no general-purpose URL/redirect client.
bytes = "=1.12.1"
http-body-util = "=0.1.5"
hyper = { version = "=1.12.0", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["tokio"] }
