[package]
name = "nxrs-camera-activity"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
getrandom = "=0.3.4"
libc = "=0.2.191"
tokio = { version = "=1.48.0", features = ["macros", "rt", "process", "io-util", "sync", "signal", "time"] }
zeroize = "=1.9.1"
sha2 = "=0.10.9"
rustix = { version = "=1.1.4", features = ["fs"] }
