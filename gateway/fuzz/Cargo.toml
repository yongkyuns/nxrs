[package]
name = "nxrs-parser-fuzz"
version = "0.0.0"
edition.workspace = true
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
nxrs-camera-ingest = { path = "../ingest" }
nxrs-stream-service = { path = "../../service/stream" }
tokio = { version = "=1.51.6", features = ["rt", "io-util"] }

[[bin]]
name = "mjpeg"
path = "fuzz_targets/mjpeg.rs"
test = false
doc = false
bench = false

[[bin]]
name = "http_request"
path = "fuzz_targets/http_request.rs"
test = false
doc = false
bench = false

[[bin]]
name = "asan_probe"
path = "fuzz_targets/asan_probe.rs"
test = false
doc = false
bench = false
