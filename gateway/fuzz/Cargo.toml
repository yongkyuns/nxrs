[package]
name = "nxrs-gateway-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[workspace]
members = ["."]

[dependencies]
libfuzzer-sys = "=0.4.13"
nxrs-camera-ingest = { path = "../ingest" }
nxrs-gateway-control = { path = "../control" }
serde_json = "=1.0.145"
tokio = { version = "=1.48.0", features = ["rt", "io-util"] }

[[bin]]
name = "mjpeg"
path = "fuzz_targets/mjpeg.rs"
test = false
doc = false
bench = false

[[bin]]
name = "enrollment"
path = "fuzz_targets/enrollment.rs"
test = false
doc = false
bench = false
