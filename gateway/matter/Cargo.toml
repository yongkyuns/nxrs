[package]
name = "nxrs-gateway-matter"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
base64 = "=0.22.1"
serde = { version = "=1.0.228", features = ["derive"] }
retina = { version = "=0.4.21", default-features = false }
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
url = "=2.5.8"
sha2 = "=0.10.9"
cfg-if = "=1.0.5"
nxrs-detection-wire = { path = "../../service/detection-wire" }
serde_json = "=1.0.145"
bytes = "=1.12.1"
http-body-util = "=0.1.5"
hyper = { version = "=1.12.0", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["tokio"] }
tokio = { version = "=1.51.6", features = ["io-util", "macros", "net", "process", "sync", "time"] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc = "=0.2.191"

[dev-dependencies]
tokio = { version = "=1.51.6", features = ["rt", "io-util", "test-util"] }
