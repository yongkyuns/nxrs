[package]
name = "nxrs-gateway-matter"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
base64 = "=0.22.1"
serde = { version = "=1.0.228", features = ["derive"] }
retina = { version = "=0.4.21", default-features = false }
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
url = "=2.5.9"
sha2 = "=0.10.9"
zeroize = { version = "1.9.1", default-features = false, features = ["alloc"] }
cfg-if = "=1.0.5"
domain = { version = "=0.12.3", default-features = false, features = ["std"] }
nxrs-detection-wire = { path = "../../service/detection-wire" }
serde_json = "=1.0.145"
bytes = "=1.12.1"
http-body-util = "=0.1.5"
hyper = { version = "=1.12.0", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["tokio"] }
tokio = { version = "=1.51.6", features = ["io-util", "macros", "net", "process", "sync", "time"] }
x509-parser = { version = "=0.18.1", default-features = false, features = ["verify"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["ring", "zeroize"] }
ring = "=0.17.14"
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std"] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc = "=0.2.191"
if-addrs = { version = "=0.15.0", features = ["link-local"] }
socket2 = { version = "=0.6.5", features = ["all"] }

[target.'cfg(target_os = "macos")'.dependencies]
nix = { version = "=0.31.4", default-features = false, features = ["net", "uio"] }

[dev-dependencies]
rcgen = { version = "=0.14.10", default-features = false, features = ["x509-parser"] }
tokio = { version = "=1.51.6", features = ["rt", "io-util", "test-util"] }
