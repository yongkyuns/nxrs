		.d2-896741385 .stroke-B2{stroke:#0D32B2;}.appendix text.text{fill:#0A0F25}.md{--color-fg-default:#0A0F25;--color-fg-muted:#676C7E;--color-fg-subtle:#9499AB;--color-canvas-default:#FFFFFF;--color-canvas-subtle:#EEF1F8;--color-border-default:#0D32B2;--color-border-muted:#0D32B2;--color-neutral-muted:#EEF1F8;--color-accent-fg:#0D32B2;--color-accent-emphasis:#0D32B2;--color-attention-subtle:#676C7E;--color-danger-fg:red;}.light-code{display: block}.dark-code{display: none}</style><g class="dGl0bGU="><g class="shape" /><text x="244" y="25" fill="#102D47" class="text-bold" style="text-anchor:middle;font-size:25px">Borrow explicit contracts, not another RTOS</text></g><g class="YTA= os"><g class="shape"><rect x="0" y="80" width="330" height="86" rx="8" stroke="#607D8B" fill="#ECEFF1" style="stroke-width:2;" /></g><text x="165" y="120" fill="#263238" class="text" style="text-anchor:middle;font-size:20px"><tspan x="165" dy="0">Device description</tspan><tspan x="165" dy="23">is not ownership</tspan></text></g><g class="YjA= code"><g class="shape"><rect x="490" y="80" width="370" height="86" rx="8" stroke="#527EA8" fill="#EDF4FC" style="stroke-width:2;" /></g><text x="675" y="120" fill="#17324D" class="text" style="text-anchor:middle;font-size:20px"><tspan x="675" dy="0">Validate bindings</tspan><tspan x="675" dy="23">and session readiness</tspan></text></g><g class="YTE= os"><g class="shape"><rect x="0" y="215" width="330" height="86" rx="8" stroke="#607D8B" fill="#ECEFF1" style="stroke-width:2;" /></g><text x="165" y="255" fill="#263238" class="text" style="text-anchor:middle;font-size:20px"><tspan x="165" dy="0">Queue / work APIs</tspan><tspan x="165" dy="23">have different lifetimes</tspan></text></g><g class="YjE= code"><g class="shape"><rect x="490" y="215" width="370" height="86" rx="8" stroke="#527EA8" fill="#EDF4FC" style="stroke-width:2;" /></g><text x="675" y="255" fill="#17324D" class="text" style="text-anchor:middle;font-size:20px"><tspan x="675" dy="0">Specify loss, transfer</tspan><tspan x="675" dy="23">and stop behavior</tspan></text></g><g class="YTI= os"><g class="shape"><rect x="0" y="350" width="330" height="86" rx="8" stroke="#607D8B" fill="#ECEFF1" style="stroke-width:2;" /></g><text x="165" y="390" fill="#263238" class="text" style="text-anchor:middle;font-size:20px"><tspan x="165" dy="0">Driver emulation</tspan><tspan x="165" dy="23">plus kernel tracing</tspan></text></g><g class="YjI= code"><g class="shape"><rect x="490" y="350" width="370" height="86" rx="8" stroke="#527EA8" fill="#EDF4FC" style="stroke-width:2;" /></g><text x="675" y="390" fill="#17324D" class="text" style="text-anchor:middle;font-size:20px"><tspan x="675" dy="0">Test providers and</tspan><tspan x="675" dy="23">measure the complete path</tspan></text></g><g class="Y2FwdGlvbg=="><g class="shape" /><text x="296.5" y="489" fill="#445E74" class="text" style="text-anchor:middle;font-size:19px">Dotted arrows mean design influence—not calls, data flow or a Zephyr port.</text></g><g class="KGEwIC0mZ3Q7IGIwKVswXQ== config"><marker id="mk-d2-896741385-2059231022" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#65758A" class="connection" stroke-width="2" /> </marker><path d="M 330,123 L 490,123" stroke="#65758A" fill="none" class="connection" style="stroke-width:2;stroke-dasharray:6.000000,5.919384;" marker-end="url(#mk-d2-896741385-2059231022)" stroke-linejoin="round" stroke-linecap="round" /><text x="410.0" y="111.0" fill="#465367" class="text" style="text-anchor:middle;font-size:18px">apply</text></g><g class="KGExIC0mZ3Q7IGIxKVswXQ== config"><path d="M 330,258 L 490,258" stroke="#65758A" fill="none" class="connection" style="stroke-width:2;stroke-dasharray:6.000000,5.919384;" marker-end="url(#mk-d2-896741385-2059231022)" stroke-linejoin="round" stroke-linecap="round" /><text x="410.0" y="246.0" fill="#465367" class="text" style="text-anchor:m