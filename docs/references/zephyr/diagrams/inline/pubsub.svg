		.d2-1173264606 .stroke-B2{stroke:#0D32B2;}.appendix text.text{fill:#0A0F25}.md{--color-fg-default:#0A0F25;--color-fg-muted:#676C7E;--color-fg-subtle:#9499AB;--color-canvas-default:#FFFFFF;--color-canvas-subtle:#EEF1F8;--color-border-default:#0D32B2;--color-border-muted:#0D32B2;--color-neutral-muted:#EEF1F8;--color-accent-fg:#0D32B2;--color-accent-emphasis:#0D32B2;--color-attention-subtle:#676C7E;--color-danger-fg:red;}.light-code{display: block}.dark-code{display: none}</style><g class="dGl0bGU="><g class="shape" /><text x="284.5" y="25" fill="#17324D" class="text" style="text-anchor:middle;font-size:25px">zbus: what does the observer keep, and who executes?</text></g><g class="cHVibGlzaA== os"><g class="shape"><rect x="0" y="72" width="860" height="86" rx="8" stroke="#607D8B" fill="#ECEFF1" style="stroke-width:2;" /></g><text x="430" y="112" fill="#263238" class="text" style="text-anchor:middle;font-size:20px"><tspan x="430" dy="0">Publisher updates the channel and dispatches observers</tspan><tspan x="430" dy="23">Example: publish A, then B before a queued subscriber runs</tspan></text></g><g class="bGlzdGVuZXI= code"><g class="shape"><rect x="0" y="241" width="240" height="110" rx="8" stroke="#527EA8" fill="#EDF4FC" style="stroke-width:2;" /></g><text x="120" y="283" fill="#17324D" class="text" style="text-anchor:middle;font-size:20px"><tspan x="120" dy="0">Listener</tspan><tspan x="120" dy="22">Callback runs inline</tspan><tspan x="120" dy="22">Publisher pays its cost</tspan></text></g><g class="cmVmZXJlbmNl note"><g class="shape"><rect x="310" y="241" width="240" height="110" rx="8" stroke="#BA8A35" fill="#FFF6E4" style="stroke-width:2;" /></g><text x="430" y="283" fill="#614715" class="text" style="text-anchor:middle;font-size:20px"><tspan x="430" dy="0">Subscriber</tspan><tspan x="430" dy="22">Queue holds channel refs</tspan><tspan x="430" dy="22">Reads current value later</tspan></text></g><g class="Y29weQ== data"><g class="shape"><rect x="620" y="241" width="240" height="110" rx="8" stroke="#00897B" fill="#E7F4EF" style="stroke-width:2;" /></g><text x="740" y="283" fill="#004D40" class="text" style="text-anchor:middle;font-size:20px"><tspan x="740" dy="0">Message subscriber</tspan><tspan x="740" dy="22">Queue retains copies</tspan><tspan x="740" dy="22">Uses finite buffer storage</tspan></text></g><g class="bF9yZXN1bHQ= code"><g class="shape"><rect x="0" y="442" width="240" height="76" rx="8" stroke="#527EA8" fill="#EDF4FC" style="stroke-width:2;" /></g><text x="120" y="477" fill="#17324D" class="text" style="text-anchor:middle;font-size:20px"><tspan x="120" dy="0">Inline observation</tspan><tspan x="120" dy="23">A, then B</tspan></text></g><g class="cl9yZXN1bHQ= note"><g class="shape"><rect x="310" y="442" width="240" height="76" rx="8" stroke="#BA8A35" fill="#FFF6E4" style="stroke-width:2;" /></g><text x="430" y="477" fill="#614715" class="text" style="text-anchor:middle;font-size:20px"><tspan x="430" dy="0">Possible delayed reads</tspan><tspan x="430" dy="23">B, then B</tspan></text></g><g class="Y19yZXN1bHQ= data"><g class="shape"><rect x="620" y="442" width="240" height="76" rx="8" stroke="#00897B" fill="#E7F4EF" style="stroke-width:2;" /></g><text x="740" y="477" fill="#004D40" class="text" style="text-anchor:middle;font-size:20px"><tspan x="740" dy="0">Retained records</tspan><tspan x="740" dy="23">A, then B if admitted</tspan></text></g><g class="Y2FwdGlvbg=="><g class="shape" /><text x="292" y="554" fill="#17324D" class="text" style="text-anchor:middle;font-size:19px"><tspan x="292" dy="0">Observer modes are choices, not stages. Check publication/queue results.</tspan><tspan x="292" dy="21.5">Optional async listeners defer a copy to a workqueue; see the text.</tspan></text></g><g class="KHB1Ymxpc2ggLSZndDsgbGlzdGVuZXIpWzBd call"><marker id="mk-d2-1173264606-3790674192" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#1565C0" class="connection" stroke-width="2" /> </marker><path d="M 120,158 L 120,241" stroke="#1565C0" fill="none" class="connection" style="stroke-width:2;" marker-end="url(#mk-d2-1173264606-3790674192)" stroke-linejoin="round" stroke-linecap="round" /><text x="108.0" y="206.5" fill="#104F90" class="text" style="text-anchor:end;font-size:18px">call</text></g><g class="KHB1Ymxpc2ggLSZndDsgcmVmZXJlbmNlKVswXQ== wake"><marker id="mk-d2-1173264606-2797090140" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#CB6900" class="connection" stroke-width="2" /> </marker><path d="M 430,158 L 430,241" stroke="#CB6900" fill="none" class="connection" style="stroke-width:2;stroke-dasharray:12.000000,11.838767;" marker-end="url(#mk-d2-1173264606-2797090140)" stroke-linejoin="round" stroke-linecap="round" /><text x="418.0" y="206.5" fill="#9A4C00" class="text" style="text-anchor:end;font-size:18px">notify</text></g><g class="KHB1Ymxpc2ggLSZndDsgY29weSlbMF0= payload"><marker id="mk-d2-1173264606-3673120826" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#00897B" class="connection" stroke-width="2" /> </marker><path d="M 740,158 L 740,241" stroke="#00897B" fill="none" class="connection" style="stroke-width:2;" marker-end="url(#mk-d2-1173264606-3673120826)" stroke-linejoin="round" stroke-linecap="round" /><text x="728.0" y="206.5" fill="#00695C" class="text" style="text-anchor:end;font-size:18px">copy</text></g><g class="KGxpc3RlbmVyIC0mZ3Q7IGxfcmVzdWx0KVswXQ== call"><path d="M 120,351 L 120,442" stroke="#1565C0" fill="none" class="connection" style="stroke-width:2;" marker-end="url(#mk-d2-1173264606-3790674192)" stroke-linejoin="round" stroke-linecap="round" /></g><g class="KHJlZmVyZW5jZSAtJmd0OyByX3Jlc3VsdClbMF0= wake"><path d="M 430,351 L 430,442" stroke="#CB6900" fill="none" class="connection" style="stroke-width:2;stroke-dasharray:12.000000,11.838767;" marker-end="url(#mk-d2-1173264606-2797090140)" stroke-linejoin="round" stroke-linecap="round" /></g><g class="KGNvcHkgLSZndDsgY19yZXN1bHQpWzBd payload"><path d="M 740,351 L 740,442" stroke="#00897B" fill="none" class="connection" style="stroke-width:2;" marker-end="url(#mk-d2-1173264606-3673120826)" stroke-linejoin="round" stroke-linecap="round" /></g><mask id="d2-1173264606" maskUnits="userSpaceOnUse" x="-25" y="-25" width="910" height="635">
