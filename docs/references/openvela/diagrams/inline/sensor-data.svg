		.d2-2124373753 .stroke-B2{stroke:#0D32B2;}.appendix text.text{fill:#0A0F25}.md{--color-fg-default:#0A0F25;--color-fg-muted:#676C7E;--color-fg-subtle:#9499AB;--color-canvas-default:#FFFFFF;--color-canvas-subtle:#EEF1F8;--color-border-default:#0D32B2;--color-border-muted:#0D32B2;--color-neutral-muted:#EEF1F8;--color-accent-fg:#0D32B2;--color-accent-emphasis:#0D32B2;--color-attention-subtle:#676C7E;--color-danger-fg:red;}.light-code{display: block}.dark-code{display: none}</style><g class="dGl0bGU="><g class="shape" /><text x="275.5" y="25" fill="#102D47" class="text-bold" style="text-anchor:middle;font-size:25px">Sample time, read-out time and arrival time differ</text></g><g class="bjA= os"><g class="shape"><rect x="0" y="84" width="240" height="88" rx="8" stroke="#607D8B" fill="#ECEFF1" style="stroke-width:2;" /></g><text x="120" y="125" fill="#263238" class="text" style="text-anchor:middle;font-size:20px"><tspan x="120" dy="0">Hardware samples</tspan><tspan x="120" dy="23">measurement time</tspan></text></g><g class="bjE= data"><g class="shape"><rect x="310" y="84" width="240" height="88" rx="8" stroke="#00897B" fill="#E7F4EF" style="stroke-width:2;" /></g><text x="430" y="125" fill="#004D40" class="text" style="text-anchor:middle;font-size:20px"><tspan x="430" dy="0">FIFO / bus read</tspan><tspan x="430" dy="23">read-out time</tspan></text></g><g class="bjI= code"><g class="shape"><rect x="620" y="84" width="240" height="88" rx="8" stroke="#527EA8" fill="#EDF4FC" style="stroke-width:2;" /></g><text x="740" y="125" fill="#17324D" class="text" style="text-anchor:middle;font-size:20px"><tspan x="740" dy="0">Application receives</tspan><tspan x="740" dy="23">arrival time</tspan></text></g><g class="c2FtcGxlcw== data"><g class="shape"><rect x="0" y="233" width="330" height="84" rx="8" stroke="#00897B" fill="#E7F4EF" style="stroke-width:2;" /></g><text x="165" y="272" fill="#004D40" class="text" style="text-anchor:middle;font-size:20px"><tspan x="165" dy="0">s1   s2  