ble worker: a shared HPWORK callback must not block arbitrarily.</tspan><tspan x="430" dy="23">Task groups describe shared resources; they are not memory-protection regions.</tspan></text></g><g class="Y2FwdGlvbg=="><g class="shape" /><text x="275" y="381" fill="#445E74" class="text" style="text-anchor:middle;font-size:19px">This is a buffered sensor example—not one required thread per driver.</text></g><g class="KG4wIC0mZ3Q7IG4xKVswXQ== wake"><marker id="mk-d2-2872251450-2797090140" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#CB6900" class="connection" stroke-width="2" /> </marker><path d="M 240,124 L 310,124" stroke="#CB6900" fill="none" class="connection" style="stroke-width:2;stroke-dasharray:12.000000,11.838767;" marker-end="url(#mk-d2-2872251450-2797090140)" stroke-linejoin="round" stroke-linecap="round" /><text x="275.0" y="112.0" fill="#9A4C00" class="text" style="text-anchor:middle;font-size:18px">defer</text></g><g class="KG4xIC0mZ3Q7IG4yKVswXQ== wake"><path d="M 550,124 L 620,124" stroke="#CB6900" fill="none" class="connection" style="stroke-width:2;stroke-dasharray:12.000000,11.838767;" marker-end="url(#mk-d2-2872251450-2797090140)" stroke-linejoin="round" stroke-linecap="round" /><text x="585.0" y="112.0" fill="#9A4C00" class="text" style="text-anchor:middle;font-size:18px">ready</text></g><mask id="d2-2872251450" maskUnits="userSpaceOnUse" x="-25" y="-25" width="910" height="470">
