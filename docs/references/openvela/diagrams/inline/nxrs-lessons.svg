		.d2-364156484 .stroke-B2{stroke:#0D32B2;}.appendix text.text{fill:#0A0F25}.md{--color-fg-default:#0A0F25;--color-fg-muted:#676C7E;--color-fg-subtle:#9499AB;--color-canvas-default:#FFFFFF;--color-canvas-subtle:#EEF1F8;--color-border-default:#0D32B2;--color-border-muted:#0D32B2;--color-neutral-muted:#EEF1F8;--color-accent-fg:#0D32B2;--color-accent-emphasis:#0D32B2;--color-attention-subtle:#676C7E;--color-danger-fg:red;}.light-code{display: block}.dark-code{display: none}</style><g class="dGl0bGU="><g class="shape" /><text x="279" y="25" fill="#102D47" class="text-bold" style="text-anchor:middle;font-size:25px">Reuse drivers; make the product boundary explicit</text></g><g class="bjA= os"><g class="shape"><rect x="0" y="82" width="240" height="88" rx="8" stroke="#607D8B" fill="#ECEFF1" style="stroke-width:2;" /></g><text x="120" y="123" fill="#263238" class="text" style="text-anchor:middle;font-size:20px"><tspan x="120" dy="0">NuttX driver</tspan><tspan x="120" dy="23">existing device access</tspan></text></g><g class="bjE= code"><g class="shape"><rect x="310" y="82" width="240" height="88" rx="8" stroke="#527EA8" fill="#EDF4FC" style="stroke-width:2;" /></g><text x="430" y="123" fill="#17324D" class="text" style="text-anchor:middle;font-size:20px"><tspan x="430" dy="0">nxrs provider</tspan><tspan x="430" dy="23">I/O + normalization</tspan></text></g><g class="bjI= code"><g class="shape"><rect x="620" y="82" width="240" height="88" rx="8" stroke="#527EA8" fill="#EDF4FC" style="stroke-width:2;" /></g><text x="740" y="123" fill="#17324D" class="text" style="text-anchor:middle;font-size:20px"><tspan x="740" dy="0">nxrs service</tspan><tspan x="740" dy="23">calibration + fusion</tspan></text></g><g class="cnVsZQ== note"><g class="shape"><rect x="0" y="225" width="860" height="102" rx="8" stroke="#BA8A35" fill="#FFF6E4" style="stroke-width:2;" /></g><text x="430" y="273" fill="#614715" class="text" style="text-anchor:middle;font-size:20px"><tspan x="430" dy="0">Specify un