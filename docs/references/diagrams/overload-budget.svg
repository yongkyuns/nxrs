		.d2-262719278 .stroke-B2{stroke:#0D32B2;}.appendix text.text{fill:#0A0F25}.md{--color-fg-default:#0A0F25;--color-fg-muted:#676C7E;--color-fg-subtle:#9499AB;--color-canvas-default:#FFFFFF;--color-canvas-subtle:#EEF1F8;--color-border-default:#0D32B2;--color-border-muted:#0D32B2;--color-neutral-muted:#EEF1F8;--color-accent-fg:#0D32B2;--color-accent-emphasis:#0D32B2;--color-attention-subtle:#676C7E;--color-danger-fg:red;}.light-code{display: block}.dark-code{display: none}</style><g class="dGl0bGU="><g class="shape" /><text x="246" y="25" fill="#17324D" class="text" style="text-anchor:middle;font-size:25px">Enough storage does not mean a timely answer</text></g><g class="aW5wdXQ= os"><g class="shape"><rect x="0" y="70" width="860" height="82" rx="8" stroke="#607D8B" fill="#ECEFF1" style="stroke-width:2;" /></g><text x="430" y="108" fill="#263238" class="text" style="text-anchor:middle;font-size:20px"><tspan x="430" dy="0">Example: 100 records/s + 4-record burst</tspan><tspan x="430" dy="23">Consumer cannot drain for 50 ms; queue initially empty</tspan></text></g><g class="c3RvcmFnZQ== data"><g class="shape"><rect x="0" y="230" width="390" height="116" rx="8" stroke="#00897B" fill="#E7F4EF" style="stroke-width:2;" /></g><text x="195" y="275" fill="#004D40" class="text" style="text-anchor:middle;font-size:20px"><tspan x="195" dy="0">Retention requirement</tspan><tspan x="195" dy="22">4 + ceil(100 × 0.050) = 9 slots</tspan><tspan x="195" dy="22">64 bytes/record → 576 payload bytes</tspan></text></g><g class="ZGVhZGxpbmU= gate"><g class="shape"><rect x="470" y="230" width="390" height="116" rx="8" stroke="#AD3049" fill="#FFF0F2" style="stroke-width:2;" /></g><text x="665" y="275" fill="#7E2034" class="text" style="text-anchor:middle;font-size:20px"><tspan x="665" dy="0">Response-time requirement</tspan><tspan x="665" dy="22">20 ms deadline &lt; 50 ms blackout</tspan><tspan x="665" dy="22">Already late, before processing</tspan></text></g><g class="Y2FwdGlvbg=="><g class="shape" /><text x="314.5" y="418" fill="#17324D" class="text" style="text-anchor:middle;font-size:19px"><tspan x="314.5" dy="0">Nine slots cover this blackout only. Metadata, in-flight data and stacks add cost.</tspan><tspan x="314.5" dy="21.5">Fix the stall to meet the deadline; enlarging the queue cannot remove it.</tspan></text></g><g class="KGlucHV0IC0mZ3Q7IHN0b3JhZ2UpWzBd config"><marker id="mk-d2-262719278-2059231022" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#65758A" class="connection" stroke-width="2" /> </marker><path d="M 195,152 L 195,230" stroke="#65758A" fill="none" class="connection" style="stroke-width:2;stroke-dasharray:6.000000,5.919384;" marker-end="url(#mk-d2-262719278-2059231022)" stroke-linejoin="round" stroke-linecap="round" /><text x="183.0" y="198.0" fill="#465367" class="text" style="text-anchor:end;font-size:18px">bound arrivals</text></g><g class="KGlucHV0IC0mZ3Q7IGRlYWRsaW5lKVswXQ== config"><path d="M 665,152 L 665,230" stroke="#65758A" fill="none" class="connection" style="stroke-width:2;stroke-dasharray:6.000000,5.919384;" marker-end="url(#mk-d2-262719278-2059231022)" stroke-linejoin="round" stroke-linecap="round" /><text x="653.0" y="198.0" fill="#465367" class="text" style="text-anchor:end;font-size:18px">check age</text></g><mask id="d2-262719278" maskUnits="userSpaceOnUse" x="-25" y="-25" width="910" height="527">
