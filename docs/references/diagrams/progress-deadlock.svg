		.d2-1205410585 .stroke-B2{stroke:#0D32B2;}.appendix text.text{fill:#0A0F25}.md{--color-fg-default:#0A0F25;--color-fg-muted:#676C7E;--color-fg-subtle:#9499AB;--color-canvas-default:#FFFFFF;--color-canvas-subtle:#EEF1F8;--color-border-default:#0D32B2;--color-border-muted:#0D32B2;--color-neutral-muted:#EEF1F8;--color-accent-fg:#0D32B2;--color-accent-emphasis:#0D32B2;--color-attention-subtle:#676C7E;--color-danger-fg:red;}.light-code{display: block}.dark-code{display: none}</style><g class="dGl0bGU="><g class="shape" /><text x="271.5" y="25" fill="#17324D" class="text" style="text-anchor:middle;font-size:25px">Why shutdown can hang with a separate stop queue</text></g><g class="am9pbg== gate"><g class="shape"><rect x="0" y="100" width="280" height="96" rx="8" stroke="#AD3049" fill="#FFF0F2" style="stroke-width:2;" /></g><text x="140" y="145" fill="#7E2034" class="text" style="text-anchor:middle;font-size:20px"><tspan x="140" dy="0">Service waits in join</tspan><tspan x="140" dy="23">No normal dispatch</tspan></text></g><g class="cHJvZHVjZXI= code"><g class="shape"><rect x="580" y="100" width="280" height="96" rx="8" stroke="#527EA8" fill="#EDF4FC" style="stroke-width:2;" /></g><text x="720" y="145" fill="#17324D" class="text" style="text-anchor:middle;font-size:20px"><tspan x="720" dy="0">Provider must exit</tspan><tspan x="720" dy="23">Its send is blocked</tspan></text></g><g class="c3BhY2U= data"><g class="shape"><rect x="580" y="350" width="280" height="96" rx="8" stroke="#00897B" fill="#E7F4EF" style="stroke-width:2;" /></g><text x="720" y="395" fill="#004D40" class="text" style="text-anchor:middle;font-size:20px"><tspan x="720" dy="0">Full queue needs space</tspan><tspan x="720" dy="23">Provider cannot finish send</tspan></text></g><g class="ZHJhaW4= gate"><g class="shape"><rect x="0" y="350" width="280" height="96" rx="8" stroke="#AD3049" fill="#FFF0F2" style="stroke-width:2;" /></g><text x="140" y="395" fill="#7E2034" class="text" style="text-anchor:middle;font-size:20px"><tspan x="140" dy="0">Service must drain</tspan><tspan x="140" dy="23">But it is waiting in join</tspan></text></g><g class="Y2FwdGlvbg=="><g class="shape" /><text x="296" y="513" fill="#17324D" class="text" style="text-anchor:middle;font-size:19px"><tspan x="296" dy="0">Arrows mean “cannot finish until”, not data flow. Break the wait cycle:</tspan><tspan x="296" dy="21.5">make delivery cancellable/nonblocking, or coordinate draining before join.</tspan></text></g><g class="KGpvaW4gLSZndDsgcHJvZHVjZXIpWzBd config"><marker id="mk-d2-1205410585-2059231022" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#65758A" class="connection" stroke-width="2" /> </marker><path d="M 280,148 L 580,148" stroke="#65758A" fill="none" class="connection" style="stroke-width:2;stroke-dasharray:6.000000,5.919384;" marker-end="url(#mk-d2-1205410585-2059231022)" stroke-linejoin="round" stroke-linecap="round" /><text x="430.0" y="136.0" fill="#465367" class="text" style="text-anchor:middle;font-size:18px">waits for exit</text></g><g class="KHByb2R1Y2VyIC0mZ3Q7IHNwYWNlKVswXQ== config"><path d="M 720,196 L 720,350" stroke="#65758A" fill="none" class="connection" style="stroke-width:2;stroke-dasharray:6.000000,5.919384;" marker-end="url(#mk-d2-1205410585-2059231022)" stroke-linejoin="round" stroke-linecap="round" /><text x="705" y="279" fill="#465367" class="text" style="text-anchor:end;font-size:18px">needs space</text></g><g class="KHNwYWNlIC0mZ3Q7IGRyYWluKVswXQ== config"><path d="M 580,398 L 280,398" stroke="#65758A" fill="none" class="connection" style="stroke-width:2;stroke-dasharray:6.000000,5.919384;" marker-end="url(#mk-d2-1205410585-2059231022)" stroke-linejoin="round" stroke-linecap="round" /><text x="430.0" y="386.0" fill="#465367" class="text" style="text-anchor:middle;font-size:18px">needs drain</text></g><g class="KGRyYWluIC0mZ3Q7IGpvaW4pWzBd config"><path d="M 140,350 L 140,196" stroke="#65758A" fill="none" class="connection" style="stroke-width:2;stroke-dasharray:6.000000,5.919384;" marker-end="url(#mk-d2-1205410585-2059231022)" stroke-linejoin="round" stroke-linecap="round" /><text x="155" y="279" fill="#465367" class="text" style="text-anchor:start;font-size:18px">join must return</text></g><mask id="d2-1205410585" maskUnits="userSpaceOnUse" x="-25" y="-25" width="910" height="620">
