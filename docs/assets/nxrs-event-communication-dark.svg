<svg xmlns="http://www.w3.org/2000/svg" width="680" height="644" viewBox="0 0 680 644" role="img" aria-labelledby="title description">
  <title id="title">Event-driven communication in the navigation demo</title>
  <desc id="description">The IMU service, GNSS service and application control send typed events to a bounded inbox with sixteen slots reserved at setup. While running, the Fusion owner blocks at one receive point, handles one event to completion with its private state, and returns to the same wait.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L6 4 L1 7" fill="none" stroke="#8199B1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="145%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset in="blur" dx="0" dy="3" result="offset-blur"/>
      <feFlood flood-color="#000000" flood-opacity="0.055" result="shadow-color"/>
      <feComposite in="shadow-color" in2="offset-blur" operator="in" result="card-shadow"/>
      <feMerge><feMergeNode in="card-shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      text { font-family: Inter, "Helvetica Neue", Arial, sans-serif; }
      .card { fill: #1A2533; stroke: #34465A; stroke-width: 1.2; }
      .label { fill: #E5EDF5; font-weight: 500; letter-spacing: -0.4px; }
      .subtitle { fill: #ACBDCE; font-size: 22px; }
      .edge { fill: none; stroke: #8199B1; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .edge-label { fill: #ACBDCE; font-size: 16px; }
    </style>
  </defs>

  <rect width="680" height="644" rx="24" fill="#10161F"/>
  <g id="node-imu">
      <rect x="24" y="28" width="192" height="86" rx="15" class="card" filter="url(#shadow)"/>

      <text x="120" y="63" text-anchor="middle" class="label" font-size="27">IMU service</text>
      <text x="120" y="93" text-anchor="middle" class="subtitle">IMU samples</text>
    </g>
  <g id="node-gnss">
      <rect x="244" y="28" width="192" height="86" rx="15" class="card" filter="url(#shadow)"/>

      <text x="340" y="63" text-anchor="middle" class="label" font-size="27">GNSS service</text>
      <text x="340" y="93" text-anchor="middle" class="subtitle">GNSS fixes</text>
    </g>
  <g id="node-control">
      <rect x="464" y="28" width="192" height="86" rx="15" class="card" filter="url(#shadow)"/>

      <text x="560" y="63" text-anchor="middle" class="label" font-size="27">App control</text>
      <text x="560" y="93" text-anchor="middle" class="subtitle">Stop request</text>
    </g>
  <path id="edge-imu-inbox" data-from="imu" data-to="inbox" d="M120 114 V140 H214 V164" class="edge"/>
  <path id="edge-gnss-inbox" data-from="gnss" data-to="inbox" d="M340 114 V164" class="edge"/>
  <path id="edge-control-inbox" data-from="control" data-to="inbox" d="M560 114 V140 H466 V164" class="edge"/>

  <g id="node-inbox">
    <rect x="96" y="166" width="488" height="124" rx="15" class="card" filter="url(#shadow)"/>
    <text x="340" y="205" text-anchor="middle" class="label" font-size="29">Bounded inbox</text>
    <rect x="110" y="221" width="25" height="23" rx="4" fill="#83C5EA" stroke="#3B5066"/>
    <rect x="139" y="221" width="25" height="23" rx="4" fill="#83C5EA" stroke="#3B5066"/>
    <rect x="168" y="221" width="25" height="23" rx="4" fill="#83C5EA" stroke="#3B5066"/>
    <rect x="197" y="221" width="25" height="23" rx="4" fill="#83C5EA" stroke="#3B5066"/>
    <rect x="226" y="221" width="25" height="23" rx="4" fill="#141E2B" stroke="#3B5066"/>
    <rect x="255" y="221" width="25" height="23" rx="4" fill="#141E2B" stroke="#3B5066"/>
    <rect x="284" y="221" width="25" height="23" rx="4" fill="#141E2B" stroke="#3B5066"/>
    <rect x="313" y="221" width="25" height="23" rx="4" fill="#141E2B" stroke="#3B5066"/>
    <rect x="342" y="221" width="25" height="23" rx="4" fill="#141E2B" stroke="#3B5066"/>
    <rect x="371" y="221" width="25" height="23" rx="4" fill="#141E2B" stroke="#3B5066"/>
    <rect x="400" y="221" width="25" height="23" rx="4" fill="#141E2B" stroke="#3B5066"/>
    <rect x="429" y="221" width="25" height="23" rx="4" fill="#141E2B" stroke="#3B5066"/>
    <rect x="458" y="221" width="25" height="23" rx="4" fill="#141E2B" stroke="#3B5066"/>
    <rect x="487" y="221" width="25" height="23" rx="4" fill="#141E2B" stroke="#3B5066"/>
    <rect x="516" y="221" width="25" height="23" rx="4" fill="#141E2B" stroke="#3B5066"/>
    <rect x="545" y="221" width="25" height="23" rx="4" fill="#141E2B" stroke="#3B5066"/>
    <text x="340" y="272" text-anchor="middle" class="subtitle">16 slots reserved at setup</text>
  </g>

  <g id="node-owner">
    <rect x="96" y="332" width="488" height="288" rx="21" fill="#141E2B" stroke="#3B5066" stroke-width="1.2"/>
    <text x="122" y="369" class="label" font-size="28">Fusion owner</text>
    <text x="558" y="369" text-anchor="end" class="subtitle">Private state</text>
    <g id="node-wait">
      <rect x="166" y="390" width="348" height="80" rx="15" class="card" filter="url(#shadow)"/>
      <rect x="186" y="414" width="4" height="32" rx="2" fill="#83C5EA"/>
      <text x="348" y="425" text-anchor="middle" class="label" font-size="28">One wait point</text>
      <text x="348" y="455" text-anchor="middle" class="subtitle">Block in recv()</text>
    </g>
    <g id="node-handle">
      <rect x="166" y="514" width="348" height="80" rx="15" class="card" filter="url(#shadow)"/>
      <rect x="186" y="538" width="4" height="32" rx="2" fill="#F2A06A"/>
      <text x="348" y="549" text-anchor="middle" class="label" font-size="28">Handle one event</text>
      <text x="348" y="579" text-anchor="middle" class="subtitle">Run to completion</text>
    </g>
    <path id="edge-wait-handle" data-from="wait" data-to="handle" d="M340 470 V512" class="edge"/>
    <path id="edge-handle-wait" data-from="handle" data-to="wait" d="M514 554 H549 Q557 554 557 546 V438 Q557 430 549 430 H516" class="edge"/>
  </g>
  <path id="edge-inbox-wait" data-from="inbox" data-to="wait" d="M340 290 V388" class="edge"/>
</svg>
