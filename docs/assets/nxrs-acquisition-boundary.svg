<svg xmlns="http://www.w3.org/2000/svg" width="800" height="654" viewBox="0 0 800 654" role="img" aria-labelledby="title description">
  <title id="title">Acquisition produces typed input for an application owner</title>
  <desc id="description">Device readiness wakes the HAL acquisition path, which waits, reads, parses and normalizes device data. Its narrow typed delivery endpoint admits data to the destination service queues. Commands and peer events enter those queues separately. One owner waits or selects and applies local processing policy. The endpoint runs in producer task context and never runs the receiving handler inline.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L6 4 L1 7" fill="none" stroke="#8A9CAF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="145%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset in="blur" dx="0" dy="3" result="offset-blur"/>
      <feFlood flood-color="#24374A" flood-opacity="0.055" result="shadow-color"/>
      <feComposite in="shadow-color" in2="offset-blur" operator="in" result="card-shadow"/>
      <feMerge><feMergeNode in="card-shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      text { font-family: Inter, "Helvetica Neue", Arial, sans-serif; }
      .card { fill: #FFFFFF; stroke: #D7E1EB; stroke-width: 1.2; }
      .label { fill: #203042; font-weight: 500; letter-spacing: -0.4px; }
      .subtitle { fill: #596B7D; font-size: 18px; }
      .edge { fill: none; stroke: #8A9CAF; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .edge-label { fill: #596B7D; font-size: 16px; }
    </style>
  </defs>
  <rect width="800" height="654" rx="24" fill="#FCFDFE"/>

  <g id="node-device" data-panel="true">
    <rect x="24" y="24" width="340" height="88" rx="15" class="card" filter="url(#shadow)"/>

    <text x="194" y="56" text-anchor="middle" class="label" font-size="22">Device readiness</text>
    <text x="194" y="83" text-anchor="middle" class="subtitle">Qualified wake / cancellation</text>
  </g>
  <g id="node-hal" data-panel="true">
    <rect x="24" y="150" width="340" height="112" rx="15" class="card" filter="url(#shadow)"/>
    <rect x="39" y="170" width="4" height="72" rx="2" fill="#73B9E2"/>
    <text x="194" y="182" text-anchor="middle" class="label" font-size="22">HAL acquisition</text>
    <text x="194" y="209" text-anchor="middle" class="subtitle">Wait · read · parse · normalize</text>
    <text x="194" y="234" text-anchor="middle" class="subtitle">Own device resources</text>
  </g>
  <path id="edge-device-hal" data-from="device" data-to="hal" d="M194 112 V148" class="edge"/>
  <g id="node-sink" data-panel="true">
    <rect x="24" y="302" width="340" height="88" rx="15" class="card" filter="url(#shadow)"/>

    <text x="194" y="334" text-anchor="middle" class="label" font-size="22">Typed delivery endpoint</text>
    <text x="194" y="361" text-anchor="middle" class="subtitle">Map and admit; never handle inline</text>
  </g>
  <path id="edge-hal-sink" data-from="hal" data-to="sink" d="M194 262 V300" class="edge"/>
  <g id="node-control" data-panel="true">
    <rect x="436" y="302" width="340" height="88" rx="15" class="card" filter="url(#shadow)"/>

    <text x="606" y="334" text-anchor="middle" class="label" font-size="22">Commands / peer events</text>
    <text x="606" y="361" text-anchor="middle" class="subtitle">Independent producers</text>
  </g>
  <g id="node-queues" data-panel="true">
    <rect x="160" y="454" width="480" height="88" rx="15" class="card" filter="url(#shadow)"/>

    <text x="400" y="486" text-anchor="middle" class="label" font-size="22">Service queues</text>
    <text x="400" y="513" text-anchor="middle" class="subtitle">Bounded admission · explicit full policy</text>
  </g>
  <path id="edge-sink-queues" data-from="sink" data-to="queues" d="M194 390 V422 H280 V452" class="edge"/>
  <path id="edge-control-queues" data-from="control" data-to="queues" d="M606 390 V422 H520 V452" class="edge"/>
  <g id="node-owner" data-panel="true">
    <rect x="160" y="578" width="480" height="52" rx="15" class="card" filter="url(#shadow)"/>
    <rect x="175" y="598" width="4" height="12" rx="2" fill="#F08A4B"/>
    <text x="400" y="611" text-anchor="middle" class="label" font-size="22">One wait / selection · local processing</text>

  </g>
  <path id="edge-queues-owner" data-from="queues" data-to="owner" d="M400 542 V576" class="edge"/>

</svg>
