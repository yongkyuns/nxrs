<svg xmlns="http://www.w3.org/2000/svg" width="800" height="514" viewBox="0 0 800 514" role="img" aria-labelledby="title description">
  <title id="title">Independent queue capacity with one selection point</title>
  <desc id="description">Lifecycle stop requests have a reserved bounded queue. Critical commands and terminal faults use an important queue. Ordinary HAL solutions and peer events use an ordinary queue. One owner selects across the queues and processes one event at a time. Separate capacity does not preempt a running handler or provide fairness without an explicit scheduling policy.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L6 4 L1 7" fill="none" stroke="#8199B1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="145%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset in="blur" dx="0" dy="3" result="offset-blur"/>
      <feFlood flood-color="#000000" flood-opacity="0.055" result="shadow-color"/>
      <feComposite in="shadow-color" in2="offset-blur" operator="in" result="card-shadow"/>
      <feMerge><feMergeNode in="card-shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      text { font-family: Inter, "Helvetica Neue", Arial, sans-serif; }
      .card { fill: #1A2533; stroke: #34465A; stroke-width: 1.2; }
      .label { fill: #E5EDF5; font-weight: 500; letter-spacing: -0.4px; }
      .subtitle { fill: #ACBDCE; font-size: 18px; }
      .edge { fill: none; stroke: #8199B1; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .edge-label { fill: #ACBDCE; font-size: 16px; }
    </style>
  </defs>
  <rect width="800" height="514" rx="24" fill="#10161F"/>

  <g id="node-stop-source" data-panel="true">
    <rect x="24" y="24" width="250" height="88" rx="15" class="card" filter="url(#shadow)"/>

    <text x="149" y="56" text-anchor="middle" class="label" font-size="22">Lifecycle owner</text>
    <text x="149" y="83" text-anchor="middle" class="subtitle">Stop requests</text>
  </g>
  <g id="node-important-source" data-panel="true">
    <rect x="24" y="170" width="250" height="88" rx="15" class="card" filter="url(#shadow)"/>

    <text x="149" y="202" text-anchor="middle" class="label" font-size="22">Critical events</text>
    <text x="149" y="229" text-anchor="middle" class="subtitle">Commands · terminal faults</text>
  </g>
  <g id="node-ordinary-source" data-panel="true">
    <rect x="24" y="316" width="250" height="88" rx="15" class="card" filter="url(#shadow)"/>

    <text x="149" y="348" text-anchor="middle" class="label" font-size="22">Ordinary inputs</text>
    <text x="149" y="375" text-anchor="middle" class="subtitle">HAL data · peer events</text>
  </g>
  <g id="node-stop" data-panel="true">
    <rect x="314" y="24" width="212" height="88" rx="15" class="card" filter="url(#shadow)"/>
    <rect x="329" y="44" width="4" height="48" rx="2" fill="#F2A06A"/>
    <text x="420" y="56" text-anchor="middle" class="label" font-size="22">Stop queue</text>
    <text x="420" y="83" text-anchor="middle" class="subtitle">Reserved capacity</text>
  </g>
  <g id="node-important" data-panel="true">
    <rect x="314" y="170" width="212" height="88" rx="15" class="card" filter="url(#shadow)"/>

    <text x="420" y="202" text-anchor="middle" class="label" font-size="22">Important queue</text>
    <text x="420" y="229" text-anchor="middle" class="subtitle">Independent bound</text>
  </g>
  <g id="node-ordinary" data-panel="true">
    <rect x="314" y="316" width="212" height="88" rx="15" class="card" filter="url(#shadow)"/>
    <rect x="329" y="336" width="4" height="48" rx="2" fill="#83C5EA"/>
    <text x="420" y="348" text-anchor="middle" class="label" font-size="22">Ordinary queue</text>
    <text x="420" y="375" text-anchor="middle" class="subtitle">Independent bound</text>
  </g>
  <g id="node-select" data-panel="true">
    <rect x="584" y="170" width="192" height="114" rx="15" class="card" filter="url(#shadow)"/>

    <text x="680" y="202" text-anchor="middle" class="label" font-size="22">One selection</text>
    <text x="680" y="229" text-anchor="middle" class="subtitle">One owner</text>
    <text x="680" y="254" text-anchor="middle" class="subtitle">Bounded handlers</text>
  </g>
  <path id="edge-stop-source-stop" data-from="stop-source" data-to="stop" d="M274 68 H312" class="edge"/>
  <path id="edge-important-source-important" data-from="important-source" data-to="important" d="M274 214 H312" class="edge"/>
  <path id="edge-ordinary-source-ordinary" data-from="ordinary-source" data-to="ordinary" d="M274 360 H312" class="edge"/>
  <path id="edge-stop-select" data-from="stop" data-to="select" d="M526 68 H554 V196 H582" class="edge"/>
  <path id="edge-important-select" data-from="important" data-to="select" d="M526 214 H582" class="edge"/>
  <path id="edge-ordinary-select" data-from="ordinary" data-to="select" d="M526 360 H554 V258 H582" class="edge"/>
  <text x="400" y="452" text-anchor="middle" class="edge-label">All producers of a class share its queue; each class has a separate bound.</text>
  <text x="400" y="484" text-anchor="middle" class="edge-label">Selection order, deadlines and fairness remain explicit owner policy.</text>

</svg>
