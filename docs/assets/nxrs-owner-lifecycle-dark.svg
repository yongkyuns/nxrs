<svg xmlns="http://www.w3.org/2000/svg" width="800" height="836" viewBox="0 0 800 836" role="img" aria-labelledby="title description">
  <title id="title">Explicit startup and shutdown ownership</title>
  <desc id="description">Allocate bounded resources and construct the owners, then start producers. During operation the owner tracks accepted work. To stop, close admission, request cancellation, wake blocked waits and join the owners that successfully started. Release resources only after cleanup completes. A cleanup failure retains ownership and an observable error for the capability-specific retry or quarantine policy.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L6 4 L1 7" fill="none" stroke="#8199B1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="145%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset in="blur" dx="0" dy="3" result="offset-blur"/>
      <feFlood flood-color="#000000" flood-opacity="0.055" result="shadow-color"/>
      <feComposite in="shadow-color" in2="offset-blur" operator="in" result="card-shadow"/>
      <feMerge><feMergeNode in="card-shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      text { font-family: Inter, "Helvetica Neue", Arial, sans-serif; }
      .card { fill: #1A2533; stroke: #34465A; stroke-width: 1.2; }
      .label { fill: #E5EDF5; font-weight: 500; letter-spacing: -0.4px; }
      .subtitle { fill: #ACBDCE; font-size: 18px; }
      .edge { fill: none; stroke: #8199B1; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .edge-label { fill: #ACBDCE; font-size: 16px; }
    </style>
  </defs>
  <rect width="800" height="836" rx="24" fill="#10161F"/>

  <g id="node-construct" data-panel="true">
    <rect x="160" y="24" width="480" height="88" rx="15" class="card" filter="url(#shadow)"/>

    <text x="400" y="56" text-anchor="middle" class="label" font-size="22">Construct bounded resources</text>
    <text x="400" y="83" text-anchor="middle" class="subtitle">Inboxes · buffers · handles</text>
  </g>
  <g id="node-start" data-panel="true">
    <rect x="160" y="148" width="480" height="88" rx="15" class="card" filter="url(#shadow)"/>
    <rect x="175" y="168" width="4" height="48" rx="2" fill="#83C5EA"/>
    <text x="400" y="180" text-anchor="middle" class="label" font-size="22">Start producers and owners</text>
    <text x="400" y="207" text-anchor="middle" class="subtitle">Track which components started</text>
  </g>
  <g id="node-run" data-panel="true">
    <rect x="160" y="272" width="480" height="88" rx="15" class="card" filter="url(#shadow)"/>

    <text x="400" y="304" text-anchor="middle" class="label" font-size="22">Process accepted work</text>
    <text x="400" y="331" text-anchor="middle" class="subtitle">Each owner maintains its state</text>
  </g>
  <g id="node-cancel" data-panel="true">
    <rect x="160" y="396" width="480" height="88" rx="15" class="card" filter="url(#shadow)"/>
    <rect x="175" y="416" width="4" height="48" rx="2" fill="#F2A06A"/>
    <text x="400" y="428" text-anchor="middle" class="label" font-size="22">Close admission and request stop</text>
    <text x="400" y="455" text-anchor="middle" class="subtitle">Complete or cancel admitted work</text>
  </g>
  <g id="node-join" data-panel="true">
    <rect x="160" y="520" width="480" height="112" rx="15" class="card" filter="url(#shadow)"/>

    <text x="400" y="552" text-anchor="middle" class="label" font-size="22">Wake blocked waits and join</text>
    <text x="400" y="579" text-anchor="middle" class="subtitle">Stop callbacks and resource access</text>
    <text x="400" y="604" text-anchor="middle" class="subtitle">Attempt every started owner’s cleanup</text>
  </g>
  <path id="edge-construct-start" data-from="construct" data-to="start" d="M400 112 V146" class="edge"/>
  <path id="edge-start-run" data-from="start" data-to="run" d="M400 236 V270" class="edge"/>
  <path id="edge-run-cancel" data-from="run" data-to="cancel" d="M400 360 V394" class="edge"/>
  <path id="edge-cancel-join" data-from="cancel" data-to="join" d="M400 484 V518" class="edge"/>
  <path id="edge-join-release" data-from="join" data-to="release" d="M280 632 V664 H206 V702" class="edge"/>
  <path id="edge-join-retain" data-from="join" data-to="retain" d="M520 632 V664 H594 V702" class="edge"/>
  <text x="224" y="688" text-anchor="start" class="edge-label">Cleanup completed</text>
  <text x="612" y="688" text-anchor="start" class="edge-label">Cleanup failed</text>
  <g id="node-release" data-panel="true">
    <rect x="24" y="704" width="364" height="108" rx="15" class="card" filter="url(#shadow)"/>
    <rect x="39" y="724" width="4" height="68" rx="2" fill="#83C5EA"/>
    <text x="206" y="736" text-anchor="middle" class="label" font-size="22">Release resources</text>
    <text x="206" y="763" text-anchor="middle" class="subtitle">No producer can access them</text>
    <text x="206" y="788" text-anchor="middle" class="subtitle">Shutdown is complete</text>
  </g>
  <g id="node-retain" data-panel="true">
    <rect x="412" y="704" width="364" height="108" rx="15" class="card" filter="url(#shadow)"/>
    <rect x="427" y="724" width="4" height="68" rx="2" fill="#F2A06A"/>
    <text x="594" y="736" text-anchor="middle" class="label" font-size="22">Retain ownership</text>
    <text x="594" y="763" text-anchor="middle" class="subtitle">Keep the failure observable</text>
    <text x="594" y="788" text-anchor="middle" class="subtitle">Apply retry / quarantine policy</text>
  </g>

</svg>
