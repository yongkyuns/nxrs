<svg xmlns="http://www.w3.org/2000/svg" width="800" height="286" viewBox="0 0 800 286" role="img" aria-labelledby="title description">
  <title id="title">Queue capacity and the response deadline</title>
  <desc id="description">A queue that starts empty and cannot drain for 50 milliseconds needs nine slots for four burst and five regular arrivals. Each record contains 64 bytes of inline payload. The record arriving at the start misses its 20 millisecond deadline before draining resumes.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L6 4 L1 7" fill="none" stroke="#8199B1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="145%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset in="blur" dx="0" dy="3" result="offset-blur"/>
      <feFlood flood-color="#000000" flood-opacity="0.055" result="shadow-color"/>
      <feComposite in="shadow-color" in2="offset-blur" operator="in" result="card-shadow"/>
      <feMerge><feMergeNode in="card-shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      text { font-family: Inter, "Helvetica Neue", Arial, sans-serif; }
      .card { fill: #1A2533; stroke: #34465A; stroke-width: 1.2; }
      .label { fill: #E5EDF5; font-weight: 500; letter-spacing: -0.4px; }
      .subtitle { fill: #ACBDCE; font-size: 18px; }
      .edge { fill: none; stroke: #8199B1; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .edge-label { fill: #ACBDCE; font-size: 16px; }
    </style>
  </defs>
  <rect width="800" height="286" rx="24" fill="#10161F"/>

  <text x="400" y="44" text-anchor="middle" class="label" font-size="27">Queue capacity and the response deadline</text>
  <rect x="112" y="78" width="576" height="66" rx="12" fill="#141E2B" stroke="#3B5066"/>
  <text x="400" y="119" text-anchor="middle" class="label" font-size="23">Consumer cannot drain</text>
  <path d="M112 144 H688 M112 140 V154 M688 140 V154" stroke="#8199B1" stroke-width="2" fill="none"/>
  <path d="M342.4 144 V155" stroke="#F2A06A" stroke-width="4"/>
  <text x="112" y="179" text-anchor="middle" class="subtitle">0 ms · pause starts</text>
  <text x="342.4" y="179" text-anchor="middle" class="label" font-size="20">20 ms · deadline</text>
  <text x="688" y="179" text-anchor="middle" class="subtitle">50 ms · draining resumes</text>
  <g id="node-slots" data-panel="true">
    <rect x="136" y="199" width="528" height="70" rx="15" class="card" filter="url(#shadow)"/>
    <rect x="151" y="219" width="4" height="30" rx="2" fill="#83C5EA"/>
    <text x="400" y="231" text-anchor="middle" class="label" font-size="22">9 slots hold the arrivals</text>
    <text x="400" y="258" text-anchor="middle" class="subtitle">4 burst + 5 regular arrivals · 576 B of payload</text>
  </g>

</svg>
