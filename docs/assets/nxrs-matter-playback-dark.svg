<svg xmlns="http://www.w3.org/2000/svg" width="800" height="705" viewBox="0 0 800 705" role="img" aria-labelledby="title description">
  <title id="title">Matter camera playback session</title>
  <desc id="description">A Matter controller commissions the bridge, subscribes to occupancy, and passes the receiver’s WebRTC offer to the bridge. A shared RTSP stream supplies H.264. The receiver negotiates ICE and receives encrypted video directly from the bridge. Closing the live view sends EndSession through the controller.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L6 4 L1 7" fill="none" stroke="#8199B1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="145%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset in="blur" dx="0" dy="3" result="offset-blur"/>
      <feFlood flood-color="#000000" flood-opacity="0.055" result="shadow-color"/>
      <feComposite in="shadow-color" in2="offset-blur" operator="in" result="card-shadow"/>
      <feMerge><feMergeNode in="card-shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      text { font-family: Inter, "Helvetica Neue", Arial, sans-serif; }
      .card { fill: #1A2533; stroke: #34465A; stroke-width: 1.2; }
      .label { fill: #E5EDF5; font-weight: 500; letter-spacing: -0.4px; }
      .subtitle { fill: #ACBDCE; font-size: 18px; }
      .edge { fill: none; stroke: #8199B1; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .edge-label { fill: #ACBDCE; font-size: 16px; }
    </style>
  </defs>
  <rect width="800" height="705" rx="24" fill="#10161F"/>


  <path d="M106 91 V680" stroke="#8199B1" stroke-width="1" stroke-dasharray="4 6"/>
  <g id="node-receiver" data-panel="true">
    <rect x="16" y="24" width="180" height="67" rx="15" class="card" filter="url(#shadow)"/>

    <text x="106" y="64.5" text-anchor="middle" class="label" font-size="22">Video receiver</text>

  </g>

  <path d="M302 91 V680" stroke="#8199B1" stroke-width="1" stroke-dasharray="4 6"/>
  <g id="node-controller" data-panel="true">
    <rect x="212" y="24" width="180" height="67" rx="15" class="card" filter="url(#shadow)"/>

    <text x="302" y="64.5" text-anchor="middle" class="label" font-size="22">Matter controller</text>

  </g>

  <path d="M498 91 V680" stroke="#8199B1" stroke-width="1" stroke-dasharray="4 6"/>
  <g id="node-bridge" data-panel="true">
    <rect x="408" y="24" width="180" height="67" rx="15" class="card" filter="url(#shadow)"/>

    <text x="498" y="64.5" text-anchor="middle" class="label" font-size="22">Matter bridge</text>

  </g>

  <path d="M694 91 V680" stroke="#8199B1" stroke-width="1" stroke-dasharray="4 6"/>
  <g id="node-media" data-panel="true">
    <rect x="604" y="24" width="180" height="67" rx="15" class="card" filter="url(#shadow)"/>

    <text x="694" y="64.5" text-anchor="middle" class="label" font-size="22">Gateway media</text>

  </g>
    <path id="edge-controller-0-bridge" data-from="controller-0" data-to="bridge" d="M302 133 H498" class="edge"/>
  <text x="400" y="125" text-anchor="middle" class="edge-label">Commission and discover endpoints</text>
  <path id="edge-controller-1-bridge" data-from="controller-1" data-to="bridge" d="M302 177 H498" class="edge"/>
  <text x="400" y="169" text-anchor="middle" class="edge-label">Subscribe to occupancy and reachability</text>
  <path id="edge-receiver-2-controller" data-from="receiver-2" data-to="controller" d="M106 221 H302" class="edge"/>
  <text x="204" y="213" text-anchor="middle" class="edge-label">Open with a WebRTC offer</text>
  <path id="edge-controller-3-bridge" data-from="controller-3" data-to="bridge" d="M302 265 H498" class="edge"/>
  <text x="400" y="257" text-anchor="middle" class="edge-label">ProvideOffer on Camera</text>
  <path id="edge-bridge-4-media" data-from="bridge-4" data-to="media" d="M498 309 H694" class="edge"/>
  <text x="596" y="301" text-anchor="middle" class="edge-label">Use the shared RTSP source</text>
  <path id="edge-media-5-bridge" data-from="media-5" data-to="bridge" d="M694 353 H498" class="edge" stroke-dasharray="4 6"/>
  <text x="596" y="345" text-anchor="middle" class="edge-label">H.264 access units</text>
  <path id="edge-bridge-6-controller" data-from="bridge-6" data-to="controller" d="M498 397 H302" class="edge" stroke-dasharray="4 6"/>
  <text x="400" y="389" text-anchor="middle" class="edge-label">Session, SDP answer and ICE</text>
  <path id="edge-controller-7-receiver" data-from="controller-7" data-to="receiver" d="M302 441 H106" class="edge" stroke-dasharray="4 6"/>
  <text x="204" y="433" text-anchor="middle" class="edge-label">SDP answer and ICE</text>
  <path id="edge-receiver-8-bridge" data-from="receiver-8" data-to="bridge" d="M106 485 H498" class="edge"/>
  <text x="302" y="477" text-anchor="middle" class="edge-label">Direct ICE negotiation</text>
  <path id="edge-bridge-9-receiver" data-from="bridge-9" data-to="receiver" d="M498 529 H106" class="edge" stroke-dasharray="4 6"/>
  <text x="302" y="521" text-anchor="middle" class="edge-label">Encrypted WebRTC media</text>
  <path id="edge-receiver-10-controller" data-from="receiver-10" data-to="controller" d="M106 573 H302" class="edge"/>
  <text x="204" y="565" text-anchor="middle" class="edge-label">Close the live view</text>
  <path id="edge-controller-11-bridge" data-from="controller-11" data-to="bridge" d="M302 617 H498" class="edge"/>
  <text x="400" y="609" text-anchor="middle" class="edge-label">EndSession</text>
  <path id="edge-bridge-12-controller" data-from="bridge-12" data-to="controller" d="M498 661 H302" class="edge" stroke-dasharray="4 6"/>
  <text x="400" y="653" text-anchor="middle" class="edge-label">Release viewer session</text>

</svg>
