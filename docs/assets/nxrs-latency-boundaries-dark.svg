<svg xmlns="http://www.w3.org/2000/svg" width="800" height="640" viewBox="0 0 800 640" role="img" aria-labelledby="title description">
  <title id="title">Measure the path that matters</title>
  <desc id="description">An event is acquired, admitted to a queue, received by a worker and processed into output. Channel delivery covers admission through receive; end-to-end response includes acquisition and useful processing. Widths and spacing are conceptual, not durations.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L6 4 L1 7" fill="none" stroke="#8199B1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="145%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset in="blur" dx="0" dy="3" result="offset-blur"/>
      <feFlood flood-color="#000000" flood-opacity="0.055" result="shadow-color"/>
      <feComposite in="shadow-color" in2="offset-blur" operator="in" result="card-shadow"/>
      <feMerge><feMergeNode in="card-shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      text { font-family: Inter, "Helvetica Neue", Arial, sans-serif; }
      .card { fill: #1A2533; stroke: #34465A; stroke-width: 1.2; }
      .label { fill: #E5EDF5; font-weight: 500; letter-spacing: -0.4px; }
      .subtitle { fill: #ACBDCE; font-size: 18px; }
      .edge { fill: none; stroke: #8199B1; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .edge-label { fill: #ACBDCE; font-size: 16px; }
    </style>
  </defs>
  <rect width="800" height="640" rx="24" fill="#10161F"/>

  <text x="400" y="42" text-anchor="middle" class="label" font-size="26">Measure the path that matters</text>
  <g id="node-acquire" data-panel="true">
    <rect x="240" y="80" width="320" height="88" rx="15" class="card" filter="url(#shadow)"/>

    <text x="400" y="112" text-anchor="middle" class="label" font-size="22">Acquire and normalize</text>
    <text x="400" y="139" text-anchor="middle" class="subtitle">Device readiness → typed event</text>
  </g>
  <g id="node-admit" data-panel="true">
    <rect x="240" y="206" width="320" height="88" rx="15" class="card" filter="url(#shadow)"/>
    <rect x="255" y="226" width="4" height="48" rx="2" fill="#83C5EA"/>
    <text x="400" y="238" text-anchor="middle" class="label" font-size="22">Offer to the inbox</text>
    <text x="400" y="265" text-anchor="middle" class="subtitle">Queue admission / full policy</text>
  </g>
  <g id="node-receive" data-panel="true">
    <rect x="240" y="332" width="320" height="88" rx="15" class="card" filter="url(#shadow)"/>
    <rect x="255" y="352" width="4" height="48" rx="2" fill="#83C5EA"/>
    <text x="400" y="364" text-anchor="middle" class="label" font-size="22">Worker receives</text>
    <text x="400" y="391" text-anchor="middle" class="subtitle">Queue residence + scheduling</text>
  </g>
  <g id="node-output" data-panel="true">
    <rect x="240" y="458" width="320" height="88" rx="15" class="card" filter="url(#shadow)"/>
    <rect x="255" y="478" width="4" height="48" rx="2" fill="#F2A06A"/>
    <text x="400" y="490" text-anchor="middle" class="label" font-size="22">Handle and output</text>
    <text x="400" y="517" text-anchor="middle" class="subtitle">Useful work completes</text>
  </g>
  <path id="edge-acquire-admit" data-from="acquire" data-to="admit" d="M400 168 V204" class="edge"/>
  <path id="edge-admit-receive" data-from="admit" data-to="receive" d="M400 294 V330" class="edge"/>
  <path id="edge-receive-output" data-from="receive" data-to="output" d="M400 420 V456" class="edge"/>
  <path d="M204 80 H180 V546 H204 M596 206 H620 V420 H596" fill="none" stroke="#8199B1" stroke-width="2"/>
  <text transform="translate(152 313) rotate(-90)" text-anchor="middle" class="label" font-size="22">End-to-end response</text>
  <text transform="translate(654 313) rotate(-90)" text-anchor="middle" class="label" font-size="22">Channel delivery</text>
  <text x="400" y="592" text-anchor="middle" class="subtitle">Elapsed time includes waiting and preemption.</text>
  <text x="400" y="618" text-anchor="middle" class="subtitle">CPU time counts execution; measure it separately.</text>

</svg>
