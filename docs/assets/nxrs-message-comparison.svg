<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="title description">
  <title id="title">WROOM stream delivery latency</title>
  <desc id="description">Maximum of three per-run delivery p99 values in microseconds; lower is better. Four producers, eight slots. 16-byte messages: NuttX std 50.375, Zephyr 52.000. 64-byte messages: NuttX std 85.438, Zephyr 85.313. One physical WROOM; nominal on-chip clock. November 17, 2026.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L6 4 L1 7" fill="none" stroke="#8A9CAF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="145%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset in="blur" dx="0" dy="3" result="offset-blur"/>
      <feFlood flood-color="#24374A" flood-opacity="0.055" result="shadow-color"/>
      <feComposite in="shadow-color" in2="offset-blur" operator="in" result="card-shadow"/>
      <feMerge><feMergeNode in="card-shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      text { font-family: Inter, "Helvetica Neue", Arial, sans-serif; }
      .card { fill: #FFFFFF; stroke: #D7E1EB; stroke-width: 1.2; }
      .label { fill: #203042; font-weight: 500; letter-spacing: -0.4px; }
      .subtitle { fill: #596B7D; font-size: 18px; }
      .edge { fill: none; stroke: #8A9CAF; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .edge-label { fill: #596B7D; font-size: 16px; }
    </style>
  </defs>
  <rect width="800" height="480" rx="24" fill="#FCFDFE"/>

  <text x="30" y="43" class="label" font-size="26">WROOM stream delivery p99</text>
  <text x="30" y="75" class="subtitle">Four producers · eight slots · lower is better</text>
  <path d="M230 146 V354" stroke="#D7E1EB" stroke-width="1"/>
  <path d="M355 146 V354" stroke="#D7E1EB" stroke-width="1"/>
  <path d="M480 146 V354" stroke="#D7E1EB" stroke-width="1"/>
  <path d="M605 146 V354" stroke="#D7E1EB" stroke-width="1"/>
  <path d="M730 146 V354" stroke="#D7E1EB" stroke-width="1"/>
  <text x="30" y="126" class="label" font-size="22">16-byte messages</text>
<text x="30" y="163" class="subtitle">NuttX std</text>
  <rect x="230" y="148" width="251.88" height="20" rx="4" fill="#73B9E2"/>
  <text x="490.875" y="163" class="subtitle">50.375</text>
<text x="30" y="199" class="subtitle">Zephyr native</text>
  <rect x="230" y="184" width="260.00" height="20" rx="4" fill="#F08A4B"/>
  <text x="499" y="199" class="subtitle">52.000</text>
<text x="30" y="266" class="label" font-size="22">64-byte messages</text>
<text x="30" y="303" class="subtitle">NuttX std</text>
  <rect x="230" y="288" width="427.19" height="20" rx="4" fill="#73B9E2"/>
  <text x="666.1875" y="303" class="subtitle">85.438</text>
<text x="30" y="339" class="subtitle">Zephyr native</text>
  <rect x="230" y="324" width="426.56" height="20" rx="4" fill="#F08A4B"/>
  <text x="665.5625" y="339" class="subtitle">85.313</text>
  <text x="230" y="390" text-anchor="middle" class="subtitle">0</text>
  <text x="355" y="390" text-anchor="middle" class="subtitle">25</text>
  <text x="480" y="390" text-anchor="middle" class="subtitle">50</text>
  <text x="605" y="390" text-anchor="middle" class="subtitle">75</text>
  <text x="730" y="390" text-anchor="middle" class="subtitle">100</text>
  <text x="480" y="423" text-anchor="middle" class="subtitle">Delivery latency (µs) · nominal on-chip clock</text>
  <text x="30" y="458" class="subtitle">Maximum per-run p99 across three boots; not a worst-case bound.</text>

</svg>
