<svg xmlns="http://www.w3.org/2000/svg" width="800" height="688" viewBox="0 0 800 688" role="img" aria-labelledby="title description">
  <title id="title">Application-facing interfaces and implementation boundaries</title>
  <desc id="description">The application constructs reusable services. Application and service code may call a capability HAL or use ordinary Rust standard-library APIs directly. A capability selects its provider below the portable interface. The provider may use a chip driver, a resource adapter, or standard-library operations. On an MCU these paths reach the NuttX operating system and BSP. Platform profiles select configuration without becoming a runtime layer.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L6 4 L1 7" fill="none" stroke="#8A9CAF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="145%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset in="blur" dx="0" dy="3" result="offset-blur"/>
      <feFlood flood-color="#24374A" flood-opacity="0.055" result="shadow-color"/>
      <feComposite in="shadow-color" in2="offset-blur" operator="in" result="card-shadow"/>
      <feMerge><feMergeNode in="card-shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      text { font-family: Inter, "Helvetica Neue", Arial, sans-serif; }
      .card { fill: #FFFFFF; stroke: #D7E1EB; stroke-width: 1.2; }
      .label { fill: #203042; font-weight: 500; letter-spacing: -0.4px; }
      .subtitle { fill: #596B7D; font-size: 18px; }
      .edge { fill: none; stroke: #8A9CAF; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .edge-label { fill: #596B7D; font-size: 16px; }
    </style>
  </defs>
  <rect width="800" height="688" rx="24" fill="#FCFDFE"/>

  <g id="group-portable"><rect x="24" y="24" width="752" height="166" rx="21" fill="#F4F7FB" stroke="#CCD9E6" stroke-width="1.2"/><text x="48" y="59" class="label" font-size="21">Portable application code</text></g>
  <g id="node-app" data-panel="true">
    <rect x="54" y="90" width="300" height="68" rx="15" class="card" filter="url(#shadow)"/>

    <text x="204" y="131" text-anchor="middle" class="label" font-size="22">Application main()</text>

  </g>
  <g id="node-service" data-panel="true">
    <rect x="444" y="90" width="300" height="68" rx="15" class="card" filter="url(#shadow)"/>

    <text x="594" y="131" text-anchor="middle" class="label" font-size="22">Reusable services</text>

  </g>
  <path id="edge-app-service" data-from="app" data-to="service" d="M354 124 H442" class="edge"/>
  <path id="edge-portable-hal" data-from="portable" data-to="hal" d="M214 190 V252" class="edge"/>
  <path id="edge-portable-std" data-from="portable" data-to="std" d="M600 190 V252" class="edge"/>
  <text x="232" y="226" text-anchor="start" class="edge-label">Subsystem behavior</text>
  <text x="618" y="226" text-anchor="start" class="edge-label">Ordinary Rust APIs</text>
  <g id="node-hal" data-panel="true">
    <rect x="44" y="254" width="340" height="88" rx="15" class="card" filter="url(#shadow)"/>
    <rect x="59" y="274" width="4" height="48" rx="2" fill="#73B9E2"/>
    <text x="214" y="286" text-anchor="middle" class="label" font-size="22">Capability HAL</text>
    <text x="214" y="313" text-anchor="middle" class="subtitle">Types · errors · ownership contract</text>
  </g>
  <g id="node-std" data-panel="true">
    <rect x="444" y="254" width="312" height="88" rx="15" class="card" filter="url(#shadow)"/>
    <rect x="459" y="274" width="4" height="48" rx="2" fill="#F08A4B"/>
    <text x="600" y="286" text-anchor="middle" class="label" font-size="22">Rust std</text>
    <text x="600" y="313" text-anchor="middle" class="subtitle">Files · sockets · threads</text>
  </g>
  <path id="edge-hal-provider" data-from="hal" data-to="provider" d="M214 342 V404" class="edge"/>
  <g id="node-provider" data-panel="true">
    <rect x="44" y="406" width="340" height="88" rx="15" class="card" filter="url(#shadow)"/>

    <text x="214" y="438" text-anchor="middle" class="label" font-size="22">Selected provider</text>
    <text x="214" y="465" text-anchor="middle" class="subtitle">Acquisition · cleanup · native I/O</text>
  </g>
  <g id="node-driver" data-panel="true">
    <rect x="444" y="406" width="312" height="88" rx="15" class="card" filter="url(#shadow)"/>

    <text x="600" y="438" text-anchor="middle" class="label" font-size="22">Driver / resource adapter</text>
    <text x="600" y="465" text-anchor="middle" class="subtitle">Device protocol · bus operations</text>
  </g>
  <path id="edge-provider-driver" data-from="provider" data-to="driver" d="M384 450 H442" class="edge"/>
  <path id="edge-provider-os" data-from="provider" data-to="os" d="M214 494 V576" class="edge"/>
  <path id="edge-driver-os" data-from="driver" data-to="os" d="M600 494 V576" class="edge"/>
  <path id="edge-std-os" data-from="std" data-to="os" d="M756 298 H778 V548 H692 V576" class="edge"/>
  <g id="node-os" data-panel="true">
    <rect x="104" y="578" width="592" height="88" rx="15" class="card" filter="url(#shadow)"/>
    <rect x="119" y="598" width="4" height="48" rx="2" fill="#73B9E2"/>
    <text x="400" y="610" text-anchor="middle" class="label" font-size="22">NuttX + BSP</text>
    <text x="400" y="637" text-anchor="middle" class="subtitle">Scheduling · device registration · hardware</text>
  </g>

</svg>
