<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="704" viewBox="0 0 1180 704" role="img" aria-labelledby="title description">
  <title id="title">NXRS Motion Tracker in the browser</title>
  <desc id="description">The Rust application and ESP32-S3 NuttX profile build an Xtensa flash image for two cores. The same image boots in QEMU or in ESP-EMU inside a browser worker. In the browser, the guest exchanges touch and display data with the page, UBX with a UART1 GNSS model, and UART2 H4 traffic with a simulated controller and central. QR pixels connect the guest's TLS pairing secret to the browser TLS client. The page displays authenticated telemetry.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M1 1l5 3-5 3" fill="none" stroke="#687f94" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text{font-family:Inter,"Helvetica Neue",Arial,sans-serif;fill:#203042}
      .card{fill:#fff;stroke:#cbd8e5;stroke-width:1.2}
      .label{font-size:23px;font-weight:650;letter-spacing:-.3px}
      .sub{font-size:17px;fill:#4a6074}
      .edge{fill:none;stroke:#687f94;stroke-width:1.8;marker-end:url(#arrow)}
      .both{marker-start:url(#arrow)}
      .path-label{font-size:16px;font-weight:550;fill:#4a6074}
    </style>
  </defs>

  <rect width="1180" height="704" rx="24" fill="#fcfdfe"/>

  <rect class="card" x="48" y="28" width="440" height="88" rx="15"/>
  <text class="label" x="70" y="65">Rust Motion Tracker</text>
  <text class="sub" x="70" y="93">NXRS HALs and ESP32-S3 NuttX profile</text>
  <path class="edge" d="M490 72h94"/>
  <rect x="596" y="28" width="536" height="88" rx="15" fill="#eaf3fc" stroke="#a7c7e5"/>
  <text class="label" x="618" y="65">ESP32-S3 Xtensa flash image</text>
  <text class="sub" x="618" y="93">Two-core NuttX · same image for QEMU and ESP-EMU</text>

  <rect x="48" y="162" width="1084" height="398" rx="19" fill="#f2f6fa" stroke="#c4d3e1"/>
  <text class="label" x="75" y="204">Browser worker</text>
  <path class="edge" d="M895 118v104"/>
  <text class="path-label" x="913" y="145">Boot flash</text>

  <rect class="card" x="75" y="230" width="383" height="86" rx="13"/>
  <text class="label" x="95" y="265">Touch and display bridge</text>
  <text class="sub" x="95" y="291">Contact state in · RGB565 pixels out</text>
  <path class="edge both" d="M464 280h214"/>
  <text class="path-label" x="571" y="267" text-anchor="middle">FT6336 / LCD</text>

  <rect class="card" x="75" y="336" width="383" height="86" rx="13"/>
  <text class="label" x="95" y="371">NEO-M9N model</text>
  <text class="sub" x="95" y="397">UBX configuration and simulated fixes</text>
  <path class="edge both" d="M464 386h214"/>
  <text class="path-label" x="571" y="373" text-anchor="middle">UART1</text>

  <rect x="75" y="442" width="383" height="86" rx="13" fill="#fff4e9" stroke="#e7ba90"/>
  <text class="label" x="95" y="477">Simulated BLE peer</text>
  <text class="sub" x="95" y="503">QR scan · H4 controller · GATT and TLS</text>
  <path class="edge both" d="M464 492h214"/>
  <text class="path-label" x="571" y="479" text-anchor="middle">UART2 / H4</text>

  <rect x="688" y="230" width="417" height="298" rx="15" fill="#eaf3fc" stroke="#a7c7e5"/>
  <text class="label" x="709" y="265">ESP-EMU WebAssembly</text>
  <text class="sub" x="709" y="292">ESP32-S3 ROM, flash and peripherals</text>
  <rect class="card" x="709" y="312" width="375" height="193" rx="12"/>
  <text class="label" x="729" y="347">NuttX guest and Rust std</text>
  <rect x="729" y="364" width="154" height="33" rx="7" fill="#eaf3fc"/>
  <rect x="897" y="364" width="165" height="33" rx="7" fill="#eaf3fc"/>
  <text class="path-label" x="749" y="386">Xtensa core 0</text>
  <text class="path-label" x="917" y="386">Xtensa core 1</text>
  <text class="sub" x="729" y="432">Tracker, dashboard gestures and sensors</text>
  <text class="sub" x="729" y="459">NuttX Bluetooth host and GATT server</text>
  <text class="sub" x="729" y="486">Guest TLS-PSK endpoint</text>

  <path class="edge both" d="M265 563v44"/>
  <text class="path-label" x="282" y="590">Pointer events, panel frames and authenticated telemetry</text>
  <rect class="card" x="48" y="614" width="1084" height="63" rx="13"/>
  <text class="label" x="75" y="653">Tutorial and demo UI</text>
  <text class="sub" x="388" y="652">Canvas touchscreen · BLE telemetry · serial console</text>
</svg>
