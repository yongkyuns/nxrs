<svg xmlns="http://www.w3.org/2000/svg" width="800" height="768" viewBox="0 0 800 768" role="img" aria-labelledby="title description">
  <title id="title">One owner, one bounded inbox, one wait point</title>
  <desc id="description">Commands and peer or I/O events enter one bounded inbox. A single owner waits for the next message or its next deadline, updates private state synchronously, and submits outputs with a declared capacity policy before returning to the wait. Interrupt notifications are deferred to task context before this path. A deadline may expire the wait without enqueuing another message.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L6 4 L1 7" fill="none" stroke="#8A9CAF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="145%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset in="blur" dx="0" dy="3" result="offset-blur"/>
      <feFlood flood-color="#24374A" flood-opacity="0.055" result="shadow-color"/>
      <feComposite in="shadow-color" in2="offset-blur" operator="in" result="card-shadow"/>
      <feMerge><feMergeNode in="card-shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      text { font-family: Inter, "Helvetica Neue", Arial, sans-serif; }
      .card { fill: #FFFFFF; stroke: #D7E1EB; stroke-width: 1.2; }
      .label { fill: #203042; font-weight: 500; letter-spacing: -0.4px; }
      .subtitle { fill: #596B7D; font-size: 18px; }
      .edge { fill: none; stroke: #8A9CAF; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .edge-label { fill: #596B7D; font-size: 16px; }
    </style>
  </defs>
  <rect width="800" height="768" rx="24" fill="#FCFDFE"/>

  <g id="node-commands" data-panel="true">
    <rect x="44" y="24" width="328" height="88" rx="15" class="card" filter="url(#shadow)"/>

    <text x="208" y="56" text-anchor="middle" class="label" font-size="22">Commands</text>
    <text x="208" y="83" text-anchor="middle" class="subtitle">Application control</text>
  </g>
  <g id="node-events" data-panel="true">
    <rect x="428" y="24" width="328" height="88" rx="15" class="card" filter="url(#shadow)"/>

    <text x="592" y="56" text-anchor="middle" class="label" font-size="22">Peer and I/O events</text>
    <text x="592" y="83" text-anchor="middle" class="subtitle">Delivered in task context</text>
  </g>
  <path id="edge-commands-inbox" data-from="commands" data-to="inbox" d="M208 112 V140 H280 V166" class="edge"/>
  <path id="edge-events-inbox" data-from="events" data-to="inbox" d="M592 112 V140 H520 V166" class="edge"/>
  <g id="node-inbox" data-panel="true">
    <rect x="160" y="168" width="480" height="128" rx="15" class="card" filter="url(#shadow)"/>

    <text x="400" y="200" text-anchor="middle" class="label" font-size="22">Bounded typed inbox</text>
    <text x="400" y="227" text-anchor="middle" class="subtitle">Capacity and full-queue policy are explicit</text>
  </g>
  <rect x="225" y="238" width="30" height="20" rx="4" fill="#73B9E2" stroke="#CCD9E6"/>
<rect x="261" y="238" width="30" height="20" rx="4" fill="#73B9E2" stroke="#CCD9E6"/>
<rect x="297" y="238" width="30" height="20" rx="4" fill="#73B9E2" stroke="#CCD9E6"/>
<rect x="333" y="238" width="30" height="20" rx="4" fill="#F4F7FB" stroke="#CCD9E6"/>
<rect x="369" y="238" width="30" height="20" rx="4" fill="#F4F7FB" stroke="#CCD9E6"/>
<rect x="405" y="238" width="30" height="20" rx="4" fill="#F4F7FB" stroke="#CCD9E6"/>
<rect x="441" y="238" width="30" height="20" rx="4" fill="#F4F7FB" stroke="#CCD9E6"/>
<rect x="477" y="238" width="30" height="20" rx="4" fill="#F4F7FB" stroke="#CCD9E6"/>
<rect x="513" y="238" width="30" height="20" rx="4" fill="#F4F7FB" stroke="#CCD9E6"/>
<rect x="549" y="238" width="30" height="20" rx="4" fill="#F4F7FB" stroke="#CCD9E6"/>
  <g id="group-owner"><rect x="64" y="336" width="672" height="408" rx="21" fill="#F4F7FB" stroke="#CCD9E6" stroke-width="1.2"/><text x="88" y="371" class="label" font-size="21">One owner · private mutable state</text></g>
  <g id="node-wait" data-panel="true">
    <rect x="132" y="392" width="520" height="88" rx="15" class="card" filter="url(#shadow)"/>
    <rect x="147" y="412" width="4" height="48" rx="2" fill="#73B9E2"/>
    <text x="392" y="424" text-anchor="middle" class="label" font-size="22">Wait for an event or deadline</text>
    <text x="392" y="451" text-anchor="middle" class="subtitle">recv() or recv_timeout()</text>
  </g>
  <g id="node-handle" data-panel="true">
    <rect x="132" y="516" width="520" height="88" rx="15" class="card" filter="url(#shadow)"/>
    <rect x="147" y="536" width="4" height="48" rx="2" fill="#F08A4B"/>
    <text x="392" y="548" text-anchor="middle" class="label" font-size="22">Handle one event</text>
    <text x="392" y="575" text-anchor="middle" class="subtitle">Synchronous, bounded state update</text>
  </g>
  <g id="node-output" data-panel="true">
    <rect x="176" y="640" width="432" height="76" rx="15" class="card" filter="url(#shadow)"/>

    <text x="392" y="672" text-anchor="middle" class="label" font-size="22">Submit outputs</text>
    <text x="392" y="699" text-anchor="middle" class="subtitle">Apply the chosen delivery policy</text>
  </g>
  <path id="edge-inbox-wait" data-from="inbox" data-to="wait" d="M400 296 V390" class="edge"/>
  <path id="edge-wait-handle" data-from="wait" data-to="handle" d="M400 480 V514" class="edge"/>
  <path id="edge-handle-output" data-from="handle" data-to="output" d="M400 604 V638" class="edge"/>
  <path id="edge-output-wait" data-from="output" data-to="wait" d="M608 678 H700 V436 H654" class="edge"/>

</svg>
