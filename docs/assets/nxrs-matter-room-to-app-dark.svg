<svg xmlns="http://www.w3.org/2000/svg" width="800" height="810" viewBox="0 0 800 810" role="img" aria-labelledby="title description">
  <title id="title">From a room to an app</title>
  <desc id="description">The camera board runs Nxrs firmware. It sends video and person updates to the gateway computer. The gateway’s Matter bridge presents a camera and a room sensor. The Home Assistant server adds the device, opens the video session, and runs automations. The phone or browser receives live video directly from the bridge.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L6 4 L1 7" fill="none" stroke="#8199B1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="145%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset in="blur" dx="0" dy="3" result="offset-blur"/>
      <feFlood flood-color="#000000" flood-opacity="0.055" result="shadow-color"/>
      <feComposite in="shadow-color" in2="offset-blur" operator="in" result="card-shadow"/>
      <feMerge><feMergeNode in="card-shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      text { font-family: Inter, "Helvetica Neue", Arial, sans-serif; }
      .card { fill: #1A2533; stroke: #34465A; stroke-width: 1.2; }
      .label { fill: #E5EDF5; font-weight: 500; letter-spacing: -0.4px; }
      .subtitle { fill: #ACBDCE; font-size: 18px; }
      .edge { fill: none; stroke: #8199B1; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .edge-label { fill: #ACBDCE; font-size: 16px; }
    </style>
  </defs>
  <rect width="800" height="810" rx="24" fill="#10161F"/>

  <g id="node-board" data-panel="true">
    <rect x="24" y="24" width="752" height="94" rx="15" class="card" filter="url(#shadow)"/>
    <rect x="39" y="44" width="4" height="54" rx="2" fill="#83C5EA"/>
    <text x="400" y="56" text-anchor="middle" class="label" font-size="22">Camera board in the room</text>
    <text x="400" y="83" text-anchor="middle" class="subtitle">Nxrs firmware captures video and detects people</text>
  </g>
  <g id="group-host"><rect x="24" y="171" width="752" height="315" rx="21" fill="#141E2B" stroke="#3B5066" stroke-width="1.2"/><text x="48" y="206" class="label" font-size="21">Gateway computer</text></g>
  <path id="edge-board-gateway" data-from="board" data-to="gateway" d="M298 118 V224" class="edge"/>
  <text x="314" y="149" text-anchor="start" class="edge-label">Video and person updates</text>
  <g id="node-gateway" data-panel="true">
    <rect x="52" y="226" width="492" height="82" rx="15" class="card" filter="url(#shadow)"/>

    <text x="298" y="258" text-anchor="middle" class="label" font-size="22">Nxrs gateway</text>
    <text x="298" y="285" text-anchor="middle" class="subtitle">Shares live video and room occupancy</text>
  </g>
  <path id="edge-gateway-bridge" data-from="gateway" data-to="bridge" d="M298 308 V365" class="edge"/>
  <text x="314" y="342" text-anchor="start" class="edge-label">Camera feed and room status</text>
  <g id="node-bridge" data-panel="true">
    <rect x="52" y="367" width="492" height="88" rx="15" class="card" filter="url(#shadow)"/>
    <rect x="67" y="387" width="4" height="48" rx="2" fill="#83C5EA"/>
    <text x="298" y="399" text-anchor="middle" class="label" font-size="22">Matter bridge</text>
    <text x="298" y="426" text-anchor="middle" class="subtitle">Presents a camera and a room occupancy sensor</text>
  </g>
  <path id="edge-home-assistant-bridge" data-from="home-assistant" data-to="bridge" d="M298 538 V457" class="edge"/>
  <text x="314" y="515" text-anchor="start" class="edge-label">Pairing and camera commands</text>
  <g id="node-home-assistant" data-panel="true">
    <rect x="52" y="538" width="492" height="88" rx="15" class="card" filter="url(#shadow)"/>
    <rect x="67" y="558" width="4" height="48" rx="2" fill="#F2A06A"/>
    <text x="298" y="570" text-anchor="middle" class="label" font-size="22">Home Assistant server</text>
    <text x="298" y="597" text-anchor="middle" class="subtitle">Adds the device, opens live view and runs rules</text>
  </g>
  <path id="edge-bridge-app" data-from="bridge" data-to="app" d="M544 411 H669 V697" class="edge"/>
  <text x="655" y="565" text-anchor="end" class="edge-label">Live video</text>
  <text x="655" y="588" text-anchor="end" class="edge-label">direct to app</text>
  <path id="edge-home-assistant-app" data-from="home-assistant" data-to="app" d="M298 626 V697" class="edge"/>
  <text x="314" y="664" text-anchor="start" class="edge-label">Controls and room status</text>
  <g id="node-app" data-panel="true">
    <rect x="52" y="699" width="696" height="87" rx="15" class="card" filter="url(#shadow)"/>
    <rect x="67" y="719" width="4" height="47" rx="2" fill="#83C5EA"/>
    <text x="400" y="731" text-anchor="middle" class="label" font-size="22">Phone app or web dashboard</text>
    <text x="400" y="758" text-anchor="middle" class="subtitle">See the live image and check whether the room is occupied</text>
  </g>

</svg>
