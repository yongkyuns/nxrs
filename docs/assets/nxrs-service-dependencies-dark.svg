<svg xmlns="http://www.w3.org/2000/svg" width="800" height="744" viewBox="0 0 800 744" role="img" aria-labelledby="title description">
  <title id="title">Capability dependencies in portable service qualification</title>
  <desc id="description">The camera-support test composition depends on camera, recording and telemetry services. Each service uses its corresponding camera, storage or transport capability contract. Separately, navigation services depend on IMU and GNSS capability contracts, each with a build-selected provider. Production applications do not depend on the camera-support fixture.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L6 4 L1 7" fill="none" stroke="#8199B1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="145%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset in="blur" dx="0" dy="3" result="offset-blur"/>
      <feFlood flood-color="#000000" flood-opacity="0.055" result="shadow-color"/>
      <feComposite in="shadow-color" in2="offset-blur" operator="in" result="card-shadow"/>
      <feMerge><feMergeNode in="card-shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      text { font-family: Inter, "Helvetica Neue", Arial, sans-serif; }
      .card { fill: #1A2533; stroke: #34465A; stroke-width: 1.2; }
      .label { fill: #E5EDF5; font-weight: 500; letter-spacing: -0.4px; }
      .subtitle { fill: #ACBDCE; font-size: 18px; }
      .edge { fill: none; stroke: #8199B1; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .edge-label { fill: #ACBDCE; font-size: 16px; }
    </style>
  </defs>
  <rect width="800" height="744" rx="24" fill="#10161F"/>

  <g id="group-test"><rect x="24" y="24" width="752" height="392" rx="21" fill="#141E2B" stroke="#3B5066" stroke-width="1.2"/><text x="48" y="59" class="label" font-size="21">Camera qualification fixture</text></g>
  <g id="node-fixture" data-panel="true">
    <rect x="188" y="80" width="424" height="68" rx="15" class="card" filter="url(#shadow)"/>

    <text x="400" y="121" text-anchor="middle" class="label" font-size="22">tests/camera-support</text>

  </g>
  <g id="node-camera-service" data-panel="true">
    <rect x="44" y="204" width="218" height="88" rx="15" class="card" filter="url(#shadow)"/>

    <text x="153" y="236" text-anchor="middle" class="label" font-size="22">Camera service</text>
    <text x="153" y="263" text-anchor="middle" class="subtitle">nxrs-camera-service</text>
  </g>
  <g id="node-recording-service" data-panel="true">
    <rect x="290" y="204" width="218" height="88" rx="15" class="card" filter="url(#shadow)"/>

    <text x="399" y="236" text-anchor="middle" class="label" font-size="22">Recording service</text>
    <text x="399" y="263" text-anchor="middle" class="subtitle">nxrs-recording-service</text>
  </g>
  <g id="node-telemetry-service" data-panel="true">
    <rect x="536" y="204" width="218" height="88" rx="15" class="card" filter="url(#shadow)"/>

    <text x="645" y="236" text-anchor="middle" class="label" font-size="22">Telemetry service</text>
    <text x="645" y="263" text-anchor="middle" class="subtitle">nxrs-telemetry-service</text>
  </g>
  <g id="node-camera" data-panel="true">
    <rect x="44" y="332" width="218" height="60" rx="15" class="card" filter="url(#shadow)"/>
    <rect x="59" y="352" width="4" height="20" rx="2" fill="#83C5EA"/>
    <text x="153" y="369" text-anchor="middle" class="label" font-size="22">nxrs-camera</text>

  </g>
  <g id="node-storage" data-panel="true">
    <rect x="290" y="332" width="218" height="60" rx="15" class="card" filter="url(#shadow)"/>
    <rect x="305" y="352" width="4" height="20" rx="2" fill="#83C5EA"/>
    <text x="399" y="369" text-anchor="middle" class="label" font-size="22">nxrs-storage</text>

  </g>
  <g id="node-transport" data-panel="true">
    <rect x="536" y="332" width="218" height="60" rx="15" class="card" filter="url(#shadow)"/>
    <rect x="551" y="352" width="4" height="20" rx="2" fill="#83C5EA"/>
    <text x="645" y="369" text-anchor="middle" class="label" font-size="22">nxrs-transport</text>

  </g>
  <path id="edge-fixture-camera-service" data-from="fixture" data-to="camera-service" d="M272 148 V174 H153 V202" class="edge"/>
  <path id="edge-fixture-recording-service" data-from="fixture" data-to="recording-service" d="M400 148 V202" class="edge"/>
  <path id="edge-fixture-telemetry-service" data-from="fixture" data-to="telemetry-service" d="M528 148 V174 H645 V202" class="edge"/>
  <path id="edge-camera-service-camera" data-from="camera-service" data-to="camera" d="M153 292 V330" class="edge"/>
  <path id="edge-recording-service-storage" data-from="recording-service" data-to="storage" d="M399 292 V330" class="edge"/>
  <path id="edge-telemetry-service-transport" data-from="telemetry-service" data-to="transport" d="M645 292 V330" class="edge"/>
  <g id="group-navigation"><rect x="24" y="456" width="752" height="264" rx="21" fill="#141E2B" stroke="#3B5066" stroke-width="1.2"/><text x="48" y="491" class="label" font-size="21">Navigation service dependencies</text></g>
  <g id="node-navigation" data-panel="true">
    <rect x="44" y="516" width="290" height="88" rx="15" class="card" filter="url(#shadow)"/>

    <text x="189" y="548" text-anchor="middle" class="label" font-size="22">service/navigation</text>
    <text x="189" y="575" text-anchor="middle" class="subtitle">Reusable behavior</text>
  </g>
  <g id="node-sensors" data-panel="true">
    <rect x="412" y="516" width="342" height="88" rx="15" class="card" filter="url(#shadow)"/>
    <rect x="427" y="536" width="4" height="48" rx="2" fill="#83C5EA"/>
    <text x="583" y="548" text-anchor="middle" class="label" font-size="22">nxrs-imu / nxrs-gnss</text>
    <text x="583" y="575" text-anchor="middle" class="subtitle">Provider-independent contracts</text>
  </g>
  <path id="edge-navigation-sensors" data-from="navigation" data-to="sensors" d="M334 560 H410" class="edge"/>
  <g id="node-provider" data-panel="true">
    <rect x="412" y="646" width="342" height="54" rx="15" class="card" filter="url(#shadow)"/>

    <text x="583" y="680" text-anchor="middle" class="label" font-size="22">Build-selected providers</text>

  </g>
  <path id="edge-sensors-provider" data-from="sensors" data-to="provider" d="M583 604 V644" class="edge"/>

</svg>
