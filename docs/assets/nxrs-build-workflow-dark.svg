<svg xmlns="http://www.w3.org/2000/svg" width="800" height="756" viewBox="0 0 800 756" role="img" aria-labelledby="title description">
  <title id="title">From source inputs to a NuttX firmware image</title>
  <desc id="description">An application manifest, a profile with ordered overlays, and pinned native sources enter the host build controller. It resolves configuration, prepares the compiler and native sources, asks Cargo for selected dependencies, prepares generated instances and native helpers, compiles and links, then checks the actual image and writes build records. Application behavior remains in handwritten Rust.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L6 4 L1 7" fill="none" stroke="#8199B1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="145%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset in="blur" dx="0" dy="3" result="offset-blur"/>
      <feFlood flood-color="#000000" flood-opacity="0.055" result="shadow-color"/>
      <feComposite in="shadow-color" in2="offset-blur" operator="in" result="card-shadow"/>
      <feMerge><feMergeNode in="card-shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      text { font-family: Inter, "Helvetica Neue", Arial, sans-serif; }
      .card { fill: #1A2533; stroke: #34465A; stroke-width: 1.2; }
      .label { fill: #E5EDF5; font-weight: 500; letter-spacing: -0.4px; }
      .subtitle { fill: #ACBDCE; font-size: 18px; }
      .edge { fill: none; stroke: #8199B1; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .edge-label { fill: #ACBDCE; font-size: 16px; }
    </style>
  </defs>
  <rect width="800" height="756" rx="24" fill="#10161F"/>

  <g id="node-app" data-panel="true">
    <rect x="24" y="24" width="236" height="88" rx="15" class="card" filter="url(#shadow)"/>
    <rect x="39" y="44" width="4" height="48" rx="2" fill="#83C5EA"/>
    <text x="142" y="56" text-anchor="middle" class="label" font-size="22">Application</text>
    <text x="142" y="83" text-anchor="middle" class="subtitle">Manifest · Rust source</text>
  </g>
  <g id="node-profile" data-panel="true">
    <rect x="282" y="24" width="236" height="88" rx="15" class="card" filter="url(#shadow)"/>
    <rect x="297" y="44" width="4" height="48" rx="2" fill="#F2A06A"/>
    <text x="400" y="56" text-anchor="middle" class="label" font-size="22">Profile + overlays</text>
    <text x="400" y="83" text-anchor="middle" class="subtitle">Board · resources</text>
  </g>
  <g id="node-sources" data-panel="true">
    <rect x="540" y="24" width="236" height="88" rx="15" class="card" filter="url(#shadow)"/>

    <text x="658" y="56" text-anchor="middle" class="label" font-size="22">Pinned sources</text>
    <text x="658" y="83" text-anchor="middle" class="subtitle">NuttX · Rust · patches</text>
  </g>
  <path id="edge-app-resolve" data-from="app" data-to="resolve" d="M142 112 V134 H276 V156" class="edge" stroke-dasharray="4 6"/>
  <path id="edge-profile-resolve" data-from="profile" data-to="resolve" d="M400 112 V156" class="edge" stroke-dasharray="4 6"/>
  <path id="edge-sources-resolve" data-from="sources" data-to="resolve" d="M658 112 V134 H524 V156" class="edge" stroke-dasharray="4 6"/>
  <g id="node-resolve" data-panel="true">
    <rect x="120" y="158" width="560" height="88" rx="15" class="card" filter="url(#shadow)"/>

    <text x="400" y="190" text-anchor="middle" class="label" font-size="22">Resolve the build</text>
    <text x="400" y="217" text-anchor="middle" class="subtitle">Entry settings · capability checks · configuration</text>
  </g>
  <path id="edge-resolve-prepare" data-from="resolve" data-to="prepare" d="M400 246 V284" class="edge"/>
  <g id="node-prepare" data-panel="true">
    <rect x="120" y="286" width="560" height="112" rx="15" class="card" filter="url(#shadow)"/>
    <rect x="135" y="306" width="4" height="72" rx="2" fill="#83C5EA"/>
    <text x="400" y="318" text-anchor="middle" class="label" font-size="22">Prepare selected inputs</text>
    <text x="400" y="345" text-anchor="middle" class="subtitle">Compiler and sources → Cargo dependency graph</text>
    <text x="400" y="370" text-anchor="middle" class="subtitle">Instances · native headers and helpers</text>
  </g>
  <path id="edge-prepare-compile" data-from="prepare" data-to="compile" d="M400 398 V436" class="edge"/>
  <g id="node-compile" data-panel="true">
    <rect x="120" y="438" width="560" height="88" rx="15" class="card" filter="url(#shadow)"/>

    <text x="400" y="470" text-anchor="middle" class="label" font-size="22">Compile and link</text>
    <text x="400" y="497" text-anchor="middle" class="subtitle">Cargo builds Rust · NuttX builds the native image</text>
  </g>
  <path id="edge-compile-inspect" data-from="compile" data-to="inspect" d="M400 526 V564" class="edge"/>
  <g id="node-inspect" data-panel="true">
    <rect x="120" y="566" width="560" height="88" rx="15" class="card" filter="url(#shadow)"/>
    <rect x="135" y="586" width="4" height="48" rx="2" fill="#F2A06A"/>
    <text x="400" y="598" text-anchor="middle" class="label" font-size="22">Inspect the actual outputs</text>
    <text x="400" y="625" text-anchor="middle" class="subtitle">Effective configuration · ABI · symbols · image hashes</text>
  </g>
  <path id="edge-inspect-image" data-from="inspect" data-to="image" d="M276 654 V676 H210 V694" class="edge"/>
  <path id="edge-inspect-records" data-from="inspect" data-to="records" d="M524 654 V676 H590 V694" class="edge"/>
  <g id="node-image" data-panel="true">
    <rect x="24" y="696" width="372" height="40" rx="15" class="card" filter="url(#shadow)"/>

    <text x="210" y="723" text-anchor="middle" class="label" font-size="22">Firmware image</text>

  </g>
  <g id="node-records" data-panel="true">
    <rect x="420" y="696" width="356" height="40" rx="15" class="card" filter="url(#shadow)"/>

    <text x="598" y="723" text-anchor="middle" class="label" font-size="22">Build records + receipts</text>

  </g>

</svg>
