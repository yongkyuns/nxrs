[package]
name = "nxrs-composition"
version.workspace = true
edition.workspace = true
build = "../tools/build-support/cargo/composition.rs"

[lib]
name = "composition"

[package.metadata.nxrs]
device-capabilities = ["imu", "gnss", "battery"]
resource-features = { i2c = "i2c", spi = "spi", "gnss/gpio-interrupt" = "gnss-pps" }
diagnostic-features = ["probe"]

[features]
imu = ["dep:nxrs-imu", "dep:nxrs-acquisition", "dep:nxrs-peripheral", "dep:nxrs-messaging", "dep:embedded-hal"]
i2c = ["dep:nxrs-i2c"]
spi = ["dep:nxrs-spi"]
gnss = ["dep:nxrs-gnss"]
gnss-pps = ["nxrs-gnss?/pps"]
battery = ["dep:nxrs-battery"]
# Diagnostics follow selected capabilities; weak edges never acquire another HAL.
probe = ["nxrs-imu?/probe", "nxrs-gnss?/probe"]

[dependencies]
cfg-if = "=1.0.5"
nxrs-acquisition = { path = "../shared/acquisition", optional = true }
nxrs-battery = { path = "../hal/battery", optional = true }
nxrs-gnss = { path = "../hal/gnss", optional = true }
nxrs-imu = { path = "../hal/imu", optional = true }
nxrs-messaging = { path = "../shared/messaging", optional = true, default-features = false }

[target.'cfg(target_os = "nuttx")'.dependencies]
embedded-hal = { version = "=1.0.0", optional = true }
axp2101 = { package = "nxrs-axp2101", path = "../driver/axp2101", optional = true }
bmi270 = { package = "nxrs-bmi270", path = "../driver/bmi270", optional = true }
nxrs-i2c = { path = "../driver/i2c", optional = true }
lsm6dso = { package = "nxrs-lsm6dso", path = "../driver/lsm6dso", optional = true }
nxrs-peripheral = { path = "../driver/peripheral", optional = true }
nxrs-spi = { path = "../driver/spi", optional = true }
ubx = { package = "nxrs-ubx-driver", path = "../driver/ubx", optional = true }

[build-dependencies]
nxrs-build-support = { path = "../tools/build-support" }
