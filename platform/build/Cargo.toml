[package]
name = "nxrs-build"
version.workspace = true
edition.workspace = true
publish = false

[[bin]]
name = "nxrs-build"
path = "src/main.rs"

[dependencies]
serde_json = "1.0"
toml = { version = "0.9", default-features = false, features = ["parse", "serde", "std"] }
sha2 = "0.10"
regex = "1"
shlex = "1.3"
tar = { version = "0.4", default-features = false }
