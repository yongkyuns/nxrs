# Physical Freenove camera qualification; no radio credentials or networking.
board = "esp32s3-devkit:nsh"
target = "xtensa-esp32s3-nuttx"
crossdev = "xtensa-esp32s3-elf-"
machine = "Tensilica Xtensa Processor"
image = "nuttx.bin"
requires-qemu = false
hal = { camera = "nuttx" }

[kconfig]
enable = [
  "RAW_BINARY", "ESP32S3_SPIRAM", "ESP32S3_SPIRAM_MODE_OCT",
  "ESP32S3_SPIRAM_TYPE_ESPPSRAM64", "ARCH_CHIP_ESP32S3WROOM2N16R8V",
  "ESP32S3_USBSERIAL", "OTHER_SERIAL_CONSOLE", "ESP32S3_DEFAULT_CPU_FREQ_240",
  "SERIAL_TERMIOS", "ESP32S3_CAM", "VIDEO_STREAM", "VIDEO_OV3660",
  "ESP32S3_I2C0", "ESP32S3_DEVKIT_FREENOVE_CAMERA", "PTHREAD_MUTEX_TYPES",
  "DEBUG_FEATURES", "DEBUG_ASSERTIONS", "DEBUG_SYMBOLS", "DEBUG_LINK_MAP",
  "SYSLOG_CONSOLE", "STACK_COLORATION",
  "SCHED_LPWORK", "ESP32S3_SPIRAM_USER_HEAP",
]
disable = [
  "ESP32S3_QEMU_IMAGE", "SMP", "DISABLE_PTHREAD", "UART0_SERIAL_CONSOLE",
  "ARCH_LEDS", "ESPRESSIF_WIFI", "ESPRESSIF_BLE", "NETINIT_DHCPC",
  "SYSLOG_DEFAULT", "ESP32S3_CAMERA", "ESP32S3_SPIRAM_COMMON_HEAP",
]
set = [
  "BOARD_INITTHREAD_STACKSIZE=8192", "PTHREAD_STACK_DEFAULT=8192",
  "ARCH_INTERRUPTSTACK=4096", "TLS_TASK_NELEM=1",
  "SCHED_LPWORKSTACKSIZE=2048",
  "ESP32S3_CAM_XCLK_FREQUENCY=16000000",
  "ESP32S3_I2C0_SDAPIN=4", "ESP32S3_I2C0_SCLPIN=5",
  "ESP32S3_CAM_XCLK_PIN=15", "ESP32S3_CAM_PCLK_PIN=13",
  "ESP32S3_CAM_VSYNC_PIN=6", "ESP32S3_CAM_HREF_PIN=7",
  "ESP32S3_CAM_D0_PIN=11", "ESP32S3_CAM_D1_PIN=9",
  "ESP32S3_CAM_D2_PIN=8", "ESP32S3_CAM_D3_PIN=10",
  "ESP32S3_CAM_D4_PIN=12", "ESP32S3_CAM_D5_PIN=18",
  "ESP32S3_CAM_D6_PIN=17", "ESP32S3_CAM_D7_PIN=16",
]
require = [
  "CONFIG_ESP32S3_CAM=y", "CONFIG_ESP32S3_SPIRAM=y",
  "CONFIG_VIDEO_OV3660=y", "CONFIG_VIDEO_STREAM=y",
  "CONFIG_ESP32S3_DEVKIT_FREENOVE_CAMERA=y", "CONFIG_ESP32S3_I2C0=y",
  "CONFIG_ESP32S3_CAM_XCLK_FREQUENCY=16000000",
  "CONFIG_ESP32S3_SPIRAM_USER_HEAP=y", "CONFIG_MM_KERNEL_HEAP=y",
  "CONFIG_SCHED_LPWORK=y", "CONFIG_SCHED_LPWORKSTACKSIZE=2048",
  "CONFIG_ESP32S3_USBSERIAL=y", "CONFIG_TLS_TASK_NELEM=1",
  "CONFIG_SYSLOG_CONSOLE=y",
]
forbid-regex = "^CONFIG_(ESP32S3_QEMU_IMAGE|SMP|ESPRESSIF_WIFI|ESPRESSIF_BLE)=y$"
