# Native Dropbear, one password-authenticated interactive session.
CONFIG_ESP32S3_MAINTENANCE_VOLUME=y
CONFIG_SCHED_WAITPID=y
CONFIG_SCHED_HAVE_PARENT=y
CONFIG_SCHED_CHILD_STATUS=y
CONFIG_NSH_LIBRARY=y
CONFIG_NSH_DISABLEBG=y
CONFIG_NSH_BUILTIN_APPS=y
CONFIG_BUILTIN=y
CONFIG_PSEUDOTERM=y
CONFIG_PIPES=y
CONFIG_ARCH_SETJMP_H=y
CONFIG_TTY_SIGINT=y
CONFIG_TTY_SIGINT_CHAR=0x03
CONFIG_LIBC_NETDB=y
CONFIG_LIBC_GAISTRERROR=y
CONFIG_CRYPTO=y
CONFIG_CRYPTO_SW_AES=y
CONFIG_ALLOW_BSD_COMPONENTS=y
CONFIG_CRYPTO_CRYPTODEV=y
CONFIG_CRYPTO_CRYPTODEV_SOFTWARE_CRYPTO=y
CONFIG_NETUTILS_CODECS=y
CONFIG_CODECS_BASE64=y
CONFIG_FSUTILS_PASSWD=y
CONFIG_FSUTILS_PASSWD_READONLY=y
CONFIG_FSUTILS_PASSWD_PATH="/mnt/ssh/passwd"
CONFIG_NETUTILS_DROPBEAR=y
CONFIG_NETUTILS_DROPBEAR_SYSLOG=y
CONFIG_NETUTILS_DROPBEAR_HOSTKEY_PATH="/mnt/ssh/dropbear_ecdsa_host_key"
# Override with the board's reserved IPv4 for LAN use.
CONFIG_NETUTILS_DROPBEAR_BIND_ADDRESS="127.0.0.1"
CONFIG_NETUTILS_DROPBEAR_PORT=2222
# Keep the SSH transport and shell below the camera TLS worker.
CONFIG_NETUTILS_DROPBEAR_PRIORITY=85
CONFIG_NETUTILS_DROPBEAR_SHELL_PRIORITY=85
# Let a blocked camera TLS worker boost the owner of the user-heap mutex.
CONFIG_PRIORITY_INHERITANCE=y
CONFIG_NETUTILS_DROPBEAR_LISTEN_RETRIES=2
CONFIG_NETUTILS_DROPBEAR_LISTEN_RETRY_MAX=2
CONFIG_ESP32S3_RNG=y
CONFIG_DEV_RANDOM=y
CONFIG_DEV_URANDOM=y
CONFIG_DEV_URANDOM_ARCH=y
# CONFIG_NSH_PIPELINE is not set
# CONFIG_NETUTILS_DROPBEAR_SCP is not set
# CONFIG_NETUTILS_DROPBEAR_GENERATE_HOSTKEY is not set
