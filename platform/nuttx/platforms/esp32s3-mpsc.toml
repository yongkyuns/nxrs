# Single-core internal-memory MPSC qualification.
board = "esp32s3-devkit:nsh"
target = "xtensa-esp32s3-nuttx"
crossdev = "xtensa-esp32s3-elf-"
machine = "Tensilica Xtensa Processor"
image = "nuttx.merged.bin"
requires-qemu = false
hal = {}
iram-layout = "platform/nuttx/linker/esp32s3-mpsc.ld"

[build]
trace-only-backtrace = true

[init]
args = []

[kconfig]
enable = [
  "ESP32S3_QEMU_IMAGE",
  "ESP32S3_USBSERIAL",
  "ESP32S3_DEFAULT_CPU_FREQ_240",
  "OTHER_SERIAL_CONSOLE",
  "ARCH_CHIP_ESP32S3WROOM2N16R8V",
  "DEBUG_FEATURES",
  "DEBUG_ASSERTIONS",
  "DEBUG_SYMBOLS",
  "DEBUG_LINK_MAP",
  "STACK_COLORATION",
  "USERLED",
  "USERLED_LOWER",
  "USERLED_LOWER_READSTATE",
  "ESP32S3_DEVKIT_FREENOVE_USERLED",
]
disable = [
  "NET", "ESP32S3_SPIRAM", "SYSTEM_NSH", "NSH_LIBRARY", "PRIORITY_INHERITANCE", "SCHED_CRITMONITOR", "SCHED_INSTRUMENTATION",
  "SMP",
  "DISABLE_PTHREAD",
  "DISABLE_MQUEUE",
  "NSH_NETINIT",
  "NETUTILS_NETINIT",
  "NET_USRSOCK",
  "NET_ETHERNET",
  "ESP32S3_WIFI",
  "ESP32S3_BLE",
  "UART0_SERIAL_CONSOLE",
  "ARCH_LEDS",
]
set = ["PTHREAD_STACK_DEFAULT=4096", "ARCH_INTERRUPTSTACK=4096", "MQ_MAXMSGSIZE=248", "USEC_PER_TICK=10000"]
require = [
  "CONFIG_ARCH_XTENSA=y",
  "CONFIG_ARCH_CHIP_ESP32S3=y",
  "CONFIG_ESP32S3_QEMU_IMAGE=y",
  "CONFIG_ESPRESSIF_SIMPLE_BOOT=y",
  "CONFIG_ESP32S3_USBSERIAL=y",
  "CONFIG_ESP32S3_DEFAULT_CPU_FREQ_MHZ=240",
  "CONFIG_OTHER_SERIAL_CONSOLE=y",
  "CONFIG_PTHREAD_STACK_DEFAULT=4096",
  "CONFIG_ARCH_INTERRUPTSTACK=4096",
  "CONFIG_MQ_MAXMSGSIZE=248",
  "CONFIG_USERLED=y",
  "CONFIG_USERLED_LOWER=y",
  "CONFIG_USERLED_LOWER_READSTATE=y",
  "CONFIG_ESP32S3_DEVKIT_FREENOVE_USERLED=y",
]
forbid-regex = "^CONFIG_(NET|SMP|DISABLE_PTHREAD|DISABLE_MQUEUE|NET_USRSOCK|NET_ETHERNET|NSH_NETINIT|NETUTILS_NETINIT|ESP32S3_WIFI|ESP32S3_BLE|UART0_SERIAL_CONSOLE|ARCH_LEDS)=y$"
