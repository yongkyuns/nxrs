# Simultaneous station Wi-Fi and native GATT qualification. No boot credentials.
board = "esp32s3-devkit:nsh"
target = "xtensa-esp32s3-nuttx"
crossdev = "xtensa-esp32s3-elf-"
machine = "Tensilica Xtensa Processor"
image = "nuttx.bin"
requires-qemu = false
hal = { wifi = "nuttx", ble = "nuttx" }

[kconfig]
enable = [
  "ESP32S3_SPIRAM", "ESP32S3_SPIRAM_MODE_OCT",
  "ESP32S3_SPIRAM_TYPE_ESPPSRAM64", "ARCH_CHIP_ESP32S3WROOM2N16R8V",
  "ESP32S3_USBSERIAL", "OTHER_SERIAL_CONSOLE", "ESP32S3_DEFAULT_CPU_FREQ_240",
  "SERIAL_TERMIOS",
  "NET", "NET_IPv4", "NET_UDP", "NET_TCP", "NET_TCPPROTO_OPTIONS",
  # Counter-only diagnostics; no packet dumps or additional traffic.
  "NET_STATISTICS", "NETDEV_STATISTICS",
  "ESPRESSIF_WIFI", "ESPRESSIF_WIFI_STATION",
  "DRIVERS_WIRELESS", "DRIVERS_IEEE80211",
  "NETDEV_WIRELESS_IOCTL", "NETDEV_WIRELESS_HANDLER",
  "NETDEV_LATEINIT", "TIMER",
  "NSH_NETINIT", "NETUTILS_NETINIT", "NETUTILS_NETLIB",
  # The pinned DHCP client requires the DNS server-count configuration even
  # when this IPv4 echo fixture does not install DNS or resolve names.
  # DHCP asks for broadcast replies; IPv4 input otherwise drops them.
  "NETUTILS_DHCPC", "NET_BROADCAST", "NET_SOCKOPTS", "NETDB_DNSCLIENT",
  "SCHED_LPWORK", "PTHREAD_MUTEX_TYPES",
  "DEBUG_FEATURES", "DEBUG_ASSERTIONS", "DEBUG_SYMBOLS", "DEBUG_LINK_MAP",
  "DEBUG_NET", "DEBUG_NET_ERROR",
  "SYSLOG_CONSOLE",
  "STACK_COLORATION",
  "ALLOW_BSD_COMPONENTS", "NET_BLUETOOTH", "DRIVERS_BLUETOOTH",
  "WIRELESS", "WIRELESS_BLUETOOTH", "WIRELESS_BLUETOOTH_HOST",
  "ESPRESSIF_BLE", "BOARD_LATE_INITIALIZE",
  "ESPRESSIF_WIFI_BT_COEXIST", "ESP_COEX_SW_COEXIST_ENABLE",
]
disable = [
  # Physical hardware uses the unpadded simple-boot image, not a QEMU disk.
  "ESP32S3_QEMU_IMAGE",
  "SMP", "DISABLE_PTHREAD", "UART0_SERIAL_CONSOLE", "ARCH_LEDS",
  "NETINIT_DHCPC", "WIRELESS_WAPI",
  "SYSLOG_DEFAULT",
  "DEBUG_WIRELESS_INFO", "DEBUG_NET_INFO",
]
set = [
  # Wi-Fi/BLE initialization exceeds the default 2 KiB startup stack. This
  # temporary board-init task exits before the interactive radio fixture.
  "BOARD_INITTHREAD_STACKSIZE=8192",
  "PTHREAD_STACK_DEFAULT=16384", "ARCH_INTERRUPTSTACK=4096",
  "SCHED_LPWORKSTACKSIZE=4096",
  "TLS_TASK_NELEM=1",
  "NETINIT_IPADDR=0x00000000", "NETINIT_NETMASK=0x00000000",
  "NETINIT_DRIPADDR=0x00000000", "ESPRESSIF_WIFI_SCAN_RESULT_SIZE=4096",
  "ESPRESSIF_WIFI_CONNECT_TIMEOUT=10",
  "NETUTILS_DHCPC_RECV_TIMEOUT_MS=1000", "NETUTILS_DHCPC_RETRIES=3",
  "NETUTILS_DHCPC_BOOTP_FLAGS=0x8000",
  # Allow bounded cold Wi-Fi peer resolution instead of the 20 ms default.
  # Keep retries bounded; do not retry/drop application packets in the fixture.
  "ARP_SEND_DELAYMSEC=200", "ARP_SEND_MAXTRIES=5",
  # Stock Wi-Fi packet sizing: its 32 RX + 1 TX quota exceeds NSH's 24 IOBs.
  "IOB_NBUFFERS=100", "IOB_BUFSIZE=400", "NET_ETH_PKTSIZE=1514",
  "BLUETOOTH_TXCMD_STACKSIZE=8192", "BLUETOOTH_TXCONN_STACKSIZE=8192",
  "BLUETOOTH_MAXSCANDATA=64", "BLUETOOTH_MAXSCANRESULT=32",
  "IOB_NCHAINS=32", "PREALLOC_MQ_MSGS=32",
]
require = [
  "CONFIG_BOARD_INITTHREAD_STACKSIZE=8192",
  "CONFIG_ESPRESSIF_WIFI=y", "CONFIG_ESPRESSIF_WIFI_STATION=y",
  "CONFIG_NET=y", "CONFIG_NET_IPv4=y", "CONFIG_NET_UDP=y",
  "CONFIG_NET_TCP=y", "CONFIG_NET_TCPPROTO_OPTIONS=y",
  "CONFIG_NET_STATISTICS=y", "CONFIG_NETDEV_STATISTICS=y",
  "CONFIG_NETDEV_IOCTL=y", "CONFIG_NETDEV_WIRELESS_IOCTL=y",
  "CONFIG_NETDEV_WIRELESS_HANDLER=y",
  "CONFIG_DRIVERS_IEEE80211=y",
  "CONFIG_NETDEV_LATEINIT=y", "CONFIG_TIMER=y",
  "CONFIG_ESP32S3_USBSERIAL=y", "CONFIG_NSH_NETINIT=y",
  "CONFIG_SERIAL_TERMIOS=y",
  "CONFIG_ESPRESSIF_WIFI_SCAN_RESULT_SIZE=4096",
  "CONFIG_SCHED_LPWORK=y", "CONFIG_SCHED_LPWORKSTACKSIZE=4096",
  "CONFIG_TLS_TASK_NELEM=1",
  "CONFIG_PTHREAD_MUTEX_TYPES=y",
  "CONFIG_SYSLOG_CONSOLE=y",
  "CONFIG_IOB_NBUFFERS=100", "CONFIG_IOB_BUFSIZE=400",
  "CONFIG_NET_ETH_PKTSIZE=1514",
  "CONFIG_NETUTILS_DHCPC=y", "CONFIG_NET_BROADCAST=y",
  "CONFIG_NET_BINDTODEVICE=y", "CONFIG_NET_SOCKOPTS=y",
  "CONFIG_NETDB_DNSCLIENT=y",
  "CONFIG_NETUTILS_DHCPC_RECV_TIMEOUT_MS=1000", "CONFIG_NETUTILS_DHCPC_RETRIES=3",
  "CONFIG_ESPRESSIF_WIFI_CONNECT_TIMEOUT=10",
  "CONFIG_ARP_SEND_DELAYMSEC=200", "CONFIG_ARP_SEND_MAXTRIES=5",
  "CONFIG_DEBUG_NET_ERROR=y",
  "CONFIG_WIRELESS_BLUETOOTH_HOST=y", "CONFIG_NET_BLUETOOTH=y",
  "CONFIG_DRIVERS_BLUETOOTH=y", "CONFIG_BLUETOOTH_MAX_CONN=1",
  "CONFIG_BLUETOOTH_TXCMD_STACKSIZE=8192", "CONFIG_BLUETOOTH_TXCONN_STACKSIZE=8192",
  "CONFIG_PREALLOC_MQ_MSGS=32", "CONFIG_ESPRESSIF_BLE=y",
  "CONFIG_ESPRESSIF_WIFI_BT_COEXIST=y", "CONFIG_ESP_COEX_SW_COEXIST_ENABLE=y",
]
forbid-regex = "^CONFIG_(ESP32S3_QEMU_IMAGE|WIRELESS_WAPI|NETINIT_DHCPC|SMP|DEBUG_WIRELESS_INFO|DEBUG_NET_INFO)=y$"
