# CoreS3 K128 + Module GNSS M135, software bring-up; physical qualification pending.
board = "esp32s3-m5-cores3:nsh"
target = "xtensa-esp32s3-nuttx"
crossdev = "xtensa-esp32s3-elf-"
machine = "Tensilica Xtensa Processor"
image = "nuttx.bin"
requires-qemu = false
hal = { gnss = "nuttx", imu = "nuttx" }

[build]
size-optimized = true

[gnss]
device = "/dev/ttyS1"
baud = 38400

[imu]
driver = "bmi270"
device = "/dev/i2c0"
address = 0x68
frequency = 400000

[kconfig]
enable = [
  "RAW_BINARY", "ARCH_CHIP_ESP32S3CUSTOM", "ESP32S3CUSTOM_FLASH_16M", "ESP32S3_PSRAM_8M",
  "ESP32S3_SPIRAM", "ESP32S3_SPIRAM_MODE_OCT", "ESP32S3_SPIRAM_TYPE_ESPPSRAM64",
  "ESP32S3_SPIRAM_USER_HEAP", "ESP32S3_USBSERIAL", "OTHER_SERIAL_CONSOLE",
  "ESP32S3_DEFAULT_CPU_FREQ_240", "SERIAL_TERMIOS", "ESP32S3_UART1",
  "ESP32S3_I2C0", "I2C_DRIVER", "BOARD_LATE_INITIALIZE", "PTHREAD_MUTEX_TYPES",
  "DEBUG_FEATURES", "DEBUG_ASSERTIONS", "DEBUG_SYMBOLS", "DEBUG_LINK_MAP",
  "SYSLOG_CONSOLE", "STACK_COLORATION",
]
disable = [
  "SMP", "DISABLE_PTHREAD", "UART0_SERIAL_CONSOLE", "ARCH_LEDS", "NSH_ARCHINIT",
  "ESP32S3_QEMU_IMAGE", "ESPRESSIF_WIFI", "ESPRESSIF_BLE", "I2C_POLLED",
  "SENSORS_BMI270", "ESP32S3_SPIRAM_COMMON_HEAP", "SYSLOG_DEFAULT",
]
set = [
  "PTHREAD_STACK_DEFAULT=16384", "ARCH_INTERRUPTSTACK=4096", "TLS_TASK_NELEM=1",
  "ESP32S3_UART1_TXPIN=17", "ESP32S3_UART1_RXPIN=18", "UART1_BAUD=38400",
  "UART1_RXBUFSIZE=2048", "UART1_TXBUFSIZE=256",
  "ESP32S3_I2C0_SDAPIN=12", "ESP32S3_I2C0_SCLPIN=11",
  "ESP32S3_I2CTIMEOSEC=0", "ESP32S3_I2CTIMEOMS=50",
]
require = [
  "CONFIG_ARCH_BOARD_ESP32S3_M5_CORES3=y", "CONFIG_ARCH_BOARD_COMMON=y",
  "CONFIG_ESP32S3_FLASH_16M=y", "CONFIG_ESP32S3_SPIRAM_SIZE=8388608",
  "CONFIG_ESP32S3_USBSERIAL=y", "CONFIG_SERIAL_TERMIOS=y", "CONFIG_ESP32S3_UART1=y",
  "CONFIG_ESP32S3_UART1_TXPIN=17", "CONFIG_ESP32S3_UART1_RXPIN=18",
  "CONFIG_ESP32S3_I2C0=y", "CONFIG_I2C_DRIVER=y",
  "CONFIG_ESP32S3_I2C0_SDAPIN=12", "CONFIG_ESP32S3_I2C0_SCLPIN=11",
  "CONFIG_ESP32S3_I2CTIMEOMS=50", "CONFIG_BOARD_LATE_INITIALIZE=y",
]
forbid-regex = "^CONFIG_(SMP|I2C_POLLED|SENSORS_BMI270|ESPRESSIF_WIFI|ESPRESSIF_BLE)=y$"
