# Actual SDK TLS over native IPv4/TCP loopback; host entropy/CA/time fixtures.
# This is not a production radio, entropy, key-custody or deployment profile.
extends = "esp32s3-identity-sdk"

[identity-crypto]
sdk = "mbedtls-4.1.1"
scope = "qualification-only"
trust-fixture = "fresh-host-utc"

[kconfig]
enable = ["ESP32S3_QEMU_IMAGE", "DEBUG_FEATURES", "DEBUG_ASSERTIONS", "DEBUG_SYMBOLS", "DEBUG_LINK_MAP", "STACK_COLORATION",
          "NET", "NET_IPv4", "NET_TCP", "NET_LOOPBACK", "NET_SOCKOPTS", "NETDEV_LATEINIT", "NET_READAHEAD",
          "NET_TCP_WRITE_BUFFERS", "NET_TCPPROTO_OPTIONS", "SCHED_HPWORK", "SCHED_LPWORK"]
disable = ["SMP", "DISABLE_PTHREAD", "NSH_NETINIT", "NETUTILS_NETINIT", "NET_USRSOCK", "NET_ETHERNET", "NET_UDP", "NET_IPv6",
           "ESPRESSIF_WIFI", "ESPRESSIF_BLE", "ESPRESSIF_ADC", "ESP32S3_SPIRAM", "CRYPTO_MBEDTLS"]
set = ["PTHREAD_STACK_DEFAULT=16384", "ARCH_INTERRUPTSTACK=4096", "RR_INTERVAL=10", "NET_RECV_BUFSIZE=8192", "NET_SEND_BUFSIZE=8192",
       "NET_TCP_PREALLOC_CONNS=16", "NET_TCP_ALLOC_CONNS=0", "NET_TCP_NWRBCHAINS=16", "NET_TCP_ALLOC_WRBCHAINS=0"]
require = ["CONFIG_ARCH_XTENSA=y", "CONFIG_ARCH_CHIP_ESP32S3=y", "CONFIG_ESP32S3_QEMU_IMAGE=y", "CONFIG_ESPRESSIF_SIMPLE_BOOT=y",
           "CONFIG_NET=y", "CONFIG_NET_IPv4=y", "CONFIG_NET_TCP=y", "CONFIG_NET_LOOPBACK=y", "CONFIG_NET_TCPPROTO_OPTIONS=y",
           "CONFIG_NET_TCP_WRITE_BUFFERS=y", "CONFIG_NET_RECV_BUFSIZE=8192", "CONFIG_NET_SEND_BUFSIZE=8192",
           "CONFIG_PTHREAD_STACK_DEFAULT=16384", "CONFIG_ARCH_INTERRUPTSTACK=4096", "CONFIG_RR_INTERVAL=10"]
forbid-regex = "^CONFIG_(SMP|DISABLE_PTHREAD|NET_USRSOCK|NET_ETHERNET|NSH_NETINIT|NETUTILS_NETINIT|NET_UDP|NET_IPv6|ESPRESSIF_WIFI|ESPRESSIF_BLE|ESPRESSIF_ADC|ESP32S3_SPIRAM|CRYPTO_MBEDTLS)=y$"
