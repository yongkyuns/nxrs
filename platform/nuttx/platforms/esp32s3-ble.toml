# Scan-stage qualification only. GATT operations are explicitly unsupported.
board = "esp32s3-devkit:nsh"
target = "xtensa-esp32s3-nuttx"
crossdev = "xtensa-esp32s3-elf-"
machine = "Tensilica Xtensa Processor"
image = "nuttx.merged.bin"
requires-qemu = false
hal-features = ["nxrs-ble/nuttx"]

[kconfig]
enable = [
  "ESP32S3_QEMU_IMAGE", "ESP32S3_SPIRAM", "ESP32S3_SPIRAM_MODE_OCT",
  "ESP32S3_SPIRAM_TYPE_ESPPSRAM64", "ARCH_CHIP_ESP32S3WROOM2N16R8V",
  "ESP32S3_USBSERIAL", "OTHER_SERIAL_CONSOLE", "ESP32S3_DEFAULT_CPU_FREQ_240",
  "ALLOW_BSD_COMPONENTS", "NET", "NET_BLUETOOTH", "NETDEV_LATEINIT",
  "NETDEV_IOCTL", "DRIVERS_WIRELESS", "DRIVERS_BLUETOOTH",
  "WIRELESS", "WIRELESS_BLUETOOTH", "WIRELESS_BLUETOOTH_HOST", "ESPRESSIF_BLE",
  "NSH_ARCHINIT", "TIMER", "PTHREAD_MUTEX_TYPES", "SYSLOG_CONSOLE", "STACK_COLORATION",
  "DEBUG_FEATURES", "DEBUG_ASSERTIONS", "DEBUG_SYMBOLS", "DEBUG_LINK_MAP",
]
disable = [
  "SMP", "DISABLE_PTHREAD", "UART0_SERIAL_CONSOLE", "ARCH_LEDS",
  "ESPRESSIF_WIFI", "ESP32S3_NIMBLE_HCI", "NIMBLE", "SYSLOG_DEFAULT",
  "DEBUG_WIRELESS_INFO", "DEBUG_NET_INFO",
]
set = [
  "PTHREAD_STACK_DEFAULT=8192", "ARCH_INTERRUPTSTACK=4096",
  "SCHED_HPWORKSTACKSIZE=4096", "SCHED_LPWORKSTACKSIZE=4096", "TLS_TASK_NELEM=1",
  "BLUETOOTH_TXCMD_STACKSIZE=8192", "BLUETOOTH_TXCONN_STACKSIZE=8192",
  "BLUETOOTH_MAXSCANDATA=64", "BLUETOOTH_MAXSCANRESULT=32",
  "IOB_NBUFFERS=100", "IOB_BUFSIZE=400", "IOB_NCHAINS=32",
]
require = [
  "CONFIG_ESP32S3_USBSERIAL=y", "CONFIG_OTHER_SERIAL_CONSOLE=y",
  "CONFIG_ESPRESSIF_BLE=y", "CONFIG_NET_BLUETOOTH=y", "CONFIG_NETDEV_IOCTL=y",
  "CONFIG_WIRELESS_BLUETOOTH_HOST=y", "CONFIG_DRIVERS_BLUETOOTH=y",
  "CONFIG_NSH_ARCHINIT=y", "CONFIG_PTHREAD_MUTEX_TYPES=y",
  "CONFIG_TIMER=y",
  "CONFIG_BLUETOOTH_MAXSCANDATA=64", "CONFIG_BLUETOOTH_MAXSCANRESULT=32",
  "CONFIG_TLS_TASK_NELEM=1",
]
forbid-regex = "^CONFIG_(ESPRESSIF_WIFI|ESP32S3_NIMBLE_HCI|NIMBLE|SMP|DEBUG_WIRELESS_INFO|DEBUG_NET_INFO)=y$"
