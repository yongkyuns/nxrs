# Pico 2 W Wi-Fi profile. Radio firmware is resolved and hash-validated by
# the generic NuttX builder from this declarative selection.
radio-firmware = "cyw43439"
board = "raspberrypi-pico-2:usbnsh"
target = "thumbv8m.main-nuttx-eabi"
crossdev = "arm-none-eabi-"
machine = "ARM"
image = "nuttx.bin"
requires-qemu = false
hal-features = ["nxrs-wifi/nuttx"]

[kconfig]
enable = [
  # USB CDC uses the serial upper half's always-supported echo/raw controls;
  # SERIAL_TERMIOS requires an enabled physical UART on this pinned board.
  "RAW_BINARY", "PTHREAD_MUTEX_TYPES", "SCHED_LPWORK",
  # Development-only USB bootloader entry, independent of NSH/radio workers.
  "CDCACM_1200BPS_BOOTLOADER",
  "DEBUG_FEATURES", "DEBUG_ASSERTIONS", "STACK_COLORATION",
  # USB syslog does not require the board's disabled physical UART console.
  "SYSLOG_CDCACM", "DEBUG_WIRELESS", "DEBUG_WIRELESS_ERROR",
  "NET", "NET_IPv4", "NET_UDP",
  "DRIVERS_WIRELESS", "DRIVERS_IEEE80211",
  "IEEE80211_BROADCOM_FULLMAC_GSPI", "IEEE80211_INFINEON_CYW43439",
  "RP23XX_INFINEON_CYW43439",
  "NETDEV_WIRELESS_IOCTL", "NETDEV_WIRELESS_HANDLER", "NETDEV_LATEINIT",
  "NSH_NETINIT", "NETUTILS_NETINIT", "NETUTILS_NETLIB",
  # The pinned DHCP client header needs the DNS server-count configuration.
  "NETUTILS_DHCPC", "NET_SOCKOPTS", "NET_BINDTODEVICE", "NETDB_DNSCLIENT",
]
disable = [
  "RP23XX_UF2_BINARY", "ARCH_FPU", "SMP", "DISABLE_PTHREAD",
  "ARCH_LEDS", "USERLED", "NETINIT_DHCPC", "WIRELESS_WAPI",
  "DEBUG_WIRELESS_INFO", "DEBUG_NET_INFO",
  "DEV_CONSOLE", "SYSLOG_CONSOLE", "SYSLOG_DEFAULT",
]
set = [
  "PTHREAD_STACK_DEFAULT=8192", "SCHED_LPWORKSTACKSIZE=8192",
  "INIT_STACKSIZE=8192", "DEFAULT_TASK_STACKSIZE=8192",
  "NETUTILS_DHCPC_RECV_TIMEOUT_MS=1000", "NETUTILS_DHCPC_RETRIES=3",
  "NETUTILS_DHCPC_BOOTP_FLAGS=0x8000",
  # The bcmf receive pool must fit within the NuttX IOB quota.
  "IOB_NBUFFERS=100", "IOB_BUFSIZE=400", "NET_ETH_PKTSIZE=1514",
]
require = [
  "CONFIG_ARCH_ARM=y",
  "CONFIG_ARCH_BOARD_RASPBERRYPI_PICO_2=y",
  "CONFIG_ARCH_CHIP_RP23XX=y",
  "CONFIG_RAW_BINARY=y",
  "CONFIG_BOARD_USBDEV_BOOTLOADER=y", "CONFIG_CDCACM_1200BPS_BOOTLOADER=y",
  "CONFIG_NET=y", "CONFIG_NET_IPv4=y", "CONFIG_NET_UDP=y",
  "CONFIG_DRIVERS_IEEE80211=y",
  "CONFIG_IEEE80211_BROADCOM_FULLMAC_GSPI=y",
  "CONFIG_IEEE80211_INFINEON_CYW43439=y",
  "CONFIG_RP23XX_INFINEON_CYW43439=y",
  "CONFIG_NETDEV_WIRELESS_IOCTL=y", "CONFIG_NETDEV_LATEINIT=y",
  "CONFIG_NSH_NETINIT=y", "CONFIG_NETUTILS_NETINIT=y",
  "CONFIG_NETUTILS_NETLIB=y", "CONFIG_NETUTILS_DHCPC=y",
  "CONFIG_NET_BINDTODEVICE=y", "CONFIG_NET_SOCKOPTS=y",
  "CONFIG_NETDB_DNSCLIENT=y",
  "CONFIG_SYSLOG_CDCACM=y",
  "CONFIG_DEBUG_WIRELESS_ERROR=y",
  "CONFIG_SCHED_LPWORK=y",
  "CONFIG_PTHREAD_STACK_DEFAULT=8192",
  "CONFIG_SCHED_LPWORKSTACKSIZE=8192",
  "CONFIG_NETUTILS_DHCPC_RECV_TIMEOUT_MS=1000",
  "CONFIG_NETUTILS_DHCPC_RETRIES=3",
  "CONFIG_IOB_NBUFFERS=100", "CONFIG_IOB_BUFSIZE=400",
  "CONFIG_NET_ETH_PKTSIZE=1514",
]
forbid-regex = "^CONFIG_(ARCH_FPU|SMP|DISABLE_PTHREAD|ARCH_LEDS|USERLED|NETINIT_DHCPC|WIRELESS_WAPI|DEBUG_WIRELESS_INFO|DEBUG_NET_INFO)=y$"
