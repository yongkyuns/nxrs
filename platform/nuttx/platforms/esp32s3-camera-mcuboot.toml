# ESP32-S3 application-signature build qualification. No ROM/counter/hardware qualification.
# Kconfig replaces the parent table and preserves its physical camera wiring.
extends = "esp32s3-camera"
image = "nuttx.hex"

[kconfig]
enable = [
  "ESP32S3_FLASH_MODE_DIO", "ESP32S3_FLASH_FREQ_40M", "ESPRESSIF_FLASH_MODE_DIO", "ESPRESSIF_FLASH_FREQ_40M",
  "INTELHEX_BINARY", "ESP32S3_APP_FORMAT_MCUBOOT", "ESP32S3_ESPTOOL_TARGET_SECONDARY",
  "ESP32S3_SPIRAM", "ESP32S3_SPIRAM_MODE_OCT",
  "ESP32S3_SPIRAM_TYPE_ESPPSRAM64", "ARCH_CHIP_ESP32S3WROOM2N16R8V",
  "ESP32S3_USBSERIAL", "OTHER_SERIAL_CONSOLE", "ESP32S3_DEFAULT_CPU_FREQ_240",
  "SERIAL_TERMIOS", "ESP32S3_CAM", "VIDEO_STREAM", "VIDEO_OV3660",
  "ESP32S3_I2C0", "ESP32S3_DEVKIT_FREENOVE_CAMERA", "PTHREAD_MUTEX_TYPES",
  "DEBUG_FEATURES", "DEBUG_ASSERTIONS", "DEBUG_SYMBOLS", "DEBUG_LINK_MAP",
  "SYSLOG_CONSOLE", "STACK_COLORATION",
  "SCHED_LPWORK", "ESP32S3_SPIRAM_USER_HEAP",
]
disable = [
  "ESP32S3_FLASH_MODE_QIO", "ESP32S3_FLASH_MODE_QOUT", "ESP32S3_FLASH_MODE_DOUT", "ESP32S3_FLASH_MODE_OCT",
  "ESP32S3_FLASH_FREQ_120M", "ESP32S3_FLASH_FREQ_80M", "ESP32S3_FLASH_FREQ_20M",
  "RAW_BINARY", "ESPRESSIF_SIMPLE_BOOT", "ESP32S3_APP_FORMAT_LEGACY", "ESP32S3_MERGE_BINS",
  "ESP32S3_QEMU_IMAGE", "SMP", "DISABLE_PTHREAD", "UART0_SERIAL_CONSOLE",
  "ARCH_LEDS", "ESPRESSIF_WIFI", "ESPRESSIF_BLE", "NETINIT_DHCPC",
  "SYSLOG_DEFAULT", "ESP32S3_CAMERA", "ESP32S3_SPIRAM_COMMON_HEAP",
]
set = [
  "ESP32S3_OTA_PRIMARY_SLOT_OFFSET=0x20000",
  "ESP32S3_OTA_SECONDARY_SLOT_OFFSET=0x120000",
  "ESP32S3_OTA_SLOT_SIZE=0x100000",
  "ESP32S3_OTA_SCRATCH_OFFSET=0x220000",
  "ESP32S3_OTA_SCRATCH_SIZE=0x40000",
  "ESP32S3_APP_MCUBOOT_HEADER_SIZE=32",
  "ESP32S3_MCUBOOT_VERSION=\"6d3b3d2c38ab20c242e5b9abb04d050086383eb2\"",
  "BOARD_INITTHREAD_STACKSIZE=8192", "PTHREAD_STACK_DEFAULT=8192",
  "ARCH_INTERRUPTSTACK=4096", "TLS_TASK_NELEM=1",
  "SCHED_LPWORKSTACKSIZE=2048",
  "ESP32S3_CAM_XCLK_FREQUENCY=16000000",
  "ESP32S3_I2C0_SDAPIN=4", "ESP32S3_I2C0_SCLPIN=5",
  "ESP32S3_CAM_XCLK_PIN=15", "ESP32S3_CAM_PCLK_PIN=13",
  "ESP32S3_CAM_VSYNC_PIN=6", "ESP32S3_CAM_HREF_PIN=7",
  "ESP32S3_CAM_D0_PIN=11", "ESP32S3_CAM_D1_PIN=9",
  "ESP32S3_CAM_D2_PIN=8", "ESP32S3_CAM_D3_PIN=10",
  "ESP32S3_CAM_D4_PIN=12", "ESP32S3_CAM_D5_PIN=18",
  "ESP32S3_CAM_D6_PIN=17", "ESP32S3_CAM_D7_PIN=16",
]
require = [
  "CONFIG_ESP32S3_FLASH_16M=y", "CONFIG_ESP32S3_FLASH_MODE_DIO=y", "CONFIG_ESP32S3_FLASH_FREQ_40M=y",
  "CONFIG_ESPRESSIF_FLASH_MODE_DIO=y", "CONFIG_ESPRESSIF_FLASH_FREQ_40M=y",
  "CONFIG_INTELHEX_BINARY=y",
  "CONFIG_ESP32S3_APP_FORMAT_MCUBOOT=y",
  "CONFIG_ESPRESSIF_BOOTLOADER_MCUBOOT=y",
  "CONFIG_ESP32S3_ESPTOOL_TARGET_SECONDARY=y",
  "CONFIG_ESP32S3_HAVE_OTA_PARTITION=y",
  "CONFIG_ESP32S3_OTA_PRIMARY_SLOT_OFFSET=0x20000",
  "CONFIG_ESP32S3_OTA_SECONDARY_SLOT_OFFSET=0x120000",
  "CONFIG_ESP32S3_OTA_SLOT_SIZE=0x100000",
  "CONFIG_ESP32S3_OTA_SCRATCH_OFFSET=0x220000",
  "CONFIG_ESP32S3_OTA_SCRATCH_SIZE=0x40000",
  "CONFIG_ESP32S3_APP_MCUBOOT_HEADER_SIZE=32",
  "CONFIG_ESP32S3_MCUBOOT_VERSION=\"6d3b3d2c38ab20c242e5b9abb04d050086383eb2\"",
  "CONFIG_ESP32S3_CAM=y", "CONFIG_ESP32S3_SPIRAM=y",
  "CONFIG_VIDEO_OV3660=y", "CONFIG_VIDEO_STREAM=y",
  "CONFIG_ESP32S3_DEVKIT_FREENOVE_CAMERA=y", "CONFIG_ESP32S3_I2C0=y",
  "CONFIG_ESP32S3_CAM_XCLK_FREQUENCY=16000000",
  "CONFIG_ESP32S3_SPIRAM_USER_HEAP=y", "CONFIG_MM_KERNEL_HEAP=y",
  "CONFIG_SCHED_LPWORK=y", "CONFIG_SCHED_LPWORKSTACKSIZE=2048",
  "CONFIG_ESP32S3_USBSERIAL=y", "CONFIG_TLS_TASK_NELEM=1",
  "CONFIG_SYSLOG_CONSOLE=y",
]
forbid-regex = "^CONFIG_(ESP32S3_QEMU_IMAGE|SMP|ESPRESSIF_WIFI|ESPRESSIF_BLE|RAW_BINARY|ESPRESSIF_SIMPLE_BOOT|ESP32S3_APP_FORMAT_LEGACY|ESP32S3_MERGE_BINS|ESPRESSIF_SECURE_FLASH_ENC_ENABLED)=y$"

[boot]
schema = 1
format = "mcuboot-rsa3072-pss-sha256"
scope = "qualification-only"
chip = "esp32s3"
flash_mode = "dio"
flash_frequency = "40m"
console_uart = 0
bootloader_bytes = 61440

[boot.layout]
flash_bytes = 16777216
primary_offset = 131072
secondary_offset = 1179648
slot_bytes = 1048576
scratch_offset = 2228224
scratch_bytes = 262144
header_bytes = 32
erase_bytes = 4096
write_align = 4
max_align = 8
max_sectors = 512
