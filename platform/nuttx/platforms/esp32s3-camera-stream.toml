# Freenove OV3660 + station Wi-Fi, no Bluetooth or boot-time credentials.
extends = "esp32s3-camera"
hal = { wifi = "nuttx" }

# Kconfig tables replace rather than merge: retain the camera's physical wiring
# and split PSRAM/internal heaps while adding the station networking resources.
[kconfig]
enable = [
  "RAW_BINARY", "ESP32S3_SPIRAM", "ESP32S3_SPIRAM_MODE_OCT",
  "ESP32S3_SPIRAM_TYPE_ESPPSRAM64", "ARCH_CHIP_ESP32S3WROOM2N16R8V",
  "ESP32S3_USBSERIAL", "OTHER_SERIAL_CONSOLE", "ESP32S3_DEFAULT_CPU_FREQ_240",
  "SERIAL_TERMIOS", "ESP32S3_CAM", "VIDEO_STREAM", "VIDEO_OV3660",
  "ESP32S3_I2C0", "ESP32S3_DEVKIT_FREENOVE_CAMERA", "PTHREAD_MUTEX_TYPES",
  "DEBUG_FEATURES", "DEBUG_ASSERTIONS", "DEBUG_SYMBOLS", "DEBUG_LINK_MAP",
  "SYSLOG_CONSOLE", "STACK_COLORATION", "SCHED_LPWORK", "ESP32S3_SPIRAM_USER_HEAP",
  "NET", "NET_IPv4", "NET_UDP", "NET_TCP", "NET_TCPPROTO_OPTIONS", "NET_TCP_WRITE_BUFFERS",
  "ESPRESSIF_WIFI", "ESPRESSIF_WIFI_STATION", "DRIVERS_WIRELESS", "DRIVERS_IEEE80211",
  "NETDEV_WIRELESS_IOCTL", "NETDEV_WIRELESS_HANDLER", "NETDEV_LATEINIT", "TIMER",
  "NSH_NETINIT", "NETUTILS_NETINIT", "NETUTILS_NETLIB", "NETUTILS_DHCPC",
  "NET_BROADCAST", "NET_SOCKOPTS", "NETDB_DNSCLIENT",
  "SCHED_CRITMONITOR",
  "ARCH_PERF_EVENTS", "PERF_OVERFLOW_CORRECTION",
]
disable = [
  "ESP32S3_QEMU_IMAGE", "SMP", "DISABLE_PTHREAD", "UART0_SERIAL_CONSOLE",
  "ARCH_LEDS", "ESPRESSIF_BLE", "NETINIT_DHCPC", "WIRELESS_WAPI",
  "SYSLOG_DEFAULT", "ESP32S3_CAMERA", "ESP32S3_SPIRAM_COMMON_HEAP",
  "DEBUG_WIRELESS_INFO", "DEBUG_NET_INFO",
]
set = [
  "BOARD_INITTHREAD_STACKSIZE=8192", "PTHREAD_STACK_DEFAULT=16384",
  "ARCH_INTERRUPTSTACK=4096", "TLS_TASK_NELEM=1", "SCHED_LPWORKSTACKSIZE=4096",
  "USEC_PER_TICK=1000",
  "ESP32S3_CAM_XCLK_FREQUENCY=16000000",
  "ESP32S3_CAM_DMA_BUFSIZE=614400",
  "ESP32S3_I2C0_SDAPIN=4", "ESP32S3_I2C0_SCLPIN=5",
  "ESP32S3_CAM_XCLK_PIN=15", "ESP32S3_CAM_PCLK_PIN=13",
  "ESP32S3_CAM_VSYNC_PIN=6", "ESP32S3_CAM_HREF_PIN=7",
  "ESP32S3_CAM_D0_PIN=11", "ESP32S3_CAM_D1_PIN=9",
  "ESP32S3_CAM_D2_PIN=8", "ESP32S3_CAM_D3_PIN=10",
  "ESP32S3_CAM_D4_PIN=12", "ESP32S3_CAM_D5_PIN=18",
  "ESP32S3_CAM_D6_PIN=17", "ESP32S3_CAM_D7_PIN=16",
  "NETINIT_IPADDR=0x00000000", "NETINIT_NETMASK=0x00000000", "NETINIT_DRIPADDR=0x00000000",
  "ESPRESSIF_WIFI_SCAN_RESULT_SIZE=4096", "ESPRESSIF_WIFI_CONNECT_TIMEOUT=10",
  "NETUTILS_DHCPC_RECV_TIMEOUT_MS=1000", "NETUTILS_DHCPC_RETRIES=3", "NETUTILS_DHCPC_BOOTP_FLAGS=0x8000",
  "ARP_SEND_DELAYMSEC=200", "ARP_SEND_MAXTRIES=5",
  "IOB_NBUFFERS=100", "IOB_BUFSIZE=400", "NET_ETH_PKTSIZE=1514",
  # Admit a typical VGA JPEG without an 8 KiB mid-frame queue stall. The
  # shared packet/write pools below still bound aggregate network storage.
  "NET_SEND_BUFSIZE=16384", "NET_MAX_SEND_BUFSIZE=16384",
  "NET_TCP_PREALLOC_CONNS=16", "NET_TCP_ALLOC_CONNS=0",
  "NET_TCP_NWRBCHAINS=16", "NET_TCP_ALLOC_WRBCHAINS=0",
  # TCP connection, send and close callbacks share a separate pool. Keeping
  # its default 16 slots starves short-lived HTTP connections before the
  # connection/write-buffer pools fill. Keep this budget fixed as well.
  "NET_PREALLOC_DEVIF_CALLBACKS=64", "NET_ALLOC_DEVIF_CALLBACKS=0",
  "SCHED_CRITMONITOR_MAXTIME_THREAD=0",
]
require = [
  "CONFIG_ESP32S3_CAM=y", "CONFIG_VIDEO_OV3660=y", "CONFIG_VIDEO_STREAM=y",
  "CONFIG_ESP32S3_DEVKIT_FREENOVE_CAMERA=y", "CONFIG_ESP32S3_I2C0=y",
  "CONFIG_ESP32S3_CAM_XCLK_FREQUENCY=16000000",
  "CONFIG_ESP32S3_CAM_DMA_BUFSIZE=614400",
  "CONFIG_ESP32S3_SPIRAM_USER_HEAP=y", "CONFIG_MM_KERNEL_HEAP=y",
  "CONFIG_ESP32S3_USBSERIAL=y", "CONFIG_SERIAL_TERMIOS=y", "CONFIG_TLS_TASK_NELEM=1",
  "CONFIG_ESPRESSIF_WIFI=y", "CONFIG_ESPRESSIF_WIFI_STATION=y",
  "CONFIG_NET_TCP=y", "CONFIG_NET_TCPPROTO_OPTIONS=y", "CONFIG_NET_UDP=y",
  "CONFIG_NET_TCP_WRITE_BUFFERS=y", "CONFIG_NET_SEND_BUFSIZE=16384",
  "CONFIG_NET_MAX_SEND_BUFSIZE=16384",
  "CONFIG_NET_TCP_PREALLOC_CONNS=16", "CONFIG_NET_TCP_ALLOC_CONNS=0",
  "CONFIG_NET_TCP_NWRBCHAINS=16", "CONFIG_NET_TCP_ALLOC_WRBCHAINS=0",
  "CONFIG_NET_PREALLOC_DEVIF_CALLBACKS=64", "CONFIG_NET_ALLOC_DEVIF_CALLBACKS=0",
  "CONFIG_NETDEV_LATEINIT=y", "CONFIG_NETDEV_WIRELESS_HANDLER=y",
  "CONFIG_NETUTILS_DHCPC=y", "CONFIG_NET_BROADCAST=y", "CONFIG_NET_BINDTODEVICE=y",
  "CONFIG_NET_SOCKOPTS=y", "CONFIG_NETDB_DNSCLIENT=y", "CONFIG_TIMER=y",
  "CONFIG_SCHED_LPWORKSTACKSIZE=4096", "CONFIG_IOB_NBUFFERS=100", "CONFIG_IOB_BUFSIZE=400",
  "CONFIG_USEC_PER_TICK=1000",
  "CONFIG_SCHED_CRITMONITOR=y",
  "CONFIG_ARCH_PERF_EVENTS=y", "CONFIG_PERF_OVERFLOW_CORRECTION=y",
]
forbid-regex = "^CONFIG_(ESP32S3_QEMU_IMAGE|SMP|ESPRESSIF_BLE|NETINIT_DHCPC|WIRELESS_WAPI)=y$"
