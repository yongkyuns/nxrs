# Compile qualification only; physical entropy and TLS transport remain gates.
extends = "pico2-mock"
requires-qemu = false

[hal]
tls = "nuttx"

[kconfig]
enable = ["RAW_BINARY", "RP23XX_RNG", "DEV_RANDOM", "DEV_URANDOM", "DEV_URANDOM_ARCH"]
disable = ["RP23XX_UF2_BINARY", "ARCH_FPU", "SMP", "NET", "DISABLE_PTHREAD"]
set = ["PTHREAD_STACK_DEFAULT=65536", "RP23XX_RNG_POLL_TIMEOUT=100000"]
require = [
  "CONFIG_ARCH_ARM=y",
  "CONFIG_ARCH_BOARD_RASPBERRYPI_PICO_2=y",
  "CONFIG_ARCH_CHIP_RP23XX=y",
  "CONFIG_RAM_SIZE=532480",
  "CONFIG_RAW_BINARY=y",
  "CONFIG_PTHREAD_STACK_DEFAULT=65536",
  "CONFIG_RP23XX_RNG=y",
  "CONFIG_DEV_RANDOM=y",
  "CONFIG_DEV_URANDOM_ARCH=y",
  "CONFIG_RP23XX_RNG_POLL_TIMEOUT=100000",
]
forbid-regex = "^CONFIG_(ARCH_FPU|SMP|NET|DISABLE_PTHREAD|DEV_URANDOM_XORSHIFT128|DEV_URANDOM_CONGRUENTIAL|DEV_URANDOM_RANDOM_POOL)=y$"
