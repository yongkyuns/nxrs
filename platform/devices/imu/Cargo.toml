[package]
name = "nxrs-imu-devices"
version.workspace = true
edition.workspace = true
build = "build.rs"

[lib]
name = "imu_devices"

[package.metadata.nxrs]
kind = "device-catalogue"
bindings = [{ dependency = "nxrs-bmi270" }, { dependency = "nxrs-lsm6dso" }]

[features]
probe = ["nxrs-imu/probe"]

[dependencies]
cfg-if = "=1.0.5"
nxrs-acquisition = { path = "../../../hal/acquisition" }
nxrs-imu = { path = "../../../hal/imu" }
nxrs-messaging = { path = "../../../shared/messaging" }

[target.'cfg(target_os = "nuttx")'.dependencies]
nxrs-peripheral = { path = "../../../driver/peripheral" }
nxrs-i2c = { path = "../../../driver/i2c" }
nxrs-spi = { path = "../../../driver/spi" }
nxrs-bmi270 = { path = "../../../driver/bmi270" }
nxrs-lsm6dso = { path = "../../../driver/lsm6dso" }
embedded-hal = "=1.0.0"

[build-dependencies]
nxrs-build-support = { path = "../../build-support" }
