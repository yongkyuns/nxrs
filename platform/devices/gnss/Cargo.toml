[package]
build = "../../../tools/build-support/cargo/hal.rs"
name = "nxrs-gnss-devices"
version.workspace = true
edition.workspace = true

[lib]
name = "gnss_devices"

[package.metadata.nxrs]
kind = "device-catalogue"
bindings = [{ dependency = "nxrs-ubx-driver", feature = "ubx" }]

[features]
ubx = ["dep:nxrs-ubx-driver"]

[dependencies]
cfg-if = "=1.0.5"
nxrs-gnss = { path = "../../../hal/gnss" }

[target.'cfg(target_os = "nuttx")'.dependencies]
nxrs-ubx-driver = { path = "../../../driver/ubx", optional = true }

[build-dependencies]
nxrs-build-support = { path = "../../../tools/build-support" }
