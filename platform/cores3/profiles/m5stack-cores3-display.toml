# Built-in ILI9342C panel on the CoreS3. SPI2 is dedicated to the LCD.
board = "esp32s3-m5-cores3:nsh"
target = "xtensa-esp32s3-nuttx"
crossdev = "xtensa-esp32s3-elf-"
machine = "Tensilica Xtensa Processor"
image = "nuttx.bin"
requires-qemu = false
hal = { display = "nuttx" }

[display]
device = "/dev/spi2"

[build]
size-optimized = true

[kconfig]
enable = [
  "RAW_BINARY", "ARCH_CHIP_ESP32S3CUSTOM", "ESP32S3CUSTOM_FLASH_16M",
  "ESP32S3_M5_CORES3_LCD", "ESP32S3_I2C0", "ESP32S3_I2C0_MASTER_MODE",
  "ESP32S3_SPI2", "ESP32S3_SPI_SWCS", "SPI_EXCHANGE", "SPI_CMDDATA", "SPI_DRIVER",
  "ESP32S3_USBSERIAL", "OTHER_SERIAL_CONSOLE", "BOARD_LATE_INITIALIZE",
]
disable = [
  "NET", "SMP", "ESPRESSIF_WIFI", "ESPRESSIF_BLE", "ESP32S3_QEMU_IMAGE",
  "ESP32S3_SPI_DMA", "ESP32S3_SPI_UDCS", "ESP32S3_SPI3", "SPI_HWFEATURES",
  "MMCSD_SPI", "I2C_POLLED", "UART0_SERIAL_CONSOLE", "DISABLE_PTHREAD", "NSH_PIPELINE",
]
set = [
  "ESP32S3_I2C0_SDAPIN=12", "ESP32S3_I2C0_SCLPIN=11",
  "ESP32S3_SPI2_CSPIN=3", "ESP32S3_SPI2_CLKPIN=36",
  "ESP32S3_SPI2_MOSIPIN=37", "ESP32S3_SPI2_MISOPIN=-1",
  "ESP32S3_I2CTIMEOSEC=0", "ESP32S3_I2CTIMEOMS=50",
]
require = [
  "CONFIG_ARCH_BOARD_ESP32S3_M5_CORES3=y", "CONFIG_ESPRESSIF_SIMPLE_BOOT=y",
  "CONFIG_ESP32S3_FLASH_16M=y", "CONFIG_ESP32S3_M5_CORES3_LCD=y",
  "CONFIG_ESP32S3_USBSERIAL=y", "CONFIG_OTHER_SERIAL_CONSOLE=y",
  "CONFIG_ESP32S3_I2C0_SDAPIN=12", "CONFIG_ESP32S3_I2C0_SCLPIN=11",
  "CONFIG_ESP32S3_SPI2_CSPIN=3", "CONFIG_ESP32S3_SPI2_CLKPIN=36",
  "CONFIG_ESP32S3_SPI2_MOSIPIN=37", "CONFIG_ESP32S3_SPI2_MISOPIN=-1",
  "CONFIG_ESP32S3_SPI_SWCS=y", "CONFIG_SPI_CMDDATA=y", "CONFIG_SPI_DRIVER=y",
]
forbid-regex = "^CONFIG_(SMP|ESPRESSIF_WIFI|ESPRESSIF_BLE|ESP32S3_SPI_DMA|MMCSD_SPI)=y$"
