CONFIG_NET_IPv4=y
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y
# Let the shared BLE/TLS task enqueue TCP writes without waiting for ACKs.
CONFIG_NET_TCP_WRITE_BUFFERS=y
CONFIG_NET_TCP_NWRBCHAINS=8
CONFIG_NET_TCP_ALLOC_WRBCHAINS=0
CONFIG_NET_SEND_BUFSIZE=4096
CONFIG_NET_MAX_SEND_BUFSIZE=4096
CONFIG_NET_TUN=y
CONFIG_NET_TUN_PKTSIZE=1500
CONFIG_NETUTILS_NETLIB=y
CONFIG_NET_SOCKOPTS=y
CONFIG_LIBC_NETDB=y
CONFIG_UART2_RXBUFSIZE=4096
CONFIG_UART2_TXBUFSIZE=1024
CONFIG_LINE_MAX=256
CONFIG_NSH_MAXARGUMENTS=14
