# CoreS3 with M135, built-in panel and a dedicated settings partition.
extends = "m5stack-cores3-gnss"
hal = { display = "nuttx", touch = "nuttx", settings = "nuttx", ble = "nuttx", tls = "nuttx", battery = "nuttx", execution = "nuttx", boot = "nuttx", watchdog = "nuttx" }

[build]
size-optimized = true
trace-only-backtrace = true

[scheduling]
background = 90
# Acquisition workers use NuttX's default priority of 100.
normal = 99

[devices.onboard]
compatible = "bosch,bmi270"
bus = "sensor_bus"
address = 0x69
wake = { kind = "periodic" }

[devices.fuel_gauge]
compatible = "x-powers,axp2101-fuel-gauge"
bus = "sensor_bus"
address = 0x34

[aliases]
# The inherited imu device is the M135 BMI270, set to 0x68.
imu = "onboard"
imu_secondary = "imu"
battery = "fuel_gauge"

[display]
device = "/dev/spi2"

[imu]
stack-bytes = 3584

[gnss]
stack-bytes = 4608

[touch]
device = "/dev/input0"

[watchdog]
device = "/dev/watchdog0"
mode = "runtime"

[kconfig]
enable = [
  "PIPES", "RAW_BINARY", "ARCH_CHIP_ESP32S3CUSTOM", "ESP32S3CUSTOM_FLASH_16M",
  "ESP32S3_DEFAULT_CPU_FREQ_240", "PTHREAD_MUTEX_TYPES",
  "ESP32S3_M5_CORES3_LCD", "ESP32S3_SPI2", "ESP32S3_SPI_SWCS",
  "SPI_EXCHANGE", "SPI_CMDDATA", "SPI_DRIVER", "BOARD_LATE_INITIALIZE",
  "INPUT", "INPUT_FT5X06", "FT5X06_POLLMODE", "FT5X06_SINGLEPOINT",
  "ESP32S3_M5_CORES3_TOUCH",
  "ESP32S3_SPIFLASH", "ESP32S3_MTD", "MTD_CONFIG_NVS", "MTD_CONFIG_NAMED",
  "NET", "NET_SOCKOPTS", "NET_BLUETOOTH", "NETDEV_LATEINIT", "NETDEV_IOCTL", "DRIVERS_WIRELESS",
  "DRIVERS_BLUETOOTH", "WIRELESS", "WIRELESS_BLUETOOTH", "WIRELESS_BLUETOOTH_HOST",
  "ALLOW_BSD_COMPONENTS", "ESPRESSIF_BLE", "TIMER", "SCHED_LPWORK",
  "ESP32S3_RNG", "DEV_RANDOM",
  "WATCHDOG", "ESP32S3_MWDT0", "BOARDCTL", "BOARDCTL_RESET_CAUSE",
  "DEBUG_SYMBOLS", "DEBUG_LINK_MAP", "STACK_COLORATION", "SYSLOG_CONSOLE",
]
disable = [
  "NSH_PIPELINE", "SMP", "DISABLE_PTHREAD", "ARCH_LEDS", "NSH_ARCHINIT",
  "ESP32S3_QEMU_IMAGE", "ESPRESSIF_WIFI", "ESP32S3_NIMBLE_HCI", "NIMBLE", "PM", "ESPRESSIF_AUTO_SLEEP", "ESP32S3_AUTO_SLEEP", "SENSORS_BMI270",
  "ESP32S3_SPIRAM", "ESP32S3_SPI_DMA", "ESP32S3_SPI_UDCS",
  "ESP32S3_SPI3", "SPI_HWFEATURES", "MMCSD_SPI", "I2C_POLLED",
  "ESP32S3_PARTITION_TABLE", "ESP32S3_SPIFLASH_AUTO_BRINGUP", "MTD_CONFIG_NONE",
  "WATCHDOG_AUTOMONITOR", "WATCHDOG_PANIC_NOTIFIER",
  "SYSLOG_DEFAULT",
]
set = [
  "USEC_PER_TICK=1000", "PTHREAD_STACK_DEFAULT=16384", "ARCH_INTERRUPTSTACK=4096",
  "TLS_TASK_NELEM=1", "UART1_RXBUFSIZE=2048", "UART1_TXBUFSIZE=256",
  "ESP32S3_I2CTIMEOSEC=0", "ESP32S3_I2CTIMEOMS=50",
  "ESP32S3_SPI2_CSPIN=3", "ESP32S3_SPI2_CLKPIN=36",
  "ESP32S3_SPI2_MOSIPIN=37", "ESP32S3_SPI2_MISOPIN=-1",
  "ESP32S3_STORAGE_MTD_OFFSET=0xf00000", "ESP32S3_STORAGE_MTD_SIZE=0x4000",
  "MTD_CONFIG_NAME_LEN=32", "BOARD_INITTHREAD_STACKSIZE=8192",
  "FT5X06_POLL_IDLE_MS=40",
  "BLUETOOTH_TXCMD_STACKSIZE=8192", "BLUETOOTH_TXCONN_STACKSIZE=8192", "BLUETOOTH_TXCONN_RESERVE=y",
  # LPWORK dispatches BLE callbacks. Keep it below sensor acquisition.
  "SCHED_LPWORKPRIORITY=99",
  "SCHED_LPWORKSTACKSIZE=4096", "IOB_NBUFFERS=100", "IOB_BUFSIZE=400", "IOB_NCHAINS=32",
  "BLUETOOTH_MAXSCANDATA=64", "BLUETOOTH_MAXSCANRESULT=32", "PREALLOC_MQ_MSGS=40",
  "FS_HEAPSIZE=8192",

]
require = [
  "CONFIG_ARCH_BOARD_ESP32S3_M5_CORES3=y", "CONFIG_ESPRESSIF_SIMPLE_BOOT=y",
  "CONFIG_ESP32S3_FLASH_16M=y", "# CONFIG_ESP32S3_SPIRAM is not set",
  "CONFIG_PIPES=y", "CONFIG_USEC_PER_TICK=1000", "CONFIG_PTHREAD_MUTEX_TYPES=y",
  "CONFIG_ESP32S3_I2CTIMEOMS=50", "CONFIG_BOARD_LATE_INITIALIZE=y",
  "CONFIG_ESP32S3_M5_CORES3_LCD=y", "CONFIG_SPI_DRIVER=y", "CONFIG_SPI_CMDDATA=y",
  "CONFIG_ESP32S3_M5_CORES3_TOUCH=y", "CONFIG_FT5X06_POLLMODE=y",
  "CONFIG_FT5X06_SINGLEPOINT=y", "CONFIG_FT5X06_POLL_IDLE_MS=40",
  "CONFIG_ESP32S3_SPI2_CSPIN=3", "CONFIG_ESP32S3_SPI2_CLKPIN=36",
  "CONFIG_ESP32S3_SPI2_MOSIPIN=37", "CONFIG_ESP32S3_SPI2_MISOPIN=-1",
  "CONFIG_ESP32S3_MTD=y", "CONFIG_MTD_CONFIG_NVS=y", "CONFIG_MTD_CONFIG_NAMED=y",
  "CONFIG_ESPRESSIF_BLE=y", "CONFIG_NET_BLUETOOTH=y", "CONFIG_WIRELESS_BLUETOOTH_HOST=y",
  "CONFIG_SCHED_LPWORKPRIORITY=99",
  "CONFIG_BLUETOOTH_MAX_CONN=1", "CONFIG_BLUETOOTH_TXCONN_RESERVE=y", "CONFIG_PREALLOC_MQ_MSGS=40",
  "CONFIG_FS_HEAPSIZE=8192",
  "CONFIG_ESP32S3_RNG=y", "CONFIG_DEV_RANDOM=y",
  "CONFIG_WATCHDOG=y", "CONFIG_ESP32S3_MWDT0=y", "CONFIG_BOARDCTL_RESET_CAUSE=y",
  "# CONFIG_WATCHDOG_AUTOMONITOR is not set", "# CONFIG_WATCHDOG_PANIC_NOTIFIER is not set",
  "CONFIG_MTD_CONFIG_NAME_LEN=32", "CONFIG_ESP32S3_STORAGE_MTD_OFFSET=0xf00000",
  "CONFIG_ESP32S3_STORAGE_MTD_SIZE=0x4000",
]
forbid-regex = "^CONFIG_(SMP|I2C_POLLED|SENSORS_BMI270|ESPRESSIF_WIFI|NIMBLE|PM|ESPRESSIF_AUTO_SLEEP|ESP32S3_AUTO_SLEEP|ESP32S3_SPI_DMA|MMCSD_SPI|ESP32S3_PARTITION_TABLE|ESP32S3_SPIFLASH_AUTO_BRINGUP)=y$"

[resources.gnss_pps]
binding = "gpio10"

[devices.navigation]
pps = "gnss_pps"
navigation-period-ms = 500
