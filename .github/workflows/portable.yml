name: Portable services

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTUP_TOOLCHAIN: 1.90.0
  CARGO_TERM_COLOR: always

jobs:
  architecture:
    name: Architecture boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.90.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Boundary checker negative controls
        run: python -m unittest discover -s tests/host -p test_architecture.py -v
      - name: Enforce actual workspace dependency boundaries
        run: python tools/check-architecture.py
      - name: Documentation and dependency setup guards (no compiler build)
        run: |
          python -m unittest discover -s tests/host -p test_evaluation_docs.py -v
          python -m unittest discover -s tests/host -p test_upstream_layout.py -v
          python tests/nuttx-std/test-llvm-patches.py
          python tests/nuttx-std/test-build-rust-llvm.py
          python tests/nuttx-std/test-std-proposals.py

  native:
    name: Native qualification (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.90.0
          components: clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Provenance
        run: |
          git rev-parse HEAD
          rustc --version --verbose
      - name: Portable applications, mocks and actual native adapters
        run: cargo test --locked
      - name: Event-driven native owner unit tests
        run: cargo test --locked -p nxrs-applications --features nxrs-applications/cli,nxrs-camera/native,nxrs-storage/native,nxrs-transport/native --bin nxrs
      - name: Native simulator and bounded worker
        run: cargo run --locked -p nxrs-simulator --bin nxrs-simulator
      - name: App-owned CLI with independently decoded disk and UDP outputs
        run: python tests/host/test-native-runner.py
      - name: Lint production crates and selected app binary
        run: cargo clippy --locked -p nxrs-camera -p nxrs-storage -p nxrs-transport -p nxrs-camera-api -p nxrs-storage-api -p nxrs-transport-api -p nxrs-camera-native -p nxrs-storage-native -p nxrs-transport-native -p nxrs-camera-service -p nxrs-recording-service -p nxrs-telemetry-service -p nxrs-applications --features nxrs-applications/cli,nxrs-camera/native,nxrs-storage/native,nxrs-transport/native --lib --bins -- -D warnings

  no-std:
    name: No-std Cortex-M0 compile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.90.0
          targets: thumbv6m-none-eabi
      - name: Compile app library and services without selecting a backend
        run: cargo check --locked -p nxrs-applications --no-default-features --lib --target thumbv6m-none-eabi

  wasm:
    name: Shared mocks in Node and Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.90.0
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile the same scenario registry to WebAssembly
        run: cargo build --locked --release --lib -p nxrs-simulator --target wasm32-unknown-unknown
      - name: Install pinned browser test harness
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Execute Rust assertions in Node and a real Chromium page
        run: node tests/browser/run-wasm-scenarios.mjs target/wasm32-unknown-unknown/release/nxrs_simulator.wasm --browser
      - uses: actions/upload-artifact@v4
        with:
          name: portable-simulator-wasm
          path: target/wasm32-unknown-unknown/release/nxrs_simulator.wasm
