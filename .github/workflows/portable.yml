name: Portable services

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTUP_TOOLCHAIN: 1.90.0
  CARGO_TERM_COLOR: always

jobs:
  architecture:
    name: Architecture boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.90.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Boundary checker negative controls
        run: |
          python -m unittest discover -s tests/host -p test_architecture.py -v
          python -m unittest discover -s tests/host -p test_hal_boundaries.py -v
      - name: CSI build and acceptance rejection controls (no devices)
        run: python -m unittest discover -s tests/host -p 'test_csi_*.py' -v
      - name: Editor configuration regressions
        run: python -m unittest discover -s tests/host -p test_clangd_setup.py -v
      - name: Enforce actual workspace dependency boundaries
        run: python tools/check-architecture.py
      - name: Native filesystem binding rejection controls
        run: python -m unittest discover -s tests/host -p test_directory_abi.py -v
      - name: Camera inspection runtime and session policies (no devices)
        run: |
          cargo test --locked -p nxrs-std-stream --bin nxrs-std-stream
          python -m unittest discover -s tests/host -p test_camera_session.py -v
      - name: Two-board GATT runner negative controls (no devices)
        run: |
          python -m unittest discover -s tests/host -p test_gatt_client_runner.py -v
          python -m unittest discover -s tests/host -p test_gatt_native_process.py -v
          python -m unittest discover -s tests/host -p test_radio_client.py -v
          python -m unittest discover -s tests/host -p test_radio_echo.py -v
      - name: Documentation and dependency setup guards (no toolchain build)
        run: |
          python -m unittest discover -s tests/host -p test_evaluation_docs.py -v
          python -m unittest discover -s tests/host -p test_upstream_layout.py -v
          python -m unittest discover -s tests/host -p test_radio_firmware.py -v
          python -m unittest discover -s tests/host -p test_esp_mbedtls_allocators.py -v
          python -m unittest discover -s tests/event-services-comparison -p test_setup.py -v
          python -m unittest discover -s tests/rtos_harness -p 'test_*.py' -v
          python tests/nuttx-std/test-llvm-patches.py
          python tests/nuttx-std/test-build-rust-llvm.py
          python tests/nuttx-std/test-std-proposals.py

  native:
    name: Native qualification (${{ matrix.os }})
    runs-on: ${{ matrix.image }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Keep existing check identifiers while pinning the SDK/runner images.
        include:
          - os: ubuntu-latest
            image: ubuntu-24.04
          - os: macos-latest
            image: macos-15
          - os: windows-latest
            image: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.90.0
          components: clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Provenance
        run: |
          git rev-parse HEAD
          rustc --version --verbose
      - name: CSI presence policy and demo protocol qualification (no devices)
        run: |
          cargo test --locked -p nxrs-csi-radio-test --lib
          cargo clippy --locked -p nxrs-csi-radio-test --all-targets -- -D warnings
          cargo test --locked --manifest-path tests/csi-radio/presence/Cargo.toml --lib
          cargo test --locked -p nxrs-presence-service
          cargo clippy --locked -p nxrs-presence-service --all-targets -- -D warnings
          cargo test --locked --manifest-path tests/csi-presence/Cargo.toml
          cargo clippy --locked --manifest-path tests/csi-presence/Cargo.toml --all-targets -- -D warnings
      - name: Portable applications, mocks and actual native adapters
        run: cargo test --locked
      - name: Event-driven native owner unit tests
        env:
          NXRS_PLATFORM: std
        run: cargo test --locked -p nxrs-applications --features cli --bin nxrs
      - name: Native HAL integration qualification
        env:
          NXRS_PLATFORM: std
        run: cargo test --locked -p nxrs-native-integration
      - name: Scan fixture single-wait owner tests
        run: |
          cargo test --locked -p nxrs-std-wifi --lib
          cargo clippy --locked -p nxrs-std-wifi --lib -- -D warnings
          cargo test --locked -p nxrs-std-ble --lib --bin gatt-client
          # Lint the portable fixture without compiling a hardware entry point.
          cargo clippy --locked -p nxrs-std-ble --lib -- -D warnings
          cargo test --locked -p nxrs-std-radio
          cargo clippy --locked -p nxrs-std-radio --tests -- -D warnings
      - name: Injected NuttX radio source tests (no radio access)
        if: runner.os != 'Windows'
        run: |
          cargo test --locked -p nxrs-wifi --lib
          cargo test --locked -p nxrs-ble --lib --tests
          python tests/host/test_ble_native.py
          python tests/host/test_gatt_native.py
          python tests/host/test_wifi_qualification.py
      - name: macOS radio SDK bridges (fake objects; no radio or permission UI)
        if: runner.os == 'macOS'
        env:
          NXRS_PLATFORM: macos
        run: |
          cargo test --locked -p nxrs-wifi --lib
          cargo clippy --locked -p nxrs-wifi --lib --tests -- -D warnings
          cargo test --locked -p nxrs-ble --lib --tests
          cargo clippy --locked -p nxrs-ble --lib --tests -- -D warnings
          cargo clippy --locked -p nxrs-std-ble --bin gatt-client -- -D warnings
          python tests/host/test_macos_radio_native.py
      - name: Linux radio IPC bridges (private services; no radio access)
        if: runner.os == 'Linux'
        env:
          NXRS_PLATFORM: linux
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libglib2.0-dev dbus
          cargo test --locked -p nxrs-wifi -p nxrs-ble --lib --tests
          cargo clippy --locked -p nxrs-wifi -p nxrs-ble --lib --tests -- -D warnings
          cargo clippy --locked -p nxrs-std-ble --bin gatt-client -- -D warnings
          python tests/host/test_linux_radio_native.py
      - name: Native simulator and bounded worker
        env:
          NXRS_PLATFORM: mock
        run: |
          cargo test --locked -p nxrs-simulator
          cargo run --locked -p nxrs-simulator --bin nxrs-simulator
      - name: App-owned CLI with independently decoded disk and UDP outputs
        run: python tests/host/test-native-runner.py
      - name: Lint production crates and selected app binary
        env:
          NXRS_PLATFORM: std
        run: cargo clippy --locked -p nxrs-camera -p nxrs-storage -p nxrs-transport -p nxrs-camera-service -p nxrs-recording-service -p nxrs-telemetry-service -p nxrs-applications --features cli --lib --bins -- -D warnings

  no-std:
    name: No-std Cortex-M0 compile
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.90.0
          targets: thumbv6m-none-eabi
      - name: Compile app library and services without selecting a backend
        run: cargo check --locked -p nxrs-applications --no-default-features --lib --target thumbv6m-none-eabi
      - name: Compile allocation-free radio contracts and controllers
        run: cargo check --locked -p nxrs-wifi -p nxrs-ble --no-default-features --lib --target thumbv6m-none-eabi

  wasm:
    name: Shared mocks in Node and Chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.90.0
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile the same scenario registry to WebAssembly
        run: NXRS_PLATFORM=mock cargo build --locked --release --lib -p nxrs-simulator --target wasm32-unknown-unknown
      - name: Install pinned browser test harness
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Execute Rust assertions in Node and a real Chromium page
        run: node tests/browser/run-wasm-scenarios.mjs target/wasm32-unknown-unknown/release/nxrs_simulator.wasm --browser
      - uses: actions/upload-artifact@v4
        with:
          name: portable-simulator-wasm
          path: target/wasm32-unknown-unknown/release/nxrs_simulator.wasm
