name: Portable services

on:
  push:
    branches: [codex/portable-tracker-linux-ci]
  # Stacked PRs need the same architecture/native/core/WASM gates as main-bound PRs.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTUP_TOOLCHAIN: 1.90.0
  CARGO_TERM_COLOR: always

jobs:
  native:
    name: Native qualification (${{ matrix.os }})
    runs-on: ${{ matrix.image }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Keep existing check identifiers while pinning the SDK/runner images.
        include:
          - os: ubuntu-latest
            image: ubuntu-24.04
            platform: linux
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.90.0
          components: clippy
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Provenance
        run: |
          git rev-parse HEAD
          rustc --version --verbose
      - name: Headless Motion Tracker and observation log rotation
        if: runner.os != 'Windows'
        run: |
          python tests/native/motion_tracker.py
          cargo test --locked -p nxrs-log-qualification --test file -- --nocapture
          cargo test --locked -p nxrs-telemetry-service --no-default-features --features stream
