name: Optional Dropbear SSH

on:
  pull_request:
    paths:
      - '.github/workflows/dropbear-ssh.yml'
      - 'platform/build/**'
      - 'platform/build-support/**'
      - 'tests/profiles/esp32s3-wifi.toml'
      - 'tests/nuttx-std/ssh/**'
      - 'tests/nuttx-std/wifi/**'
      - 'tests/host/test_ssh_qualification.py'
      - 'tests/host/test_dropbear*.py'
      - 'tests/host/fixtures/dropbear-native/**'
      - 'upstream/nuttx-apps/**'
      - 'upstream/rust-std/**'
      - 'upstream/build-patches.json'
      - 'external/nuttx'
      - 'external/nuttx-apps'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dropbear-ssh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: true
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.90.0
          components: clippy
      - name: Check build options and portable probe
        run: |
          cargo test --locked -p nxrs-build --lib --bin nxrs-build --test cli
          cargo test --locked -p nxrs-std-ssh
          cargo clippy --locked -p nxrs-std-ssh --all-targets -- -D warnings
      - name: Check SSH harness and native port controls
        run: |
          python3 -m unittest discover -s tests/host -p 'test_ssh_qualification.py' -v
          python3 tests/host/test_dropbear_native.py -v
          python3 tools/check-architecture.py

  esp32s3-build:
    needs: host
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ env.SOURCE_SHA }}
          submodules: true
      - name: Install build dependencies
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          bash .github/scripts/install-ubuntu-packages.sh bison flex gperf kconfig-frontends genromfs cmake ninja-build libncurses-dev zlib1g-dev libgcrypt20 libglib2.0-0 libpixman-1-0 libsdl2-2.0-0 libslirp0
          python3 -m venv target/ssh-venv
          target/ssh-venv/bin/pip install kconfiglib==14.1.0 esptool==4.8.1
          echo "$GITHUB_WORKSPACE/target/ssh-venv/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: target/qemu-tools/*.tar.xz
          key: qemu-linux-x64-9.0.0-20240606-gcc14.2-20241119-rust1.90.0.0-v1
      - name: Install verified target tools
        run: bash tools/install-qemu-tools.sh
      - name: Cross-build optional SSH and its disabled baseline
        shell: bash
        run: |
          set -o pipefail
          source target/qemu-tools/environment.sh
          mkdir -p target/ssh-ci
          bash tests/nuttx-std/ssh/build.sh --out target/dropbear-ssh 2>&1 | tee target/ssh-ci/enabled-build.log
          bash tests/nuttx-std/ssh/build.sh --without-ssh --out target/dropbear-ssh-off 2>&1 | tee target/ssh-ci/disabled-build.log
      - name: Retain build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dropbear-ssh-build-evidence
          path: |
            target/ssh-ci/*.log
            target/dropbear-ssh/*.json
            target/dropbear-ssh/*.txt
            target/dropbear-ssh/*.config
            target/dropbear-ssh/*.sha256
            target/dropbear-ssh/ssh-localoptions.h
            target/dropbear-ssh/std-main-thread-once.patch
            target/dropbear-ssh/nuttx/nuttx.map
            target/dropbear-ssh-off/*.json
            target/dropbear-ssh-off/*.txt
            target/dropbear-ssh-off/*.config
            target/dropbear-ssh-off/*.sha256
            target/dropbear-ssh-off/std-main-thread-once.patch
            target/dropbear-ssh-off/nuttx/nuttx.map
          if-no-files-found: warn
          retention-days: 14
