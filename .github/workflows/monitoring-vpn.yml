name: Monitoring VPN deployment reference
on:
  pull_request:
    paths:
      - 'gateway/**'
      - 'service/detection-wire/**'
      - 'docs/detection-protocol*'
      - '.github/workflows/monitoring-vpn.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: monitoring-vpn-${{ github.ref }}
  cancel-in-progress: true
jobs:
  vpn:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install hosted-only reference tools
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install --no-install-recommends nginx wireguard-tools nftables ffmpeg
          sudo systemctl stop nginx
          nginx -v
          wg --version
          nft --version
          python3 -m venv /tmp/nxrs-vpn-test
          /tmp/nxrs-vpn-test/bin/pip install -r gateway/tests/media-requirements.txt
      - name: Generated policy and real nginx TLS boundary regressions
        run: python3 -m unittest discover -s gateway/tests -p test_vpn_deployment.py -v
      - name: Build independent gateway and verify pinned MediaMTX asset
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          (cd gateway && cargo build --locked)
          python3 - <<'PY'
          import hashlib, json, pathlib, urllib.request
          pin=json.load(open('gateway/deploy/dependencies.json'))['mediamtx']
          data=urllib.request.urlopen(pin['linux_amd64_url'],timeout=60).read()
          assert hashlib.sha256(data).hexdigest()==pin['linux_amd64_sha256'], 'MediaMTX checksum mismatch'
          pathlib.Path('/tmp/nxrs-vpn-mediamtx.tar.gz').write_bytes(data)
          PY
          mkdir /tmp/nxrs-vpn-mediamtx
          tar -xzf /tmp/nxrs-vpn-mediamtx.tar.gz -C /tmp/nxrs-vpn-mediamtx mediamtx
      - name: Kernel WireGuard, HTTPS proxy, scoped authorization and real video
        run: |
          sudo env GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted \
            /tmp/nxrs-vpn-test/bin/python gateway/tests/vpn_reference.py \
            --gateway gateway/target/debug/nxrs-gateway-control \
            --mediamtx /tmp/nxrs-vpn-mediamtx/mediamtx
