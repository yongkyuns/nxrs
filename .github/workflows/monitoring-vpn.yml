name: Monitoring VPN deployment reference
on:
  pull_request:
    paths:
      - '.github/scripts/install-ubuntu-packages.sh'
      - 'tools/native-packages/pcre.py'
      - 'tools/gateway-proxy/**'
      - 'security/gateway-proxy-dependencies.json'
      - 'tests/host/test_system_regex.py'
      - 'tests/host/native/system_regex.c'
      - 'gateway/**'
      - 'service/detection-wire/**'
      - 'docs/detection-protocol*'
      - '.github/workflows/monitoring-vpn.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: monitoring-vpn-${{ github.ref }}
  cancel-in-progress: true
jobs:
  vpn:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install hosted-only reference tools
        run: |
          python3 tools/ci-apt.py build-essential gpg gpgv cryptsetup-bin nginx wireguard-tools nftables ffmpeg
          sudo systemctl stop nginx
          nginx -v
          wg --version
          nft --version
          python3 gateway/tools/native_python.py prepare --work /tmp/nxrs-vpn-test-native --runtime /tmp/nxrs-vpn-test --qualify
          /tmp/nxrs-vpn-test/bin/python -m pip check
          /tmp/nxrs-vpn-test/bin/python gateway/tools/python_environment.py inventory --report "$RUNNER_TEMP/python-monitoring-vpn.json"
      - name: Qualify signed shared PCRE2 for the actual system tools
        run: |
          python3 -m unittest discover -s tests/host -p test_system_regex.py -v
          timeout --signal=KILL 1260 python3 tools/native-packages/pcre.py --work "$RUNNER_TEMP/system-regex-build"
      - name: Generated policy and real nginx TLS boundary regressions
        run: |
          python3 -m unittest discover -s gateway/tests -p test_vpn_deployment.py -v
          python3 -m unittest discover -s gateway/tests -p test_vpn_rotation.py -v
          python3 -m unittest discover -s gateway/tests -p test_vpn_retirement.py -v
          python3 -m unittest discover -s gateway/tests -p test_vpn_progress.py -v
          python3 -m unittest discover -s gateway/tests -p test_vpn_admission_contract.py -v
      - name: Build independent gateway and verify pinned MediaMTX asset
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          (cd gateway && cargo build --locked)
          mkdir /tmp/nxrs-vpn-mediamtx
          python3 gateway/tests/fetch_mediamtx.py --artifact linux_amd64 --output /tmp/nxrs-vpn-mediamtx/mediamtx
          python3 gateway/tools/verify_media_evidence.py /tmp/nxrs-vpn-mediamtx/mediamtx
      - name: Kernel WireGuard, persisted rotation/lost-peer retirement/recovery and real video
        run: |
          sudo env GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted \
            /tmp/nxrs-vpn-test/bin/python gateway/tests/vpn_reference.py \
            --gateway gateway/target/debug/nxrs-gateway-control \
            --mediamtx /tmp/nxrs-vpn-mediamtx/mediamtx \
            --admission gateway/target/debug/nxrs-vpn-admission
