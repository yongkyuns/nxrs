name: Gateway shared PCRE2 package qualification
on:
  pull_request:
    paths:
      - 'tools/native-packages/**'
      - 'tools/gateway-proxy/**'
      - 'gateway/tools/system_regex_evidence.py'
      - 'gateway/fuzz/run.py'
      - 'tests/host/**'
      - 'security/gateway-proxy-dependencies.json'
      - 'tools/ci-apt.py'
      - '.github/workflows/gateway-pcre-package.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gateway-pcre-package-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package-install-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Require package and shared-library failure controls
        run: |
          python3 -m unittest discover -s tests/host -p test_pcre_package.py -v
          python3 -m unittest discover -s tests/host -p test_system_regex.py -v
      - name: Install disposable build and independent Ubuntu bootstrap tools
        run: python3 tools/ci-apt.py build-essential binutils gpg gpgv cryptsetup-bin debootstrap ubuntu-keyring xz-utils ca-certificates
      - name: Qualify the exact signed shared source before packaging
        run: timeout --signal=KILL 1260 python3 tools/native-packages/pcre.py --work "$RUNNER_TEMP/package-source-build"
      - name: Require actual package ownership and isolated installation recovery
        run: timeout --signal=KILL 2160 python3 tools/native-packages/pcre_package.py --source-work "$RUNNER_TEMP/package-source-build" --work "$RUNNER_TEMP/package-install-recovery"
      - name: Retain only the bounded classified public qualification receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: gateway-pcre-package-qualification
          path: ${{ runner.temp }}/package-install-recovery/qualification.json
          if-no-files-found: error
          retention-days: 7
