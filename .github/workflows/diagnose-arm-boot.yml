name: Diagnose retained ARM boot assertion

on:
  push:
    branches: ['diagnose/477-arm-boot-b423']

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install the same ARM emulator package
        run: >-
          bash .github/scripts/install-ubuntu-packages.sh
          qemu-system-arm=1:10.2.1+ds-1ubuntu3.3 gcc-arm-none-eabi=15:14.2.rel1-1
          binutils-arm-none-eabi libnewlib-arm-none-eabi bison flex gperf
          kconfig-frontends genromfs libncurses-dev python3 python3-venv build-essential
      - name: Prepare pinned Kconfig tooling
        run: |
          python3 -m venv target/arm-stack-venv
          target/arm-stack-venv/bin/pip install kconfiglib==14.1.0
          echo "$GITHUB_WORKSPACE/target/arm-stack-venv/bin" >> "$GITHUB_PATH"
      - name: Download the original failed qualification artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: 15250340281
          run-id: 46110830976
          github-token: ${{ github.token }}
          merge-multiple: true
          path: target/retained-arm
      - name: Build the corrected fixture with matching native inputs
        id: build_fixture
        run: >-
          python3 .github/scripts/build-arm-stack-diagnostic.py
          --retained target/retained-arm/mps2-an521-mock/timed-capture/build
          --output target/arm-stack-patched
      - name: Retain original and corrected transition disassembly
        run: |
          arm-none-eabi-objdump -d --disassemble=arm_initialize_stack target/retained-arm/mps2-an521-mock/timed-capture/build/nuttx > target/arm-stack-patched/original-transition.txt
          arm-none-eabi-objdump -d --disassemble=arm_initialize_stack target/arm-stack-patched/build/nuttx > target/arm-stack-patched/corrected-transition.txt
      - name: Observe ordinary boots of the corrected fixture
        run: >-
          python3 .github/scripts/verify-arm-stack-startup.py
          --build target/arm-stack-patched/build
          --comparison target/arm-stack-patched/comparison.json
          --output target/arm-stack-boots
      - name: Run the unchanged timed-capture workload and native oracles
        if: ${{ !cancelled() && steps.build_fixture.outcome == 'success' }}
        run: >-
          python3 tools/memory-explorer/tests/qualify_timed_capture_qemu.py
          --qemu /usr/bin/qemu-system-arm
          --build target/arm-stack-patched/build
          --output target/arm-stack-patched/capture --timeout 60
      - name: Retain every diagnostic and the exact image
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: arm-stack-transition-comparison
          path: |
            target/arm-stack-patched
            target/arm-stack-boots
            target/retained-arm/mps2-an521-mock/timed-capture/build/nuttx
            target/retained-arm/mps2-an521-mock/timed-capture/build/resolved.config
            target/retained-arm/mps2-an521-mock/timed-capture/build/build.json
          if-no-files-found: error
