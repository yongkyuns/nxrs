name: Storage HAL isolation
on:
  pull_request:
    paths:
      - 'hal/storage/**'
      - 'hal/camera/**'
      - 'hal/common/**'
      - 'hal/support/**'
      - 'app/**'
      - 'service/**'
      - 'platform/hal-build.rs'
      - 'platform/profiles/**'
      - 'tools/platform_config.py'
      - 'tools/check-hal-isolation.py'
      - 'tests/host/test_storage_isolation.py'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/storage-hal.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: storage-hal-${{ github.ref }}
  cancel-in-progress: true
jobs:
  isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.90.0
          targets: thumbv6m-none-eabi,wasm32-unknown-unknown
          components: clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reject invalid records and check HAL module isolation
        run: |
          python -m unittest discover -s tests/host -p test_storage_isolation.py -v
          python tools/check-hal-isolation.py --capability storage --out target/storage-isolation
      - name: Preserve worker failure, saturation and barrier tests
        run: |
          NXRS_PLATFORM=mock cargo test --locked -p nxrs-storage
          NXRS_PLATFORM=linux cargo test --locked -p nxrs-storage
      - name: Lint portable and native storage selections
        run: |
          NXRS_PLATFORM=mock cargo clippy --locked -p nxrs-storage --all-targets -- -D warnings
          NXRS_PLATFORM=linux cargo clippy --locked -p nxrs-storage --all-targets -- -D warnings
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storage-hal-isolation
          path: target/storage-isolation
