name: Minimized gateway native origin audit
on:
  pull_request:
    paths:
      - 'tools/native-packages/**'
      - 'tools/gateway-media/**'
      - 'gateway/**'
      - 'tests/host/**'
      - 'tests/device-identity/**'
      - 'security/**'
      - 'tools/ci-apt.py'
      - 'tools/native-media/**'
      - 'rust-toolchain.toml'
      - '.github/workflows/gateway-media-runtime.yml'
      - '.github/workflows/monitoring-ingest.yml'
      - '.github/workflows/encrypted-activity.yml'
      - '.github/workflows/ubuntu-native-packages.yml'
      - '.github/workflows/minimized-native-packages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: minimized-native-packages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-origins:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Require native origin and refresh failure controls
        run: |
          /usr/bin/python3 -m unittest discover -s tests/host -p test_ubuntu_native_packages.py -v
          /usr/bin/python3 -m unittest discover -s tests/host -p test_candidate_native_packages.py -v
          /usr/bin/python3 -m unittest discover -s tests/host -p test_native_payloads.py -v
      - name: Require archive trust file protection before building
        run: |
          /usr/bin/python3 - <<'PYTRUST'
          import sys
          sys.path.insert(0,'tools/native-packages')
          import payloads
          payloads.u.hosted()
          payloads.protected(payloads.KEYRING)
          PYTRUST
      - name: Install actual gateway and independent stock fixture tools
        run: /usr/bin/python3 tools/ci-apt.py build-essential nasm pkg-config libclang-dev ffmpeg libavformat-dev libavcodec-dev libavutil-dev nginx openssl cryptsetup-bin
      - name: Build the real initial distribution-linked gateway
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          cargo +1.90.0 build --manifest-path gateway/Cargo.toml --locked --workspace
          cargo +1.90.0 build --manifest-path gateway/Cargo.toml --locked -p nxrs-camera-ingest --features publisher-sdk --bins
      - name: Require a complete stock baseline before its bounded signed-archive refresh
        run: |
          native_baseline_status=0
          timeout --signal=KILL 600 /usr/bin/python3 tools/native-packages/ubuntu.py --report "$RUNNER_TEMP/candidate-stock-baseline.json" || native_baseline_status=$?
          /usr/bin/python3 - "$RUNNER_TEMP/candidate-stock-baseline.json" "$native_baseline_status" <<'PYBASELINE'
          import json,pathlib,sys
          value=json.loads(pathlib.Path(sys.argv[1]).read_bytes())
          assert value['advisory_status']=='complete' and type(value['qualified']) is bool
          assert int(sys.argv[2])==(0 if value['qualified'] else 1)
          PYBASELINE
          /usr/bin/python3 tools/native-packages/refresh.py --baseline "$RUNNER_TEMP/candidate-stock-baseline.json" --report "$RUNNER_TEMP/candidate-stock-refresh.json"
      - name: Build the exact patched minimized runtime after the package refresh
        run: /usr/bin/python3 tools/gateway-media/prepare.py --work "$RUNNER_TEMP/candidate-minimized-build"
      - name: Rebuild actual publisher and reader against the custom media libraries
        env:
          PKG_CONFIG_PATH: /usr/lib/nxrs-gateway-media-qualification/lib/pkgconfig
          RUSTFLAGS: -C link-arg=-Wl,-rpath,/usr/lib/nxrs-gateway-media-qualification/lib
        run: |
          cargo +1.90.0 clean --manifest-path gateway/Cargo.toml -p ffmpeg-sys-next
          cargo +1.90.0 build --manifest-path gateway/Cargo.toml --locked -p nxrs-camera-ingest -p nxrs-media-sandbox --features publisher-sdk --bins
          python3 gateway/tests/fetch_mediamtx.py --artifact linux_amd64 --output /tmp/nxrs-candidate-media-server
          python3 gateway/tests/build_publisher_witness.py --output /tmp/nxrs-candidate-decoder-witness
          python3 gateway/tests/publisher_reference.py --publisher gateway/target/debug/nxrs-rtsp-publisher --mediamtx /tmp/nxrs-candidate-media-server --decoder-guard /tmp/nxrs-candidate-decoder-witness/no-decoder.so
          python3 gateway/tests/reader_reference.py --reader gateway/target/debug/nxrs-rtsp-reader --publisher gateway/target/debug/nxrs-rtsp-publisher --mediamtx /tmp/nxrs-candidate-media-server --decoder-guard /tmp/nxrs-candidate-decoder-witness/no-decoder.so --report "$RUNNER_TEMP/candidate-reader.json"
      - name: Qualify unchanged confinement grants and actual finalized media after refresh
        run: |
          python3 gateway/tests/qualify_media_sandbox.py --launcher gateway/target/debug/nxrs-media-sandbox --work "$RUNNER_TEMP/candidate-isolation" --ffmpeg /usr/lib/nxrs-gateway-media-qualification/bin/ffmpeg --ffprobe /usr/lib/nxrs-gateway-media-qualification/bin/ffprobe
          python3 tools/gateway-media/qualify.py --work "$RUNNER_TEMP/candidate-native-controls" --reader-report "$RUNNER_TEMP/candidate-reader.json" --isolation-report "$RUNNER_TEMP/candidate-isolation/qualification.json" --report /usr/lib/nxrs-gateway-media-qualification/qualification.json
      - name: Authenticate mapped distribution payloads and preserve the advisory gate result
        run: |
          native_candidate_status=0
          timeout --signal=KILL 600 /usr/bin/python3 tools/native-packages/candidate.py --baseline "$RUNNER_TEMP/candidate-stock-baseline.json" --refresh "$RUNNER_TEMP/candidate-stock-refresh.json" --report "$RUNNER_TEMP/minimized-native-packages.json" || native_candidate_status=$?
          /usr/bin/python3 - "$RUNNER_TEMP/minimized-native-packages.json" "$native_candidate_status" <<'PYCANDIDATE'
          import json,pathlib,sys
          value=json.loads(pathlib.Path(sys.argv[1]).read_bytes())
          assert value['advisory_status']=='complete' and type(value['qualified']) is bool
          assert int(sys.argv[2])==(0 if value['qualified'] else 1)
          PYCANDIDATE
          timeout --signal=KILL 960 /usr/bin/python3 tools/native-packages/payloads.py --candidate "$RUNNER_TEMP/minimized-native-packages.json" --work "$RUNNER_TEMP/candidate-payload-verification" --report "$RUNNER_TEMP/minimized-native-payloads.json"
          exit "$native_candidate_status"
      - name: Retain bounded public origins and joined receipts even when the gate fails
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: minimized-native-package-origins
          path: |
            ${{ runner.temp }}/candidate-stock-baseline.json
            ${{ runner.temp }}/candidate-stock-refresh.json
            /usr/lib/nxrs-gateway-media-qualification/build.json
            /usr/lib/nxrs-gateway-media-qualification/qualification.json
            ${{ runner.temp }}/candidate-reader.json
            ${{ runner.temp }}/candidate-isolation/qualification.json
            ${{ runner.temp }}/minimized-native-packages.json
            ${{ runner.temp }}/minimized-native-payloads.json
          if-no-files-found: warn
          retention-days: 7
