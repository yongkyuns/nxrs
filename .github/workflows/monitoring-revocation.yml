name: Monitoring durable revocation
on:
  pull_request:
    paths:
      - 'gateway/**'
      - '.github/workflows/monitoring-revocation.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: monitoring-revocation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  revocation:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Locked gateway tests and strict lint
        working-directory: gateway
        run: |
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
          cargo build --locked
      - name: Install reference tools
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install --no-install-recommends ffmpeg
          python3 -m venv /tmp/nxrs-revocation
          /tmp/nxrs-revocation/bin/pip install -r gateway/tests/media-requirements.txt
          python3 - <<'PY'
          import hashlib, json, pathlib, urllib.request
          pin=json.load(open('gateway/deploy/dependencies.json'))['mediamtx']
          data=urllib.request.urlopen(pin['linux_amd64_url'],timeout=60).read()
          assert hashlib.sha256(data).hexdigest()==pin['linux_amd64_sha256'], 'MediaMTX checksum mismatch'
          pathlib.Path('/tmp/nxrs-revocation-mediamtx.tar.gz').write_bytes(data)
          PY
          mkdir /tmp/nxrs-revocation-mediamtx
          tar -xzf /tmp/nxrs-revocation-mediamtx.tar.gz -C /tmp/nxrs-revocation-mediamtx mediamtx
      - name: Terminate live media, retain unrelated viewers, recover and restore durable denials
        run: |
          /tmp/nxrs-revocation/bin/python gateway/tests/revocation_reference.py \
            --gateway gateway/target/debug/nxrs-gateway-control \
            --mediamtx /tmp/nxrs-revocation-mediamtx/mediamtx
