name: Monitoring durable revocation
on:
  pull_request:
    paths:
      - 'gateway/**'
      - 'tools/ci-apt.py'
      - 'tests/host/test_ci_apt.py'
      - '.github/workflows/monitoring-revocation.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: monitoring-revocation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  revocation:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Locked gateway tests and strict lint
        working-directory: gateway
        run: |
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
          cargo build --locked
      - name: Install reference tools
        run: |
          python3 -m unittest discover -s tests/host -p test_ci_apt.py -v
          python3 tools/ci-apt.py ffmpeg
          python3 -m venv /tmp/nxrs-revocation
          /tmp/nxrs-revocation/bin/pip install -r gateway/tests/media-requirements.txt
          mkdir /tmp/nxrs-revocation-mediamtx
          python3 gateway/tests/fetch_mediamtx.py --artifact linux_amd64 --output /tmp/nxrs-revocation-mediamtx/mediamtx
          python3 gateway/tools/verify_media_evidence.py /tmp/nxrs-revocation-mediamtx/mediamtx
      - name: Terminate live media, retain unrelated viewers, recover and restore durable denials
        run: |
          /tmp/nxrs-revocation/bin/python gateway/tests/revocation_reference.py \
            --gateway gateway/target/debug/nxrs-gateway-control \
            --mediamtx /tmp/nxrs-revocation-mediamtx/mediamtx
