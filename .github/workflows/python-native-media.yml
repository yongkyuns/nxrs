name: Python embedded native media replacement
on:
  pull_request:
    paths:
      - 'gateway/**'
      - 'tools/enrollment/requirements.txt'
      - '.github/workflows/python-native-media.yml'
  schedule:
    - cron: '47 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: python-native-media-${{ github.ref }}
  cancel-in-progress: true
jobs:
  candidate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Refusal controls and pinned isolated native rebuild
        run: |
          python -m unittest discover -s gateway/tests -p test_native_python.py -v
          python gateway/tools/native_python.py prepare --work "$RUNNER_TEMP/native-media-candidate"
      - name: Fresh package and native advisory checks with actual HTTP and H264 media
        run: |
          python -m venv "$RUNNER_TEMP/native-auditor"
          "$RUNNER_TEMP/native-auditor/bin/python" -m pip install pip-audit==2.10.1
          "$RUNNER_TEMP/native-media-candidate/runtime/bin/python" gateway/tools/native_python.py qualify --audit-python "$RUNNER_TEMP/native-auditor/bin/python" --report "$RUNNER_TEMP/native-python.json"
      - name: Retain bounded public candidate evidence only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: python-native-candidate-${{ matrix.os }}
          path: ${{ runner.temp }}/native-python.json
          if-no-files-found: error
          retention-days: 7
