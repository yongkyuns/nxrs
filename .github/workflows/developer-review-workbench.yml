name: Developer reference qualification
on:
  push:
    branches: [docs/developer-review-workbench]
permissions:
  contents: write
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply reviewed documentation sources
        run: python3 .developer-review/apply.py
      - name: Install verified D2 renderer
        shell: bash
        run: |
          curl -fsSL --retry 3 https://github.com/d2lang/d2/releases/download/v0.9.0/d2-v0.9.0-linux-amd64.tar.gz -o /tmp/d2.tar.gz
          echo '5669ddc46b99e942cc96078f4a4e36d5e62103348f4c05179ede27802fdd87a9  /tmp/d2.tar.gz' | sha256sum -c -
          mkdir -p /tmp/d2-pinned
          tar -xzf /tmp/d2.tar.gz -C /tmp/d2-pinned
          echo "D2=/tmp/d2-pinned/d2-v0.9.0/bin/d2" >> "$GITHUB_ENV"
      - name: Render all reference sets and check examples
        shell: bash
        run: |
          mkdir -p /tmp/developer-qualification
          pids=()
          for path in diagrams openvela/diagrams zephyr/diagrams px4/diagrams; do
            log="${path//\//-}"
            bash "docs/references/$path/render.sh" > "/tmp/developer-qualification/$log.log" 2>&1 &
            pids+=("$!")
          done
          for pid in "${pids[@]}"; do
            if ! wait "$pid"; then cat /tmp/developer-qualification/*.log; exit 1; fi
          done
          python3 docs/references/check_docs.py
          python3 docs/references/check_examples.py
          python3 .developer-review/verify.py
      - name: Preserve qualified documentation on workbench only
        run: |
          git config user.name 'nxrs documentation qualification'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: qualify developer-oriented architecture decisions and diagnostics'
          git push origin HEAD:docs/developer-review-workbench
          git rev-parse HEAD > /tmp/developer-qualification/qualified-commit.txt
          git archive HEAD docs/references | gzip -n > /tmp/developer-qualification/references.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: developer-reference-qualification
          path: /tmp/developer-qualification/
          retention-days: 7
