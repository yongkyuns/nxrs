name: Memory explorer

on:
  pull_request:
    paths:
      - 'tools/memory-explorer/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/memory-explorer.yml'
  push:
    branches: [main]
    paths:
      - 'tools/memory-explorer/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/memory-explorer.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: memory-explorer-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTUP_TOOLCHAIN: 1.90.0
  CARGO_TERM_COLOR: always

jobs:
  native:
    name: Explorer (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.90.0
          components: clippy,rustfmt
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Linux rendering prerequisites
        if: runner.os == 'Linux'
        run: bash .github/scripts/install-ubuntu-packages.sh libxkbcommon-dev libgl1-mesa-dev xvfb xauth
      - name: Formatting
        run: cargo fmt --check -p nxrs-memory-explorer
      - name: Model and independently linked ELF tests
        run: cargo test --locked -p nxrs-memory-explorer
      - name: NuttX debugger exporter contract
        run: python -m unittest discover -s tools/memory-explorer/tests -p test_gdb_export.py -v
      - name: GUI contracts
        run: cargo test --locked -p nxrs-memory-explorer --features gui --bin nxrs-memory-explorer
      - name: Lint
        run: cargo clippy --locked -p nxrs-memory-explorer --all-targets --features gui -- -D warnings
      - name: Build native viewer
        run: cargo build --locked -p nxrs-memory-explorer --features gui
      - name: Render demo and exercise navigation
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          mkdir -p target/memory-explorer-smoke
          timeout 45s xvfb-run -a -s '-screen 0 1600x1100x24' target/debug/nxrs-memory-explorer --demo --smoke-test --screenshot target/memory-explorer-smoke/demo.ppm
      - name: Render linked ELF with synthetic exporter capture
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          python tools/memory-explorer/tests/make_elf_fixture.py target/memory-explorer-fixture
          timeout 45s xvfb-run -a -s '-screen 0 1600x1100x24' target/debug/nxrs-memory-explorer --elf target/memory-explorer-fixture/fixture.elf --map target/memory-explorer-fixture/fixture.map --layout target/memory-explorer-fixture/layout.json --snapshot target/memory-explorer-fixture/exporter-snapshot.json --smoke-test --screenshot target/memory-explorer-smoke/elf.ppm
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: runner.os == 'Linux' && always()
        with:
          name: memory-explorer-rendered-smoke
          path: target/memory-explorer-smoke/
          if-no-files-found: warn
          retention-days: 7
