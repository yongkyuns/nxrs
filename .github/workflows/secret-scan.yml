name: Secret scanning
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true
jobs:
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install pinned scanner, verify controls and scan available history
        run: |
          python3 tools/scan-secrets.py install --output "$RUNNER_TEMP/gitleaks"
          python3 tools/scan-secrets.py self-test --scanner "$RUNNER_TEMP/gitleaks"
          python3 tools/scan-secrets.py scan --scanner "$RUNNER_TEMP/gitleaks"
