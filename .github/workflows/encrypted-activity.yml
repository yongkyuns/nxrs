name: Encrypted activity volume
on:
  pull_request:
    paths:
      - 'gateway/**'
      - 'tools/gateway-media/**'
      - 'security/native-media-dependencies.json'
      - 'tests/host/test_gateway_media.py'
      - 'tests/host/test_x264_cleanup.py'
      - 'tests/host/native/x264_open_cleanup.c'
      - 'driver/device-identity/**'
      - 'tests/device-identity/**'
      - 'tools/device-identity/**'
      - 'tools/enrollment/**'
      - 'service/stream/**'
      - 'service/camera/**'
      - 'app/camera-stream/**'
      - 'hal/camera/src/api.rs'
      - 'tools/ci-apt.py'
      - 'tests/host/test_ci_apt.py'
      - 'tests/host/test_sdk_camera_password.py'
      - '.github/workflows/encrypted-activity.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: encrypted-activity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  encrypted-volume:
    env:
      PKG_CONFIG_PATH: /usr/lib/nxrs-gateway-media-qualification/lib/pkgconfig
      RUSTFLAGS: -C link-arg=-Wl,-rpath,/usr/lib/nxrs-gateway-media-qualification/lib
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build and qualify storage policy with pinned Rust
        run: |
          rustup toolchain install 1.90.0 --profile minimal --component clippy
          cargo +1.90.0 test --manifest-path gateway/Cargo.toml --locked --workspace
          cargo +1.90.0 clippy --manifest-path gateway/Cargo.toml --locked --workspace --all-targets -- -D warnings
          cargo +1.90.0 build --manifest-path gateway/Cargo.toml --locked --workspace
          python3 -m unittest discover -s gateway/tests -p test_encrypted_activity.py -v
          python3 -m unittest discover -s gateway/tests -p test_ingest_diagnostics.py -v
          python3 -m unittest discover -s gateway/tests -p test_sdk_media_evidence.py -v
          python3 -m unittest discover -s tests/host -p test_ci_apt.py -v
      - name: Install disposable encrypted-volume qualification tools
        run: python3 tools/ci-apt.py cryptsetup-bin e2fsprogs util-linux ffmpeg build-essential nasm pkg-config libclang-dev
      - name: Build pinned minimized native gateway media
        run: python3 tools/gateway-media/prepare.py --work "$RUNNER_TEMP/recording-native-runtime"
      - name: Build real camera framing and native publisher for the composed secure path
        run: |
          python3 gateway/tests/build_camera_source.py --output gateway/target/camera-reference
          cargo +1.90.0 build --manifest-path gateway/Cargo.toml --locked -p nxrs-camera-ingest --features publisher-sdk --bins
          python3 gateway/tools/native_python.py prepare --work /tmp/nxrs-composed-media-native --runtime /tmp/nxrs-composed-media --qualify
          /tmp/nxrs-composed-media/bin/python -m pip check
          /tmp/nxrs-composed-media/bin/python gateway/tools/python_environment.py inventory --report "$RUNNER_TEMP/python-encrypted-activity.json"
      - name: Build and qualify the actual SDK TLS camera worker for recording
        run: |
          python3 tools/boot/install_target.py --out "$RUNNER_TEMP/sdk-recording-tools"
          "$RUNNER_TEMP/sdk-recording-tools/venv/bin/python" -m unittest discover -s tests/host -p test_sdk_camera_password.py -v
          "$RUNNER_TEMP/sdk-recording-tools/venv/bin/python" tools/device-identity/qualify.py --work "$RUNNER_TEMP/sdk-recording"
      - name: Build and audit the pinned MediaMTX runtime
        run: |
          mkdir /tmp/nxrs-encrypted-media
          python3 gateway/tests/fetch_mediamtx.py --artifact linux_amd64 --output /tmp/nxrs-encrypted-media/mediamtx
          python3 gateway/tools/verify_media_evidence.py /tmp/nxrs-encrypted-media/mediamtx
          ffmpeg -version | head -n 3
          cryptsetup --version
          /tmp/nxrs-encrypted-media/mediamtx --version
      - name: Qualify the exact credential-only native SDK against this runtime
        run: |
          python3 gateway/tests/build_publisher_witness.py --output /tmp/nxrs-recording-decoder-witness
          python3 gateway/tests/publisher_reference.py --publisher gateway/target/debug/nxrs-rtsp-publisher --mediamtx /tmp/nxrs-encrypted-media/mediamtx --decoder-guard /tmp/nxrs-recording-decoder-witness/no-decoder.so
          python3 gateway/tests/reader_reference.py --reader gateway/target/debug/nxrs-rtsp-reader --publisher gateway/target/debug/nxrs-rtsp-publisher --mediamtx /tmp/nxrs-encrypted-media/mediamtx --decoder-guard /tmp/nxrs-recording-decoder-witness/no-decoder.so --report "$RUNNER_TEMP/recording-reader.json"
      - name: Reproduce and audit exact backup engine; exercise native authenticated-backup controls
        run: |
          python3 gateway/tests/fetch_restic.py --artifact linux_amd64 --output /tmp/nxrs-restic-backup
          /tmp/nxrs-restic-backup version
          python3 gateway/tools/verify_backup_evidence.py /tmp/nxrs-restic-backup
          NXRS_TEST_RESTIC=/tmp/nxrs-restic-backup cargo +1.90.0 test --manifest-path gateway/Cargo.toml --locked \
            -p nxrs-camera-activity --lib backup::tests::actual_restic_authenticates_encrypts_verifies_and_restores_a_frozen_store -- --ignored --exact
          cargo +1.90.0 test --manifest-path gateway/Cargo.toml --locked -p nxrs-camera-activity \
            --test backup_source --no-run --message-format=json > /tmp/nxrs-backup-sdk.jsonl
          python3 - <<'PYSDK'
          import json,pathlib
          artifacts=[json.loads(line) for line in pathlib.Path('/tmp/nxrs-backup-sdk.jsonl').read_text().splitlines()]
          paths=[value['executable'] for value in artifacts if value.get('reason')=='compiler-artifact'
                 and value.get('target',{}).get('name')=='backup_source' and value.get('executable')]
          assert len(paths)==1, 'one actual Store witness required'
          pathlib.Path('/tmp/nxrs-backup-sdk-path').write_text(paths[0])
          PYSDK
      - name: Qualify the exact recorder isolation helper before encrypted composition
        run: python3 gateway/tests/qualify_media_sandbox.py --launcher gateway/target/debug/nxrs-media-sandbox --work "$RUNNER_TEMP/recording-media-isolation" --ffmpeg /usr/lib/nxrs-gateway-media-qualification/bin/ffmpeg --ffprobe /usr/lib/nxrs-gateway-media-qualification/bin/ffprobe
      - name: Bind actual SDK, isolation and finalized clip receipts
        run: |
          python3 tools/gateway-media/qualify.py --work "$RUNNER_TEMP/recording-runtime-controls" \
            --reader-report "$RUNNER_TEMP/recording-reader.json" \
            --isolation-report "$RUNNER_TEMP/recording-media-isolation/qualification.json" \
            --report /usr/lib/nxrs-gateway-media-qualification/qualification.json
      - name: Require three complete secure compositions with fresh owned encrypted volumes
        run: |
          set -e
          for qualification_case in first second third; do
            printf 'QUALIFICATION_CASE %s\n' "$qualification_case"
            qualification_report="$RUNNER_TEMP/security-integration-qualification-$qualification_case.json"
            sudo env GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted /usr/bin/python3 gateway/tests/encrypted_activity_reference.py \
              --worker gateway/target/debug/nxrs-camera-activity \
              --ffmpeg /usr/lib/nxrs-gateway-media-qualification/bin/ffmpeg \
              --media-runtime /usr/lib/nxrs-gateway-media-qualification \
              --reader gateway/target/debug/nxrs-rtsp-reader \
              --media-sandbox gateway/target/debug/nxrs-media-sandbox \
              --isolation-qualification "$RUNNER_TEMP/recording-media-isolation/qualification.json" \
              --gateway gateway/target/debug/nxrs-gateway-control \
              --mediamtx /tmp/nxrs-encrypted-media/mediamtx \
              --backup gateway/target/debug/nxrs-activity-backup \
              --publisher-test "$(cat /tmp/nxrs-backup-sdk-path)" \
              --restic /tmp/nxrs-restic-backup \
              --ingest gateway/target/debug/nxrs-camera-ingest \
              --publisher gateway/target/debug/nxrs-rtsp-publisher \
              --camera-source "$RUNNER_TEMP/sdk-recording/sdk-camera-source" \
              --sdk-qualification "$RUNNER_TEMP/sdk-recording/qualification.json" \
              --tls-python /tmp/nxrs-composed-media/bin/python \
              --report "$qualification_report"
          done
      - name: Bind the public composition report to the clean checked-out revision
        run: |
          python3 - "$RUNNER_TEMP/security-integration-qualification.json" <<'PYEVIDENCE'
          import json,pathlib,re,subprocess,sys
          reference=None;volume_identities=set()
          destination=pathlib.Path(sys.argv[1])
          for qualification_case in ["first","second","third"]:
            path=destination.with_name("security-integration-qualification-"+qualification_case+".json")
            report=json.loads(path.read_bytes())
            cohort=(report['inputs'],report['executables'],report['media_runtime'],report['sdk_qualification_sha256'])
            assert reference is None or cohort==reference, 'same sources and executed resources required across full compositions'
            reference=cohort
            identity=report['owned_volume_identity_sha256']
            assert isinstance(identity,str) and re.fullmatch('[0-9a-f]{64}',identity) and identity not in volume_identities, 'fresh distinct owned volume required'
            volume_identities.add(identity)
            assert report['qualified'] and report['authenticated_camera_ingest_qualified'] and report['authenticated_backup_restore_qualified']
            assert report['sdk_camera_host_qualified'] and report['recording']['sdk_endpoint_used']
            assert report['recording']['camera_tls_front_end_test_only'] is False
            assert report['media_runtime']['qualified'] and report['media_runtime']==report['recording']['sdk_media']['media_runtime']
            assert not subprocess.check_output(['git','status','--porcelain']).strip(), 'clean qualification checkout required'
            report['repository_head']=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
            report['repository_has_changes']=False
            assert report['media_runtime']['checkout']==dict(commit=report['repository_head'],clean=True), 'same current native checkout required'
            report['qualification_case']=qualification_case
            raw=json.dumps(report,sort_keys=True,separators=(',',':'))+'\n'
            assert len(raw.encode())<=65536, 'bounded complete composition evidence'
            path.write_text(raw)
          assert len(volume_identities)==3
          destination.write_bytes(path.read_bytes())
          PYEVIDENCE
      - name: Retain only public composition evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: security-integration-qualification
          path: |
            /usr/lib/nxrs-gateway-media-qualification/build.json
            /usr/lib/nxrs-gateway-media-qualification/qualification.json
            ${{ runner.temp }}/recording-reader.json
            /tmp/nxrs-composed-media/native-qualification.json
            ${{ runner.temp }}/python-encrypted-activity.json
            /tmp/nxrs-encrypted-media/mediamtx.cdx.json
            /tmp/nxrs-encrypted-media/mediamtx.advisories.json
            /tmp/nxrs-encrypted-media/mediamtx.provenance.json
            ${{ runner.temp }}/security-integration-qualification-first.json
            ${{ runner.temp }}/security-integration-qualification-second.json
            ${{ runner.temp }}/security-integration-qualification.json
            ${{ runner.temp }}/recording-media-isolation/qualification.json
            ${{ runner.temp }}/sdk-recording/qualification.json
          if-no-files-found: error
          retention-days: 7
