# One-off dependency qualification only. Never copy this workflow into PR #374.
name: PR 374 terminal dependency qualification
on:
  push:
    branches: [work/pr-374-tui-security]
permissions:
  contents: read
concurrency:
  group: pr-374-tui-security-qualification
  cancel-in-progress: false
env:
  RUSTUP_TOOLCHAIN: 1.90.0
  CARGO_TERM_COLOR: never
  ORIGINAL_HEAD: 33463981d96971ce79b8204976d216b07ffa1f22
jobs:
  qualify:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.90.0
          components: rustfmt
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Resolve only the terminal dependency migration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qualification"
          git merge-base --is-ancestor "$ORIGINAL_HEAD" HEAD
          git show "$ORIGINAL_HEAD:Cargo.lock" > "$RUNNER_TEMP/qualification/before-Cargo.lock"
          cargo update -p ratatui --precise 0.30.2 2>&1 | tee "$RUNNER_TEMP/qualification/resolution.log"
          cargo fetch --locked
          rustfmt --edition 2021 tools/build/tests/tui_dependencies.rs
          git add Cargo.lock tools/build/tests/tui_dependencies.rs
          git -c user.name='Dependency qualification' -c user.email='qualification@users.noreply.github.com' commit -m 'Resolve and format terminal dependency candidate locally'
          git rev-parse HEAD > "$RUNNER_TEMP/qualification/local-candidate-sha.txt"
          cargo tree --locked -p nxrs-build -i lru | tee "$RUNNER_TEMP/qualification/lru-tree.txt"
          cargo tree --locked -p nxrs-build -i crossterm | tee "$RUNNER_TEMP/qualification/crossterm-tree.txt"
          python - <<'PY'
          import pathlib, tomllib
          packages = tomllib.loads(pathlib.Path('Cargo.lock').read_text())['package']
          lru = [p['version'] for p in packages if p['name'] == 'lru']
          assert lru and all(tuple(map(int, v.split('.'))) >= (0, 18, 2) for v in lru), lru
          crossterm = [p['version'] for p in packages if p['name'] == 'crossterm']
          assert len(crossterm) == 1 and crossterm[0].startswith('0.29.'), crossterm
          PY
      - name: Native configuration and build-tool regressions
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p nxrs-build-support -p nxrs-detector-build-support -p nxrs-build 2>&1 | tee "$RUNNER_TEMP/qualification/native-tests.log"
          python -m pip install kconfiglib==14.1.0
          python -m unittest discover -s tests/host -p test_nuttx_config.py -v 2>&1 | tee "$RUNNER_TEMP/qualification/kconfig-tests.log"
          python tools/check-architecture.py 2>&1 | tee "$RUNNER_TEMP/qualification/architecture.log"
      - name: Audit fix and retain vulnerable-lockfile negative control
        shell: bash
        run: |
          set -euo pipefail
          cargo install cargo-audit --version 0.22.2 --locked
          result=0
          cargo audit --file "$RUNNER_TEMP/qualification/before-Cargo.lock" --deny unsound --json > "$RUNNER_TEMP/qualification/before-audit.json" || result=$?
          test "$result" = 1
          python - <<'PY'
          import json, os, pathlib
          report = json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'qualification/before-audit.json').read_text())
          def ids(value):
              if isinstance(value, dict):
                  yield value.get('id')
                  for child in value.values():
                      yield from ids(child)
              elif isinstance(value, list):
                  for child in value:
                      yield from ids(child)
          assert {'RUSTSEC-2026-0002', 'RUSTSEC-2026-0253'} <= set(ids(report))
          PY
          cargo audit --file Cargo.lock --deny unsound --json > "$RUNNER_TEMP/qualification/after-audit.json"
          cargo audit --file gateway/Cargo.lock --deny unsound --json > "$RUNNER_TEMP/qualification/gateway-audit.json"
      - name: Export tested files without publishing or merging a branch
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          python - <<'PY'
          import hashlib, json, os, pathlib, shutil, subprocess
          root = pathlib.Path('.')
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'qualification'
          files = ['Cargo.lock', 'tools/build/Cargo.toml', 'tools/build/tests/tui_dependencies.rs']
          for name in files:
              dest = out / 'candidate' / name
              dest.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(root / name, dest)
          (out / 'candidate.patch').write_bytes(subprocess.check_output(['git', 'diff', os.environ['ORIGINAL_HEAD'], 'HEAD', '--', *files]))
          evidence = {
              'original_head': os.environ['ORIGINAL_HEAD'],
              'workflow_head': os.environ['GITHUB_SHA'],
              'local_candidate': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'run_id': os.environ['GITHUB_RUN_ID'],
              'sha256': {name: hashlib.sha256((root / name).read_bytes()).hexdigest() for name in files},
              'native_build_tool_tests': 'passed',
              'kconfig_host_tests': 'completed; inspect log for environment-dependent skips',
              'architecture_checker': 'passed',
              'original_lockfile_refused_both_lru_advisories': True,
              'root_and_gateway_audits_deny_unsound': 'passed',
              'full_pr_ci': 'not qualified by this workflow',
          }
          (out / 'evidence.json').write_text(json.dumps(evidence, indent=2) + '\n')
          PY
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr-374-tui-security-${{ github.run_id }}
          path: ${{ runner.temp }}/qualification/
          if-no-files-found: error
          retention-days: 14
