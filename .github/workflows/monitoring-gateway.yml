name: Monitoring gateway reference integration
on:
  pull_request:
    paths:
      - 'gateway/**'
      - '.github/workflows/monitoring-gateway.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: monitoring-gateway-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gateway:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
      - name: Compile, test and lint independent host workspace
        working-directory: gateway
        run: |
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
          cargo build --locked
      - name: Install reference test dependencies
        run: |
          python3 gateway/tools/native_python.py prepare --work /tmp/nxrs-media-test-native --runtime /tmp/nxrs-media-test --qualify
          /tmp/nxrs-media-test/bin/python -m pip check
          /tmp/nxrs-media-test/bin/python gateway/tools/python_environment.py inventory --report "$RUNNER_TEMP/python-monitoring-gateway.json"
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get -qq update
            sudo apt-get -qq install ffmpeg
          fi
          ffmpeg -version | head -n 3
      - name: Reproduce and audit pinned MediaMTX runtime
        run: |
          mkdir /tmp/nxrs-mediamtx
          python3 gateway/tests/fetch_mediamtx.py --artifact linux_amd64 --output /tmp/nxrs-mediamtx/mediamtx
          python3 gateway/tools/verify_media_evidence.py /tmp/nxrs-mediamtx/mediamtx
          /tmp/nxrs-mediamtx/mediamtx --version
      - name: Real HTTPS authentication, synthetic H264 publication and WHEP decoding
        run: |
          /tmp/nxrs-media-test/bin/python gateway/tests/reference_integration.py \
            --gateway gateway/target/debug/nxrs-gateway-control \
            --mediamtx /tmp/nxrs-mediamtx/mediamtx

      - name: Activity retention, 72-hour acceptance guards and process-group recovery
        run: |
          python3 -m unittest discover -s gateway/tests -p 'test_activity_*.py' -v
      - name: Build and require the separate RTSP reader and decoder isolation
        run: |
          python3 tools/ci-apt.py libavformat-dev libavcodec-dev libavutil-dev pkg-config libclang-dev
          cargo +1.90.0 build --manifest-path gateway/Cargo.toml --locked -p nxrs-camera-ingest --features publisher-sdk --bins
          python3 gateway/tests/qualify_media_sandbox.py --launcher gateway/target/debug/nxrs-media-sandbox --work "$RUNNER_TEMP/recording-isolation"
      - name: Motion clips, authenticated history, exact media download and restart persistence
        run: |
          for case in ordinary delayed-observer; do
            python3 gateway/tests/activity_reference.py --case "$case" --media-sandbox gateway/target/debug/nxrs-media-sandbox \
              --gateway gateway/target/debug/nxrs-gateway-control \
              --worker gateway/target/debug/nxrs-camera-activity \
              --mediamtx /tmp/nxrs-mediamtx/mediamtx
          done

  private-files-macos:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal
      - name: Qualify Unix file and lock rejection on macOS
        working-directory: gateway
        run: cargo test --locked -p nxrs-gateway-private-file

  recorder-process-macos:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build and test the Unix recorder with pinned Rust
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          cargo +1.90.0 test --manifest-path gateway/Cargo.toml --locked -p nxrs-camera-activity
          cargo +1.90.0 build --manifest-path gateway/Cargo.toml --locked -p nxrs-camera-activity
      - name: Actual recorder private-input, cancellation and native metadata controls
        run: python3 gateway/tests/activity_credentials.py --worker gateway/target/debug/nxrs-camera-activity
