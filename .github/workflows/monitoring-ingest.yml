name: Monitoring camera ingest
on:
  pull_request:
    paths:
      - '.github/scripts/install-ubuntu-packages.sh'
      - 'gateway/**'
      - 'app/camera-stream/**'
      - 'service/camera/**'
      - 'service/detection/**'
      - 'hal/detector/src/api.rs'
      - 'hal/tls/**'
      - 'tests/tls/**'
      - 'tests/nuttx-std/tls-identity/**'
      - 'upstream/mbedtls/**'
      - 'platform/profiles/linux*.toml'
      - 'platform/hal-build.rs'
      - 'tools/platform_config.py'
      - 'tools/hal_native.py'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'service/detection-wire/**'
      - 'docs/detection-protocol*'
      - 'service/stream/**'
      - 'hal/camera/src/api.rs'
      - '.github/workflows/monitoring-ingest.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: monitoring-ingest-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ingest:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Test, lint and build locked Rust ingest
        working-directory: gateway
        run: |
          cargo test --locked -p nxrs-camera-ingest
          cargo clippy --locked -p nxrs-camera-ingest --all-targets -- -D warnings
          cargo build --locked -p nxrs-gateway-control -p nxrs-camera-ingest
      - name: Compile actual camera contract and stream server from the PR merge
        run: |
          python3 gateway/tests/build_camera_source.py --output gateway/target/camera-reference
          python3 upstream/mbedtls/fetch.py
          NXRS_PLATFORM=linux-tls cargo build --locked -p nxrs-std-tls-identity --bin tls-endpoint --target-dir target/device-tls
          python3 -m unittest discover -s gateway/tests -p test_ingest_service.py -v
          python3 -m unittest discover -s gateway/tests -p test_rust_camera.py -v
      - name: TLS process controls and synthetic-media reference tools
        run: |
          bash .github/scripts/install-ubuntu-packages.sh ffmpeg libavformat-dev libavcodec-dev libavutil-dev libclang-dev pkg-config
          cargo test --manifest-path gateway/Cargo.toml --locked -p nxrs-camera-ingest small_paced_camera_frames_encode_within_startup_budget -- --ignored
          cargo build --manifest-path gateway/Cargo.toml --locked -p nxrs-rtsp-publisher
          cargo test --manifest-path gateway/Cargo.toml --locked -p nxrs-rtsp-publisher
          cargo clippy --manifest-path gateway/Cargo.toml --locked -p nxrs-rtsp-publisher --all-targets -- -D warnings
          python3 gateway/tests/tls_reference.py --ingest gateway/target/debug/nxrs-camera-ingest \
            --camera-source target/device-tls/debug/tls-endpoint
          python3 -m venv /tmp/nxrs-ingest-test
          /tmp/nxrs-ingest-test/bin/pip install -r gateway/tests/media-requirements.txt
          ffmpeg -version | head -n 3
          python3 - <<'PY'
          import hashlib, json, pathlib, urllib.request
          pin=json.load(open('gateway/deploy/dependencies.json'))['mediamtx']
          data=urllib.request.urlopen(pin['linux_amd64_url'],timeout=60).read()
          assert hashlib.sha256(data).hexdigest()==pin['linux_amd64_sha256'], 'MediaMTX checksum mismatch'
          pathlib.Path('/tmp/nxrs-ingest-mediamtx.tar.gz').write_bytes(data)
          PY
          mkdir /tmp/nxrs-ingest-mediamtx
          tar -xzf /tmp/nxrs-ingest-mediamtx.tar.gz -C /tmp/nxrs-ingest-mediamtx mediamtx
          cc -shared -fPIC gateway/tests/native/publisher_no_decoder.c $(pkg-config --cflags --libs libavcodec) -ldl -o /tmp/nxrs-publisher-no-decoder.so
          cc gateway/tests/native/publisher_decoder_control.c $(pkg-config --cflags --libs libavcodec) -o /tmp/nxrs-publisher-decoder-control
          /tmp/nxrs-publisher-decoder-control
          set +e
          LD_PRELOAD=/tmp/nxrs-publisher-no-decoder.so /tmp/nxrs-publisher-decoder-control
          result=$?
          set -e
          test "$result" = 91
          python3 gateway/tests/publisher_reference.py --publisher gateway/target/debug/nxrs-rtsp-publisher \
            --mediamtx /tmp/nxrs-ingest-mediamtx/mediamtx --decoder-guard /tmp/nxrs-publisher-no-decoder.so
      - name: Actual Rust source, two viewers, stall, reconnect and child cleanup
        run: |
          /tmp/nxrs-ingest-test/bin/python gateway/tests/ingest_reference.py \
            --gateway gateway/target/debug/nxrs-gateway-control \
            --ingest gateway/target/debug/nxrs-camera-ingest \
            --mediamtx /tmp/nxrs-ingest-mediamtx/mediamtx \
            --camera-source gateway/target/camera-reference/nxrs_camera_source
      - name: Generated ingest sandbox, SIGKILL cgroup cleanup and explicit recovery
        run: |
          sudo env GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted \
            /tmp/nxrs-ingest-test/bin/python gateway/tests/ingest_reference.py --systemd \
              --gateway gateway/target/debug/nxrs-gateway-control \
              --ingest gateway/target/debug/nxrs-camera-ingest \
              --mediamtx /tmp/nxrs-ingest-mediamtx/mediamtx \
              --tls-camera-source target/device-tls/debug/tls-endpoint
      - name: Annotated video preserves bounded children, shutdown and cgroup recovery
        run: |
          sudo env GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted \
            /tmp/nxrs-ingest-test/bin/python gateway/tests/ingest_reference.py --systemd --detections \
              --gateway gateway/target/debug/nxrs-gateway-control \
              --ingest gateway/target/debug/nxrs-camera-ingest \
              --mediamtx /tmp/nxrs-ingest-mediamtx/mediamtx \
              --tls-camera-source target/device-tls/debug/tls-endpoint
