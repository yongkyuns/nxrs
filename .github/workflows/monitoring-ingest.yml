name: Monitoring camera ingest
on:
  pull_request:
    paths:
      - 'gateway/**'
      - 'tools/enrollment/**'
      - 'tools/ci-apt.py'
      - 'service/stream/**'
      - 'service/camera/**'
      - 'app/camera-stream/**'
      - 'driver/device-identity/**'
      - 'tests/device-identity/**'
      - 'tests/host/test_sdk_camera_password.py'
      - 'tools/device-identity/**'
      - 'hal/camera/src/api.rs'
      - '.github/workflows/monitoring-ingest.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: monitoring-ingest-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ingest:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Test, lint and build locked Rust ingest
        working-directory: gateway
        run: |
          cargo test --locked -p nxrs-camera-ingest
          cargo clippy --locked -p nxrs-camera-ingest --all-targets -- -D warnings
          cargo build --locked -p nxrs-gateway-control -p nxrs-camera-ingest
      - name: Compile actual camera contract and stream server from the PR merge
        run: |
          python3 gateway/tests/build_camera_source.py --output gateway/target/camera-reference
          python3 -m unittest discover -s gateway/tests -p test_ingest_service.py -v
      - name: Install synthetic-media reference tools
        run: |
          python3 tools/ci-apt.py ffmpeg libavformat-dev libavcodec-dev libavutil-dev pkg-config libclang-dev
          python3 -m venv /tmp/nxrs-ingest-test
          /tmp/nxrs-ingest-test/bin/pip install -r gateway/tests/media-requirements.txt
          /tmp/nxrs-ingest-test/bin/pip install --require-hashes --only-binary=:all: -r tools/enrollment/requirements.txt
          /tmp/nxrs-ingest-test/bin/pip check
          ffmpeg -version | head -n 3
          python3 - <<'PY'
          import hashlib, json, pathlib, urllib.request
          pin=json.load(open('gateway/deploy/dependencies.json'))['mediamtx']
          data=urllib.request.urlopen(pin['linux_amd64_url'],timeout=60).read()
          assert hashlib.sha256(data).hexdigest()==pin['linux_amd64_sha256'], 'MediaMTX checksum mismatch'
          pathlib.Path('/tmp/nxrs-ingest-mediamtx.tar.gz').write_bytes(data)
          PY
          mkdir /tmp/nxrs-ingest-mediamtx
          tar -xzf /tmp/nxrs-ingest-mediamtx.tar.gz -C /tmp/nxrs-ingest-mediamtx mediamtx
      - name: Build and qualify the separate native SDK publisher
        run: |
          pkg-config --modversion libavformat libavcodec libavutil
          cargo test --manifest-path gateway/Cargo.toml --locked -p nxrs-camera-ingest --features publisher-sdk --bin nxrs-rtsp-publisher
          cargo clippy --manifest-path gateway/Cargo.toml --locked -p nxrs-camera-ingest --features publisher-sdk --bin nxrs-rtsp-publisher -- -D warnings
          cargo build --manifest-path gateway/Cargo.toml --locked -p nxrs-camera-ingest --features publisher-sdk --bin nxrs-rtsp-publisher
          sha256sum gateway/target/debug/nxrs-rtsp-publisher /usr/bin/ffmpeg
          python3 gateway/tests/build_publisher_witness.py --output /tmp/nxrs-publisher-decoder-witness
          python3 gateway/tests/publisher_reference.py --publisher gateway/target/debug/nxrs-rtsp-publisher --mediamtx /tmp/nxrs-ingest-mediamtx/mediamtx --decoder-guard /tmp/nxrs-publisher-decoder-witness/no-decoder.so
      - name: Actual Rust source, two viewers, stall, reconnect and child cleanup
        run: |
          /tmp/nxrs-ingest-test/bin/python gateway/tests/ingest_reference.py \
            --gateway gateway/target/debug/nxrs-gateway-control \
            --ingest gateway/target/debug/nxrs-camera-ingest \
            --mediamtx /tmp/nxrs-ingest-mediamtx/mediamtx \
            --camera-source gateway/target/camera-reference/nxrs_camera_source
      - name: Generated ingest sandbox, SIGKILL cgroup cleanup and explicit recovery
        run: |
          sudo env GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted \
            /tmp/nxrs-ingest-test/bin/python gateway/tests/ingest_reference.py --systemd \
              --gateway gateway/target/debug/nxrs-gateway-control \
              --ingest gateway/target/debug/nxrs-camera-ingest \
              --mediamtx /tmp/nxrs-ingest-mediamtx/mediamtx \
              --camera-source gateway/target/camera-reference/nxrs_camera_source

      - name: Mutual TLS ingest through actual Rust framing, encoder and two decoded viewers
        run: |
          /tmp/nxrs-ingest-test/bin/python gateway/tests/ingest_reference.py --camera-tls \
            --gateway gateway/target/debug/nxrs-gateway-control \
            --ingest gateway/target/debug/nxrs-camera-ingest \
            --mediamtx /tmp/nxrs-ingest-mediamtx/mediamtx \
            --camera-source gateway/target/camera-reference/nxrs_camera_source
      - name: Generated TLS credentials and required-TLS service in the hosted sandbox
        run: |
          sudo env GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted \
            /tmp/nxrs-ingest-test/bin/python gateway/tests/ingest_reference.py --systemd --camera-tls \
              --gateway gateway/target/debug/nxrs-gateway-control \
              --ingest gateway/target/debug/nxrs-camera-ingest \
              --mediamtx /tmp/nxrs-ingest-mediamtx/mediamtx \
              --camera-source gateway/target/camera-reference/nxrs_camera_source

      - name: Build and qualify the real SDK camera worker endpoint
        run: |
          python3 tools/boot/install_target.py --out "$RUNNER_TEMP/sdk-camera-tools"
          "$RUNNER_TEMP/sdk-camera-tools/venv/bin/python" -m unittest discover -s tests/host -p test_sdk_camera_password.py -v
          "$RUNNER_TEMP/sdk-camera-tools/venv/bin/python" tools/device-identity/qualify.py --work "$RUNNER_TEMP/sdk-camera"
      - name: Refuse private data in bounded startup failure observations
        run: |
          python3 -m unittest discover -s gateway/tests -p test_ingest_diagnostics.py -v
          python3 -m unittest discover -s gateway/tests -p test_sdk_media_evidence.py -v
      - name: Actual SDK camera TLS worker through encoder and two decoded viewers
        run: |
          /tmp/nxrs-ingest-test/bin/python gateway/tests/ingest_reference.py --camera-tls --sdk-camera \
            --gateway gateway/target/debug/nxrs-gateway-control \
            --ingest gateway/target/debug/nxrs-camera-ingest \
            --mediamtx /tmp/nxrs-ingest-mediamtx/mediamtx \
            --camera-source "$RUNNER_TEMP/sdk-camera/sdk-camera-source" \
            --sdk-qualification "$RUNNER_TEMP/sdk-camera/qualification.json" \
            --sdk-report "$RUNNER_TEMP/sdk-camera-media.json"
      - name: Retain bounded public SDK and media evidence only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sdk-camera-gateway-media
          path: |
            ${{ runner.temp }}/sdk-camera/qualification.json
            ${{ runner.temp }}/sdk-camera-media.json
          if-no-files-found: error
          retention-days: 7
