name: Rust std channel blocking and priority progress

on:
  pull_request:
    paths:
      - 'tests/std-channel-perf/**'
      - 'tests/nuttx-std/prepare-std.py'
      - 'tests/nuttx-std/check-abi.py'
      - 'tests/nuttx-std/link.py'
      - 'tests/nuttx-std/test-patches.py'
      - 'tests/nuttx-std/test-simpleboot-digest.py'
      - 'tools/build-nuttx-std-app.sh'
      - 'tools/platform_config.py'
      - 'tools/check-deployment.py'
      - 'tools/apply-nuttx-patches.py'
      - 'tools/nuttx-version.py'
      - 'tools/install-qemu-tools.sh'
      - 'upstream/rust-std/**'
      - 'upstream/libc/**'
      - 'upstream/nuttx/**'
      - 'upstream/nuttx-apps/**'
      - 'upstream/esp-hal-3rdparty/**'
      - 'platform/nuttx/**'
      - 'external/nuttx'
      - 'external/nuttx-apps'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/scripts/install-ubuntu-packages.sh'
      - '.github/workflows/std-channel-perf.yml'
  push:
    branches: [main]
    paths:
      - 'tests/std-channel-perf/**'
      - 'tests/nuttx-std/prepare-std.py'
      - 'tests/nuttx-std/check-abi.py'
      - 'tests/nuttx-std/link.py'
      - 'tests/nuttx-std/test-patches.py'
      - 'tests/nuttx-std/test-simpleboot-digest.py'
      - 'tools/build-nuttx-std-app.sh'
      - 'tools/platform_config.py'
      - 'tools/check-deployment.py'
      - 'tools/apply-nuttx-patches.py'
      - 'tools/nuttx-version.py'
      - 'tools/install-qemu-tools.sh'
      - 'upstream/rust-std/**'
      - 'upstream/libc/**'
      - 'upstream/nuttx/**'
      - 'upstream/nuttx-apps/**'
      - 'upstream/esp-hal-3rdparty/**'
      - 'platform/nuttx/**'
      - 'external/nuttx'
      - 'external/nuttx-apps'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/scripts/install-ubuntu-packages.sh'
      - '.github/workflows/std-channel-perf.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: std-channel-perf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy
      - name: Preserve exact checked-out source for offline reproduction
        run: |
          mkdir -p target/std-channel-host
          git archive --format=tar.gz --output=target/std-channel-host/source.tar.gz HEAD
          git rev-parse HEAD > target/std-channel-host/source-revision.txt
          sha256sum target/std-channel-host/source.tar.gz > target/std-channel-host/source.sha256
          # git archive includes tracked superproject files only; toolchains and
          # external submodule contents still require their pinned sources.
      - name: Evidence, private source isolation, and architecture negative controls
        run: |
          python3 -m unittest discover -s tests/std-channel-perf -p 'test_*.py' -v
          python3 -m unittest discover -s tests/host -p test_architecture.py -v
          python3 -m unittest discover -s tests/host -p test_hal_boundaries.py -v
          python3 -m unittest discover -s tests/host -p test_evaluation_docs.py -v
          python3 tools/check-architecture.py
      - name: Compile and exercise ordinary std on Linux (functional only)
        run: |
          cargo +1.90.0 fmt --check -p nxrs-std-channel-perf
          cargo +1.90.0 test --locked -p nxrs-std-channel-perf
          cargo +1.90.0 clippy --locked -p nxrs-std-channel-perf --all-targets -- -D warnings
          CARGO_PROFILE_RELEASE_OPT_LEVEL=2 CARGO_PROFILE_RELEASE_LTO=false cargo +1.90.0 build --locked --release -p nxrs-std-channel-perf
          mkdir -p target/std-channel-host
          timeout 30 target/release/std-channel-perf latency 64 8 > target/std-channel-host/console.log
          python3 tests/std-channel-perf/analyze.py target/std-channel-host/console.log --expect-outcome host-functional-only --output target/std-channel-host/analysis.json
          # Separate process: a different release profile is a distinct experiment.
          timeout 30 target/release/std-channel-perf latency 64 8 1 > target/std-channel-host/phase-console.log
          python3 tests/std-channel-perf/analyze.py target/std-channel-host/phase-console.log --expect-outcome host-functional-only --output target/std-channel-host/phase-analysis.json
          for warmup in 8 9; do
            prefix="target/std-channel-host/fixed-$warmup"
            timeout 30 target/release/std-channel-perf latency 64 "$warmup" fixed:1000 > "$prefix.log"
            python3 tests/std-channel-perf/analyze.py "$prefix.log" --expect-outcome host-functional-only --output "$prefix.json"
            python3 tests/std-channel-perf/analyze_alternation.py "$prefix.log" --output "$prefix-alternation.json"
          done
          if target/release/std-channel-perf witness-reserved > target/std-channel-host/rejected-witness.log 2>&1; then
            echo 'Host witness must refuse fixed-priority qualification' >&2
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: std-channel-host-functional
          path: target/std-channel-host/

  arm:
    needs: host
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: true
      - name: Pinned Rust and ARM build prerequisites
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          rustup toolchain install nightly-2025-09-15 --profile minimal --component rust-src
          bash .github/scripts/install-ubuntu-packages.sh gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi qemu-system-arm bison flex gperf kconfig-frontends genromfs libncurses-dev python3-venv xxd
          python3 -m venv target/std-channel-venv
          target/std-channel-venv/bin/pip install kconfiglib==14.1.0
          echo "$GITHUB_WORKSPACE/target/std-channel-venv/bin" >> "$GITHUB_PATH"
      - name: Native SIMPLE_BOOT digest-offset regression
        run: python3 tests/nuttx-std/test-simpleboot-digest.py -v
      - name: Native SysTick regression and patch provenance
        run: |
          python3 tests/nuttx-std/test-patches.py PatchSeriesTests.test_armv8m_systick_snapshot_preserves_elapsed_time_at_wrap PatchSeriesTests.test_both_series_apply_to_copies_and_record_provenance -v
      - name: Independent std images; one command per fresh QEMU boot
        shell: bash
        run: |
          set -euo pipefail
          for mode in latency witness-reserved witness-published; do
            out="target/std-channel-perf/mps2/$mode"
            python3 tests/std-channel-perf/build.py --platform mps2-an521-mock --mode "$mode" --out "$out"
            python3 tests/std-channel-perf/capture.py qemu --build-directory "$out" --mode "$mode" --samples 64 --warmup 8 --output "$out/run"
            # Preserve measured firmware and evidence; each next image gets a fresh SDK.
            rm -rf "$out/prepared/toolchain" "$out/firmware/cargo"
          done
      - name: Real Pico 2 headers and firmware link (no hardware timing claim)
        run: |
          python3 tests/std-channel-perf/build.py --platform pico2-mock --mode latency --clock-source native-counter --out target/std-channel-perf/pico2/latency
          rm -rf target/std-channel-perf/pico2/latency/prepared/toolchain target/std-channel-perf/pico2/latency/firmware/cargo
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: std-channel-arm-functional-and-build
          path: |
            target/std-channel-perf/**/build.json
            target/std-channel-perf/**/build.log
            target/std-channel-perf/**/run/
            target/std-channel-perf/**/prepared/*.json
            target/std-channel-perf/**/prepared/*.patch
            target/std-channel-perf/**/firmware/*.json
            target/std-channel-perf/**/firmware/*.config
            target/std-channel-perf/**/firmware/*.txt
            target/std-channel-perf/**/firmware/*.sha256
            target/std-channel-perf/**/firmware/nuttx/nuttx
            target/std-channel-perf/**/firmware/nuttx/nuttx.bin

  esp32s3:
    needs: host
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: true
      - name: Xtensa prerequisites
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          bash .github/scripts/install-ubuntu-packages.sh bison flex gperf kconfig-frontends genromfs cmake ninja-build libncurses-dev zlib1g-dev libgcrypt20 libglib2.0-0 libpixman-1-0 libsdl2-2.0-0 libslirp0 xxd
          python3 -m venv target/std-channel-venv
          target/std-channel-venv/bin/pip install kconfiglib==14.1.0 esptool==4.8.1
          echo "$GITHUB_WORKSPACE/target/std-channel-venv/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: target/qemu-tools/*.tar.xz
          key: qemu-linux-x64-9.0.0-20240606-gcc14.2-20241119-rust1.90.0.0-v1
      - name: Hash-pinned Xtensa SDK
        run: bash tools/install-qemu-tools.sh
      - name: Three ESP32-S3 N16R8 images (build only; physical runs are external)
        shell: bash
        run: |
          set -euo pipefail
          for mode in latency witness-reserved witness-published; do
            out="target/std-channel-perf/esp32s3/$mode"
            python3 tests/std-channel-perf/build.py --platform esp32s3-service-footprint --mode "$mode" --clock-source native-counter --out "$out"
            rm -rf "$out/prepared/toolchain" "$out/firmware/cargo"
          done
      - name: Opt-in RAM-prefix digest candidate (build only; no clean-boot claim)
        shell: bash
        run: |
          set -euo pipefail
          out="target/std-channel-perf/esp32s3/latency-rom-digest"
          python3 tests/std-channel-perf/build.py --platform esp32s3-service-footprint --mode latency --clock-source native-counter --boot-image-profile ram-prefix-digest-v1 --out "$out"
          rm -rf "$out/prepared/toolchain" "$out/firmware/cargo"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: std-channel-esp32s3-build-only
          path: |
            target/std-channel-perf/**/build.json
            target/std-channel-perf/**/build.log
            target/std-channel-perf/**/prepared/*.json
            target/std-channel-perf/**/prepared/*.patch
            target/std-channel-perf/**/firmware/*.json
            target/std-channel-perf/**/firmware/*.config
            target/std-channel-perf/**/firmware/*.txt
            target/std-channel-perf/**/firmware/*.sha256
            target/std-channel-perf/**/firmware/nuttx/nuttx
            target/std-channel-perf/**/firmware/nuttx/nuttx.bin
            target/std-channel-perf/**/firmware/nuttx/nuttx.merged.bin
            target/std-channel-perf/**/firmware/nuttx/nuttx.rom-digest.bin
