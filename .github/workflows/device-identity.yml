name: Device identity SDK and issuer qualification
on:
  pull_request:
    paths:
      - 'driver/device-identity/**'
      - 'tests/device-identity/**'
      - 'tests/host/test_device_identity_tools.py'
      - 'tests/boot/admission/sanitizer_probe.c'
      - 'tools/device-identity/**'
      - 'tools/enrollment/issuer.py'
      - 'tools/boot/requirements.txt'
      - 'tools/boot/target-requirements.txt'
      - 'tools/boot/install_target.py'
      - 'tools/boot/audit_signer.py'
      - 'security/device-identity-dependencies.json'
      - 'docs/device-identity.md'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/device-identity.yml'
  push:
    branches: [main]
    paths:
      - 'driver/device-identity/**'
      - 'tests/device-identity/**'
      - 'tests/host/test_device_identity_tools.py'
      - 'tools/device-identity/**'
      - 'tools/enrollment/issuer.py'
      - 'security/device-identity-dependencies.json'
      - 'docs/device-identity.md'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/device-identity.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: device-identity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  operator-advisories:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Complete target-tool audit and actual affected negative control
        run: |
          python -m venv "$RUNNER_TEMP/identity-auditor"
          "$RUNNER_TEMP/identity-auditor/bin/python" -m pip install pip-audit==2.10.1
          python -m unittest discover -s tools/boot -p test_audit_signer.py -v
          python tools/boot/audit_signer.py --target --audit-python "$RUNNER_TEMP/identity-auditor/bin/python"
  native:
    needs: operator-advisories
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Private hash-verified tools
        run: |
          rustup toolchain install 1.90.0 --profile minimal --component clippy
          python tools/boot/install_target.py --out "$RUNNER_TEMP/identity-tools"
          echo "$RUNNER_TEMP/identity-tools/venv/bin" >> "$GITHUB_PATH"
      - name: Source containment, production Rust and architecture controls
        run: |
          python -m unittest discover -s tests/host -p test_device_identity_tools.py -v
          cargo +1.90.0 clippy --locked -p nxrs-device-identity --all-targets -- -D warnings
          python tools/check-architecture.py
          python -m unittest discover -s tests/host -p test_architecture.py -v
          python -m unittest discover -s tests/host -p test_hal_boundaries.py -v
      - name: Actual SDK entropy, key, CSR, sanitizer and issuer execution
        run: |
          umask 077
          ulimit -c 0
          python tools/device-identity/qualify.py --work "$RUNNER_TEMP/identity-native"
      - name: Retain bounded public scope report only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: device-identity-host-${{ matrix.os }}
          path: ${{ runner.temp }}/identity-native/qualification.json
          if-no-files-found: error
          retention-days: 7
