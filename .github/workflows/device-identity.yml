      - 'security/device-tls-advisory-review.json'
      - 'service/camera/src/lib.rs'
      - 'service/stream/README.md'
      - 'service/stream/src/lib.rs'
      - 'service/stream/src/server.rs'
      - 'service/stream/src/worker.rs'
      - 'service/stream/tests/server.rs'
      - 'service/stream/tests/worker.rs'
      - 'tests/boot/admission/sanitizer_probe.c'
      - 'tests/device-identity/camera_source.rs'
      - 'tests/device-identity/certificate_fixture.py'
      - 'tests/device-identity/endpoint_fixture.py'
      - 'tests/device-identity/export_control.c'
      - 'tests/device-identity/frame.jpg'
      - 'tests/device-identity/native_allocation.rs'
      - 'tests/device-identity/native_allocator.h'
      - 'tests/device-identity/sdk.rs'
      - 'tests/device-identity/tls_fixture.py'
      - 'tests/host/test_device_identity_tools.py'
      - 'tests/host/test_device_tls_advisories.py'
      - 'tests/host/test_sdk_camera_password.py'
      - 'tools/boot/audit_signer.py'
      - 'tools/boot/install_target.py'
      - 'tools/boot/requirements.txt'
      - 'tools/boot/target-requirements.txt'
      - 'tools/boot/qualify.py'
      - 'tools/boot/target_plan.py'
      - 'tools/boot/upstream_advisories.py'
      - 'tools/device-identity/**'
      - 'tools/device-identity/advisories.py'
      - 'tools/device-identity/allocator_qualification.py'
      - 'tools/device-identity/crypto_config.h'
      - 'tools/device-identity/mbedtls_config.h'
      - 'tools/device-identity/qualify.py'
      - 'tools/enrollment/issuer.py'
      - 'tools/platform_config.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: device-identity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  operator-advisories:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Complete target-tool audit and actual affected negative control
        run: |
          python -m venv "$RUNNER_TEMP/identity-auditor"
          "$RUNNER_TEMP/identity-auditor/bin/python" -m pip install pip-audit==2.10.1
          python -m unittest discover -s tools/boot -p test_audit_signer.py -v
          python tools/boot/audit_signer.py --target --audit-python "$RUNNER_TEMP/identity-auditor/bin/python"
  native:
    needs: operator-advisories
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Private hash-verified tools
        run: |
          rustup toolchain install 1.90.0 --profile minimal --component clippy
          python tools/boot/install_target.py --out "$RUNNER_TEMP/identity-tools"
          echo "$RUNNER_TEMP/identity-tools/venv/bin" >> "$GITHUB_PATH"
      - name: Source containment, production Rust and architecture controls
        run: |
          python -m unittest discover -s tests/host -p test_device_identity_tools.py -v
          python -m unittest discover -s tests/host -p test_device_tls_advisories.py -v
          python -m unittest discover -s tests/host -p test_sdk_camera_password.py -v
          cargo +1.90.0 clippy --locked -p nxrs-device-identity -p nxrs-stream-service --all-targets -- -D warnings
          cargo +1.90.0 test --locked -p nxrs-stream-service -p nxrs-camera-stream
          python tools/check-architecture.py
          python -m unittest discover -s tests/host -p test_architecture.py -v
          python -m unittest discover -s tests/host -p test_hal_boundaries.py -v
      - name: Actual SDK entropy, key, CSR, sanitizer and issuer execution
        run: |
          umask 077
          ulimit -c 0
          python tools/device-identity/qualify.py --work "$RUNNER_TEMP/identity-native"
      - name: Current official advisories for this exact executed SDK and resolved profile
        run: |
          python tools/device-identity/advisories.py --sdk-work "$RUNNER_TEMP/identity-native" --out "$RUNNER_TEMP/identity-native-advisories.json"
      - name: Retain bounded public scope report only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: device-identity-host-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/identity-native/qualification.json
            ${{ runner.temp }}/identity-native-advisories.json
          if-no-files-found: error
          retention-days: 7
