name: Website

on:
  push:
    branches: [main]
    paths: ['website/**', 'docs/**', 'README.md', 'app/event-demo/**', '.github/workflows/website.yml']
  pull_request:
    paths: ['website/**', 'docs/**', 'README.md', 'app/event-demo/**', '.github/workflows/website.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and validate documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned site dependencies
        run: |
          python -m pip install -r website/requirements.txt playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Renderer regression tests
        run: |
          python -m unittest discover -s website/tests -p 'test_*.py' -v
          node --check website/static/site.js
          node --check website/static/theme.js
      - name: Build complete guide and reference library
        run: |
          python website/build.py --base-path /nxrs/ --out target/website
          python website/check.py target/website --base-path /nxrs/
          python website/build.py --base-path / --out target/website-root
          python website/check.py target/website-root --base-path /
      - name: Browser behavior and responsive layout
        run: python website/tests/browser.py --site target/website --base-path /nxrs/
      - name: Retain preview and qualification reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nxrs-website-preview
          path: |
            target/website
            target/website-browser
          if-no-files-found: error
          retention-days: 14
      - name: Package Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: target/website

  deploy:
    name: Publish GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Verify Pages publishing source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! build_type="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.build_type')"; then
            echo "::error::Enable Pages in Settings > Pages and select GitHub Actions as the source."
            exit 1
          fi
          if [ "$build_type" != "workflow" ]; then
            echo "::error::Set Settings > Pages > Build and deployment > Source to GitHub Actions. The docs/ folder contains Markdown sources, not the generated website."
            exit 1
          fi
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
