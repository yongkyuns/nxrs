name: Mac runner smoke test

on:
  # This opt-in smoke test uses GitHub-hosted macOS, never a developer Mac.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nxrs-mac-runner
  cancel-in-progress: false

jobs:
  runner-smoke-test:
    if: github.actor == 'yongkyuns'
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - name: Verify GitHub-hosted macOS runner is available
        run: |
          echo "Trusted push by $GITHUB_ACTOR on $GITHUB_REF"
          sw_vers
          uname -m
          git --version
