name: Reference diagram workbench
on:
  push:
    branches: [docs/reference-diagram-workbench]
    paths: [.github/workflows/reference-diagram-workbench.yml]
permissions:
  contents: write
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Clarify publication callback notation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('docs/references/openvela/diagrams/sensor-execution.d2')
          text=p.read_text()
          assert 'call upper.push_event()' in text
          p.write_text(text.replace('call upper.push_event()','call push_event callback'))
          p=Path('.workbench/expected-svg.json')
          expected=json.loads(p.read_text())
          expected['docs/references/openvela/diagrams/sensor-execution.svg']='ff98e40905c70614361eb86f4790bb2cae47a030479493c155a171e385dc24aa'
          p.write_text(json.dumps(expected,indent=2)+'\n')
          PY
      - name: Install verified renderer and browser harness
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/d2lang/d2/releases/download/v0.9.0/d2-v0.9.0-linux-amd64.tar.gz -o /tmp/d2.tar.gz
          echo '5669ddc46b99e942cc96078f4a4e36d5e62103348f4c05179ede27802fdd87a9  /tmp/d2.tar.gz' | sha256sum -c -
          tar -xzf /tmp/d2.tar.gz -C /tmp
          echo /tmp/d2-v0.9.0/bin >> "$GITHUB_PATH"
          python3 -m pip install playwright==1.58.0
          command -v google-chrome
      - name: Render twice and validate all routes
        shell: bash
        run: |
          set -euo pipefail
          bash docs/references/openvela/diagrams/render.sh
          bash docs/references/zephyr/diagrams/render.sh
      - name: Match all locally inspected SVGs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          expected=json.loads(Path('.workbench/expected-svg.json').read_text())
          assert len(expected)==11
          for name,want in expected.items():
              got=hashlib.sha256(Path(name).read_bytes()).hexdigest()
              assert got==want,(name,got,want)
              print('MATCH',name,got)
          PY
      - name: Browser text and connector qualification
        shell: bash
        run: |
          set -euo pipefail
          for ref in openvela zephyr; do
            python3 "docs/references/$ref/diagrams/check_browser.py" --chromium "$(command -v google-chrome)" --screenshots-dir "/tmp/atlas-previews/$ref"
          done
      - name: Commit qualified documentation to staging only
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only -- docs/references/px4)"
          git add docs/references/openvela docs/references/zephyr
          python3 - <<'PY'
          import subprocess
          files=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert files and all(p.startswith(('docs/references/openvela/','docs/references/zephyr/')) for p in files)
          assert not any('__pycache__' in p or p.endswith('.pyc') for p in files)
          print('Qualified changed files:',len(files))
          PY
          git config user.name 'nxrs diagram qualification'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: clarify upper-owned sensor publication callback'
          git push origin HEAD:refs/heads/docs/reference-diagram-workbench
          git rev-parse HEAD > /tmp/atlas-previews/QUALIFIED_COMMIT
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qualified-reference-atlases
          path: |
            docs/references/openvela
            docs/references/zephyr
            /tmp/atlas-previews
          retention-days: 7
