name: RTOS benchmark qualification (GitHub-hosted)
on:
  push:
    branches: [main, 'bench/**']
    paths: ['tests/rtos-bench/**', 'Cargo.toml', 'Cargo.lock', 'service/event/**', 'tools/build-nuttx-std-app.sh', 'tools/check-deployment.py', 'tests/host/test_deployment.py', '.github/workflows/rtos-bench.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rtos-bench-${{ github.ref }}
  cancel-in-progress: true
jobs:
  host:
    if: github.repository == 'yongkyuns/nxrs' && github.actor == 'yongkyuns'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Verify GitHub-hosted runner
        run: |
          set -eu
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Pinned Rust tools
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup toolchain install 1.90.0 --profile minimal --component clippy --component rustfmt
      - name: Test C, parsing, comparison guards and Rust cases
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/bench-logs
          bash -n tools/build-nuttx-std-app.sh
          python3 -m unittest discover -s tests/rtos-bench -p test_bench.py -v
          python3 -m unittest discover -s tests/rtos-bench -p test_isolate.py -v
          python3 -m unittest discover -s tests/host -p test_deployment.py -v
          cargo +1.90.0 fmt --check -p nxrs-rt-bench
          cargo +1.90.0 test --locked -p nxrs-rt-bench
          cargo +1.90.0 clippy --locked -p nxrs-rt-bench --all-targets -- -D warnings
          python3 tools/check-architecture.py
          python3 tests/rtos-bench/build.py fetch
          python3 tests/rtos-bench/build.py c-host
          CARGO_PROFILE_RELEASE_OPT_LEVEL=2 CARGO_PROFILE_RELEASE_LTO=false \
            cargo +1.90.0 build --locked --release -p nxrs-rt-bench
          python3 tests/rtos-bench/smoke.py target/release/rt-bench --rust > target/bench-logs/rust-host.json
          python3 tests/rtos-bench/smoke.py target/rtos-bench/c-host/mps2-an521-mock/posix/basic/raw-o2/rt_c > target/bench-logs/c-host.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rtos-bench-host
          path: |
            target/bench-logs/
            target/rtos-bench/**/*.json
            target/**/cc-command.txt
  arm:
    needs: host
    if: github.repository == 'yongkyuns/nxrs' && github.actor == 'yongkyuns'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Verify GitHub-hosted runner
        run: |
          set -eu
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          submodules: true
          persist-credentials: false
      - name: ARM prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi qemu-system-arm gdb-multiarch bison flex gperf kconfig-frontends genromfs libncurses-dev python3 python3-venv curl build-essential
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup toolchain install 1.90.0 --profile minimal
          rustup toolchain install nightly-2025-09-15 --profile minimal --component rust-src
          python3 -m venv target/rtbench-venv
          target/rtbench-venv/bin/pip install kconfiglib==14.1.0
          echo "$GITHUB_WORKSPACE/target/rtbench-venv/bin" >> "$GITHUB_PATH"
      - name: Build Rust NuttX image
        id: rust-build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/bench-logs
          python3 tests/rtos-bench/build.py rust-firmware 2>&1 | tee target/bench-logs/rust-arm-build.log
      - name: Compare all implementations one command per fresh boot
        id: fresh-matrix
        if: ${{ !cancelled() && steps.rust-build.outcome == 'success' }}
        run: |
          out=target/rtos-bench/rust-firmware/mps2-an521-mock/posix/basic/nxrs
          python3 tests/rtos-bench/isolate.py --image "$out/nuttx/nuttx" --out target/bench-logs/fresh-matrix --fresh-matrix --repeats 2
      - name: Build and exercise independent matched C
        if: ${{ !cancelled() && steps.rust-build.outcome == 'success' && steps.fresh-matrix.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          out=target/rtos-bench/rust-firmware/mps2-an521-mock/posix/basic/nxrs
          python3 tests/rtos-bench/build.py c-firmware --profile matched --matched-config "$out/resolved.config" 2>&1 | tee target/bench-logs/c-matched-build.log
          out=target/rtos-bench/c-firmware/mps2-an521-mock/posix/basic/matched
          python3 tests/rtos-bench/capture.py --mode c --image "$out/nuttx/nuttx" --log target/bench-logs/c-matched-console.log
      - name: Build matched minimal C and Rust std footprint images
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/rtos-bench/build.py rust-firmware --rust-bin rt-minimal 2>&1 | tee target/bench-logs/rust-minimal-build.log
          rust=target/rtos-bench/rust-firmware/mps2-an521-mock/footprint/minimal/nxrs
          python3 tests/rtos-bench/build.py c-firmware --suite footprint --profile matched --matched-config "$rust/resolved.config" 2>&1 | tee target/bench-logs/c-minimal-build.log
          c=target/rtos-bench/c-firmware/mps2-an521-mock/footprint/basic/matched
          python3 tests/rtos-bench/footprint.py --c-dir "$c" --rust-dir "$rust" --out target/bench-logs/minimal-footprint.json
      - name: Build and capture every original Thread-Metric case without suppressing failures
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p target/bench-logs
          failed=0
          for test in basic basic-observable cooperative preemptive memory message synchronization; do
            if ! python3 tests/rtos-bench/build.py c-firmware --suite thread-metric --case "$test" --window-seconds 1 2>&1 | tee "target/bench-logs/tm-$test-build.log"; then
              failed=1
              continue
            fi
            out="target/rtos-bench/c-firmware/mps2-an521-mock/thread-metric/$test/raw-o2"
            if ! python3 tests/rtos-bench/capture.py --mode thread-metric --window-seconds 1 --image "$out/nuttx/nuttx" --log "target/bench-logs/tm-$test-console.log"; then
              if test "$test" = basic; then
                echo "Known upstream Basic counter visibility failure retained as diagnostic" >&2
              else
                failed=1
              fi
            fi
          done
          exit "$failed"
      - name: Actual Pico 2 build and ABI gate (not a hardware run)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/rtos-bench/build.py rust-firmware --platform pico2-mock 2>&1 | tee target/bench-logs/pico2-build.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rtos-bench-arm
          path: |
            target/bench-logs/
            target/rtos-bench/**/*.json
            target/rtos-bench/**/*.config
            target/rtos-bench/**/provenance.txt
            target/rtos-bench/**/binaries.sha256
            target/rtos-bench/**/cc-command.txt
            target/rtos-bench/**/nuttx/nuttx
