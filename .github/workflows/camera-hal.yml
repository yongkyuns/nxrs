name: Camera HAL isolation
on:
  pull_request:
    paths:
      - 'hal/camera/**'
      - 'hal/common/**'
      - 'hal/support/**'
      - 'app/**'
      - 'service/**'
      - 'platform/hal-build.rs'
      - 'platform/profiles/**'
      - 'tools/platform_config.py'
      - 'tools/check-hal-isolation.py'
      - 'tools/check-architecture.py'
      - 'tests/host/test_architecture.py'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/camera-hal.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: camera-hal-${{ github.ref }}
  cancel-in-progress: true
jobs:
  isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.90.0
          targets: thumbv6m-none-eabi,wasm32-unknown-unknown
          components: clippy
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check HAL module isolation
        run: python tools/check-hal-isolation.py --capability camera --out target/camera-isolation
      - name: Independent provider contract tests
        run: |
          NXRS_PLATFORM=mock cargo test --locked -p nxrs-camera
          NXRS_PLATFORM=linux cargo test --locked -p nxrs-camera
      - name: Lint portable and native camera selections
        run: |
          NXRS_PLATFORM=mock cargo clippy --locked -p nxrs-hal-common -p nxrs-camera --all-targets -- -D warnings
          NXRS_PLATFORM=linux cargo clippy --locked -p nxrs-camera --all-targets -- -D warnings
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: camera-hal-isolation
          path: target/camera-isolation
