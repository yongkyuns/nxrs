name: ESP32-S3 QEMU (temporary frozen-image diagnostics)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qemu-failure-diagnostics-${{ github.ref }}
  cancel-in-progress: false

jobs:
  esp32s3:
    name: Diagnose frozen tracker image; not primary qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download the exact failed primary artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: 15173309907
          run-id: 45940991761
          repository: yongkyuns/nxrs
          github-token: ${{ github.token }}
          merge-multiple: true
          path: target/frozen-qualification
      - name: Verify original firmware, configuration and provenance
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import hashlib, json
          root = Path('target/frozen-qualification')
          manifest = json.loads(Path('tests/nuttx-std/tracker-sim/qmp-diagnostic-inputs.json').read_text())
          for name, expected in manifest['files'].items():
              actual = hashlib.sha256((root / name).read_bytes()).hexdigest()
              assert actual == expected, (name, actual, expected)
          provenance = (root / 'tracker-coexist-sim/provenance.txt').read_text().splitlines()
          assert 'nxrs=' + manifest['compiled_revision'] in provenance
          out = Path('target/qemu-diagnostics')
          out.mkdir(parents=True, exist_ok=True)
          (out / 'verified-inputs.json').write_text(json.dumps(manifest, indent=2) + '\n')
          print('Verified all seven frozen firmware/configuration/provenance inputs')
          PYTHON
      - name: Prepare the same pinned tracker QEMU
        run: |
          bash .github/scripts/install-ubuntu-packages.sh \
            libgcrypt20-dev libglib2.0-dev libpixman-1-dev libslirp-dev libfdt-dev \
            ninja-build cmake pkg-config binutils gcc g++
          bash tools/build-tracker-qemu.sh
          target/tracker-qemu/qemu-system-xtensa --version > target/qemu-diagnostics/emulator-version.txt
          sha256sum target/tracker-qemu/qemu-system-xtensa target/tracker-qemu/esp32s3_rev0_rom.bin > target/qemu-diagnostics/emulator.sha256
          nm target/frozen-qualification/tracker-coexist-sim/nuttx/nuttx > target/qemu-diagnostics/symbols.txt
          git rev-parse HEAD > target/qemu-diagnostics/harness-revision.txt
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        id: tracker-python
        with:
          python-version: '3.13'
      - name: Check diagnostic protocol controls and existing peer controls
        env:
          TRACKER_PYTHON: ${{ steps.tracker-python.outputs.python-path }}
        run: |
          "$TRACKER_PYTHON" -m venv target/tracker-peer
          target/tracker-peer/bin/pip install bumble==0.0.236 pillow==13.0.0 zxing-cpp==3.0.0
          target/tracker-peer/bin/python -m unittest discover -s tests/nuttx-std/tracker-sim -p test_qmp_failure.py -v
          target/tracker-peer/bin/python -m unittest discover -s tests/nuttx-std/tracker-sim -p test_coexist.py -v
      - name: Probe at most three fresh unchanged tiles boots; stop at first failure
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            export NXRS_TRACKER_QMP_FAILURE="target/qemu-diagnostics/attempt-$attempt-registers.json"
            if target/tracker-peer/bin/python tests/nuttx-std/tracker-sim/coexist.py \
                target/frozen-qualification/tracker-coexist-sim/nuttx/nuttx.merged.bin \
                --qemu target/tracker-qemu/qemu-system-xtensa --qemu-data target/tracker-qemu \
                --network-qemu target/tracker-qemu/qemu-system-xtensa --nm nm \
                --wall-clock --tiles --tile-write-loss --timeout 140 \
                --log "target/qemu-diagnostics/attempt-$attempt-console.log"; then
              printf 'passed; failure unreproduced on this boot\n' > "target/qemu-diagnostics/attempt-$attempt-status.txt"
            else
              result=$?
              printf 'failed; exit status %s; no further attempts\n' "$result" > "target/qemu-diagnostics/attempt-$attempt-status.txt"
              exit "$result"
            fi
          done
          printf 'Failure unreproduced in three fresh boots; no fix claimed.\n' > target/qemu-diagnostics/outcome.txt
      - name: Retain every attempt and exact original firmware
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qemu-frozen-image-diagnostics
          include-hidden-files: true
          path: |
            target/qemu-diagnostics/
            target/frozen-qualification/tracker-coexist-sim/nuttx/
            target/frozen-qualification/tracker-coexist-sim/provenance.txt
            target/frozen-qualification/tracker-coexist-sim/abi-report.json
            target/frozen-qualification/tracker-coexist-sim/resolved-profile.json
