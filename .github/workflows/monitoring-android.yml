name: Monitoring native Android app
on:
  pull_request:
    paths:
      - 'clients/android/**'
      - 'clients/ios/Tests/NxrsMonitorCoreTests/Fixtures/**'
      - 'clients/tests/**'
      - 'gateway/**'
      - 'service/detection-wire/**'
      - '.github/scripts/install-ubuntu-packages.sh'
      - '.github/workflows/monitoring-android.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: monitoring-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prepare pinned mutual TLS fixture dependencies
        run: python -m pip install --require-hashes --only-binary=:all: -r tools/enrollment/requirements.txt
      - name: Select JDK 17 and prepare SDK
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          for tool_dir in cmdline-tools/latest/bin platform-tools emulator; do
            echo "$ANDROID_HOME/$tool_dir" >> "$GITHUB_PATH"
          done
          sdk_manager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$sdk_manager" --licenses < <(yes) > /tmp/nxrs-sdk-licenses.log
          "$sdk_manager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Core contracts, native builds and lint with strict dependency verification
        run: |
          python3 -m unittest discover -s clients/tests -v
          clients/android/gradlew -p clients/android --no-daemon \
            :core:test :app:assembleDebug :app:assembleDebugAndroidTest \
            :app:assembleRelease :app:lintDebug
      - name: Prepare independent real camera and gateway publications
        run: |
          python3 tools/ci-apt.py ffmpeg build-essential nasm pkg-config libclang-dev
          rustup toolchain install 1.90.0 --profile minimal
          cargo build --manifest-path gateway/Cargo.toml --release --locked
          python3 gateway/tests/build_camera_source.py --output /tmp/nxrs-client-camera
          python3 tools/gateway-media/prepare.py --work "$RUNNER_TEMP/android-native-runtime"
          PKG_CONFIG_PATH=/usr/lib/nxrs-gateway-media-qualification/lib/pkgconfig \
            RUSTFLAGS="-C link-arg=-Wl,-rpath,/usr/lib/nxrs-gateway-media-qualification/lib" \
            cargo build --manifest-path gateway/Cargo.toml --release --locked \
              -p nxrs-camera-ingest -p nxrs-media-sandbox --features publisher-sdk --bins
          mkdir /tmp/nxrs-client-media
          python3 gateway/tests/fetch_mediamtx.py --artifact linux_amd64 --output /tmp/nxrs-client-media/mediamtx
          python3 gateway/tools/verify_media_evidence.py /tmp/nxrs-client-media/mediamtx
      - name: Enable emulator acceleration on the disposable runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-nxrs-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native decoder identity, two cameras, capture, expiry and teardown
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          avd-name: nxrs-multicamera-ci
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -skin 720x1280
          disable-animations: true
          script: |
            ANDROID_SERIAL=emulator-5554 NXRS_CLIENT_REPORT=/tmp/nxrs-android-metrics.json python3 clients/tests/multicamera_reference.py --case functional --gateway "$PWD/gateway/target/release/nxrs-gateway-control" --ingest "$PWD/gateway/target/release/nxrs-camera-ingest" --mediamtx /tmp/nxrs-client-media/mediamtx --camera-source /tmp/nxrs-client-camera/nxrs_camera_source --runner "$PWD/clients/tests/run_android_reference.py" --ffmpeg /usr/lib/nxrs-gateway-media-qualification/bin/ffmpeg --media-sandbox "$PWD/gateway/target/release/nxrs-media-sandbox"
      - name: Retain sanitized metrics and unit/lint results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nxrs-android-validation
          path: |
            /tmp/nxrs-android-metrics.json
            clients/android/core/build/test-results/test/*.xml
            clients/android/app/build/reports/lint-results-debug.xml
          if-no-files-found: ignore
          retention-days: 3
