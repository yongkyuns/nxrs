name: Monitoring combined strict VPN deployment
on:
  pull_request:
    paths:
      - 'gateway/**'
      - 'service/stream/**'
      - 'hal/camera/src/api.rs'
      - '.github/workflows/monitoring-combined.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: monitoring-combined-${{ github.ref }}
  cancel-in-progress: true
jobs:
  combined:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Unprivileged fixture policy and HTTPS readiness regressions
        run: python3 -m unittest discover -s gateway/tests -p 'test_combined_*.py' -v
      - name: Build locked gateway and actual camera-stream source
        run: |
          (cd gateway && cargo build --locked -p nxrs-gateway-control -p nxrs-camera-ingest)
          python3 gateway/tests/build_camera_source.py --output gateway/target/camera-reference
      - name: Install isolated reference tools and verify pinned media server
        run: |
          python3 tools/ci-apt.py ffmpeg nginx wireguard-tools nftables iproute2
          python3 -m venv /tmp/nxrs-combined-test
          /tmp/nxrs-combined-test/bin/pip install -r gateway/tests/media-requirements.txt
          systemctl --version | head -n 1
          ffmpeg -version | head -n 3
          python3 - <<'PY'
          import hashlib, json, pathlib, urllib.request
          pin=json.load(open('gateway/deploy/dependencies.json'))['mediamtx']
          data=urllib.request.urlopen(pin['linux_amd64_url'],timeout=60).read()
          assert hashlib.sha256(data).hexdigest()==pin['linux_amd64_sha256'], 'MediaMTX checksum mismatch'
          pathlib.Path('/tmp/nxrs-combined-media.tar.gz').write_bytes(data)
          PY
          mkdir /tmp/nxrs-combined-media
          tar -xzf /tmp/nxrs-combined-media.tar.gz -C /tmp/nxrs-combined-media mediamtx
      - name: Full generated service group, actual source, VPN, revocation and crash recovery
        run: |
          sudo env GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted \
            /tmp/nxrs-combined-test/bin/python gateway/tests/combined_reference.py \
              --gateway gateway/target/debug/nxrs-gateway-control \
              --ingest gateway/target/debug/nxrs-camera-ingest \
              --mediamtx /tmp/nxrs-combined-media/mediamtx \
              --camera-source gateway/target/camera-reference/nxrs_camera_source
