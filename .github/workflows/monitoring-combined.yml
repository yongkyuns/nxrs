name: Monitoring combined strict VPN deployment
on:
  pull_request:
    paths:
      - 'gateway/**'
      - 'tools/ci-apt.py'
      - 'service/stream/**'
      - 'hal/camera/src/api.rs'
      - '.github/workflows/monitoring-combined.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: monitoring-combined-${{ github.ref }}
  cancel-in-progress: true
jobs:
  combined:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Unprivileged fixture policy and HTTPS readiness regressions
        run: python3 -m unittest discover -s gateway/tests -p 'test_combined_*.py' -v
      - name: Build locked gateway and actual camera-stream source
        run: |
          (cd gateway && cargo build --locked -p nxrs-gateway-control -p nxrs-camera-ingest -p nxrs-media-sandbox)
          python3 gateway/tests/build_camera_source.py --output gateway/target/camera-reference
      - name: Install isolated reference tools and verify pinned media server
        run: |
          python3 tools/ci-apt.py ffmpeg nginx wireguard-tools nftables iproute2 libavformat-dev libavcodec-dev libavutil-dev pkg-config libclang-dev
          python3 gateway/tools/native_python.py prepare --work /tmp/nxrs-combined-test-native --runtime /tmp/nxrs-combined-test --qualify
          /tmp/nxrs-combined-test/bin/python -m pip check
          /tmp/nxrs-combined-test/bin/python gateway/tools/python_environment.py inventory --report "$RUNNER_TEMP/python-monitoring-combined.json"
          systemctl --version | head -n 1
          ffmpeg -version | head -n 3
          mkdir /tmp/nxrs-combined-media
          python3 gateway/tests/fetch_mediamtx.py --artifact linux_amd64 --output /tmp/nxrs-combined-media/mediamtx
          python3 gateway/tools/verify_media_evidence.py /tmp/nxrs-combined-media/mediamtx
      - name: Build the separate publisher against the installed native SDK
        run: |
          pkg-config --modversion libavformat libavcodec libavutil
          cargo build --manifest-path gateway/Cargo.toml --locked -p nxrs-camera-ingest --features publisher-sdk --bin nxrs-rtsp-publisher
      - name: Full generated service group, actual source, VPN, revocation and crash recovery
        run: |
          sudo env GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted \
            /tmp/nxrs-combined-test/bin/python gateway/tests/combined_reference.py \
              --gateway gateway/target/debug/nxrs-gateway-control \
              --ingest gateway/target/debug/nxrs-camera-ingest \
              --publisher gateway/target/debug/nxrs-rtsp-publisher \
              --mediamtx /tmp/nxrs-combined-media/mediamtx \
              --camera-source gateway/target/camera-reference/nxrs_camera_source
