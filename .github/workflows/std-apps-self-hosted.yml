name: Std recipes and active-object stress (GitHub-hosted)

on:
  push:
    branches: [main, 'apps/**']
    paths:
      - '.github/scripts/install-ubuntu-packages.sh'
      - 'app/**'
      - 'service/**'
      - 'hal/**'
      - 'shared/acquisition/**'
      - 'tools/detector-build-support/**'
      - 'driver/**'
      - 'shared/messaging/**'
      - 'tools/build-support/**'
      - 'tools/memory-explorer/**'
      - 'tools/nuttx-trace-to-perfetto.py'
      - 'platform/Cargo.toml'
      - 'platform/src/**'
      - 'platform/tests/**'
      - 'platform/*/profile.toml'
      - 'platform/*/profiles/**'
      - 'tests/profiles/mock.toml'
      - 'tests/profiles/mps2-an521-mock.toml'
      - 'tests/profiles/pico2-mock.toml'
      - 'tests/profiles/esp32s3-qemu-mock.toml'
      - 'tools/platform_config.py'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/config.toml'
      - 'tools/build/**'
      - 'platform/nuttx/**'
      - 'upstream/nuttx/**'
      - 'tools/nuttx-version.py'
      - 'tools/build-nuttx-std-app.sh'
      - 'tools/check-architecture.py'
      - 'tools/check-deployment.py'
      - 'tests/host/**'
      - 'tests/portable/**'
      - 'tests/native/**'
      - 'tests/camera-support/**'
      - 'tests/nuttx-std/**'
      - 'external/nuttx'
      - 'external/nuttx-apps'
      - 'upstream/nuttx-apps/patches/**'
      - 'upstream/build-patches.json'
      - 'upstream/esp-hal-3rdparty/patches/**'
      - 'tools/apply-nuttx-patches.py'
      - '.github/workflows/std-apps-self-hosted.yml'
  pull_request:
    # Stacked diagnostics PRs need the same native timing and heap witnesses
    # before their prerequisite lands; retain the path and actor restrictions.
    paths:
      - '.github/scripts/install-ubuntu-packages.sh'
      - 'app/**'
      - 'service/**'
      - 'hal/**'
      - 'shared/acquisition/**'
      - 'tools/detector-build-support/**'
      - 'driver/**'
      - 'shared/messaging/**'
      - 'tools/build-support/**'
      - 'tools/memory-explorer/**'
      - 'tools/nuttx-trace-to-perfetto.py'
      - 'platform/Cargo.toml'
      - 'platform/src/**'
      - 'platform/tests/**'
      - 'platform/*/profile.toml'
      - 'platform/*/profiles/**'
      - 'tests/profiles/mock.toml'
      - 'tests/profiles/mps2-an521-mock.toml'
      - 'tests/profiles/pico2-mock.toml'
      - 'tests/profiles/esp32s3-qemu-mock.toml'
      - 'tools/platform_config.py'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/config.toml'
      - 'tools/build/**'
      - 'platform/nuttx/**'
      - 'upstream/nuttx/**'
      - 'tools/nuttx-version.py'
      - 'tools/build-nuttx-std-app.sh'
      - 'tools/check-architecture.py'
      - 'tools/check-deployment.py'
      - 'tests/host/**'
      - 'tests/portable/**'
      - 'tests/native/**'
      - 'tests/camera-support/**'
      - 'tests/nuttx-std/**'
      - 'external/nuttx'
      - 'external/nuttx-apps'
      - 'upstream/nuttx-apps/patches/**'
      - 'upstream/build-patches.json'
      - 'upstream/esp-hal-3rdparty/patches/**'
      - 'tools/apply-nuttx-patches.py'
      - '.github/workflows/std-apps-self-hosted.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: std-apps-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  host:
    if: github.repository == 'yongkyuns/nxrs' && github.actor == 'yongkyuns'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      checks: read
    steps:
      - name: Verify GitHub-hosted Linux runner
        run: |
          set -eu
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pinned Rust
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup toolchain install 1.90.0 --profile minimal --component clippy --component rustfmt
          rustup target add --toolchain 1.90.0 thumbv6m-none-eabi wasm32-unknown-unknown
      - name: Test and lint both ordinary binaries
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.90.0 fmt --check -p nxrs-std-demo -p nxrs-ao-stress
          cargo +1.90.0 test --locked -p nxrs-std-demo -p nxrs-ao-stress
          cargo +1.90.0 clippy --locked -p nxrs-std-demo -p nxrs-ao-stress --all-targets -- -D warnings
          cargo +1.90.0 build --locked -p nxrs-std-demo -p nxrs-ao-stress
          python3 -m unittest discover -s tests/host -p test_std_apps.py -v
          python3 -m unittest discover -s tests/host -p test_nuttx_memory.py -v
      - name: Qualify workspace and native regressions
        shell: bash
        run: |
          set -euo pipefail
          # Adding default workspace members must also preserve existing apps.
          cargo +1.90.0 test --locked
          cargo +1.90.0 test --locked -p nxrs-build
          python3 -m unittest discover -s tests/host -p test_architecture.py -v
          python3 -m unittest discover -s tests/host -p test_deployment.py -v
          python3 -m unittest discover -s tests/host -p test_platform_profiles.py -v
          python3 tools/check-architecture.py
          NXRS_PLATFORM=mock cargo +1.90.0 test --locked -p nxrs-simulator
          NXRS_PLATFORM=mock cargo +1.90.0 run --locked -p nxrs-simulator --bin nxrs-simulator
          python3 tests/native/qualify.py
          export NXRS_PLATFORM=linux
          cargo +1.90.0 clippy --locked \
            -p nxrs-camera -p nxrs-storage \
            -p nxrs-camera-test-support -p nxrs-native-integration \
            --lib -- -D warnings
          unset NXRS_PLATFORM
          cargo +1.90.0 check --locked -p nxrs-camera-test-support --lib --target thumbv6m-none-eabi
          NXRS_PLATFORM=mock cargo +1.90.0 build --locked --release --lib -p nxrs-simulator --target wasm32-unknown-unknown
      - name: Check firmware discovery and app isolation
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.90.0 nxrs apps | tee /tmp/nxrs-std-apps.txt
          grep -x std-demo /tmp/nxrs-std-apps.txt
          grep -x ao-stress /tmp/nxrs-std-apps.txt
          for app in std-demo ao-stress; do
            for platform in pico2-mock mps2-an521-mock esp32s3-qemu-mock; do
              cargo +1.90.0 nxrs build --app "$app" --profile "$platform" --dry-run
            done
            cargo +1.90.0 tree --locked -p "nxrs-$app" > "/tmp/$app-tree.txt"
            ! grep -E 'nxrs-(imu|gnss|camera|storage)' "/tmp/$app-tree.txt"
          done
      - name: Record release behavior
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/std-apps
          cargo +1.90.0 run --locked --release -p nxrs-std-demo --bin std-demo | tee target/std-apps/std-demo.log
          cargo +1.90.0 run --locked --release -p nxrs-ao-stress --bin ao-stress -- --duration-ms 1000 --rounds 2 | tee target/std-apps/ao-stress.log
      - name: Record CI failure annotations without changing check results
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import urllib.request

          # Read only this repository's check results. No admin/billing access,
          # no status writes, and no false green replacements for other jobs.
          base = os.environ['GITHUB_API_URL'] + '/repos/' + os.environ['GITHUB_REPOSITORY']
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                     'Accept': 'application/vnd.github+json',
                     'X-GitHub-Api-Version': '2022-11-28'}
          def get(path):
              request = urllib.request.Request(base + path, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          rows = []
          for page in range(1, 21):
              checks = get('/commits/' + os.environ['GITHUB_SHA'] +
                           '/check-runs?filter=latest&per_page=100&page=' + str(page))['check_runs']
              for check in checks:
                  if check['conclusion'] not in ('failure', 'timed_out', 'action_required'):
                      continue
                  annotations = []
                  for annotation_page in range(1, 21):
                      items = get('/check-runs/' + str(check['id']) +
                                  '/annotations?per_page=100&page=' + str(annotation_page))
                      annotations.extend({k: item.get(k) for k in
                          ('annotation_level', 'title', 'message', 'path', 'start_line')} for item in items)
                      if len(items) < 100:
                          break
                  else:
                      raise RuntimeError('annotation pagination exceeded safety limit')
                  rows.append({'id': check['id'], 'name': check['name'],
                      'conclusion': check['conclusion'], 'url': check['html_url'],
                      'summary': check['output'].get('summary'), 'annotations': annotations})
              if len(checks) < 100:
                  break
          else:
              raise RuntimeError('check pagination exceeded safety limit')
          output = Path('target/std-apps/ci-failures.json')
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps({'head': os.environ['GITHUB_SHA'], 'checks': rows}, indent=2) + '\n')
          print(output.read_text())
          PY
      - name: Retain native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: std-apps-host
          path: target/std-apps/
          if-no-files-found: warn

  arm-firmware:
    needs: host
    if: github.repository == 'yongkyuns/nxrs' && github.actor == 'yongkyuns'
    strategy:
      fail-fast: false
      matrix:
        app: [std-demo, ao-stress]
    # Noble's QEMU 8.2.2 predates the MPS2 UART RX/TX wiring correction
    # (upstream 5a558be93ad628e5bed6e0ee062870f49251725c). Use the
    # corrected emulator, retaining the target's hardware-correct IRQs.
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    steps:
      - name: Verify GitHub-hosted Linux runner
        run: |
          set -eu
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          submodules: true
          persist-credentials: false
      - name: Install ARM prerequisites
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/install-ubuntu-packages.sh gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi qemu-system-arm gdb-multiarch bison flex gperf kconfig-frontends genromfs libncurses-dev python3 python3-venv curl build-essential
          qemu-system-arm --version
          export PATH="$HOME/.cargo/bin:$PATH"
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup toolchain install 1.90.0 --profile minimal
          rustup toolchain install nightly-2025-09-15 --profile minimal --component rust-src
          python3 -m venv target/std-apps-arm-venv
          target/std-apps-arm-venv/bin/pip install kconfiglib==14.1.0
          echo "$GITHUB_WORKSPACE/target/std-apps-arm-venv/bin" >> "$GITHUB_PATH"
      - name: Build real Pico 2 and Cortex-M33 QEMU firmware
        shell: bash
        env:
          APP: ${{ matrix.app }}
        run: |
          set -euo pipefail
          python3 tests/nuttx-std/test-patches.py
          for platform in mps2-an521-mock pico2-mock; do
            mkdir -p "target/firmware/$APP/$platform"
            if test "$APP" = ao-stress; then
              if test "$platform" = mps2-an521-mock; then
                export NXRS_NUTTX_DIAGNOSTIC_UNWIND=1
              else
                unset NXRS_NUTTX_DIAGNOSTIC_UNWIND
              fi
              bash tools/build-nuttx-std-app.sh \
                --app-manifest tests/nuttx-std/resources/Cargo.toml --app-package nxrs-std-resources \
                --bin ao-stack-stress --command ao_stress --priority 100 --stack-size 65536 \
                --platform "$platform" --out "target/firmware/$APP/$platform"
            elif test "$platform" = mps2-an521-mock; then
              NXRS_NUTTX_DIAGNOSTIC_UNWIND=1 cargo +1.90.0 nxrs build --app "$APP" --profile "$platform" --out "target/firmware/$APP/$platform" 2>&1 | tee "target/firmware/$APP/$platform/build.log"
            else
              cargo +1.90.0 nxrs build --app "$APP" --profile "$platform" --out "target/firmware/$APP/$platform" 2>&1 | tee "target/firmware/$APP/$platform/build.log"
            fi
          done
      - name: Execute twice on NuttX and verify actual output
        shell: bash
        env:
          APP: ${{ matrix.app }}
        run: |
          python3 tests/host/run-std-apps-nuttx.py --qemu "$(command -v qemu-system-arm)" --app "$APP" --image "target/firmware/$APP/mps2-an521-mock/nuttx/nuttx" --log "target/firmware/$APP/mps2-an521-mock/console.log"
      - name: Capture and verify stopped QEMU heap and task observations
        if: matrix.app == 'std-demo'
        shell: bash
        run: |
          set -euo pipefail
          output=target/firmware/std-demo/mps2-an521-mock
          python3 tools/memory-explorer/tests/qualify_qemu.py \
            --qemu "$(command -v qemu-system-arm)" \
            --gdb "$(command -v gdb-multiarch)" \
            --image "$output/nuttx/nuttx" \
            --config "$output/resolved.config" \
            --pynuttx "$output/nuttx/tools/pynuttx" \
            --output "$output/memory-explorer"
      - name: Import real QEMU observations and verify the Rust memory model
        if: matrix.app == 'std-demo'
        shell: bash
        run: |
          set -euo pipefail
          output="$GITHUB_WORKSPACE/target/firmware/std-demo/mps2-an521-mock"
          NXRS_MEMORY_QEMU_EVIDENCE="$output/memory-explorer" \
          NXRS_MEMORY_QEMU_ELF="$output/nuttx/nuttx" \
            cargo +1.90.0 test --locked -p nxrs-memory-explorer \
              --test qemu_capture --test board_projection -- --ignored --nocapture
      - name: Build and capture a native QEMU scheduler and IRQ timing witness
        if: matrix.app == 'std-demo'
        shell: bash
        run: |
          set -euo pipefail
          timing_sources="$GITHUB_WORKSPACE/target/memory-timing-sources"
          timing_output="$GITHUB_WORKSPACE/target/firmware/std-demo/mps2-an521-mock/memory-timing"
          mkdir -p "$timing_sources" "$timing_output"
          # Disposable pristine trees: never change the submodules or reuse the
          # patched NXRS application tree for this native qualification fixture.
          git clone --shared --no-checkout external/nuttx "$timing_sources/nuttx"
          git clone --shared --no-checkout external/nuttx-apps "$timing_sources/apps"
          git -C "$timing_sources/nuttx" checkout --detach "$(git -C external/nuttx rev-parse HEAD)"
          git -C "$timing_sources/apps" checkout --detach "$(git -C external/nuttx-apps rev-parse HEAD)"
          python3 tools/memory-explorer/tests/build_timing_nuttx.py \
            --nuttx "$timing_sources/nuttx" --apps "$timing_sources/apps" \
            --output "$timing_output/build" --qemu-timer-clock
          python3 tools/memory-explorer/tests/qualify_timing_qemu.py \
            --qemu "$(command -v qemu-system-arm)" \
            --image "$timing_output/build/nuttx" \
            --config "$timing_output/build/resolved.config" \
            --output "$timing_output/capture" --timeout 60
          python3 tools/nuttx-trace-to-perfetto.py \
            "$timing_output/capture/console.log" "$timing_output/capture/timing.json" \
            --source qemu-mps2-an521 --elf "$timing_output/build/nuttx"
      - name: Compare imported timing with actual UART endpoints and build identity
        if: matrix.app == 'std-demo'
        shell: bash
        run: |
          set -euo pipefail
          timing_output="$GITHUB_WORKSPACE/target/firmware/std-demo/mps2-an521-mock/memory-timing"
          NXRS_MEMORY_TIMING_EVIDENCE="$timing_output/capture" \
          NXRS_MEMORY_TIMING_ELF="$timing_output/build/nuttx" \
            cargo +1.90.0 test --locked -p nxrs-memory-explorer \
              --test timing_qemu -- --ignored --nocapture
      - name: Capture memory checkpoints and timing from one QEMU run
        if: matrix.app == 'std-demo'
        shell: bash
        run: |
          set -euo pipefail
          timing_sources="$GITHUB_WORKSPACE/target/memory-timing-sources"
          timing_output="$GITHUB_WORKSPACE/target/firmware/std-demo/mps2-an521-mock/memory-timing"
          python3 tools/memory-explorer/tests/qualify_lifecycle_qemu.py \
            --qemu "$(command -v qemu-system-arm)" \
            --gdb "$(command -v gdb-multiarch)" \
            --image "$timing_output/build/nuttx" \
            --config "$timing_output/build/resolved.config" \
            --pynuttx "$timing_sources/nuttx/tools/pynuttx" \
            --output "$timing_output/lifecycle"
          NXRS_MEMORY_LIFECYCLE_EVIDENCE="$timing_output/lifecycle" \
          NXRS_MEMORY_LIFECYCLE_ELF="$timing_output/build/nuttx" \
            cargo +1.90.0 test --locked -p nxrs-memory-explorer \
              --test lifecycle_qemu -- --ignored --nocapture
      - name: Qualify isolated heap topology replay against real QEMU headers
        if: matrix.app == 'std-demo'
        shell: bash
        run: |
          set -euo pipefail
          replay_sources="$GITHUB_WORKSPACE/target/memory-timing-sources"
          replay_output="$GITHUB_WORKSPACE/target/firmware/std-demo/mps2-an521-mock/heap-replay"
          # Reuse disposable sources only after the independent timing and
          # checkpoint witnesses have retained their final images and captures.
          python3 tools/memory-explorer/tests/build_replay_nuttx.py \
            --nuttx "$replay_sources/nuttx" --apps "$replay_sources/apps" \
            --output "$replay_output/build"
          python3 tools/memory-explorer/tests/qualify_replay_qemu.py \
            --qemu "$(command -v qemu-system-arm)" \
            --gdb "$(command -v gdb-multiarch)" \
            --build "$replay_output/build/build.json" \
            --output "$replay_output/capture"
          NXRS_HEAP_REPLAY_BUILD="$replay_output/build" \
          NXRS_HEAP_REPLAY_EVIDENCE="$replay_output/capture" \
            cargo +1.90.0 test --locked -p nxrs-memory-explorer \
              --test replay_qemu -- --ignored --nocapture
      - name: Qualify production allocator request and result notes
        if: matrix.app == 'std-demo'
        shell: bash
        run: |
          set -euo pipefail
          request_sources="$GITHUB_WORKSPACE/target/memory-timing-sources"
          request_output="$GITHUB_WORKSPACE/target/firmware/std-demo/mps2-an521-mock/heap-requests"
          # Earlier witnesses retain their pristine-source images before this
          # disposable tree receives the exact production allocator-note patch.
          python3 tools/memory-explorer/tests/build_requests_nuttx.py \
            --nuttx "$request_sources/nuttx" --apps "$request_sources/apps" \
            --output "$request_output/build"
          python3 tools/memory-explorer/tests/qualify_requests_qemu.py \
            --qemu "$(command -v qemu-system-arm)" \
            --build "$request_output/build/build.json" \
            --output "$request_output/capture"
          NXRS_HEAP_REQUEST_BUILD="$request_output/build" \
          NXRS_HEAP_REQUEST_EVIDENCE="$request_output/capture" \
            cargo +1.90.0 test --locked -p nxrs-memory-explorer \
              --test requests_qemu -- --ignored --nocapture
          # The allocator builder leaves its known production patch applied.
          # Restore only that patch after retaining and checking its evidence;
          # the next builder independently requires tracked-clean sources.
          request_patch="$GITHUB_WORKSPACE/upstream/nuttx/patches/0148-trace-heap-allocation-requests.patch"
          git -C "$request_sources/nuttx" apply --reverse --check "$request_patch"
          git -C "$request_sources/nuttx" apply --reverse "$request_patch"
      - name: Qualify measured capture windows and normalized event rates
        if: matrix.app == 'std-demo'
        shell: bash
        run: |
          set -euo pipefail
          timed_sources="$GITHUB_WORKSPACE/target/memory-timing-sources"
          timed_output="$GITHUB_WORKSPACE/target/firmware/std-demo/mps2-an521-mock/timed-capture"
          # Earlier fixtures have retained their images and evidence. Rebuild
          # the disposable trees with the exact production trace command patch.
          python3 tools/memory-explorer/tests/build_timed_capture_nuttx.py \
            --nuttx "$timed_sources/nuttx" --apps "$timed_sources/apps" \
            --output "$timed_output/build"
          python3 tools/memory-explorer/tests/qualify_timed_capture_qemu.py \
            --qemu "$(command -v qemu-system-arm)" \
            --build "$timed_output/build" \
            --output "$timed_output/capture" --timeout 60
          NXRS_TIMED_CAPTURE_BUILD="$timed_output/build" \
          NXRS_TIMED_CAPTURE_EVIDENCE="$timed_output/capture" \
            cargo +1.90.0 test --locked -p nxrs-memory-explorer \
              --test timed_capture_qemu -- --ignored --nocapture
      - name: Retain firmware qualification
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: std-apps-arm-${{ matrix.app }}
          path: |
            target/firmware/${{ matrix.app }}/*/*.log
            target/firmware/${{ matrix.app }}/*/*.json
            target/firmware/${{ matrix.app }}/*/*.config
            target/firmware/${{ matrix.app }}/*/nuttx/nuttx
            target/firmware/${{ matrix.app }}/*/nuttx/nuttx.map
            target/firmware/${{ matrix.app }}/*/nuttx/nuttx.uf2
            target/firmware/${{ matrix.app }}/*/nuttx/nuttx.bin
            target/firmware/${{ matrix.app }}/*/memory-explorer/
            target/firmware/${{ matrix.app }}/*/memory-timing/
            target/firmware/${{ matrix.app }}/*/heap-replay/
            target/firmware/${{ matrix.app }}/*/heap-requests/
            target/firmware/${{ matrix.app }}/*/timed-capture/
          if-no-files-found: warn
