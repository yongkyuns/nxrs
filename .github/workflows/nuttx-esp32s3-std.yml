name: NuttX ESP32-S3 ordinary Rust std
on:
  pull_request:
    paths:
      - '.github/scripts/install-ubuntu-packages.sh'
      - 'tests/nuttx-std/**'
      - 'tests/browser-threads/src/main.rs'
      - 'tests/browser-threads/Cargo.toml'
      - 'tools/install-qemu-tools.sh'
      - '.github/workflows/nuttx-esp32s3-std.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'external/nuttx'
      - 'external/nuttx-apps'
      - 'upstream/nuttx/**'
      - 'upstream/mcuboot/**'
      - 'tests/host/mcuboot_trailer_nor.c'
      - 'tests/host/mcuboot_native_erase.c'
      - 'tests/host/mcuboot_provisioning_guard.c'
      - 'tests/host/esp32s3_encrypted_write.c'
      - 'tests/host/mcuboot_encrypted_io.c'
      - 'tests/host/mcuboot_encrypted_trailer.c'
      - 'tests/host/mcuboot_security_counter.c'
      - 'tests/host/mcuboot_staging_io.c'
      - 'tests/host/mcuboot_image_class.c'
      - 'tools/nuttx-version.py'
      - 'upstream/nuttx-apps/patches/**'
      - 'tools/apply-nuttx-patches.py'
      - 'tools/mcuboot_image.py'
      - 'tools/mcuboot-requirements.txt'
      - 'tools/build-mcuboot.py'
      - 'tools/prepare-protected-factory.py'
      - 'hal/boot/**'
      - 'platform/nuttx/mcuboot.py'
      - 'tools/build-nuttx-std-app.sh'
      - 'platform/nuttx/platforms/esp32s3-camera-stream-mcuboot.toml'
      - 'platform/nuttx/platforms/esp32s3-camera-stream-protected-build.toml'
      - 'tests/host/test_mcuboot_image.py'
      - 'tests/host/test_mcuboot_build.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nuttx-esp32s3-std-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NUTTX_STD_COMPAT_FIXES: "1"
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ env.SOURCE_SHA }}
          submodules: true
      - name: Install host Cargo and emulator dependencies
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          bash .github/scripts/install-ubuntu-packages.sh bison flex gperf kconfig-frontends genromfs cmake ninja-build libncurses-dev zlib1g-dev libgcrypt20 libglib2.0-0 libpixman-1-0 libsdl2-2.0-0 libslirp0
          python3 -m venv target/esp-std-venv
          target/esp-std-venv/bin/pip install kconfiglib==14.1.0 esptool==4.8.1 -r tools/mcuboot-requirements.txt
          echo "$GITHUB_WORKSPACE/target/esp-std-venv/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: target/qemu-tools/*.tar.xz
          key: qemu-linux-x64-9.0.0-20240606-gcc14.2-20241119-rust1.90.0.0-v1
      - name: Install hash-verified pinned Xtensa tools
        run: bash tools/install-qemu-tools.sh
      - name: Check oracle and SDK isolation controls
        run: |
          source target/qemu-tools/environment.sh
          python3 -m unittest discover -s tests/host -p test_mcuboot_image.py -v
          python3 -m unittest discover -s tests/host -p test_mcuboot_build.py -v
          python3 tests/nuttx-std/run.py --self-test
          python3 tests/nuttx-std/check-abi.py --self-test
          python3 tests/nuttx-std/prepare-std.py --self-test
          python3 tests/nuttx-std/test-link.py --prefix xtensa-esp32s3-elf-
          python3 -m py_compile tests/nuttx-std/run.py tests/nuttx-std/check-abi.py tests/nuttx-std/prepare-std.py tests/nuttx-std/link.py tests/nuttx-std/test-link.py
          bash -n tests/nuttx-std/build.sh
      - name: Build normal Cargo binary and measure the Xtensa ABI
        shell: bash
        run: |
          set -o pipefail
          mkdir -p target/nuttx-esp32s3-std
          bash tests/nuttx-std/build.sh esp32s3 2>&1 | tee target/nuttx-esp32s3-std/build.log
      - name: Build signature-enforcing camera bootloader with a disposable public root
        shell: bash
        run: |
          source target/qemu-tools/environment.sh
          umask 077
          imgtool keygen -k target/mcuboot-test-key.pem -t ecdsa-p256
          imgtool getpub -k target/mcuboot-test-key.pem -e pem > target/mcuboot-test-root.pem
          git clone --quiet --bare https://github.com/mcu-tools/mcuboot.git target/mcuboot-source.git
          python3 tools/build-mcuboot.py --platform esp32s3-camera-stream-mcuboot \
            --mcuboot-repo target/mcuboot-source.git \
            --hal-repo target/nuttx-esp32s3-std/nuttx/arch/xtensa/src/esp32s3/esp-hal-3rdparty \
            --root target/mcuboot-test-root.pem --out target/mcuboot-camera
          NXRS_MCUBOOT_SOURCE=target/mcuboot-camera/mcuboot NXRS_BOOT_HAL_SOURCE=target/mcuboot-camera/hal \
            python3 -m unittest tests.host.test_mcuboot_build.BootWiringTests.test_encrypted_boot_and_native_flash_share_nor_contract \
              tests.host.test_mcuboot_build.BootWiringTests.test_native_staging_rejects_short_io_and_reserves_matching_metadata \
              tests.host.test_mcuboot_build.BootWiringTests.test_upstream_counter_policy_preserves_equal_counter_recovery \
              tests.host.test_mcuboot_build.BootWiringTests.test_native_image_class_matches_only_the_configured_product \
              tests.host.test_mcuboot_build.BootWiringTests.test_protected_native_trailer_fields_use_independent_program_units \
              tests.host.test_mcuboot_build.BootWiringTests.test_trailer_writes_never_erase_the_sector \
              tests.host.test_mcuboot_build.BootWiringTests.test_protected_startup_and_native_burn_refuse_provisioning
          xtensa-esp32s3-elf-gcc -Werror -I target/nuttx-esp32s3-std/nuttx/include \
            -I target/mcuboot-camera/mcuboot/boot/nuttx/include \
            -I target/mcuboot-camera/mcuboot/boot/bootutil/include \
            -c tests/nuttx-std/stream/ffi/boot_abi.c -o target/mcuboot-control-abi.o
          python3 -m espsecure generate_signing_key --version 2 --scheme rsa3072 target/mcuboot-rom-test-key.pem
          python3 -m espsecure extract_public_key --version 2 --keyfile target/mcuboot-rom-test-key.pem target/mcuboot-rom-test-root.pem
          python3 tools/build-mcuboot.py --platform esp32s3-camera-stream-protected-build \
            --mcuboot-repo target/mcuboot-source.git \
            --hal-repo target/nuttx-esp32s3-std/nuttx/arch/xtensa/src/esp32s3/esp-hal-3rdparty \
            --root target/mcuboot-test-root.pem --rom-key target/mcuboot-rom-test-key.pem \
            --rom-root target/mcuboot-rom-test-root.pem --out target/mcuboot-protected-build-only
      - name: Execute three fresh kernels and deliberate failure
        run: |
          source target/qemu-tools/environment.sh
          python3 tests/nuttx-std/run.py --image target/nuttx-esp32s3-std/nuttx/nuttx --esp32-image target/nuttx-esp32s3-std/nuttx/nuttx.merged.bin --output target/nuttx-esp32s3-std
      - name: Retain source, ABI, firmware and execution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nuttx-esp32s3-std-qualification
          path: |
            target/nuttx-esp32s3-std/*.elf
            target/nuttx-esp32s3-std/*.map
            target/nuttx-esp32s3-std/*.txt
            target/nuttx-esp32s3-std/*.log
            target/nuttx-esp32s3-std/*.json
            target/nuttx-esp32s3-std/*.jsonl
            target/nuttx-esp32s3-std/*.patch
            target/nuttx-esp32s3-std/*.config
            target/nuttx-esp32s3-std/*.sha256
            target/nuttx-esp32s3-std/abi-*
            target/nuttx-esp32s3-std/nuttx/nuttx
            target/nuttx-esp32s3-std/nuttx/nuttx.merged.bin
            target/nuttx-esp32s3-std/nuttx/nuttx.map
          if-no-files-found: warn
