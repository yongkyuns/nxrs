name: P4 event-path attribution images

on:
  pull_request:
    paths:
      - 'tests/event-path-trace/**'
      - 'tests/event-path-perf/**'
      - 'tests/std-channel-perf/**'
      - 'shared/messaging/**'
      - 'hal/imu/**'
      - 'platform/**'
      - 'upstream/**'
      - 'tests/nuttx-std/**'
      - 'tools/build-nuttx-std-app.sh'
      - 'tools/install-qemu-tools.sh'
      - 'tools/apply-nuttx-patches.py'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/event-path-trace.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: event-path-trace-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy
      - name: Bounded storage and evidence refusal controls
        run: |
          cargo +1.90.0 fmt --check -p nxrs-event-path-trace
          rustfmt +1.90.0 --edition 2021 --check tests/event-path-trace/rust/src/{firmware,recorder}.rs
          cargo +1.90.0 test --locked -p nxrs-event-path-trace
          cargo +1.90.0 clippy --locked -p nxrs-event-path-trace --all-targets -- -D warnings
          python3 -m unittest discover -s tests/event-path-trace -p 'test_*.py' -v
          python3 tools/check-architecture.py
          python3 -m unittest discover -s tests/host -p test_architecture.py -v
          python3 -m unittest discover -s tests/host -p test_hal_boundaries.py -v
  esp32s3:
    needs: host
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        mode: [baseline, trace]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: true
      - name: Pinned Xtensa prerequisites
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          bash .github/scripts/install-ubuntu-packages.sh bison flex gperf kconfig-frontends genromfs cmake ninja-build libncurses-dev zlib1g-dev libgcrypt20 libglib2.0-0 libpixman-1-0 libsdl2-2.0-0 libslirp0 xxd
          python3 -m venv target/event-trace-venv
          target/event-trace-venv/bin/pip install kconfiglib==14.1.0 esptool==4.8.1
          echo "$GITHUB_WORKSPACE/target/event-trace-venv/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: target/qemu-tools/*.tar.xz
          key: qemu-linux-x64-9.0.0-20240606-gcc14.2-20241119-rust1.90.0.0-v1
      - name: Build and verify separate diagnostic image
        run: |
          bash tools/install-qemu-tools.sh
          source target/qemu-tools/environment.sh
          python3 tests/event-path-trace/build.py --mode '${{ matrix.mode }}' --out target/event-path-trace
          python3 - <<'PYCODE'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'tests/event-path-trace')
          import capture
          record = capture.receipt(Path('target/event-path-trace'))
          print('Verified build-only P4', record['mode'], record['build_id'])
          PYCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: event-path-trace-${{ matrix.mode }}-build-only
          path: |
            target/event-path-trace/*.json
            target/event-path-trace/*.log
            target/event-path-trace/*.txt
            target/event-path-trace/native-sources/
            target/event-path-trace/prepared/*.json
            target/event-path-trace/firmware/*.json
            target/event-path-trace/firmware/*.jsonl
            target/event-path-trace/firmware/*.config
            target/event-path-trace/firmware/*.txt
            target/event-path-trace/firmware/*.patch
            target/event-path-trace/firmware/nuttx/nuttx
            target/event-path-trace/firmware/nuttx/nuttx.rom-digest.bin
            target/event-path-trace/firmware/nuttx/nuttx.merged.bin
            target/event-path-trace/firmware/nuttx/arch/xtensa/src/common/espressif/esp_loader.c
