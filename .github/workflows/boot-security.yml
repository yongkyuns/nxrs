name: Verified boot host qualification
on:
  pull_request:
    paths:
      - 'tools/boot/**'
      - 'tests/boot/**'
      - 'tests/host/test_boot_qualification.py'
      - 'security/boot-dependencies.json'
      - '.github/workflows/boot-security.yml'
  push:
    branches: [main]
    paths:
      - 'tools/boot/**'
      - 'tests/boot/**'
      - 'security/boot-dependencies.json'
      - '.github/workflows/boot-security.yml'
  schedule:
    - cron: '47 7 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: boot-security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install exact Rust compiler and advisory scanner
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          cargo +1.90.0 install cargo-audit --version 0.22.2 --locked
      - name: Qualification failure controls and architecture regressions
        run: |
          python -m unittest discover -s tests/host -p test_boot_qualification.py -v
          python tools/check-architecture.py
          python -m unittest discover -s tests/host -p test_architecture.py -v
          python -m unittest discover -s tests/host -p test_hal_boundaries.py -v
      - name: Build and exercise real RSA-3072 bootutil with frozen inputs
        run: python tools/boot/qualify.py --work "$RUNNER_TEMP/nxrs-boot-native"
      - name: Retain only the public host-scope qualification report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: boot-host-${{ matrix.os }}
          path: ${{ runner.temp }}/nxrs-boot-native/qualification.json
          if-no-files-found: error
          retention-days: 7
