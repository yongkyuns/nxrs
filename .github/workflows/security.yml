name: Security baseline
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
      - name: Policy failure controls and workflow pins
        run: |
          python3 -m unittest discover -s tests/host -p 'test_security*.py' -v
          python3 -m unittest discover -s gateway/tests -p test_parser_fuzz_evidence.py -v
          python3 -m unittest discover -s gateway/tests -p test_native_media_evidence.py -v
          python3 tools/check-security.py policy
  rust-advisories:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        workspace: [root, gateway, fuzz]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned auditor
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          cargo +1.90.0 install cargo-audit --version 0.22.2 --locked
      - name: Audit committed lockfile against current RustSec advisories
        env:
          NXRS_AUDIT_WORKSPACE: ${{ matrix.workspace }}
        run: python3 tools/check-security.py audit --workspace "$NXRS_AUDIT_WORKSPACE"

  enrollment-host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install hash-verified operator environment
        run: |
          python -m venv /tmp/nxrs-enrollment
          /tmp/nxrs-enrollment/bin/python -m pip install --require-hashes --only-binary=:all: -r tools/enrollment/requirements.txt
      - name: Qualify issuance, recovery and real mutual TLS with synthetic keys
        run: |
          /tmp/nxrs-enrollment/bin/python -m unittest discover -s tools/enrollment -p test_issuer.py -v
          /tmp/nxrs-enrollment/bin/python -c 'import sys, ssl, cryptography; from cryptography.hazmat.backends import default_backend; print(sys.version); print(ssl.OPENSSL_VERSION); print(cryptography.__version__, default_backend().openssl_version_text())'
  enrollment-advisories:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Audit complete operator dependency pins
        run: |
          python -m venv /tmp/nxrs-enrollment-audit
          /tmp/nxrs-enrollment-audit/bin/python -m pip install pip-audit==2.10.1
          /tmp/nxrs-enrollment-audit/bin/python -m pip_audit --disable-pip --require-hashes -r tools/enrollment/requirements.txt

  authenticated-ingest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Build, test and lint the independent gateway workspace
        run: |
          rustup toolchain install 1.90.0 --profile minimal --component clippy
          cargo +1.90.0 test --manifest-path gateway/Cargo.toml --locked --workspace
          cargo +1.90.0 clippy --manifest-path gateway/Cargo.toml --locked --workspace --all-targets -- -D warnings
          cargo +1.90.0 build --manifest-path gateway/Cargo.toml --locked -p nxrs-camera-ingest
      - name: Install hash-verified host enrollment environment
        run: |
          python -m venv /tmp/nxrs-gateway-tls
          /tmp/nxrs-gateway-tls/bin/python -m pip install --require-hashes --only-binary=:all: -r tools/enrollment/requirements.txt
      - name: Qualify the actual TLS ingest process and encoder ownership boundary
        run: /tmp/nxrs-gateway-tls/bin/python gateway/tests/tls_reference.py --ingest gateway/target/debug/nxrs-camera-ingest

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install hash-pinned scanner and verify detection/redaction
        run: |
          python3 tools/scan-secrets.py install --output "$RUNNER_TEMP/gitleaks"
          python3 tools/scan-secrets.py self-test --scanner "$RUNNER_TEMP/gitleaks"
          python3 tools/scan-secrets.py scan --scanner "$RUNNER_TEMP/gitleaks"
  parser-fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [mjpeg, enrollment, recording_csv, recording_event]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
      - name: Install isolated pinned fuzz toolchain
        run: |
          rustup toolchain install nightly-2026-03-01 --profile minimal --component rust-src
          cargo +nightly-2026-03-01 install cargo-fuzz --version 0.13.2 --locked
      - name: Fuzz production parsers with AddressSanitizer and bounded resources
        env:
          NXRS_FUZZ_TARGET: ${{ matrix.target }}
        run: |
          cargo +nightly-2026-03-01 fetch --locked --manifest-path gateway/fuzz/Cargo.toml
          python3 gateway/fuzz/run.py --target "$NXRS_FUZZ_TARGET" --work "$RUNNER_TEMP/parser-$NXRS_FUZZ_TARGET"
      - name: Retain bounded public parser evidence only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: parser-fuzz-${{ matrix.target }}
          path: ${{ runner.temp }}/parser-${{ matrix.target }}/qualification.json
          if-no-files-found: error
          retention-days: 7

  native-media-fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install native qualification compiler
        run: python3 tools/ci-apt.py clang-18 make
      - name: Instrument and fuzz actual native image2pipe and MJPEG code
        run: python3 tools/native-media/qualify.py --cc clang-18 --cxx clang++-18 --work "$RUNNER_TEMP/native-media"
      - name: Retain bounded public native parser evidence only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-image2pipe-mjpeg-fuzz
          path: ${{ runner.temp }}/native-media/qualification.json
          if-no-files-found: error
          retention-days: 7
