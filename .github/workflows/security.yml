name: Security baseline
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
      - name: Policy failure controls and workflow pins
        run: |
          python3 -m unittest discover -s tests/host -p test_security.py -v
          python3 tools/check-security.py policy
  rust-advisories:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        workspace: [root, gateway]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned auditor
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          cargo +1.90.0 install cargo-audit --version 0.22.2 --locked
      - name: Audit committed lockfile against current RustSec advisories
        env:
          NXRS_AUDIT_WORKSPACE: ${{ matrix.workspace }}
        run: python3 tools/check-security.py audit --workspace "$NXRS_AUDIT_WORKSPACE"

  enrollment-host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install hash-verified operator environment
        run: |
          python -m venv /tmp/nxrs-enrollment
          /tmp/nxrs-enrollment/bin/python -m pip install --require-hashes --only-binary=:all: -r tools/enrollment/requirements.txt
      - name: Qualify issuance, recovery and real mutual TLS with synthetic keys
        run: |
          /tmp/nxrs-enrollment/bin/python -m unittest discover -s tools/enrollment -p test_issuer.py -v
          /tmp/nxrs-enrollment/bin/python -c 'import sys, ssl, cryptography; from cryptography.hazmat.backends import default_backend; print(sys.version); print(ssl.OPENSSL_VERSION); print(cryptography.__version__, default_backend().openssl_version_text())'
  enrollment-advisories:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Audit complete operator dependency pins
        run: |
          python -m venv /tmp/nxrs-enrollment-audit
          /tmp/nxrs-enrollment-audit/bin/python -m pip install pip-audit==2.10.1
          /tmp/nxrs-enrollment-audit/bin/python -m pip_audit --disable-pip --require-hashes -r tools/enrollment/requirements.txt
