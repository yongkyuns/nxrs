name: Security baseline
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
      - name: Policy failure controls and workflow pins
        run: |
          python3 -m unittest discover -s tests/host -p 'test_security*.py' -v
          python3 tools/check-security.py policy
  rust-advisories:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        workspace: [root, gateway, fuzz]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned auditor
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          cargo +1.90.0 install cargo-audit --version 0.22.2 --locked
      - name: Audit committed lockfile against current RustSec advisories
        env:
          NXRS_AUDIT_WORKSPACE: ${{ matrix.workspace }}
        run: python3 tools/check-security.py audit --workspace "$NXRS_AUDIT_WORKSPACE"
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install hash-pinned scanner and verify detection/redaction
        run: |
          python3 tools/scan-secrets.py install --output "$RUNNER_TEMP/gitleaks"
          python3 tools/scan-secrets.py self-test --scanner "$RUNNER_TEMP/gitleaks"
          python3 tools/scan-secrets.py scan --scanner "$RUNNER_TEMP/gitleaks"
  parser-fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [mjpeg, enrollment]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
      - name: Install isolated pinned fuzz toolchain
        run: |
          rustup toolchain install nightly-2026-03-01 --profile minimal --component rust-src
          cargo +nightly-2026-03-01 install cargo-fuzz --version 0.13.2 --locked
      - name: Fuzz production parsers with AddressSanitizer and bounded resources
        env:
          NXRS_FUZZ_TARGET: ${{ matrix.target }}
        run: |
          cargo +nightly-2026-03-01 fetch --locked --manifest-path gateway/fuzz/Cargo.toml
          sha256sum gateway/fuzz/Cargo.lock > "$RUNNER_TEMP/fuzz-lock.sha256"
          mkdir -p "gateway/fuzz/corpus/$NXRS_FUZZ_TARGET"
          cargo +nightly-2026-03-01 fuzz run --fuzz-dir gateway/fuzz "$NXRS_FUZZ_TARGET" \
            "gateway/fuzz/corpus/$NXRS_FUZZ_TARGET" "gateway/fuzz/seeds/$NXRS_FUZZ_TARGET" -- \
            -max_total_time=60 -timeout=5 -rss_limit_mb=1024 -max_len=524289
          sha256sum -c "$RUNNER_TEMP/fuzz-lock.sha256"
