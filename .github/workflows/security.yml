name: Security checks
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true
jobs:
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install pinned scanner, verify controls and scan available history
        run: |
          python3 tools/scan-secrets.py install --output "$RUNNER_TEMP/gitleaks"
          python3 tools/scan-secrets.py self-test --scanner "$RUNNER_TEMP/gitleaks"
          python3 tools/scan-secrets.py scan --scanner "$RUNNER_TEMP/gitleaks"
  rust-advisories:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Install pinned auditor
        run: cargo +1.90.0 install cargo-audit --version 0.22.2 --locked
      - name: Audit root lockfile against current advisories
        run: cargo +1.90.0 audit --file Cargo.lock --deny unsound
      - name: Audit independent gateway lockfile
        if: success() || failure()
        run: cargo +1.90.0 audit --file gateway/Cargo.lock --deny unsound --no-fetch
      - name: Audit Python test requirements and verify vulnerable-package refusal
        if: success() || failure()
        run: |
          python3 -m venv "$RUNNER_TEMP/python-audit"
          "$RUNNER_TEMP/python-audit/bin/pip" install pip-audit==2.10.1
          printf 'aiohttp==3.12.15\n' > "$RUNNER_TEMP/vulnerable-python.txt"
          audit_result=0
          "$RUNNER_TEMP/python-audit/bin/pip-audit" --strict --disable-pip --no-deps --progress-spinner off \
            -r "$RUNNER_TEMP/vulnerable-python.txt" --format json --output "$RUNNER_TEMP/vulnerable-python.json" || audit_result=$?
          test "$audit_result" = 1
          python3 - "$RUNNER_TEMP/vulnerable-python.json" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1]))
          assert any('CVE-2025-69223' in [v['id'], *v.get('aliases', [])]
                     for package in report['dependencies'] for v in package.get('vulns', [])), 'missing known advisory'
          PY
          "$RUNNER_TEMP/python-audit/bin/pip-audit" --strict --progress-spinner off \
            -r gateway/tests/requirements.txt -r gateway/tests/media-requirements.txt
      - name: Select production parser qualification
        id: parsers
        run: |
          if [[ "$GITHUB_EVENT_NAME" != pull_request ]] || ! git diff --quiet HEAD^ HEAD -- \
            Cargo.toml gateway/ingest gateway/fuzz gateway/Cargo.toml gateway/Cargo.lock \
            service/stream service/detection-wire hal/camera platform/hal-build.rs \
            tools/platform_config.py .github/workflows/security.yml; then
            echo 'required=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Install pinned test compiler
        if: steps.parsers.outputs.required == 'true'
        run: rustup toolchain install nightly-2026-03-01 --profile minimal
      - name: Fuzz production device HTTP and gateway MJPEG parsers
        if: steps.parsers.outputs.required == 'true'
        run: bash gateway/fuzz/run.sh
