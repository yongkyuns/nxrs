name: Security baseline
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
      - name: Policy failure controls and workflow pins
        run: |
          python3 -m unittest discover -s tests/host -p test_security.py -v
          python3 tools/check-security.py policy
  rust-advisories:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        workspace: [root, gateway]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned auditor
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          cargo +1.90.0 install cargo-audit --version 0.22.2 --locked
      - name: Audit committed lockfile against current RustSec advisories
        env:
          NXRS_AUDIT_WORKSPACE: ${{ matrix.workspace }}
        run: python3 tools/check-security.py audit --workspace "$NXRS_AUDIT_WORKSPACE"
