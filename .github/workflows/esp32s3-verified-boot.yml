name: ESP32-S3 verified boot build qualification
on:
  pull_request:
    paths:
      - 'tools/boot/**'
      - 'tests/boot/**'
      - 'platform/firmware/**'
      - 'platform/nuttx/**'
      - 'tools/build-nuttx-std-app.sh'
      - 'tools/ci-apt.py'
      - 'security/*boot*'
      - 'security/esp32s3-efuse-summary-schema.json'
      - 'upstream/mcuboot/**'
      - 'upstream/nuttx/**'
      - 'external/nuttx'
      - 'external/nuttx-apps'
      - '.github/workflows/esp32s3-verified-boot.yml'
  push:
    branches: [main]
    paths:
      - 'tools/boot/**'
      - 'platform/firmware/**'
      - 'platform/nuttx/**'
      - 'tools/build-nuttx-std-app.sh'
      - 'security/*boot*'
      - 'security/esp32s3-efuse-summary-schema.json'
      - 'upstream/mcuboot/**'
      - '.github/workflows/esp32s3-verified-boot.yml'
  schedule:
    - cron: '31 8 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: esp32s3-verified-boot-${{ github.ref }}
  cancel-in-progress: true
jobs:
  operator-advisories:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Fresh complete target tool audit and actual affected negative control
        run: |
          python -m venv "$RUNNER_TEMP/target-auditor"
          "$RUNNER_TEMP/target-auditor/bin/python" -m pip install pip-audit==2.10.1
          python -m unittest discover -s tools/boot -p test_audit_signer.py -v
          python tools/boot/audit_signer.py --target --audit-python "$RUNNER_TEMP/target-auditor/bin/python"
  target:
    needs: operator-advisories
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          submodules: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Isolated complete hash-verified target tools
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          python tools/boot/install_target.py --out "$RUNNER_TEMP/target-tools"
          echo "$RUNNER_TEMP/target-tools/venv/bin" >> "$GITHUB_PATH"
      - name: Actual policy, payload, frontend and offline SDK denial controls
        run: |
          python -m unittest discover -s tools/boot -p test_target_plan.py -v
          python -m unittest discover -s tools/boot -p test_preflight.py -v
          python -m unittest discover -s tools/boot -p test_rom_image.py -v
          python -m unittest discover -s tools/boot -p test_audit_signer.py -v
          python -m unittest discover -s tools/boot -p test_native_evidence.py -v
          python -m unittest discover -s tools/boot -p test_advisory_auth.py -v
          python tools/check-architecture.py
          python -m unittest discover -s tests/host -p test_architecture.py -v
          python -m unittest discover -s tests/host -p test_hal_boundaries.py -v
          python -m unittest discover -s tests/host -p test_platform_profiles.py -v
          python -m unittest discover -s tests/host -p test_ci_apt.py -v
      - name: Disposable Linux-only build dependencies and existing frozen SDK
        if: runner.os == 'Linux'
        run: |
          python tools/ci-apt.py bison flex gperf kconfig-frontends genromfs libncurses-dev zlib1g-dev libgcrypt20 libglib2.0-0 libpixman-1-0 libsdl2-2.0-0 libslirp0
          bash tools/install-qemu-tools.sh > "$RUNNER_TEMP/target-sdk-install.log" 2>&1
      - name: Cross-build actual sole-key bootloader and full Linux NuttX application
        env:
          NXRS_ADVISORY_GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          extra=()
          if [[ "$RUNNER_OS" == Linux ]]; then extra+=(--nuttx); fi
          python tools/boot/qualify_target.py --work "$RUNNER_TEMP/target-qualification" "${extra[@]}"
      - name: Retain public cross-build reports only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: esp32s3-build-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/target-qualification/boot/boot-build.json
            ${{ runner.temp }}/target-qualification/boot/native-inputs.json
            ${{ runner.temp }}/target-qualification/boot/native-advisories.json
            ${{ runner.temp }}/target-qualification/boot/boot.sbom.cdx.json
            ${{ runner.temp }}/target-qualification/boot/boot.provenance.json
            ${{ runner.temp }}/target-qualification/boot/boot-evidence-qualification.json
            ${{ runner.temp }}/target-qualification/application-build.json
            ${{ runner.temp }}/target-qualification/preflight-qualification.json
          if-no-files-found: error
          retention-days: 7
