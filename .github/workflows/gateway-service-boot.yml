name: Encrypted gateway service virtual cold boots
on:
  pull_request:
    paths:
      - 'tools/**'
      - 'tests/host/**'
      - 'gateway/**'
      - 'service/detection-wire/**'
      - 'security/**'
      - '.github/workflows/**'
      - 'rust-toolchain.toml'
      - 'driver/device-identity/**'
      - 'tests/device-identity/**'
      - 'service/stream/**'
      - 'service/camera/**'
      - 'app/camera-stream/**'
      - 'hal/camera/src/api.rs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gateway-service-boot-${{ github.ref }}
  cancel-in-progress: true
jobs:
  virtual-service-boots:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      PKG_CONFIG_PATH: /usr/lib/nxrs-gateway-media-qualification/lib/pkgconfig
      RUSTFLAGS: -C link-arg=-Wl,-rpath,/usr/lib/nxrs-gateway-media-qualification/lib
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Require source, ordering, privacy and recovery refusal regressions
        run: |
          python3 -m unittest discover -s tests/host -p 'test_service_boot*.py' -v
          python3 -m unittest discover -s tests/host -p test_guest_source.py -v
          python3 -m unittest discover -s tests/host -p test_package_boot.py -v
          python3 -m unittest discover -s tests/host -p test_pcre_package.py -v
          python3 -m unittest discover -s tests/host -p test_gateway_proxy.py -v
          python3 -m unittest discover -s gateway/tests -p test_encrypted_services.py -v
      - name: Install disposable native build, package and emulator tools
        run: python3 tools/ci-apt.py build-essential binutils nasm pkg-config libclang-dev libssl-dev openssl gpg gpgv libexpat1-dev cryptsetup-bin debootstrap ubuntu-keyring xz-utils ca-certificates qemu-system-x86 seabios e2fsprogs util-linux ffmpeg
      - name: Build the locked Rust gateway and actual native media SDK
        run: |
          rustup toolchain install 1.90.0 --profile minimal --component clippy
          cargo +1.90.0 test --manifest-path gateway/Cargo.toml --locked --workspace
          cargo +1.90.0 clippy --manifest-path gateway/Cargo.toml --locked --workspace --all-targets -- -D warnings
          cargo +1.90.0 build --manifest-path gateway/Cargo.toml --locked --workspace
      - name: Require signed shared PCRE2 and the isolated installed package
        run: |
          timeout --signal=KILL 1260 python3 tools/native-packages/pcre.py --work "$RUNNER_TEMP/service-boot-pcre"
          timeout --signal=KILL 2160 python3 tools/native-packages/pcre_package.py --source-work "$RUNNER_TEMP/service-boot-pcre" --work "$RUNNER_TEMP/service-boot-package"
      - name: Require signed Expat and the actual parent system Python
        run: timeout --signal=KILL 1260 python3 tools/native-packages/expat.py --work "$RUNNER_TEMP/service-boot-xml"
      - name: Build and qualify the pinned native media cohort
        run: |
          python3 tools/gateway-media/prepare.py --work "$RUNNER_TEMP/service-boot-native-runtime"
          cargo +1.90.0 build --manifest-path gateway/Cargo.toml --locked -p nxrs-camera-ingest --features publisher-sdk --bins
          mkdir /tmp/nxrs-service-boot-media
          python3 gateway/tests/fetch_mediamtx.py --artifact linux_amd64 --output /tmp/nxrs-service-boot-media/mediamtx
          python3 gateway/tools/verify_media_evidence.py /tmp/nxrs-service-boot-media/mediamtx
          python3 gateway/tests/build_publisher_witness.py --output /tmp/nxrs-service-boot-decoder-witness
          python3 gateway/tests/publisher_reference.py --publisher gateway/target/debug/nxrs-rtsp-publisher --mediamtx /tmp/nxrs-service-boot-media/mediamtx --decoder-guard /tmp/nxrs-service-boot-decoder-witness/no-decoder.so
          python3 gateway/tests/reader_reference.py --reader gateway/target/debug/nxrs-rtsp-reader --publisher gateway/target/debug/nxrs-rtsp-publisher --mediamtx /tmp/nxrs-service-boot-media/mediamtx --decoder-guard /tmp/nxrs-service-boot-decoder-witness/no-decoder.so --report "$RUNNER_TEMP/service-boot-reader.json"
          python3 gateway/tests/qualify_media_sandbox.py --launcher gateway/target/debug/nxrs-media-sandbox --work "$RUNNER_TEMP/service-boot-isolation" --ffmpeg /usr/lib/nxrs-gateway-media-qualification/bin/ffmpeg --ffprobe /usr/lib/nxrs-gateway-media-qualification/bin/ffprobe
          python3 tools/gateway-media/qualify.py --work "$RUNNER_TEMP/service-boot-runtime-controls" --reader-report "$RUNNER_TEMP/service-boot-reader.json" --isolation-report "$RUNNER_TEMP/service-boot-isolation/qualification.json" --report /usr/lib/nxrs-gateway-media-qualification/qualification.json
      - name: Qualify the signed parent proxy and retain its original ABI evidence
        run: |
          timeout --signal=KILL 1260 python3 tools/gateway-proxy/qualify.py --work "$RUNNER_TEMP/service-boot-proxy"
          python3 gateway/tools/stage_proxy.py --output "$RUNNER_TEMP/service-boot-proxy-review"
      - name: Require four complete fresh guest kernels and durable encrypted service recovery
        run: |
          timeout --signal=KILL 4860 python3 tools/native-packages/service_boot.py \
            --work "$RUNNER_TEMP/service-virtual-boots" \
            --package-work "$RUNNER_TEMP/service-boot-package" \
            --control "$GITHUB_WORKSPACE/gateway/target/debug/nxrs-gateway-control" \
            --activity "$GITHUB_WORKSPACE/gateway/target/debug/nxrs-camera-activity" \
            --media /tmp/nxrs-service-boot-media/mediamtx \
            --proxy "$GITHUB_WORKSPACE/gateway/target/debug/nxrs-gateway-proxy" \
            --publisher "$GITHUB_WORKSPACE/gateway/target/debug/nxrs-rtsp-publisher" \
            --reader "$GITHUB_WORKSPACE/gateway/target/debug/nxrs-rtsp-reader" \
            --sandbox "$GITHUB_WORKSPACE/gateway/target/debug/nxrs-media-sandbox" \
            --ffmpeg /usr/lib/nxrs-gateway-media-qualification/bin/ffmpeg \
            --media-runtime /usr/lib/nxrs-gateway-media-qualification \
            --proxy-review "$RUNNER_TEMP/service-boot-proxy-review" \
            --isolation-qualification "$RUNNER_TEMP/service-boot-isolation/qualification.json"
      - name: Retain only bounded public boot and parent qualification JSON
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: gateway-encrypted-service-virtual-boots
          path: |
            ${{ runner.temp }}/service-virtual-boots/qualification.json
            /usr/lib/nxrs-gateway-system-xml-qualification/qualification.json
            ${{ runner.temp }}/service-boot-package/qualification.json
            ${{ runner.temp }}/service-boot-package/source-qualification.json
            ${{ runner.temp }}/service-boot-proxy-review/qualification.json
            ${{ runner.temp }}/service-boot-proxy-review/review.json
            /usr/lib/nxrs-gateway-media-qualification/build.json
            /usr/lib/nxrs-gateway-media-qualification/qualification.json
            ${{ runner.temp }}/service-boot-reader.json
            ${{ runner.temp }}/service-boot-isolation/qualification.json
          if-no-files-found: error
          retention-days: 7
