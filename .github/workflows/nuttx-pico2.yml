name: NuttX Pico 2 build and ABI
on:
  pull_request:
    paths:
      - 'tests/nuttx-std/**'
      - 'tests/browser-threads/src/main.rs'
      - 'tests/browser-threads/Cargo.toml'
      - '.github/workflows/nuttx-pico2.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'external/nuttx'
      - 'external/nuttx-apps'
      - 'upstream/nuttx/patches/**'
      - 'upstream/nuttx-apps/patches/**'
      - 'tools/apply-nuttx-patches.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nuttx-pico2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NUTTX_STD_COMPAT_FIXES: "1"
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          submodules: true
      - name: Install isolated Rust and ARM tools
        run: |
          rustup toolchain install nightly-2025-09-15 --profile minimal --component rust-src
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi bison flex gperf kconfig-frontends genromfs libncurses-dev
          python3 -m pip install --break-system-packages kconfiglib==14.1.0
          # NuttX's selected board uses the cross-toolchain math headers/library.
          printf '#include <math.h>\n' | arm-none-eabi-gcc -mcpu=cortex-m33 -mthumb -mfloat-abi=soft -E -x c - >/dev/null
          test -f "$(arm-none-eabi-gcc -mcpu=cortex-m33 -mthumb -mfloat-abi=soft -print-file-name=libm.a)"
      - name: Check syntax and ABI rejection controls
        run: |
          bash -n tests/nuttx-std/build.sh
          python3 tests/nuttx-std/check-abi.py --self-test
          python3 tests/nuttx-std/prepare-std.py --self-test
      - name: Build ordinary-main Pico 2 image and compare target ABI
        shell: bash
        run: |
          set -o pipefail
          mkdir -p target/nuttx-pico2
          bash tests/nuttx-std/build.sh pico2 2>&1 | tee target/nuttx-pico2/build.log
      - name: Retain build evidence, not a hardware execution claim
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nuttx-pico2-build
          path: |
            target/nuttx-pico2/*.txt
            target/nuttx-pico2/*.log
            target/nuttx-pico2/*.json
            target/nuttx-pico2/*.jsonl
            target/nuttx-pico2/*.patch
            target/nuttx-pico2/*.config
            target/nuttx-pico2/*.sha256
            target/nuttx-pico2/abi-*
            target/nuttx-pico2/nuttx/nuttx
            target/nuttx-pico2/nuttx/nuttx.bin
            target/nuttx-pico2/nuttx/nuttx.map
          if-no-files-found: warn
