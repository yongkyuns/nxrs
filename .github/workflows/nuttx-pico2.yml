name: NuttX Pico 2 build and ABI
on:
  pull_request:
    paths:
      - '.github/scripts/install-ubuntu-packages.sh'
      - 'tests/nuttx-std/**'
      - 'tests/tls/endpoint.rs'
      - 'tests/browser-threads/src/main.rs'
      - 'tests/browser-threads/Cargo.toml'
      - '.github/workflows/nuttx-pico2.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'external/nuttx'
      - 'external/nuttx-apps'
      - 'upstream/nuttx/**'
      - 'tools/nuttx-version.py'
      - 'upstream/nuttx-apps/patches/**'
      - 'tools/apply-nuttx-patches.py'
      - 'hal/tls/**'
      - 'upstream/mbedtls/**'
      - 'platform/nuttx/platforms/pico2*.toml'
      - 'platform/hal-build.rs'
      - 'tools/build-nuttx-std-app.sh'
      - 'tools/platform_config.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nuttx-pico2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NUTTX_STD_COMPAT_FIXES: "1"
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ env.SOURCE_SHA }}
          submodules: true
      - name: Install isolated Rust and ARM tools
        run: |
          rustup toolchain install nightly-2025-09-15 --profile minimal --component rust-src
          bash .github/scripts/install-ubuntu-packages.sh gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi bison flex gperf kconfig-frontends genromfs libncurses-dev
          python3 -m pip install --break-system-packages kconfiglib==14.1.0
          # NuttX's selected board uses the cross-toolchain math headers/library.
          printf '#include <math.h>\n' | arm-none-eabi-gcc -mcpu=cortex-m33 -mthumb -mfloat-abi=soft -E -x c - >/dev/null
          test -f "$(arm-none-eabi-gcc -mcpu=cortex-m33 -mthumb -mfloat-abi=soft -print-file-name=libm.a)"
      - name: Check syntax and ABI rejection controls
        run: |
          bash -n tests/nuttx-std/build.sh
          python3 tests/nuttx-std/check-abi.py --self-test
          python3 tests/nuttx-std/prepare-std.py --self-test
      - name: Build ordinary-main TLS endpoint image and compare target ABI
        shell: bash
        run: |
          set -o pipefail
          mkdir -p target/nuttx-pico2
          python3 upstream/mbedtls/fetch.py
          bash tools/build-nuttx-std-app.sh \
            --app-manifest tests/nuttx-std/tls-identity/Cargo.toml \
            --app-package nxrs-std-tls-identity --bin tls-endpoint \
            --command tls_endpoint --priority 100 --stack-size 65536 \
            --platform pico2-tls --out target/nuttx-pico2 --abi-profile minimal \
            2>&1 | tee target/nuttx-pico2/build.log
          for symbol in tls_endpoint_main psa_generate_key mbedtls_x509write_csr_pem mbedtls_platform_get_entropy rp23xx_rng_read mbedtls_ssl_handshake_step mbedtls_ssl_read mbedtls_ssl_write tls_platform_time; do
            grep -Eq " [TtWw] $symbol$" target/nuttx-pico2/symbols.txt
          done
      - name: Retain build evidence, not a hardware execution claim
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nuttx-pico2-build
          path: |
            target/nuttx-pico2/*.txt
            target/nuttx-pico2/*.log
            target/nuttx-pico2/*.json
            target/nuttx-pico2/*.jsonl
            target/nuttx-pico2/*.patch
            target/nuttx-pico2/*.config
            target/nuttx-pico2/*.sha256
            target/nuttx-pico2/abi-*
            target/nuttx-pico2/nuttx/nuttx
            target/nuttx-pico2/nuttx/nuttx.bin
            target/nuttx-pico2/nuttx/nuttx.map
          if-no-files-found: warn
