name: Memory lifecycle probes (GitHub-hosted)

on:
  push:
    branches: [main, 'apps/memory-*']
    paths:
      - 'app/std-demo/**'
      - 'app/ao-stress/**'
      - 'service/event/**'
      - 'tests/allocation-probe/**'
      - 'tests/host/test_memory_probes.py'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/memory-probes-self-hosted.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/std-demo/**'
      - 'app/ao-stress/**'
      - 'service/event/**'
      - 'tests/allocation-probe/**'
      - 'tests/host/test_memory_probes.py'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/memory-probes-self-hosted.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: memory-probes-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  memory:
    if: github.repository == 'yongkyuns/nxrs' && github.actor == 'yongkyuns'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check isolated runner
        run: |
          set -eu
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          ! mount | grep -F '/Users/' >/dev/null
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Pinned toolchain and provenance
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup toolchain install 1.90.0 --profile minimal --component clippy --component rustfmt
          mkdir -p target/memory-probes
          { git rev-parse HEAD; uname -a; rustc +1.90.0 -vV; } | tee target/memory-probes/provenance.txt
      - name: Observer accounting and transcript controls
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.90.0 test --locked -p nxrs-allocation-probe
          python3 -m unittest discover -s tests/host -p test_memory_probes.py -v
      - name: Measure debug and release tests in isolated processes
        shell: bash
        run: |
          set -euo pipefail
          for profile in debug release; do
            extra=()
            if test "$profile" = release; then extra+=(--release); fi
            for app in std-demo ao-stress; do
              timeout 90 cargo +1.90.0 test --locked "${extra[@]}" -p "nxrs-$app" --features memory-probe memory_qualification -- --ignored --test-threads=1 --nocapture 2>&1 | tee "target/memory-probes/$app-$profile.log"
              python3 tests/host/test_memory_probes.py --app "$app" --log "target/memory-probes/$app-$profile.log"
            done
          done
      - name: Check normal builds and dependency boundaries
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.90.0 test --locked
          cargo +1.90.0 build --locked -p nxrs-std-demo -p nxrs-ao-stress
          python3 tools/check-architecture.py
          python3 - <<'PY'
          import subprocess
          for app in ('std-demo', 'ao-stress'):
              for features in ([], ['--features', 'memory-probe']):
                  output = subprocess.check_output(['cargo', '+1.90.0', 'tree', '--locked', '-p',
                      'nxrs-' + app, '-e', 'normal,build', *features], text=True)
                  assert 'nxrs-allocation-probe' not in output, output
          PY
          python3 -m unittest discover -s tests/host -p test_std_apps.py -v
          cargo +1.90.0 clippy --locked -p nxrs-allocation-probe -p nxrs-std-demo -p nxrs-ao-stress --features memory-probe --all-targets -- -D warnings
      - name: Check formatting
        run: cargo +1.90.0 fmt --check -p nxrs-allocation-probe -p nxrs-std-demo -p nxrs-ao-stress
      - name: Retain measurements and formatting diagnostics
        if: always()
        shell: bash
        run: |
          set -eu
          mkdir -p target/memory-probes
          cargo +1.90.0 fmt -p nxrs-allocation-probe -p nxrs-std-demo -p nxrs-ao-stress
          git diff --binary > target/memory-probes/format.patch
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: memory-probes
          path: target/memory-probes/
          if-no-files-found: error
