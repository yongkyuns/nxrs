name: Camera person detection
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/camera-stream/**'
      - 'service/detection/**'
      - 'service/detection-wire/**'
      - 'hal/detector/**'
      - 'upstream/esp-dl/**'
      - 'hal/ffi-boundaries.toml'
      - 'platform/profiles/**'
      - 'platform/hal-build.rs'
      - 'vendor/microflow/**'
      - 'upstream/microflow/**'
      - 'tests/detection/**'
      - 'tests/nuttx-std/detection/**'
      - 'tests/nuttx-std/stream/**'
      - 'tests/host/test_detection_qualification.py'
      - 'tests/host/test_detector_alternatives.py'
      - 'tests/host/test_pico_qualification.py'
      - 'tests/host/test_platform_profiles.py'
      - 'tests/host/test_deployment.py'
      - 'tools/platform_config.py'
      - 'tests/host/test_architecture.py'
      - 'tools/check-architecture.py'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/camera-detection.yml'
permissions:
  contents: read
concurrency:
  group: camera-detection-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust-inference:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: '2'
      NXRS_PLATFORM: linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: clippy
      - name: Linux radio ABI headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libglib2.0-dev
      - name: Architecture and qualification controls
        run: |
          python3 tools/check-architecture.py
          python3 -m unittest discover -s tests/host -p test_architecture.py
          python3 -m unittest discover -s tests/host -p test_detection_qualification.py
          python3 -m unittest discover -s tests/host -p test_camera_session.py
          python3 -m unittest discover -s tests/host -p test_pico_qualification.py
          python3 -m unittest discover -s tests/host -p test_platform_profiles.py
          python3 -m unittest discover -s tests/host -p test_deployment.py
      - name: Prepare pinned numerical SDK
        run: python3 upstream/esp-dl/prepare.py
      - name: Contract and presence-only acquisition
        run: |
          cargo test --locked -p nxrs-detector --test acquisition
          env -u NXRS_PLATFORM cargo test --locked -p nxrs-detector --features pico-model --test acquisition
          env -u NXRS_PLATFORM cargo test --locked -p nxrs-detector --features probe,pico-model --test acquisition
          cargo test --locked -p nxrs-detector --features pico-model --test pico
          cargo test --locked -p nxrs-detector --features person-model --test acquisition
      - name: Alternative benchmark artifact and image-input guards
        run: |
          python3 -m pip install --disable-pip-version-check numpy==2.5.4 Pillow==10.4.0
          python3 -m unittest discover -s tests/host -p test_detector_alternatives.py
      - name: Actual models, ownership, alerts and shutdown
        env:
          NXRS_STREAM_MODEL: pico
        run: |
          cargo test --locked -p nxrs-detection-wire -p nxrs-detector -p nxrs-detection-service -p nxrs-camera-stream -p nxrs-std-stream \
            --features nxrs-detector/pico-model,nxrs-detector/person-model,nxrs-std-stream/probe
          cargo clippy --locked -p nxrs-detection-wire -p nxrs-detector -p nxrs-detection-service -p nxrs-camera-stream -p nxrs-std-stream \
            --all-targets --features nxrs-detector/pico-model,nxrs-detector/person-model,nxrs-std-stream/probe -- -D warnings
      - name: Native SDK ownership with AddressSanitizer
        run: python3 tests/detection/check_pico_asan.py
      - name: Prove the runtime correction is necessary
        run: |
          python3 tests/detection/check_runtime_patches.py
          python3 tests/detection/check_padding_control.py
