name: Python media package security
on:
  pull_request:
    paths:
      - 'gateway/**'
      - 'tools/enrollment/requirements.txt'
      - '.github/workflows/python-media-security.yml'
  schedule:
    - cron: '37 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: python-media-security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  advisories:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Audit complete pins and refuse the affected old aiohttp without installation
        run: |
          python -m unittest discover -s gateway/tests -p test_python_environment.py -v
          python -m venv /tmp/nxrs-media-auditor
          /tmp/nxrs-media-auditor/bin/python -m pip install pip-audit==2.10.1
          python gateway/tools/python_environment.py audit --audit-python /tmp/nxrs-media-auditor/bin/python --report "$RUNNER_TEMP/python-advisories.json"
      - name: Retain bounded public advisory evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: python-media-advisories
          path: ${{ runner.temp }}/python-advisories.json
          if-no-files-found: error
          retention-days: 7
  installed:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install exact hash-verified application graph and check dependencies
        run: |
          python gateway/tools/native_python.py prepare --work /tmp/nxrs-locked-media-native --runtime /tmp/nxrs-locked-media --qualify
          /tmp/nxrs-locked-media/bin/python -m pip check
          /tmp/nxrs-locked-media/bin/python gateway/tools/python_environment.py inventory --report "$RUNNER_TEMP/python-installed.json"
      - name: Test the actual installed environment and native HTTP/WebRTC media
        run: |
          NXRS_TEST_PYTHON_ENVIRONMENT=media /tmp/nxrs-locked-media/bin/python -m unittest discover -s gateway/tests -v
          /tmp/nxrs-locked-media/bin/python gateway/tests/python_media_reference.py --inventory "$RUNNER_TEMP/python-installed.json" --report "$RUNNER_TEMP/python-loopback.json"
      - name: Retain public package metadata and loopback evidence only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: python-media-installed-${{ matrix.os }}
          path: |
            /tmp/nxrs-locked-media/native-qualification.json
            ${{ runner.temp }}/python-installed.json
            ${{ runner.temp }}/python-loopback.json
          if-no-files-found: error
          retention-days: 7
