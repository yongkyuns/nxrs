[package]
name = "nxrs-ao-stress"
version.workspace = true
edition.workspace = true

[package.metadata.nxrs.firmware]
bin = "ao-stress"
command = "ao_stress"
priority = 100
stack-size = 65536

[features]
# Only enables ignored diagnostic tests; normal binaries are not instrumented.
probe = []

[dependencies]
nxrs-service-event = { path = "../../service/event" }

[dev-dependencies]
nxrs-allocation-probe = { path = "../../tests/allocation-probe" }

[[bin]]
name = "ao-stress"
path = "src/main.rs"
