[package]
name = "nxrs-motion-tracker"
version.workspace = true
edition.workspace = true

[package.metadata.nxrs]
required-capabilities = ["imu", "gnss"]

[package.metadata.nxrs.firmware]
bin = "motion-tracker"
command = "motion_tracker"
priority = 100
stack-size = 32768

[[bin]]
name = "motion-tracker"
path = "src/main.rs"

[dependencies]
nxrs-composition = { path = "../../platform", features = ["battery", "gnss", "imu"] }
nxrs-battery = { path = "../../hal/battery" }
nxrs-display = { path = "../../hal/display" }
nxrs-touch = { path = "../../hal/touch" }
nxrs-gnss = { path = "../../hal/gnss" }
nxrs-imu = { path = "../../hal/imu" }
nxrs-messaging = { path = "../../shared/messaging", features = ["channels"] }
nxrs-navigation-services = { path = "../../service/navigation" }
nxrs-settings = { path = "../../hal/settings" }
nxrs-telemetry-service = { path = "../../service/telemetry", default-features = false, features = ["stream"] }
qrcodegen = "1.8"
