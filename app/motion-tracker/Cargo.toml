[package]
name = "nxrs-motion-tracker"
version.workspace = true
edition.workspace = true

[package.metadata.nxrs]
required-capabilities = ["imu"]

[package.metadata.nxrs.capability-features]
ble-link = { when = "dashboard", requires = ["ble", "tls"] }
cellular-uplink = { when = "dashboard", requires = ["cellular", "tls"] }
wifi-map = { when = "dashboard", requires = ["wifi", "tls"] }

[package.metadata.nxrs.firmware]
bin = "motion-tracker"
command = "motion_tracker"
priority = 100
stack-size = 14848

[[bin]]
name = "motion-tracker"
path = "src/main.rs"

[features]
default = ["dashboard"]
dashboard = [
    "nxrs-composition/gnss", "nxrs-composition/battery",
    "dep:nxrs-battery", "dep:nxrs-display", "dep:nxrs-touch", "dep:nxrs-gnss",
    "dep:nxrs-execution",
]
ble-link = ["dashboard", "dep:nxrs-ble", "dep:nxrs-tls", "nxrs-tls/pairing", "dep:qrcodegen"]
cellular-uplink = ["dashboard", "dep:nxrs-cellular", "dep:nxrs-tls"]
wifi-map = ["dashboard", "dep:nxrs-tls"]

[dependencies]
log = "0.4"
nxrs-log-router = { path = "../../service/logging" }
nxrs-composition = { path = "../../platform", features = ["imu"] }
nxrs-battery = { path = "../../hal/battery", optional = true }
nxrs-display = { path = "../../hal/display", optional = true }
nxrs-touch = { path = "../../hal/touch", optional = true }
nxrs-gnss = { path = "../../hal/gnss", optional = true }
nxrs-imu = { path = "../../hal/imu" }
nxrs-boot = { path = "../../hal/boot" }
nxrs-watchdog = { path = "../../hal/watchdog" }
nxrs-messaging = { path = "../../shared/messaging", features = ["channels"] }
nxrs-navigation-services = { path = "../../service/navigation" }
nxrs-settings = { path = "../../hal/settings" }
nxrs-cellular = { path = "../../hal/cellular", optional = true }
nxrs-ble = { path = "../../hal/ble", features = ["peripheral"], optional = true }
nxrs-execution = { path = "../../hal/execution", optional = true }
nxrs-tls = { path = "../../hal/tls", optional = true }
qrcodegen = { version = "1.8", optional = true }
