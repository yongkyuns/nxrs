[package]
name = "nxrs-std-demo"
version.workspace = true
edition.workspace = true

[package.metadata.nxrs.firmware]
bin = "std-demo"
command = "std_demo"
priority = 100
stack-size = 65536

[features]
# Only enables ignored diagnostic tests; normal binaries are not instrumented.
probe = []

[dev-dependencies]
nxrs-allocation-probe = { path = "../../tests/allocation-probe" }

[[bin]]
name = "std-demo"
path = "src/main.rs"
