[package]
name = "nxrs-camera-stream"
version.workspace = true
edition.workspace = true

[lib]
name = "camera_stream"

[dependencies]
nxrs-enrollment = { path = "../../service/enrollment" }
nxrs-config = { path = "../../hal/config" }
nxrs-camera = { path = "../../hal/camera" }
nxrs-camera-service = { path = "../../service/camera" }
nxrs-stream-service = { path = "../../service/stream" }
nxrs-firmware-update = { path = "../../service/firmware-update" }
nxrs-detection-service = { path = "../../service/detection" }
nxrs-detection-wire = { path = "../../service/detection-wire" }
nxrs-tls = { path = "../../hal/tls" }
nxrs-boot = { path = "../../hal/boot" }
nxrs-watchdog = { path = "../../hal/watchdog" }
nxrs-wifi = { path = "../../hal/wifi" }

[package.metadata.nxrs]
required-capabilities = ["camera"]

[dev-dependencies]
nxrs-detector = { path = "../../hal/detector" }
