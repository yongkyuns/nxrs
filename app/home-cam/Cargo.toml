[package]
name = "nxrs-home-cam"
version.workspace = true
edition.workspace = true

[[bin]]
name = "home-cam"
path = "src/main.rs"

[lib]
name = "home_cam"

[dependencies]
nxrs-console = { path = "../../hal/console" }
nxrs-execution = { path = "../../hal/execution" }
nxrs-ssh = { path = "../../hal/ssh" }
nxrs-detector = { path = "../../hal/detector" }
nxrs-enrollment = { path = "../../service/enrollment" }
nxrs-settings = { path = "../../hal/settings" }
nxrs-camera = { path = "../../hal/camera" }
nxrs-audio = { path = "../../hal/audio" }
nxrs-stream-service = { path = "../../service/stream" }
nxrs-firmware-update = { path = "../../service/firmware-update" }
nxrs-detection-service = { path = "../../service/detection", features = ["wire"] }
nxrs-tls = { path = "../../hal/tls" }
nxrs-boot = { path = "../../hal/boot" }
nxrs-watchdog = { path = "../../hal/watchdog" }
nxrs-wifi = { path = "../../hal/wifi" }

[package.metadata.nxrs]
required-capabilities = ["camera", "wifi", "tls", "settings", "boot", "watchdog", "console", "execution"]

[package.metadata.nxrs.firmware]
bin = "home-cam"
command = "home_cam"
