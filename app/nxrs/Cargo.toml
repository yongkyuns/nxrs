[package]
name = "nxrs-applications"
version.workspace = true
edition.workspace = true

[features]
# The replay CLI composes file replay, queued recording and UDP. Core-only
# library consumers opt out without compiling these std operations.
default = ["replay"]
replay = ["nxrs-camera/replay", "nxrs-storage/recording", "nxrs-transport/udp"]

[dependencies]
nxrs-camera = { path = "../../hal/camera" }
nxrs-storage = { path = "../../hal/storage" }
nxrs-transport = { path = "../../hal/transport" }
nxrs-camera-service = { path = "../../service/camera" }
nxrs-recording-service = { path = "../../service/recording" }
nxrs-telemetry-service = { path = "../../service/telemetry" }

[[bin]]
name = "nxrs"
path = "src/main.rs"
required-features = ["replay"]
