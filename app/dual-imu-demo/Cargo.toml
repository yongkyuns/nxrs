[package]
name = "nxrs-dual-imu-demo"
version.workspace = true
edition.workspace = true

[package.metadata.nxrs]
required-capabilities = ["imu"]

[package.metadata.nxrs.firmware]
bin = "dual-imu-demo"
command = "dual_imu_demo"
priority = 100
stack-size = 65536

[dependencies]
nxrs-navigation-services = { path = "../../service/navigation" }

[[bin]]
name = "dual-imu-demo"
path = "src/main.rs"
