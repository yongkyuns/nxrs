[package]
name = "nxrs-event-demo"
version.workspace = true
edition.workspace = true

[package.metadata.nxrs]
required-capabilities = ["imu", "gnss"]

[package.metadata.nxrs.firmware]
bin = "event-demo"
command = "event_demo"
priority = 100
stack-size = 65536

[dependencies]
devices = { package = "nxrs-imu-devices", path = "../../platform/devices/imu" }
nxrs-navigation-services = { path = "../../service/navigation" }

[[bin]]
name = "event-demo"
path = "src/main.rs"
