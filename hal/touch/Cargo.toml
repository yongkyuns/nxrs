[package]
name = "nxrs-touch"
version.workspace = true
edition.workspace = true
build = "../../tools/build-support/cargo/hal.rs"

[lib]
name = "touch"

[package.metadata.nxrs]
kind = "hal-capability"
platforms = ["nuttx"]

[dependencies]
cfg-if = "=1.0.5"

[target.'cfg(target_os = "nuttx")'.dependencies]
nxrs-acquisition = { path = "../../shared/acquisition" }

[build-dependencies]
nxrs-build-support = { path = "../../tools/build-support" }
