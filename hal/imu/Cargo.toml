[package]
name = "nxrs-imu"
version.workspace = true
edition.workspace = true
build = "../../platform/hal-build.rs"

[lib]
name = "imu"

[package.metadata.nxrs]
kind = "hal-capability"
platforms = ["mock", "nuttx"]

[dependencies]
nxrs-messaging = { path = "../../shared/messaging", default-features = false }

[target.'cfg(target_os = "nuttx")'.dependencies]
bmi2 = "=0.1.2"
embedded-hal = "=1.0.0"

[dev-dependencies]
# Host tests exercise the physical driver's bounded configuration and FIFO codec.
bmi2 = "=0.1.2"
embedded-hal = "=1.0.0"

[build-dependencies]
nxrs-build = { path = "../../platform/build" }
