[package]
name = "nxrs-ble"
version.workspace = true
edition.workspace = true
build = "../../tools/build-support/cargo/hal.rs"

[features]
probe = []

[lib]
name = "ble"

[dependencies]
cfg-if = "=1.0.5"
nxrs-hal-common = { path = "../common" }
nxrs-messaging = { path = "../../shared/messaging", default-features = false }

[package.metadata.nxrs]
kind = "hal-capability"
platforms = ["nuttx", "linux", "macos"]

[package.metadata.nxrs.platform.macos]
frameworks = ["CoreBluetooth", "Foundation"]

[target.'cfg(target_os = "linux")'.dependencies]
nxrs-linux-gio = { path = "../../driver/linux/gio", features = ["ble"] }

[build-dependencies]
nxrs-build-support = { path = "../../tools/build-support" }
