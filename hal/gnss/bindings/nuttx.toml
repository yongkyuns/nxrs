version = 1
output = "gnss_config.rs"
role = "gnss"

[constants.DEVICE_PATH]
type = "str"
source = { root = "resource", reference = ["bus"], path = ["device"] }

[constants.BAUD]
type = "u32"
source = { root = "resource", reference = ["bus"], path = ["baud"] }

[constants.STACK_BYTES]
type = "usize"
source = { root = "profile", path = ["gnss", "stack-bytes"] }
default = 16384
min = 8192
max = 262144
