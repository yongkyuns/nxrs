[package]
name = "nxrs-gnss"
version.workspace = true
edition.workspace = true
build = "build.rs"

[lib]
name = "gnss"

[package.metadata.nxrs]
kind = "hal-capability"
platforms = ["mock", "nuttx", "simulation"]

[dependencies]
cfg-if = "=1.0.5"
nxrs-messaging = { path = "../../shared/messaging", default-features = false }

[target.'cfg(not(target_os = "none"))'.dependencies]
nxrs-acquisition = { path = "../acquisition" }
nxrs-peripheral = { path = "../../driver/peripheral" }

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
nxrs-simulation = { path = "../../shared/simulation" }

[dev-dependencies]
# Host tests exercise the physical receiver's bounded UBX protocol.
nxrs-ubx-driver = { path = "../../driver/ubx" }

[build-dependencies]
nxrs-build-support = { path = "../../platform/build-support" }
