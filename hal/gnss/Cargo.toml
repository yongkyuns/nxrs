[package]
name = "nxrs-gnss"
version.workspace = true
edition.workspace = true
build = "../../platform/hal-build.rs"

[lib]
name = "gnss"

[package.metadata.nxrs]
kind = "hal-capability"
platforms = ["mock", "nuttx"]

[dependencies]
nxrs-messaging = { path = "../../shared/messaging", default-features = false }
kinavis-ubx = { version = "=0.1.1", default-features = false, features = ["libm"] }

[build-dependencies]
nxrs-build = { path = "../../platform/build" }
