# Private native ABI inventory. Behavior belongs in the owning Rust HAL.
# Every entry requires semantic review; scalar interfaces do not prove thin glue.

[[bridge]]
path = "hal/watchdog/src/platform/nuttx/ffi/watchdog.c"
kind = "abi"
reason = "Target watchdog status fields and individual GETSTATUS/STOP ioctls. Rust owns descriptor admission, cancellation verification and sticky failure; the bridge never arms or feeds."

[[bridge]]
path = "hal/tls/src/platform/linux/ffi/rng.c"
kind = "abi"
reason = "Linux GRND_NONBLOCK and scalar getrandom ABI checks. Rust calls the OS RNG and refuses unseeded/error/partial output."

[[bridge]]
path = "hal/tls/src/sdk/ffi/sdk.c"
kind = "abi"
reason = "Pinned PSA/X.509/TLS SDK layouts, field access, constants and enum translation. Rust owns entropy, keys, peer/time admission, socket budgets and lifetime."

[[bridge]]
path = "hal/tls/src/sdk/ffi/crypto_config.h"
kind = "abi"
reason = "Bounded SDK crypto configuration with explicit entropy callback and volatile key slots; no ambient source/storage."

[[bridge]]
path = "hal/tls/src/sdk/ffi/mbedtls_config.h"
kind = "abi"
reason = "Pinned SDK X.509 CSR compilation settings; native calls remain in the owning Rust adapter."

[[bridge]]
path = "hal/tls/src/platform/nuttx/ffi/rng.c"
kind = "abi"
reason = "Target-header hardware RNG configuration admission. Rust acquires the descriptor and owns source/SDK failure policy."

[[bridge]]
path = "hal/ble/src/platform/linux/ffi/gio.c"
kind = "abi"
reason = "GLib header constants and opaque GError field access. Rust performs D-Bus calls, schemas, error policy and callback ownership."

[[bridge]]
path = "hal/ble/src/platform/macos/ffi/gatt.m"
kind = "abi"
reason = "CoreBluetooth object fields, individual SDK operations and serial delegate/dispatch barriers. Rust owns the executor and all GATT state."

[[bridge]]
path = "hal/ble/src/platform/macos/ffi/scan.m"
kind = "abi"
reason = "CoreBluetooth delegate field forwarding and serial lifetime barriers. Rust owns UUID filtering, reports, deadlines and scan ownership."

[[bridge]]
path = "hal/ble/src/platform/nuttx/ffi/ble_gatt.c"
kind = "abi"
reason = "Target Bluetooth callback/attribute layout, UUID representation, critical sections and LPWORK binding. Rust owns GATT sequencing, buffers and retirement."

[[bridge]]
path = "hal/ble/src/platform/nuttx/ffi/ble_scan.c"
kind = "abi"
reason = "Target raw Bluetooth socket construction and ioctl/scan record layouts; std::net has no raw Bluetooth socket constructor. Rust owns the OwnedFd, peer registry and scan lifecycle."
allowed_calls = ["socket"]

[[bridge]]
path = "hal/camera/src/platform/nuttx/ffi/close.c"
kind = "abi"
reason = "Observable close status for camera stop; std File Drop cannot report a close error. Rust consumes the sole descriptor before the call."
allowed_calls = ["close"]

[[bridge]]
path = "hal/camera/src/platform/nuttx/ffi/status.h"
kind = "abi"
reason = "Private target errno to scalar status translation for the video binding."

[[bridge]]
path = "hal/camera/src/platform/nuttx/ffi/v4l2.c"
kind = "abi"
reason = "Target-header video format, queue, stream and JPEG-control ABI translation; Rust owns buffers and lifecycle."

[[bridge]]
path = "hal/camera/src/platform/nuttx/ffi/v4l2.h"
kind = "abi"
reason = "Private fixed-width video ABI declarations."

[[bridge]]
path = "hal/led/src/platform/nuttx/ffi/userled.c"
kind = "abi"
reason = "Target-header USERLED ioctl argument construction only; Rust owns the File and validates the public contract."

[[bridge]]
path = "hal/wifi/src/platform/linux/ffi/gio.c"
kind = "abi"
reason = "GLib header constants and opaque GError field access. Rust owns NetworkManager schemas, activation, address validation and rollback."

[[bridge]]
path = "hal/wifi/src/platform/macos/ffi/wifi.m"
kind = "abi"
reason = "CoreWLAN/CoreLocation object fields, individual SDK operations and interface-address layouts absent from std. Rust owns selection, ownership and rollback."

[[bridge]]
path = "hal/wifi/src/platform/nuttx/ffi/wifi_scan.c"
kind = "abi"
reason = "Decode target-header wireless event layouts and issue individual scan ioctls; Rust owns scan buffering and normalization."

[[bridge]]
