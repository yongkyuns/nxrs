kind = "abi"
reason = "Private CoreWLAN/CoreBluetooth status translation consumed by the owning Rust provider."

[[bridge]]
path = "hal/ble/src/platform/macos/ffi/status.h"
kind = "abi"
reason = "Private CoreWLAN/CoreBluetooth status translation consumed by the owning Rust provider."

[[bridge]]
path = "hal/detector/src/compute/esp_dl/ffi/compat.hpp"
kind = "abi"
reason = "Mechanical allocator/timing hooks required by the pinned ESP-DL numerical SDK on std and NuttX. No Rust caller consumes these POSIX aliases; Rust owns JPEG validation, model output policy, worker synchronization and shutdown. The SDK launches no tasks."
allowed_calls = ["clock_gettime"]

[[bridge]]
path = "hal/detector/src/platform/nuttx/ffi/context.c"
kind = "abi"
reason = "NuttX target-header cop_ai state-save witness and enabled-state access. The owning Rust provider serializes numerical execution and restores prior context state; no native thread creation, frame handling or detector policy."
[[bridge]]
path = "hal/config/src/platform/nuttx/ffi/config.c"
kind = "abi"
reason = "NuttX config-data ioctl layout and errno translation. Rust owns files, keys, bounds and product-record validation."

[[bridge]]
path = "platform/nuttx/camera/src/platform/nuttx/ffi/startup.c"
kind = "abi"
reason = "Product bootstrap only: target-header network init, calling-worker priority and commissioning termios/poll. Rust owns input, deadlines, resource lifetime and policy."
