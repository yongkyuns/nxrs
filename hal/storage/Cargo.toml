[package]
name = "nxrs-storage"
version.workspace = true
edition.workspace = true
build = "build.rs"

[lib]
name = "storage"

[features]
# Explicit software functionality. Contract-only consumers need no Rust std.
recording = []

[[example]]
name = "native_record"
required-features = ["recording"]

[[test]]
name = "std_recording"
required-features = ["recording"]

[dependencies]
cfg-if = "=1.0.5"
nxrs-camera = { path = "../camera" }

[package.metadata.nxrs]
kind = "hal-capability"
platforms = ["mock", "linux", "macos", "windows", "nuttx"]

[build-dependencies]
nxrs-build-support = { path = "../../platform/build-support" }
