[package]
name = "nxrs-camera"
version.workspace = true
edition.workspace = true
build = "build.rs"

[lib]
name = "camera"

[features]
# Explicit software functionality, not an OS or hardware-provider selection.
# No defaults: contract-only and physical-camera consumers need no file replay.
replay = []

[[example]]
name = "native_replay"
required-features = ["replay"]

[[test]]
name = "native_replay"
required-features = ["replay"]

[package.metadata.nxrs]
kind = "hal-capability"
platforms = ["mock", "linux", "macos", "windows", "nuttx"]

[build-dependencies]
nxrs-build-support = { path = "../../platform/build-support" }

[dependencies]
cfg-if = "=1.0.5"
