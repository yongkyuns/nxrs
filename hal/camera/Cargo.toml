[package]
name = "nxrs-camera"
version.workspace = true
edition.workspace = true
build = "../../platform/hal-build.rs"

[lib]
name = "camera"

[dependencies]
nxrs-hal-common = { path = "../common" }

[target.'cfg(any(target_os = "nuttx", target_os = "none"))'.dependencies]
nxrs-nuttx-support = { path = "../support/nuttx" }

[package.metadata.nxrs]
kind = "hal-capability"
providers = ["mock", "native", "nuttx"]
