[package]
name = "nxrs-wifi"
version.workspace = true
edition.workspace = true
build = "../../platform/hal-build.rs"

[lib]
name = "wifi"

[dependencies]
nxrs-hal-common = { path = "../common" }

[package.metadata.nxrs]
kind = "hal-capability"
providers = ["nuttx", "native"]

[package.metadata.nxrs.native.macos]
frameworks = ["CoreWLAN", "CoreLocation", "Foundation"]

[package.metadata.nxrs.native.linux]
pkg-config = ["gio-2.0"]
