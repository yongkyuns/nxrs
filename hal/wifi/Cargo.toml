[package]
name = "nxrs-wifi"
version.workspace = true
edition.workspace = true
build = "build.rs"

[features]
probe = []

[lib]
name = "wifi"

[dependencies]
nxrs-hal-common = { path = "../common" }
nxrs-messaging = { path = "../../shared/messaging", default-features = false }

[package.metadata.nxrs]
kind = "hal-capability"
platforms = ["nuttx", "linux", "macos"]

[package.metadata.nxrs.platform.macos]
frameworks = ["CoreWLAN", "CoreLocation", "Foundation"]

[target.'cfg(target_os = "linux")'.dependencies]
nxrs-linux-gio = { path = "../../driver/linux/gio", features = ["wifi"] }

[build-dependencies]
nxrs-build-support = { path = "../../platform/build-support" }
