[workspace]
resolver = "2"
members = [
    "app/nxrs",
    "app/event-demo",
    "app/dual-imu-demo",
    "app/std-demo",
    "app/ao-stress",
    "app/camera-stream",
    "platform/firmware",
    "platform/mcuboot",
    "driver/firmware-image",
    "driver/mcuboot-policy",
    "driver/device-identity",
    "service/camera",
    "service/stream",
    "service/connectivity",
    "service/event",
    "service/navigation",
    "service/recording",
    "service/telemetry",
    "hal/common",
    "hal/wifi",
    "hal/ble",
    "hal/imu",
    "hal/gnss",
    "hal/led",
    "hal/transport",
    "hal/storage",
    "hal/update",
    "hal/camera",
    "tests/boot/admission",
    "tests/nuttx/support",
    "tests/allocation-probe",
    "tests/service-footprint",
    "tests/portable",
    "tests/native",
    "tests/nuttx",
    "tests/browser-threads",
    "tests/nuttx-std/resources",
    "tests/nuttx-std/udp",
    "tests/nuttx-std/userled",
    "tests/nuttx-std/identity",
    "tests/nuttx-std/wifi",
    "tests/nuttx-std/ble",
    "tests/nuttx-std/radio",
    "tests/nuttx-std/camera",
    "tests/nuttx-std/stream",
    "tests/rtos-bench/rust",
]
default-members = [
    "app/nxrs",
    "app/std-demo",
    "app/ao-stress",
    "app/camera-stream",
    "service/camera",
    "service/stream",
    "service/connectivity",
    "service/event",
    "service/recording",
    "service/telemetry",
    "hal/imu",
    "hal/gnss",
    "hal/led",
    "hal/common",
    "hal/wifi",
    "hal/ble",
    "hal/transport",
    "hal/storage",
    "hal/camera",
]

[workspace.package]
edition = "2021"
version = "0.1.0"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = "fat"
codegen-units = 1
opt-level = 'z'
strip = "symbols"
debug = false
overflow-checks = false
debug-assertions = false

[profile.nuttx-sim]
inherits = "release"
lto = false
opt-level = 1
strip = "none"
debug = 1
