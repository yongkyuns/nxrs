    "app/std-demo",
    "app/ao-stress",
    "app/home-cam",
    "app/motion-tracker",
    "service/detection",
    "service/stream",
    "service/enrollment",
    "service/time-sync",
    "shared/messaging",
    "hal/imu",
    "hal/gnss",
    "hal/time",
    "hal/led",
    "hal/pulse",
    "hal/radio-types",
    "hal/wifi",
    "hal/ble",
    "hal/storage",
    "hal/settings",
    "hal/camera",
    "hal/audio",
    "hal/detector",
]

[workspace.metadata.nxrs]
device-catalogue = "platform"

[workspace.package]
edition = "2021"
version = "0.1.0"

[patch.crates-io]
# TensorFlow-compatible SAME padding and equivalent Rust convolution reductions;
# provenance and regression witnesses are recorded under upstream/microflow. The macro compiler
# and other dependencies remain registry-pinned in Cargo.lock.
microflow = { path = "vendor/microflow" }
# Keep the published PPP implementation with the RustSec-fixed heapless release.
ppproto = { path = "vendor/ppproto" }

[profile.release.package.nxrs-detector]
opt-level = 3

# Image preparation is part of the real-time detector workload. Optimizing only
# its caller leaves the decoder's non-inlined loops at the workspace size level.
[profile.release.package.zune-jpeg]
opt-level = 3

[profile.release.package.zune-core]
opt-level = 3

[profile.release.package.nxrs-detection-service]
opt-level = 3

[profile.dev]
panic = "abort"

# The development frontend verifies retained SDK/native bytes on every build.
# Keep that check inexpensive without weakening its content-based identity.
[profile.dev.package.nxrs-build-support]
opt-level = 2

[profile.dev.package.sha2]
opt-level = 3

[profile.release]
panic = "abort"
lto = "fat"
codegen-units = 1
opt-level = 'z'
strip = "symbols"
debug = false
overflow-checks = false
debug-assertions = false

[profile.nuttx-sim]
inherits = "release"
lto = false
opt-level = 1
strip = "none"
debug = 1
