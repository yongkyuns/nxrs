[workspace]
resolver = "2"
members = [
    "app/nxrs",
    "app/event-demo",
    "app/dual-imu-demo",
    "app/std-demo",
    "app/ao-stress",
    "platform/firmware",
    "service/camera",
    "service/event",
    "service/navigation",
    "service/recording",
    "service/telemetry",
    "hal/common",
    "hal/imu",
    "hal/imu/api",
    "hal/imu/mock",
    "hal/gnss",
    "hal/gnss/api",
    "hal/gnss/mock",
    "hal/led",
    "hal/led/api",
    "hal/led/mock",
    "hal/led/nuttx",
    "hal/transport",
    "hal/transport/api",
    "hal/transport/native",
    "hal/transport/mock",
    "hal/transport/nuttx",
    "hal/storage",
    "hal/storage/api",
    "hal/storage/native",
    "hal/storage/mock",
    "hal/storage/nuttx",
    "hal/camera",
    "hal/camera/api",
    "hal/camera/native",
    "hal/camera/mock",
    "hal/camera/nuttx",
    "hal/support/nuttx",
    "tests/allocation-probe",
    "tests/service-footprint",
    "tests/portable",
    "tests/native",
    "tests/nuttx",
    "tests/browser-threads",
    "tests/nuttx-std/resources",
    "tests/nuttx-std/udp",
    "tests/nuttx-std/userled",
    "tests/rtos-bench/rust",
]
default-members = [
    "app/nxrs",
    "app/std-demo",
    "app/ao-stress",
    "service/camera",
    "service/event",
    "service/recording",
    "service/telemetry",
    "hal/imu",
    "hal/imu/api",
    "hal/imu/mock",
    "hal/gnss",
    "hal/gnss/api",
    "hal/gnss/mock",
    "hal/led",
    "hal/led/api",
    "hal/led/mock",
    "hal/common",
    "hal/transport",
    "hal/transport/api",
    "hal/transport/native",
    "hal/transport/mock",
    "hal/storage",
    "hal/storage/api",
    "hal/storage/native",
    "hal/storage/mock",
    "hal/camera",
    "hal/camera/api",
    "hal/camera/native",
    "hal/camera/mock",
    "tests/portable",
    "tests/native",
]

[workspace.package]
edition = "2021"
version = "0.1.0"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = "fat"
codegen-units = 1
opt-level = 'z'
strip = "symbols"
debug = false
overflow-checks = false
debug-assertions = false

[profile.nuttx-sim]
inherits = "release"
lto = false
opt-level = 1
strip = "none"
debug = 1
