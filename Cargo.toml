[workspace]
resolver = "2"
exclude = ["vendor/microflow"]
members = [
    "app/nxrs",
    "app/event-demo",
    "app/dual-imu-demo",
    "app/std-demo",
    "app/ao-stress",
    "app/home-cam",
    "platform/firmware",
    "hal/detector",
    "service/camera",
    "service/detection",
    "service/detection-wire",
    "service/firmware-update",
    "service/enrollment",
    "service/stream",
    "service/connectivity",
    "service/event",
    "service/navigation",
    "service/recording",
    "service/telemetry",
    "hal/common",
    "hal/config",
    "hal/console",
    "hal/execution",
    "hal/wifi",
    "hal/ble",
    "hal/imu",
    "hal/gnss",
    "hal/led",
    "hal/transport",
    "hal/tls",
    "hal/boot",
    "hal/watchdog",
    "hal/storage",
    "hal/camera",
    "tests/nuttx/support",
    "tests/allocation-probe",
    "tests/service-footprint",
    "tests/portable",
    "tests/native",
    "tests/nuttx",
    "tests/browser-threads",
    "tests/nuttx-std/resources",
    "tests/nuttx-std/udp",
    "tests/nuttx-std/userled",
    "tests/nuttx-std/tls-identity",
    "tests/nuttx-std/wifi",
    "tests/nuttx-std/ble",
    "tests/nuttx-std/radio",
    "tests/nuttx-std/camera",
    "tests/nuttx-std/stream",
    "tests/rtos-bench/rust",
]
default-members = [
    "app/nxrs",
    "app/std-demo",
    "app/ao-stress",
    "app/home-cam",
    "service/camera",
    "service/detection",
    "service/stream",
    "service/connectivity",
    "service/enrollment",
    "service/event",
    "service/recording",
    "service/telemetry",
    "hal/imu",
    "hal/gnss",
    "hal/led",
    "hal/common",
    "hal/wifi",
    "hal/ble",
    "hal/transport",
    "hal/storage",
    "hal/config",
    "hal/camera",
    "hal/detector",
]

[workspace.package]
edition = "2021"
version = "0.1.0"

[patch.crates-io]
# TensorFlow-compatible SAME padding and equivalent Rust convolution reductions;
# provenance and regression witnesses are recorded under upstream/microflow. The macro compiler
# and other dependencies remain registry-pinned in Cargo.lock.
microflow = { path = "vendor/microflow" }

[profile.release.package.nxrs-detector]
opt-level = 3

# Image preparation is part of the real-time detector workload. Optimizing only
# its caller leaves the decoder's non-inlined loops at the workspace size level.
[profile.release.package.zune-jpeg]
opt-level = 3

[profile.release.package.zune-core]
opt-level = 3

[profile.release.package.nxrs-detection-service]
opt-level = 3

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = "fat"
codegen-units = 1
opt-level = 'z'
strip = "symbols"
debug = false
overflow-checks = false
debug-assertions = false

[profile.nuttx-sim]
inherits = "release"
lto = false
opt-level = 1
strip = "none"
debug = 1
